<script id="study-data" type="application/json">{"meta": {"id": "k8s-practical-20261005", "series": "study-kit お手本", "title": "Kubernetes 実務入門（サンプル）", "purpose": "実務", "level": "Docker は日常的に使うが、Kubernetes は触ったことがない", "targetVersion": "Kubernetes v1.34 系の公式ドキュメント（2026-10 時点）", "createdAt": "2026-10-05", "goals": ["Pod と Deployment の関係を説明し、Deployment でアプリを動かせる", "Pod が起動しないとき、kubectl で原因を切り分けられる"], "exam": null}, "chapters": [{"id": "ch1", "title": "Kubernetes の基本オブジェクト", "sections": [{"id": "ch1-s1", "title": "Pod", "importance": "B", "keyPoints": ["Pod は Kubernetes で作成・管理できる最小のデプロイ単位", "同じ Pod のコンテナは <code>localhost<\/code> で通信できる", "Pod は直接作らず、Deployment などに作らせる"], "sources": ["F-001", "F-002", "F-003", "F-019", "F-020", "F-021", "F-022", "F-023", "F-024"], "items": [{"id": "i1", "title": "Pod は最小のデプロイ単位", "body": "<div class=\"sk-premise\" data-term=\"Kubernetes\"><p><strong>何か：<\/strong>コンテナで動くアプリ（ワークロード）とサービスを管理する、オープンソースのソフトウェアです。K と s の間に8文字あるので K8s とも書きます。<\/p><p><strong>誰が作ったか：<\/strong>Google が開発し、2014年にオープンソースとして公開しました。<\/p><p><strong>なぜ必要か：<\/strong>コンテナが増えると、どのサーバーでどのコンテナを動かすかを人手で管理するのが難しくなります。Kubernetes はその管理をまとめて引き受けます。<\/p><p><strong>この教材との関係：<\/strong>この教材全体の主役です。以降に出てくる Pod や Deployment は、すべて Kubernetes が管理する仕組みです。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"Docker\"><p><strong>何か：<\/strong>アプリをコンテナという隔離された環境で開発・配布・実行するためのソフトウェアです。<\/p><p><strong>誰が作ったか：<\/strong>Docker 社が提供しています。<\/p><p><strong>なぜ必要か：<\/strong>アプリと動かすのに必要なものをコンテナにまとめると、どの環境でも同じように動かせます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes が動かすのも、Docker と同じ形式のコンテナです。この教材では、Docker でコンテナを動かしたことがある前提で、その違いから説明します。<\/p><\/div>\n<p>Kubernetes でアプリを動かすとき、最小の単位になるのが <strong>Pod<\/strong> です。Docker ではコンテナを1つずつ起動しましたが、Kubernetes ではコンテナを Pod という入れ物に入れて動かします。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Docker はコンテナを1つずつ起動し、Kubernetes はコンテナを Pod に入れて動かす\">\n<rect x=\"10\" y=\"34\" width=\"280\" height=\"186\" rx=\"14\" class=\"sk-fill-muted\"/>\n<text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text-muted\">Docker（これまで）<\/text>\n<rect x=\"40\" y=\"86\" width=\"100\" height=\"56\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"90\" y=\"119\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"160\" y=\"86\" width=\"100\" height=\"56\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"210\" y=\"119\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">コンテナ<\/text>\n<text x=\"150\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">コンテナを1つずつ起動する<\/text>\n<rect x=\"330\" y=\"34\" width=\"300\" height=\"186\" rx=\"14\" class=\"sk-fill-muted\"/>\n<text x=\"480\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text-primary\">Kubernetes（これから）<\/text>\n<rect x=\"348\" y=\"56\" width=\"116\" height=\"116\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"6 4\" class=\"sk-stroke-primary\"/>\n<text x=\"360\" y=\"76\" font-size=\"13\" class=\"sk-text-primary\">Pod<\/text>\n<rect x=\"366\" y=\"92\" width=\"80\" height=\"56\" rx=\"8\" class=\"sk-fill-primary\"/><text x=\"406\" y=\"125\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"480\" y=\"56\" width=\"132\" height=\"116\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"6 4\" class=\"sk-stroke-primary\"/>\n<text x=\"492\" y=\"76\" font-size=\"13\" class=\"sk-text-primary\">Pod<\/text>\n<rect x=\"492\" y=\"88\" width=\"108\" height=\"34\" rx=\"7\" class=\"sk-fill-primary\"/><text x=\"546\" y=\"110\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"492\" y=\"128\" width=\"108\" height=\"34\" rx=\"7\" class=\"sk-fill-primary\"/><text x=\"546\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<text x=\"480\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">コンテナを Pod に入れて動かす<\/text>\n<\/svg><figcaption>図 1-1-1　Docker はコンテナを1つずつ、Kubernetes はコンテナを Pod に入れて動かす<\/figcaption><\/figure>\n<p>Pod は1つ以上のコンテナのグループです。コンテナが1つだけの Pod もあれば、複数のコンテナをまとめた Pod もあります。Kubernetes が作ったり消したりするのは、コンテナ単体ではなく Pod です。<\/p>\n<div class=\"sk-callout analogy\"><p>Pod は「お弁当箱」、コンテナは「おかず」のようなものです。Kubernetes は、おかずを1つずつではなく、お弁当箱ごと受け渡しします。<\/p><\/div>", "checks": [{"id": "q-ch1-s1-01", "type": "choice", "prompt": "Kubernetes で作成・管理できる最小のデプロイ単位はどれですか。", "code": null, "options": ["コンテナ", "Pod", "Node", "Deployment"], "answer": 1, "explanation": "Kubernetes で作成・管理できる最小のデプロイ単位は Pod です。コンテナは Pod の中に入れて動かします。", "hint": "図 1-1-1 の右側で、Kubernetes が扱っている一番外側の入れ物は何でしょうか。"}, {"id": "q-ch1-s1-10", "type": "truefalse", "prompt": "Pod には、コンテナを1つだけしか入れられない。", "code": null, "options": [], "answer": false, "explanation": "Pod は1つ以上のコンテナのグループです。コンテナが1つだけの Pod もあれば、複数のコンテナをまとめた Pod もあります。"}]}, {"id": "i2", "title": "同じ Pod のコンテナは localhost で通信できる", "body": "<p>同じ Pod に入ったコンテナは、<strong>ストレージとネットワークを共有<\/strong>します。ネットワークを共有しているので、同じ Pod の中のコンテナどうしは <code>localhost<\/code> で通信できます。<\/p>\n<div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ: web<\/span><span class=\"sk-item\">コンテナ: log-agent<\/span><p class=\"sk-caption\">ネットワークとストレージを共有する。web と log-agent は localhost で通信できる<\/p><\/div>\n<p>上の図では、Web サーバーのコンテナ web と、ログを扱うコンテナ log-agent が同じ Pod に入っています。log-agent は、宛先に <code>localhost<\/code> を指定するだけで web とやり取りできます。<\/p>\n<div class=\"sk-callout analogy\"><p>Pod は1つの部屋、コンテナは部屋の中にいる人のようなものです。同じ部屋にいる人は、住所を調べなくても声をかければ話せます。<\/p><\/div>", "checks": [{"id": "q-ch1-s1-02", "type": "fill", "prompt": "同じ Pod に入ったコンテナどうしは、宛先を <code>____<\/code> にして通信できます。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["localhost", "127.0.0.1"], "explanation": "同じ Pod のコンテナはネットワークを共有しているため、<code>localhost<\/code> で互いに通信できます。", "hint": "同じ Pod のコンテナはネットワークを共有しています。自分自身を指す宛先の名前を思い出しましょう。"}]}, {"id": "i3", "title": "Pod の定義はマニフェストに書く", "body": "<div class=\"sk-premise\" data-term=\"YAML\"><p><strong>何か：<\/strong>人が読み書きしやすいように作られた、データを書くための言語（ファイル形式）です。字下げで階層を表します。<\/p><p><strong>なぜ必要か：<\/strong>設定を人が読める文字で書いておけば、ファイルとして保存したり見直したりできます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes では、作りたいもの（Pod など）の定義を YAML で書きます。このファイルをマニフェストと呼びます。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"kubectl\"><p><strong>何か：<\/strong>Kubernetes を操作するためのコマンドラインツールです。<\/p><p><strong>誰が作ったか：<\/strong>Kubernetes プロジェクトが Kubernetes 本体と一緒に提供しています。<\/p><p><strong>なぜ必要か：<\/strong>kubectl は、Kubernetes の中でサーバー群（クラスタ）全体を管理する部分に、人の指示を伝えます。人はこのコマンドを通して Kubernetes を操作します。<\/p><p><strong>この教材との関係：<\/strong>マニフェストを適用する <code>kubectl apply<\/code> や、状態を調べる <code>kubectl get<\/code> など、以降の節でくり返し使います。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"nginx\"><p><strong>何か：<\/strong>Web サーバーとして広く使われているソフトウェアです。<\/p><p><strong>この教材との関係：<\/strong>この教材では、コンテナで動かすアプリの例として使います。下の YAML の <code>image: nginx:1.27<\/code> は「nginx のバージョン 1.27 のコンテナイメージを使う」という意味です。<\/p><\/div>\n<p>Kubernetes では、作りたいものの定義を YAML のファイルに書きます。このファイルを<strong>マニフェスト<\/strong>と呼びます。Pod のマニフェストは次のように書きます。<\/p>\n<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27\n    ports:\n    - containerPort: 80<\/code><\/pre>\n<dl class=\"sk-terms\"><div><dt>kind<\/dt><dd>作るオブジェクトの種類。Pod を作るときは <code>Pod<\/code> と書く<\/dd><\/div><div><dt>metadata.name<\/dt><dd>Pod の名前。この例では web<\/dd><\/div><div><dt>spec.containers<\/dt><dd>Pod に入れるコンテナの一覧。<code>image<\/code> に使うコンテナイメージを書く<\/dd><\/div><\/dl>\n<p>書いたマニフェストは、kubectl で Kubernetes に渡します。Docker との違いを並べると次のとおりです。<\/p>\n<ol class=\"sk-flow\"><li><strong>書く<\/strong><br>マニフェスト（YAML）に Pod の定義を書く<\/li><li><strong>渡す<\/strong><br><code>kubectl apply<\/code> で適用する<\/li><li><strong>動く<\/strong><br>Kubernetes が Pod を作る<\/li><\/ol>\n<div class=\"sk-compare\"><div><h4>Docker（これまで）<\/h4><ul><li>コンテナを1つずつ起動する<\/li><li><code>docker run<\/code> で起動する<\/li><\/ul><\/div><div><h4>Kubernetes（これから）<\/h4><ul><li>1つ以上のコンテナを Pod にまとめて起動する<\/li><li>マニフェスト（YAML）を書いて <code>kubectl apply<\/code> する<\/li><\/ul><\/div><\/div>", "checks": [{"id": "q-ch1-s1-06", "type": "fill", "prompt": "Pod のマニフェストでは、作るオブジェクトの種類を <code>kind: ____<\/code> と書きます。Pod を作るときに空欄に入る値を答えてください。", "code": null, "options": [], "answer": ["Pod"], "explanation": "Pod を作るマニフェストでは <code>kind: Pod<\/code> と書きます。", "hint": "kind には、作るオブジェクトの種類をそのまま書きます。"}]}, {"id": "i4", "title": "Pod は直接作らない", "body": "<p>ここまでで Pod を直接作る方法を見ましたが、実務で Pod を直接作ることはあまりありません。Pod は使い捨てを前提にした比較的短命なものとして設計されていて、<strong>消えても自動では作り直されない<\/strong>からです。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"直接作った Pod は削除するとそれきりだが、Deployment に作らせた Pod は新しく作り直される\">\n<defs><marker id=\"ah-recreate\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-surface\"/><\/marker><\/defs>\n<text x=\"10\" y=\"30\" font-size=\"14\" font-weight=\"700\" class=\"sk-text\">Pod を直接作った場合<\/text>\n<rect x=\"10\" y=\"44\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"65\" y=\"76\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Pod<\/text>\n<path d=\"M130 70H190\" stroke-width=\"2\" class=\"sk-stroke\" marker-end=\"url(#ah-recreate)\"/>\n<text x=\"160\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">削除<\/text>\n<rect x=\"200\" y=\"44\" width=\"110\" height=\"52\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke-warn\"/><text x=\"255\" y=\"76\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-warn\">なし<\/text>\n<text x=\"330\" y=\"76\" font-size=\"13\" class=\"sk-text-muted\">消えたまま。作り直されない<\/text>\n<text x=\"10\" y=\"140\" font-size=\"14\" font-weight=\"700\" class=\"sk-text\">Deployment に作らせた場合<\/text>\n<rect x=\"10\" y=\"154\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"65\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Pod<\/text>\n<path d=\"M130 180H190\" stroke-width=\"2\" class=\"sk-stroke\" marker-end=\"url(#ah-recreate)\"/>\n<text x=\"160\" y=\"170\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">削除<\/text>\n<rect x=\"200\" y=\"154\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"255\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">新しい Pod<\/text>\n<text x=\"330\" y=\"186\" font-size=\"13\" class=\"sk-text-muted\">足りなくなった分が作り直される<\/text>\n<\/svg><figcaption>図 1-1-2　直接作った Pod は消えたまま。Deployment に作らせた Pod は作り直される<\/figcaption><\/figure>\n<p>そのため通常は、次の節で扱う <strong>Deployment<\/strong> のようなワークロードリソースに Pod を作らせます。Deployment は、Pod が消えて数が足りなくなると、新しい Pod を作り直します。<\/p>\n<div class=\"sk-callout warn\"><p>Pod のマニフェストを直接適用して作った Pod は、削除したり、動いているサーバーが止まったりすると、それきり戻りません。<\/p><\/div>", "checks": [{"id": "q-ch1-s1-08", "type": "truefalse", "prompt": "Pod のマニフェストで直接作った Pod を削除すると、同じ Pod が自動で作り直される。", "code": null, "options": [], "answer": false, "explanation": "Pod 自体には、消えたときに自分を作り直す仕組みがありません。直接作った Pod は、削除したらそれきりです。作り直しが必要なら Deployment などに Pod を作らせます。"}, {"id": "q-ch1-s1-11", "type": "choice", "prompt": "実務で Pod を動かすとき、Pod は通常どのように作りますか。", "code": null, "options": ["Deployment などのワークロードリソースに作らせる", "Pod のマニフェストを直接適用して作る", "docker run でコンテナを起動して作る", "Pod は作らず、コンテナだけを動かす"], "answer": 0, "explanation": "Pod は消えても自動では作り直されないため、実務では Deployment などのワークロードリソースに Pod を作らせます。Deployment は、Pod が消えて数が足りなくなると新しい Pod を作り直します。"}]}]}, {"id": "ch1-s2", "title": "Deployment と ReplicaSet", "importance": "A", "prerequisites": ["ch1-s1"], "keyPoints": ["Deployment → ReplicaSet → Pod の順に管理する", "ロールアウトは Pod のひな形（<code>.spec.template<\/code>）が変わったときだけ始まる", "<code>kubectl rollout undo<\/code> で前のリビジョンに戻せる"], "sources": ["F-004", "F-005", "F-006", "F-015"], "items": [{"id": "i1", "title": "Deployment → ReplicaSet → Pod の3段で管理する", "body": "<p><strong>Deployment<\/strong> は、Pod を指定した数だけ動かし続け、更新も宣言的に行うためのオブジェクトです。Deployment を作ると、Deployment は <strong>ReplicaSet<\/strong> を作り、ReplicaSet が指定された数の Pod を維持します。<\/p>\n<div class=\"sk-nest\" data-label=\"Deployment: web（replicas: 3）\"><div class=\"sk-nest\" data-label=\"ReplicaSet: web-7c9d8f6b5\"><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><\/div><\/div>\n<p>図のように、Deployment の中に ReplicaSet があり、その中に Pod が3つあります。<code>replicas: 3<\/code> は「Pod を3つ動かし続ける」という指定です。<\/p>\n<div class=\"sk-callout point\"><p>Pod を1つ削除しても、ReplicaSet が数の不足を検知して新しい Pod を作ります。Pod を直接作ったときとの大きな違いはここです。<\/p><\/div>", "checks": [{"id": "q-ch1-s2-04", "type": "fill", "prompt": "Deployment が作り、指定された数の Pod を維持するオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。", "hint": "Deployment と Pod の間に入るオブジェクトです。"}, {"id": "q-ch1-s2-10", "type": "truefalse", "prompt": "Deployment が管理している Pod を1つ削除すると、ReplicaSet が数の不足を検知して新しい Pod を作る。", "code": null, "options": [], "answer": true, "explanation": "ReplicaSet は指定された数の Pod を維持します。Pod を1つ削除しても、数の不足を検知して新しい Pod を作ります。Pod を直接作ったときとの大きな違いです。"}, {"id": "q-ch1-s2-11", "type": "fill", "prompt": "Deployment で Pod を3つ動かし続けるには、<code>____: 3<\/code> と指定します。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["replicas"], "explanation": "<code>replicas: 3<\/code> は「Pod を3つ動かし続ける」という指定です。"}]}, {"id": "i2", "title": "ロールアウトは Pod のひな形が変わったときだけ", "body": "<p>Deployment の <code>.spec.template<\/code>（Pod のひな形）を変更すると、<strong>ロールアウト<\/strong>が始まります。たとえばコンテナイメージのタグを変えると、新しい ReplicaSet が作られ、古い Pod から新しい Pod へ順に入れ替わります。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"ロールアウトで、旧 ReplicaSet の Pod が新 ReplicaSet の Pod に順に入れ替わる様子\"><rect x=\"10\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新前<\/text><text x=\"22\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"22\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"47\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"80\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"105\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"138\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"163\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><text x=\"22\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"22\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"80\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"138\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"217\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"235\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"330\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">入れ替え中<\/text><text x=\"247\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"247\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"272\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"305\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"330\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"363\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"247\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"247\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"272\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"305\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"363\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"442\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"460\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"555\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新後<\/text><text x=\"472\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"472\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"530\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"588\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"472\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"472\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"497\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"530\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"555\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"588\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"613\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><\/svg><figcaption>図 1-2-1　イメージを v1 から v2 に変えたときのロールアウト<\/figcaption><\/figure>\n<div class=\"sk-compare\"><div><h4>ロールアウトが始まらない<\/h4><ul><li><code>replicas<\/code> の数を変える<\/li><li><code>kubectl scale<\/code> で Pod を増減する<\/li><\/ul><\/div><div><h4>ロールアウトが始まる<\/h4><ul><li><code>.spec.template<\/code> を変える<\/li><li>コンテナイメージのタグを変える<\/li><\/ul><\/div><\/div>\n<div class=\"sk-callout warn\"><p><code>replicas<\/code> の数を変えるだけのスケールでは、ロールアウトは起きません。ロールアウトが始まるのは、Pod のひな形が変わったときだけです。<\/p><\/div>", "checks": [{"id": "q-ch1-s2-02", "type": "choice", "prompt": "Deployment に対する次の操作のうち、ロールアウトが始まるものはどれですか。", "code": null, "options": ["replicas を 3 から 5 に変える", ".spec.template のコンテナイメージのタグを変える", "kubectl scale で Pod の数を減らす", "kubectl get deployment で状態を確認する"], "answer": 1, "explanation": "ロールアウトが始まるのは、Deployment の <code>.spec.template<\/code>（Pod のひな形）が変わったときです。コンテナイメージのタグの変更はこれに当たります。<code>replicas<\/code> の変更や <code>kubectl scale<\/code> はスケールなので、ロールアウトは起きません。"}, {"id": "q-ch1-s2-12", "type": "truefalse", "prompt": "<code>kubectl scale<\/code> で Deployment の Pod の数を増やすと、ロールアウトが始まる。", "code": null, "options": [], "answer": false, "explanation": "<code>replicas<\/code> の数を変えるだけのスケールでは、ロールアウトは起きません。ロールアウトが始まるのは、Pod のひな形 <code>.spec.template<\/code> が変わったときだけです。"}]}, {"id": "i3", "title": "rollout status で見守り、rollout undo で戻す", "body": "<p>ロールアウトの進み具合は <code>kubectl rollout status<\/code> で確かめます。新しいバージョンに問題があったときは、<code>kubectl rollout undo<\/code> で前のリビジョンに戻せます。<\/p>\n<ol class=\"sk-flow\"><li><strong>更新する<\/strong><br><code>kubectl set image<\/code><\/li><li><strong>見守る<\/strong><br><code>kubectl rollout status<\/code><\/li><li><strong>問題があれば戻す<\/strong><br><code>kubectl rollout undo<\/code><\/li><\/ol>\n<pre><code>$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web<\/code><\/pre>\n<div class=\"sk-callout tip\"><p>更新したら、まず <code>rollout status<\/code> で最後まで入れ替わったかを見届けます。入れ替わったあとに不具合が見つかったら、原因を調べる前に <code>rollout undo<\/code> で元に戻すと、利用者への影響を小さくできます。<\/p><\/div>", "checks": [{"id": "q-ch1-s2-07", "type": "fill", "prompt": "Deployment web を前のリビジョンに戻すコマンドは <code>kubectl rollout ____ deployment/web<\/code> です。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["undo"], "explanation": "<code>kubectl rollout undo<\/code> で、Deployment を前のリビジョンに戻せます。", "hint": "「元に戻す」を英語で言うと何でしょうか。"}, {"id": "q-ch1-s2-13", "type": "fill", "prompt": "ロールアウトの進み具合を確かめるコマンドは <code>kubectl rollout ____ deployment/web<\/code> です。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["status"], "explanation": "<code>kubectl rollout status<\/code> で、新しい Pod に最後まで入れ替わったかを見届けます。"}]}, {"id": "i4", "type": "example", "title": "<code>replicas: 3<\/code> で動いている Deployment の <code>replicas<\/code> を 5 に変えました。ロールアウトは始まりますか。", "body": "<ol class=\"sk-steps\"><li><p>変えたのは <code>replicas<\/code>、つまり Pod の数です。<\/p><\/li><li><p>Pod のひな形 <code>.spec.template<\/code> は変わっていません。<\/p><\/li><li><p>ロールアウトが始まるのはひな形が変わったときだけなので、<strong>ロールアウトは始まりません<\/strong>。今の ReplicaSet が Pod を5つに増やします。<\/p><div class=\"sk-cells\" data-label=\"同じ ReplicaSet の Pod が 3 → 5 に増える\"><span>Pod<\/span><span>Pod<\/span><span>Pod<\/span><span class=\"on\">Pod<\/span><span class=\"on\">Pod<\/span><\/div><\/li><\/ol>", "checks": [{"id": "q-ch1-s2-09", "type": "truefalse", "prompt": "Deployment のコンテナイメージのタグを変えると、新しい ReplicaSet が作られる。", "code": null, "options": [], "answer": true, "explanation": "イメージのタグは Pod のひな形（<code>.spec.template<\/code>）の一部です。ひな形が変わるとロールアウトが始まり、新しい ReplicaSet が作られます。"}]}]}], "exercise": [{"id": "q-ch1-ex-01", "type": "choice", "prompt": "実務でアプリを Kubernetes 上で動かすとき、Pod は通常どのように作りますか。", "code": null, "options": ["Pod のマニフェストを書いて、Pod を直接作る", "Deployment などのワークロードリソースに Pod を作らせる", "ノードにログインして docker run を実行する", "kubectl exec でコンテナを追加する"], "answer": 1, "explanation": "Pod は使い捨てを前提にしており、消えても自動では作り直されません。そのため通常は Deployment などのワークロードリソースに Pod を作らせ、管理を任せます。", "refs": ["ch1-s1#i4", "ch1-s2#i1"]}, {"id": "q-ch1-ex-02", "type": "choice", "prompt": "同じ Pod に入ったコンテナどうしが共有するものの組み合わせとして正しいものはどれですか。", "code": null, "options": ["ネットワークとストレージ", "コンテナイメージとタグ", "Deployment と ReplicaSet", "マニフェストと kubectl の設定"], "answer": 0, "explanation": "同じ Pod のコンテナは、ネットワークとストレージを共有します。ネットワークを共有しているので、<code>localhost<\/code> で互いに通信できます。", "refs": ["ch1-s1#i2"]}, {"id": "q-ch1-ex-03", "type": "predict", "prompt": "Deployment を使わず、Pod のマニフェストで直接作った Pod web を、次のように削除しました。最後のコマンドを実行したとき、web はどうなっていますか。", "code": "$ kubectl apply -f web-pod.yaml\n$ kubectl delete pod web\n$ kubectl get pods", "options": ["一覧に web は出てこない（作り直されない）", "同じ名前の web が自動で作り直されている", "web が Pending のまま残っている", "削除できずに Running のまま残っている"], "answer": 0, "explanation": "Pod 自体には、消えたときに自分を作り直す仕組みがありません。直接作った Pod は、作り直すコントローラーがないので、削除したらそれきりです。作り直しが必要なら Deployment などに Pod を作らせます。", "refs": ["ch1-s1#i4"]}, {"id": "q-ch1-ex-04", "type": "choice", "prompt": "1つの Pod に入れられるコンテナの数として正しいものはどれですか。", "code": null, "options": ["必ず1つ", "1つ以上", "2つまで", "0個でもよい"], "answer": 1, "explanation": "Pod は1つ以上のコンテナのグループです。1つだけのこともあれば、複数のコンテナをまとめることもあります。", "refs": ["ch1-s1#i1"]}, {"id": "q-ch1-ex-05", "type": "order", "prompt": "Deployment でアプリを動かしたときの管理の関係を、管理する側（上位）から順に並べてください。", "code": null, "options": ["Pod", "Deployment", "コンテナ", "ReplicaSet"], "answer": ["Deployment", "ReplicaSet", "Pod", "コンテナ"], "explanation": "Deployment が ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。コンテナは Pod の中で動きます。", "refs": ["ch1-s2#i1", "ch1-s1#i1"]}, {"id": "q-ch1-ex-06", "type": "predict", "prompt": "nginx:1.26 で動いていた Deployment web に、次のコマンドを順に実行しました。最後のコマンドのあと、web の Pod はどうなりますか。", "code": "$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web", "options": ["nginx:1.26 のコンテナで動く Pod に戻る", "Deployment ごと削除され、Pod がなくなる", "nginx:1.27 のまま、Pod が再起動される", "Pod は停止したまま、手動の再開を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> は Deployment を前のリビジョンに戻します。直前のリビジョンは nginx:1.26 なので、nginx:1.26 で動く Pod に戻ります。", "refs": ["ch1-s2#i3"]}, {"id": "q-ch1-ex-07", "type": "predict", "prompt": "replicas: 3 で動いている Deployment の replicas を 5 に変えて適用しました。どうなりますか。", "code": "$ kubectl scale deployment/web --replicas=5", "options": ["今の ReplicaSet のまま、Pod が5つに増える", "新しい ReplicaSet が作られ、Pod がすべて入れ替わる", "Deployment が作り直される", "ロールアウトが始まり、前のリビジョンが保存される"], "answer": 0, "explanation": "<code>replicas<\/code> を変えるだけのスケールでは、ロールアウトは起きません。今の ReplicaSet が Pod の数を5つに増やします。新しい ReplicaSet が作られるのは、Pod のひな形が変わったときです。", "refs": ["ch1-s2#i2"]}, {"id": "q-ch1-ex-08", "type": "order", "prompt": "Deployment のコンテナイメージを v1 から v2 に変えたときのロールアウトの流れを、起きる順に並べてください。", "code": null, "options": ["新しい Pod が増え、古い Pod が減っていく", ".spec.template のイメージを v2 に変える", "古い ReplicaSet の Pod が 0 になる", "新しい ReplicaSet が作られる"], "answer": [".spec.template のイメージを v2 に変える", "新しい ReplicaSet が作られる", "新しい Pod が増え、古い Pod が減っていく", "古い ReplicaSet の Pod が 0 になる"], "explanation": "Pod のひな形を変えるとロールアウトが始まり、新しい ReplicaSet が作られます。新しい Pod が増えるのに合わせて古い Pod が減り、最後は古い ReplicaSet の Pod が 0 になります。", "refs": ["ch1-s2#i2"]}, {"id": "q-ch1-ex-09", "type": "choice", "prompt": "イメージを更新したあと、ロールアウトが終わったかどうかを確かめるコマンドはどれですか。", "code": null, "options": ["kubectl rollout status deployment/web", "kubectl rollout undo deployment/web", "kubectl logs deployment/web --previous", "kubectl scale deployment/web --replicas=0"], "answer": 0, "explanation": "<code>kubectl rollout status<\/code> で、ロールアウトの進み具合と完了を確認できます。<code>rollout undo<\/code> は前のリビジョンに戻すコマンドです。", "refs": ["ch1-s2#i3"]}, {"id": "q-ch1-ex-10", "type": "truefalse", "prompt": "<code>kubectl scale<\/code> で Deployment の Pod の数を減らすと、ロールアウトが始まる。", "code": null, "options": [], "answer": false, "explanation": "<code>kubectl scale<\/code> は Pod の数を変えるスケールです。Pod のひな形（<code>.spec.template<\/code>）は変わらないので、ロールアウトは始まりません。", "refs": ["ch1-s2#i2"]}]}, {"id": "ch2", "title": "Pod のトラブルシューティング", "sections": [{"id": "ch2-s1", "title": "Pod の状態を読む", "importance": "B", "prerequisites": ["ch1-s2"], "keyPoints": ["まず <code>STATUS<\/code> と <code>RESTARTS<\/code> を見る", "phase は Pending・Running・Succeeded・Failed・Unknown の5つ", "CrashLoopBackOff は起動と異常終了の繰り返し、ImagePullBackOff はイメージ取得の失敗"], "sources": ["F-007", "F-008", "F-009", "F-010", "F-014", "F-016", "F-017"], "items": [{"id": "i1", "title": "まず STATUS と RESTARTS を見る", "body": "<p>Pod の様子は <code>kubectl get pods<\/code> で確認します。最初に見るのは <code>STATUS<\/code> 列と <code>RESTARTS<\/code> 列です。<\/p>\n<pre><code>$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\nweb-7c9d8f6b5-x2k4p   1/1     Running            0             12m\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m\nbatch-6d7e8f9a0-z9y8  0/1     Pending            0             3m<\/code><\/pre>\n<dl class=\"sk-terms\"><div><dt>STATUS<\/dt><dd>Pod の状態。phase（次の項目）のほか、CrashLoopBackOff などの値も出る<\/dd><\/div><div><dt>RESTARTS<\/dt><dd>コンテナが再起動した回数。異常終了を繰り返すと増えていく<\/dd><\/div><\/dl>\n<p>上の出力では、web は Running で再起動は 0 回です。api は CrashLoopBackOff で、再起動を 5 回繰り返しています。batch は Pending のままです。<\/p>", "checks": [{"id": "q-ch2-s1-07", "type": "fill", "prompt": "<code>kubectl get pods<\/code> の出力で、コンテナが再起動した回数を示す列の名前を答えてください。", "code": null, "options": [], "answer": ["RESTARTS"], "explanation": "<code>RESTARTS<\/code> 列はコンテナの再起動回数です。CrashLoopBackOff の Pod では、この数が増えていきます。", "hint": "出力の列名を、英語のまま答えます。「再起動」は英語で restart です。"}]}, {"id": "i2", "title": "phase は5つ", "body": "<p>Pod のライフサイクルは <strong>phase<\/strong> という値で表します。phase は次の5つだけです。意味で分けると、図のように4つのグループになります。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Pod の phase を、まだ動いていない・動いている・終わった・分からないの4つに分けた図\">\n<rect x=\"10\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"175\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"340\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"505\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<text x=\"85\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">まだ動いていない<\/text>\n<text x=\"250\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">動いている<\/text>\n<text x=\"415\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">終わった<\/text>\n<text x=\"580\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">分からない<\/text>\n<rect x=\"25\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" class=\"sk-fill-mark\"/><text x=\"85\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-dark\">Pending<\/text>\n<text x=\"85\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">スケジュール待ちや<\/text>\n<text x=\"85\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">イメージ取得中も含む<\/text>\n<rect x=\"190\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" class=\"sk-fill-accent\"/><text x=\"250\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">Running<\/text>\n<text x=\"250\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">少なくとも1つの<\/text>\n<text x=\"250\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">コンテナが動いている<\/text>\n<rect x=\"355\" y=\"56\" width=\"120\" height=\"32\" rx=\"16\" class=\"sk-fill-primary\"/><text x=\"415\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Succeeded<\/text>\n<text x=\"415\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">すべて正常に終了<\/text>\n<rect x=\"355\" y=\"124\" width=\"120\" height=\"32\" rx=\"16\" class=\"sk-fill-warn\"/><text x=\"415\" y=\"146\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Failed<\/text>\n<text x=\"415\" y=\"174\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">少なくとも1つが失敗<\/text>\n<rect x=\"520\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" stroke-width=\"1.5\" class=\"sk-fill-surface sk-stroke\"/><text x=\"580\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text\">Unknown<\/text>\n<text x=\"580\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">Pod の状態を<\/text>\n<text x=\"580\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">取得できない<\/text>\n<\/svg><figcaption>図 2-1-1　Pod の phase を意味で分けたもの<\/figcaption><\/figure>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge warn\">Pending<\/span><span>クラスタには受け入れられたが、コンテナがまだ動く状態になっていない。ノードへのスケジュール待ちや、イメージのダウンロード中もここに含まれる<\/span><\/div><div><span class=\"sk-badge ok\">Running<\/span><span>ノードに割り当てられ、少なくとも1つのコンテナが動いている<\/span><\/div><div><span class=\"sk-badge info\">Succeeded<\/span><span>すべてのコンテナが正常に終了し、再起動しない<\/span><\/div><div><span class=\"sk-badge err\">Failed<\/span><span>すべてのコンテナが終了し、少なくとも1つが失敗で終わった<\/span><\/div><div><span class=\"sk-badge info\">Unknown<\/span><span>Pod の状態を取得できない<\/span><\/div><\/div>", "checks": [{"id": "q-ch2-s1-05", "type": "choice", "prompt": "Pod の phase が Succeeded のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが正常に終了し、再起動しない", "少なくとも1つのコンテナが動いている", "コンテナがまだ動く状態になっていない", "Pod の状態を取得できない"], "answer": 0, "explanation": "Succeeded は、すべてのコンテナが正常に終了し、再起動しない phase です。少なくとも1つのコンテナが動いているのは Running です。"}, {"id": "q-ch2-s1-10", "type": "choice", "prompt": "コンテナイメージをダウンロードしている途中の Pod の phase はどれですか。", "code": null, "options": ["Pending", "Running", "Unknown", "Failed"], "answer": 0, "explanation": "Pending は、クラスタに受け入れられたがコンテナがまだ動く状態になっていない phase です。ノードへのスケジュール待ちや、イメージのダウンロード中もここに含まれます。"}]}, {"id": "i3", "title": "CrashLoopBackOff と ImagePullBackOff", "body": "<p><code>STATUS<\/code> 列には phase 以外の値も出ます。トラブルのときによく見るのは次の2つです。<\/p>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge err\">CrashLoopBackOff<\/span><span>コンテナが起動しては異常終了することを繰り返し、再起動までの待ち時間を延ばしながら再起動が続いている。<code>RESTARTS<\/code> が増えていく<\/span><\/div><div><span class=\"sk-badge err\">ImagePullBackOff<\/span><span>コンテナイメージを取得できず、取得の再試行を待っている。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こる<\/span><\/div><\/div>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 600 190\" role=\"img\" aria-label=\"CrashLoopBackOff では、起動・異常終了・待つ・再起動を繰り返す\">\n<defs><marker id=\"ah-crash\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-primary\"/><\/marker><\/defs>\n<rect x=\"20\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"95\" y=\"71\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">起動する<\/text>\n<rect x=\"225\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-warn\"/><text x=\"300\" y=\"71\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">すぐ異常終了<\/text>\n<rect x=\"430\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-surface\"/><text x=\"505\" y=\"64\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">待つ<\/text><text x=\"505\" y=\"82\" text-anchor=\"middle\" font-size=\"11\" class=\"sk-text-muted\">待ち時間は毎回のびる<\/text>\n<path d=\"M172 65H220\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<path d=\"M377 65H425\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<path d=\"M505 92C505 160 95 160 95 96\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<text x=\"300\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-primary\">再起動（RESTARTS が 1 増える）<\/text>\n<\/svg><figcaption>図 2-1-2　CrashLoopBackOff：起動と異常終了を繰り返している<\/figcaption><\/figure>\n<div class=\"sk-callout warn\"><p><code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出ますが、phase ではありません。phase は Pending、Running、Succeeded、Failed、Unknown の5つだけです。<\/p><\/div>", "checks": [{"id": "q-ch2-s1-01", "type": "choice", "prompt": "次のうち、Pod の phase ではないものはどれですか。", "code": null, "options": ["Pending", "Running", "CrashLoopBackOff", "Succeeded"], "answer": 2, "explanation": "phase は Pending、Running、Succeeded、Failed、Unknown の5つです。<code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出る値ですが、phase ではありません。"}, {"id": "q-ch2-s1-11", "type": "choice", "prompt": "STATUS が ImagePullBackOff になる原因として、本文で挙げたものはどれですか。", "code": null, "options": ["イメージ名やタグの書き間違い", "ノードの CPU の空きが足りない", "アプリが起動直後に異常終了する", "replicas の数が多すぎる"], "answer": 0, "explanation": "ImagePullBackOff は、コンテナイメージを取得できず再試行を待っている状態です。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こります。"}]}]}, {"id": "ch2-s2", "title": "describe と logs で原因を探す", "importance": "A", "prerequisites": ["ch2-s1"], "keyPoints": ["見つける → 調べる → 直す → 確かめる の順に進める", "Pending は <code>describe<\/code> の <code>Events<\/code>、CrashLoopBackOff は <code>logs --previous<\/code>", "原因を直したら、Running になったことを必ず確かめる"], "sources": ["F-004", "F-011", "F-012", "F-013", "F-018"], "items": [{"id": "i1", "title": "見つける → 調べる → 直す → 確かめる", "body": "<p><code>STATUS<\/code> で様子が分かったら、次は原因を探して直します。全体の流れは次のとおりです。<\/p>\n<ol class=\"sk-flow\"><li><strong>見つける<\/strong><br><code>kubectl get pods<\/code> で問題のある Pod と STATUS を確認<\/li><li><strong>調べる<\/strong><br><code>describe<\/code> や <code>logs<\/code> で原因を探す<\/li><li><strong>直す<\/strong><br>原因を直したマニフェストを適用<\/li><li><strong>確かめる<\/strong><br><code>kubectl get pods<\/code> で Running を確認<\/li><\/ol>\n<p>このうち「調べる」で使うコマンドは主に2つあり、どちらを先に見るかは Pod の状態で変わります。次の2つの項目で順に見ていきます。<\/p>", "checks": [{"id": "q-ch2-s2-03", "type": "order", "prompt": "Pod の不具合を調べて直すときの手順を、正しい順に並べてください。", "code": null, "options": ["原因を直したマニフェストを適用する", "kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl get pods で Pod が Running になったことを確かめる", "kubectl describe pod で Events を確認する"], "answer": ["kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl describe pod で Events を確認する", "原因を直したマニフェストを適用する", "kubectl get pods で Pod が Running になったことを確かめる"], "explanation": "まず <code>kubectl get pods<\/code> で問題のある Pod を見つけ、<code>kubectl describe pod<\/code> の <code>Events<\/code> で原因を探します。原因を直したマニフェストを適用したら、最後にもう一度 <code>kubectl get pods<\/code> で Running になったことを確かめます。"}, {"id": "q-ch2-s2-10", "type": "choice", "prompt": "原因を直したマニフェストを適用したあと、直ったことを確かめるには何を見ますか。", "code": null, "options": ["kubectl get pods で STATUS が Running になったか", "kubectl describe pod の Events が空になったか", "kubectl logs の出力が空になったか", "マニフェストのファイルが保存されたか"], "answer": 0, "explanation": "流れの最後の「確かめる」では、<code>kubectl get pods<\/code> で Pod が Running になったことを確認します。"}]}, {"id": "i2", "title": "Pending は describe の Events を見る", "body": "<p><code>kubectl describe pod<\/code> は、Pod の設定と状態の詳細を表示します。出力の最後にある <code>Events<\/code> には、スケジュールやイメージ取得の結果など、Pod に起きた出来事が時系列で並びます。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 170\" role=\"img\" aria-label=\"ノードに CPU やメモリの空きがないと、Pod は Pending のままになる\">\n<defs><marker id=\"ah-pending\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-primary\"/><\/marker><\/defs>\n<rect x=\"10\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"95\" y=\"63\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">Pod を作る<\/text>\n<rect x=\"235\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-surface\"/><text x=\"320\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">割り当てるノードを<\/text><text x=\"320\" y=\"74\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">探す<\/text>\n<rect x=\"460\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-warn\"/><text x=\"545\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">CPU・メモリの<\/text><text x=\"545\" y=\"74\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">空きがない<\/text>\n<path d=\"M182 57H230\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-pending)\"/>\n<path d=\"M407 57H455\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-pending)\"/>\n<text x=\"320\" y=\"124\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-warn\">Pod は Pending のまま（コンテナは動いていない）<\/text>\n<text x=\"320\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">理由は describe の Events に FailedScheduling として出る<\/text>\n<\/svg><figcaption>図 2-2-1　空きのあるノードがないと、Pod は Pending のまま進まない<\/figcaption><\/figure>\n<pre><code>$ kubectl describe pod batch-6d7e8f9a0-z9y8\n...\nEvents:\n  Type     Reason            Age   From               Message\n  ----     ------            ----  ----               -------\n  Warning  FailedScheduling  3m    default-scheduler  0/3 nodes are available: 3 Insufficient cpu.<\/code><\/pre>\n<p>Pending のまま進まない Pod の原因の多くは、CPU やメモリの空きが足りず、ノードに割り当てられないことです。上の例では、3つのノードすべてで CPU が足りないと出ています。コンテナがまだ動いていないので、ログからは手がかりを得られません。<\/p>", "checks": [{"id": "q-ch2-s2-04", "type": "choice", "prompt": "<code>kubectl describe pod<\/code> の出力で、スケジュールやイメージ取得など Pod に起きた出来事が時系列で並ぶのはどこですか。", "code": null, "options": ["Events", "Labels", "Annotations", "Volumes"], "answer": 0, "explanation": "<code>kubectl describe pod<\/code> の出力の最後にある <code>Events<\/code> に、Pod に起きた出来事が時系列で並びます。"}, {"id": "q-ch2-s2-11", "type": "truefalse", "prompt": "Pending のまま進まない Pod は、<code>kubectl logs<\/code> でコンテナのログを見ると原因が分かることが多い。", "code": null, "options": [], "answer": false, "explanation": "Pending の Pod はコンテナがまだ動いていないので、ログからは手がかりを得られません。<code>kubectl describe pod<\/code> の Events を見ます。"}]}, {"id": "i3", "title": "CrashLoopBackOff は logs --previous を見る", "body": "<p><code>kubectl logs<\/code> は、コンテナの標準出力と標準エラー出力を表示します。<code>--previous<\/code>（短縮形は <code>-p<\/code>）を付けると、<strong>前回終了したコンテナ<\/strong>のログを表示します。<\/p>\n<div class=\"sk-cells\" data-label=\"--previous で見るのは、直前に異常終了したコンテナのログ\"><span class=\"dim\">1回目<\/span><span class=\"dim\">2回目<\/span><span class=\"on\">前回<\/span><span>いま<\/span><\/div>\n<p>CrashLoopBackOff の Pod では、いま動いているコンテナはすぐ終了してしまいます。異常終了する前にアプリが出したメッセージは、前回のコンテナのログに残っています。<\/p>\n<pre><code>$ kubectl logs api-5f6c7d8e9-q1w2e --previous<\/code><\/pre>\n<div class=\"sk-callout tip\"><p>CrashLoopBackOff の Pod を <code>kubectl delete pod<\/code> で消しても、Deployment の Pod なら同じひな形から作り直されるので、同じ状態に戻ります。消す前にログで原因を確かめましょう。<\/p><\/div>", "checks": [{"id": "q-ch2-s2-01", "type": "fill", "prompt": "再起動を繰り返しているコンテナについて、前回終了したコンテナのログを見たいときは <code>kubectl logs &lt;Pod名&gt; ____<\/code> とします。空欄に入るオプションを答えてください。", "code": null, "options": [], "answer": ["--previous", "-p"], "explanation": "<code>kubectl logs<\/code> に <code>--previous<\/code>（短縮形 <code>-p<\/code>）を付けると、前回終了したコンテナのログを表示します。", "hint": "「前の」という意味の英単語がオプション名です。"}, {"id": "q-ch2-s2-12", "type": "truefalse", "prompt": "CrashLoopBackOff になった Deployment の Pod は、<code>kubectl delete pod<\/code> で消せば直る。", "code": null, "options": [], "answer": false, "explanation": "Deployment の Pod は同じひな形から作り直されるので、消しても同じ状態に戻ります。消す前に <code>kubectl logs --previous<\/code> で原因を確かめます。"}, {"id": "q-ch2-s2-13", "type": "fill", "prompt": "<code>kubectl logs<\/code> の <code>--previous<\/code> オプションは、短縮形で <code>____<\/code> とも書けます。空欄に入るオプションを答えてください。", "code": null, "options": [], "answer": ["-p"], "explanation": "<code>--previous<\/code> の短縮形は <code>-p<\/code> です。前回終了したコンテナのログを表示します。"}]}, {"id": "i4", "type": "example", "title": "Pending のままの Pod と、CrashLoopBackOff の Pod があります。それぞれ、最初に何を見ればよいですか。", "body": "<ol class=\"sk-steps\"><li><p>Pending の Pod は、コンテナがまだ動いていません。ログはまだないので、<code>kubectl describe pod<\/code> の <code>Events<\/code> を見ます。<\/p><\/li><li><p>CrashLoopBackOff の Pod は、コンテナが起動してはすぐ終了します。前回終了したコンテナのログを <code>kubectl logs --previous<\/code> で見ます。<\/p><\/li><li><p>まとめると次のとおりです。<\/p><div class=\"sk-compare\"><div><h4>Pending のまま<\/h4><ul><li>ノードに割り当てられていないことが多い<\/li><li>コンテナが動いていないので、ログからは手がかりを得られない<\/li><li><code>kubectl describe pod<\/code> の <code>Events<\/code> を見る<\/li><\/ul><\/div><div><h4>CrashLoopBackOff<\/h4><ul><li>コンテナは起動するが、すぐ異常終了する<\/li><li>いま動いているコンテナはすぐ終了してしまう<\/li><li><code>kubectl logs --previous<\/code> で前回のログを見る<\/li><\/ul><\/div><\/div><\/li><\/ol>", "checks": [{"id": "q-ch2-s2-08", "type": "truefalse", "prompt": "STATUS が ImagePullBackOff の Pod は、コンテナイメージを取得できておらずコンテナが動いていないので、まず <code>kubectl describe pod<\/code> の <code>Events<\/code> を確認するのがよい。", "code": null, "options": [], "answer": true, "explanation": "ImagePullBackOff の Pod はコンテナイメージを取得できていないので、コンテナは動いておらず、ログもありません。<code>Events<\/code> には、どのイメージの取得に失敗したかなど、Pod に起きた出来事が並びます。"}]}]}], "exercise": [{"id": "q-ch2-ex-01", "type": "choice", "prompt": "次の出力の Pod について、正しい説明はどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m", "options": ["コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod を割り当てるノードがまだ決まっていない", "コンテナは正常に動いている"], "answer": 0, "explanation": "<code>CrashLoopBackOff<\/code> は、コンテナが起動しては異常終了することを繰り返し、待ち時間を延ばしながら再起動が続いている状態です。<code>RESTARTS<\/code> が 5 になっていることからも、再起動を繰り返していると分かります。", "refs": ["ch2-s1#i3", "ch2-s1#i1"]}, {"id": "q-ch2-ex-02", "type": "predict", "prompt": "存在しないタグを指定して Pod を作りました。数分後に <code>kubectl get pods<\/code> を実行したとき、<code>STATUS<\/code> 列に出る値として最も可能性が高いものはどれですか。", "code": "$ kubectl run web --image=nginx:9.99-not-exist\n（数分待つ）\n$ kubectl get pods", "options": ["Running", "ImagePullBackOff", "CrashLoopBackOff", "Completed"], "answer": 1, "explanation": "指定したタグのイメージが存在しないため、コンテナイメージを取得できません。取得に失敗して再試行を待っている間、<code>STATUS<\/code> には <code>ImagePullBackOff<\/code> が出ます。", "refs": ["ch2-s1#i3"]}, {"id": "q-ch2-ex-03", "type": "fill", "prompt": "クラスタに受け入れられたものの、ノードへのスケジュール待ちやイメージのダウンロード中で、コンテナがまだ動いていない Pod の phase を答えてください。", "code": null, "options": [], "answer": ["Pending"], "explanation": "Pending は、Pod がクラスタに受け入れられたものの、コンテナがまだ動く状態になっていない phase です。スケジュール待ちやイメージのダウンロード中もここに含まれます。", "refs": ["ch2-s1#i2"]}, {"id": "q-ch2-ex-04", "type": "choice", "prompt": "次の出力の Pod について、原因として最も考えられるものはどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS   AGE\nweb-6d8f7c9b5-k3m2n   0/1     ImagePullBackOff   0          2m", "options": ["イメージ名やタグの書き間違い", "ノードの CPU の空きが足りない", "アプリが起動直後に異常終了している", "同じ Pod のコンテナが localhost で通信できない"], "answer": 0, "explanation": "<code>ImagePullBackOff<\/code> は、コンテナイメージを取得できずに再試行を待っている状態です。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こります。", "refs": ["ch2-s1#i3"]}, {"id": "q-ch2-ex-05", "type": "choice", "prompt": "Pod の phase が Failed のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが終了し、少なくとも1つが失敗で終わった", "コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod をノードに割り当てられていない"], "answer": 0, "explanation": "Failed は、すべてのコンテナが終了し、少なくとも1つが失敗で終わった phase です。起動と異常終了の繰り返しは CrashLoopBackOff で、phase ではありません。", "refs": ["ch2-s1#i2"]}, {"id": "q-ch2-ex-06", "type": "choice", "prompt": "Pending のまま進まない Pod の原因を探すとき、最初に確認するものとして適切なのはどれですか。", "code": null, "options": ["kubectl describe pod の Events", "kubectl logs の出力", "kubectl exec で入ったコンテナの中のファイル", "kubectl rollout undo の結果"], "answer": 0, "explanation": "Pending のまま進まない Pod は、ノードに割り当てられていないことがよくあります。その場合コンテナは動いていないので、ログからは手がかりを得られません。<code>kubectl describe pod<\/code> の <code>Events<\/code> に出るスケジューラのメッセージを確認します。", "refs": ["ch2-s2#i2"]}, {"id": "q-ch2-ex-07", "type": "choice", "prompt": "ある Pod の <code>kubectl describe pod<\/code> の <code>Events<\/code> に次の行がありました。この Pod の <code>STATUS<\/code> として最も考えられるものはどれですか。", "code": "Warning  FailedScheduling  2m  default-scheduler  0/3 nodes are available: 3 Insufficient memory.", "options": ["Pending", "CrashLoopBackOff", "ImagePullBackOff", "Running"], "answer": 0, "explanation": "<code>FailedScheduling<\/code> は、ノードのメモリが足りず、Pod をどのノードにも割り当てられなかったことを示します。コンテナはまだ動いていないので、Pod は Pending のままです。", "refs": ["ch2-s2#i2", "ch2-s1#i2"]}, {"id": "q-ch2-ex-08", "type": "choice", "prompt": "<code>kubectl logs<\/code> で表示されるものはどれですか。", "code": null, "options": ["コンテナが標準出力と標準エラー出力に書いたログ", "Pod に起きた出来事（Events）", "ノードの CPU とメモリの空き", "Deployment のリビジョンの一覧"], "answer": 0, "explanation": "<code>kubectl logs<\/code> は、コンテナが標準出力と標準エラー出力に書いたログを表示します。Pod に起きた出来事は <code>kubectl describe pod<\/code> の <code>Events<\/code> で見ます。", "refs": ["ch2-s2#i3"]}, {"id": "q-ch2-ex-09", "type": "choice", "prompt": "CrashLoopBackOff の Pod の原因を調べるとき、アプリが異常終了する前に出したメッセージを見るのに適したコマンドはどれですか。", "code": null, "options": ["kubectl logs <Pod名> --previous", "kubectl rollout status deployment/web", "kubectl get pods", "kubectl scale deployment/web --replicas=1"], "answer": 0, "explanation": "CrashLoopBackOff の Pod では、いま動いているコンテナはすぐ終了してしまいます。<code>--previous<\/code> を付けて、前回終了したコンテナのログを見ます。", "refs": ["ch2-s2#i3"]}, {"id": "q-ch2-ex-10", "type": "truefalse", "prompt": "phase が Running の Pod では、Pod の中のすべてのコンテナが動いている。", "code": null, "options": [], "answer": false, "explanation": "Running は、Pod がノードに割り当てられ、<strong>少なくとも1つ<\/strong>のコンテナが動いている phase です。すべてのコンテナが動いているとは限りません。", "refs": ["ch2-s1#i2"]}]}], "finalExam": [{"id": "q-final-01", "type": "choice", "prompt": "Deployment web のイメージを新しいタグに更新したところ、新しい Pod が CrashLoopBackOff になりました。まずサービスを元の状態に戻し、原因はそのあとで調べたいと考えています。最初に実行するコマンドとして適切なのはどれですか。", "code": null, "options": ["kubectl rollout undo deployment/web", "kubectl delete pod で CrashLoopBackOff の Pod を消す", "kubectl logs で新しい Pod のログを見る", "kubectl get pods を繰り返して回復を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> で前のリビジョンに戻せば、動いていたイメージの Pod に戻ります。Pod を消しても ReplicaSet が同じひな形で作り直すため、同じ状態に戻ります。原因の調査は、元に戻したあとで行います。", "refs": ["ch1-s2#i3", "ch2-s1#i3"]}, {"id": "q-final-02", "type": "choice", "prompt": "Deployment web の <code>replicas<\/code> を 3 から 10 に増やしたところ、新しく増えた Pod の一部が Pending のまま進みません。その Pod に <code>kubectl describe pod<\/code> を実行し、<code>Events<\/code> に次の行を見つけました。この Pod について正しい見立てはどれですか。", "code": "Warning  FailedScheduling  3m  default-scheduler  0/3 nodes are available: 3 Insufficient cpu.", "options": ["どのノードも CPU の空きが足りず、Pod を割り当てられていない", "コンテナが起動直後に異常終了を繰り返している", "コンテナイメージのタグが存在しない", "Pod は動いているが、ログの出力が止まっている"], "answer": 0, "explanation": "<code>replicas<\/code> を増やすと ReplicaSet が Pod を追加で作りますが、<code>FailedScheduling<\/code> と <code>Insufficient cpu<\/code> は、CPU の空きがあるノードがなく、スケジューラが Pod をノードに割り当てられなかったことを示します。コンテナはまだ動いていないので、ログからは手がかりを得られません。", "refs": ["ch2-s2#i2", "ch1-s2#i2"]}, {"id": "q-final-03", "type": "order", "prompt": "Deployment のイメージのタグを書き間違え、新しい Pod が ImagePullBackOff になりました。調べて直すまでの手順を、正しい順に並べてください。", "code": null, "options": ["Deployment のイメージを正しいタグに更新する", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "kubectl get pods で新しい Pod が Running になったことを確かめる", "kubectl get pods で ImagePullBackOff の Pod を見つける"], "answer": ["kubectl get pods で ImagePullBackOff の Pod を見つける", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "Deployment のイメージを正しいタグに更新する", "kubectl get pods で新しい Pod が Running になったことを確かめる"], "explanation": "<code>kubectl get pods<\/code> で ImagePullBackOff の Pod を見つけ、<code>describe<\/code> の <code>Events<\/code> でどのイメージの取得に失敗したかを確かめます。Deployment の Pod のひな形を正しいタグに直すとロールアウトが始まり、新しい Pod が作られます。最後に Running になったことを確かめます。", "refs": ["ch2-s1#i3", "ch2-s2#i2", "ch1-s2#i2"]}, {"id": "q-final-04", "type": "fill", "prompt": "Deployment で動かしている Pod が CrashLoopBackOff になっていたので、<code>kubectl delete pod<\/code> で消しました。少しすると新しい Pod が作られ、その Pod もまた CrashLoopBackOff になりました。新しい Pod を作ったオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment が作った ReplicaSet は、指定された数の Pod を維持します。Pod が1つ減ると、ReplicaSet が同じひな形から新しい Pod を作ります。ひな形は変わっていないので、新しい Pod も同じ理由で異常終了を繰り返します。Pod を消すのではなく、<code>kubectl logs --previous<\/code> などで原因を調べます。", "refs": ["ch1-s2#i1", "ch2-s1#i3"]}], "factsheet": [{"id": "F-001", "claim": "Pod は Kubernetes で作成・管理できる最小のデプロイ単位で、1つ以上のコンテナのグループである", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-002", "claim": "同じ Pod のコンテナはストレージとネットワークを共有し、localhost で互いに通信できる", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-003", "claim": "Pod は使い捨て（比較的短命）を前提にしており、Pod 自体は自己修復しない。通常は直接作らず Deployment などのワークロードリソースで作る", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-004", "claim": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持する", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-005", "claim": "Deployment のロールアウトは .spec.template が変わったときだけ始まり、新しい ReplicaSet を作って Pod を順に入れ替える（既定の RollingUpdate）。スケールではロールアウトは起きない", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-006", "claim": "kubectl rollout undo で Deployment を前のリビジョンに戻せる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-007", "claim": "Pod の phase は Pending・Running・Succeeded・Failed・Unknown の5つ", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-008", "claim": "Pending はクラスタに受け入れられたがコンテナがまだ動く状態にない phase で、スケジュール待ちやイメージのダウンロード中を含む", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-009", "claim": "CrashLoopBackOff は phase ではなく、コンテナが起動と異常終了を繰り返し、kubelet が待ち時間を延ばしながら再起動している状態", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-010", "claim": "イメージを取得できないとき、Pod は ImagePullBackOff になり取得を再試行する。イメージ名の誤りや非公開レジストリの認証情報不足などで起こる", "url": "https://kubernetes.io/docs/concepts/containers/images/", "rank": "S"}, {"id": "F-011", "claim": "kubectl describe pod は Pod の詳細と Events を表示する。Pending のまま進まない Pod は、スケジューラのメッセージを Events で確認する", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-012", "claim": "Pending のまま進まない Pod の多くは、CPU やメモリの不足でノードに割り当てられていない", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-013", "claim": "kubectl logs の --previous（-p）は、前回終了したコンテナのログを表示する", "url": "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/", "rank": "S"}, {"id": "F-014", "claim": "kubectl get pods で Pod の一覧と状態を表示できる", "url": "https://kubernetes.io/docs/reference/kubectl/quick-reference/", "rank": "S"}, {"id": "F-015", "claim": "kubectl rollout status で Deployment のロールアウトの状況を確認できる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-016", "claim": "phase の意味：Running は少なくとも1つのコンテナが動いている、Succeeded はすべてのコンテナが正常終了し再起動しない、Failed はすべてのコンテナが終了し少なくとも1つが失敗、Unknown は状態を取得できない", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-017", "claim": "kubectl get pods の RESTARTS 列はコンテナの再起動回数を示す", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-018", "claim": "コンテナが標準出力・標準エラー出力に書いたログは kubectl logs で見られる", "url": "https://kubernetes.io/docs/concepts/cluster-administration/logging/", "rank": "S"}, {"id": "F-019", "claim": "Kubernetes はコンテナ化されたワークロードとサービスを管理する、ポータブルで拡張可能なオープンソースのプラットフォームである", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-020", "claim": "Kubernetes は Google が2014年にオープンソース化したプロジェクトで、K8s と略される（K と s の間の8文字を数えた略記）", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-021", "claim": "Docker はアプリケーションを開発・配布・実行するためのオープンなプラットフォームで、アプリをコンテナという隔離された環境で動かす", "url": "https://docs.docker.com/get-started/docker-overview/", "rank": "S"}, {"id": "F-022", "claim": "kubectl は Kubernetes API を使ってクラスタのコントロールプレーンと通信するコマンドラインツールである", "url": "https://kubernetes.io/docs/reference/kubectl/", "rank": "S"}, {"id": "F-023", "claim": "YAML は人が読み書きしやすいデータのシリアライズ（記述）言語である", "url": "https://yaml.org/", "rank": "S"}, {"id": "F-024", "claim": "nginx は HTTP サーバー・リバースプロキシサーバーなどとして動くソフトウェアである", "url": "https://nginx.org/en/", "rank": "S"}]}</script>
<script>
"use strict";
(() => {
  // ===== 定数（references/learning-engine.md） =====
  const PROGRESS_VERSION = 3;
  const RUN_SIZE = 10;          // 今日の想起・章末演習・総合演習は1回10問まで
  const THINK_MS = 3000;        // 選択肢を出す前に、問題文だけを見せる時間
  const ADVANCE_MS = 1200;      // 演習で正解したあと、次の問題へ自動で進むまでの時間
  const RETRY_GAP = 3;          // 演習で間違えた問題は、3問あとにもう一度出す
  const MAX_RETRY = 3;          // 同じ回の中でのくり返しは3回まで
  const WARMUP_SIZE = 2;        // 節を開いたときに出す、ほかの節の期日が来た問題の数
  const READ_CHARS_PER_MINUTE = 400;
  const KANA = ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク"];

  const app = document.getElementById("app");

  // ===== 教材データ =====
  let content;
  try {
    content = JSON.parse(document.getElementById("study-data").textContent);
  } catch (error) {
    app.innerHTML = "<p>教材データを読み込めません。scripts/build_html.py で教材JSONを埋め込んだHTMLを開いてください。</p>";
    return;
  }

  const STORAGE_KEY = "study-kit:" + content.meta.id;
  const chapters = content.chapters;
  const finalExam = content.finalExam || [];
  const sectionById = new Map();
  const chapterBySectionId = new Map();
  const questionById = new Map();   // すべての問題（すぐ確認・章末演習・総合演習）
  const checkInfo = new Map();      // すぐ確認の問題ID → { section, item }
  const drillChapter = new Map();   // 章末演習・総合演習の問題ID → 章（総合演習は null）
  const factById = new Map((content.factsheet || []).map((fact) => [fact.id, fact]));

  for (const chapter of chapters) {
    for (const section of chapter.sections) {
      sectionById.set(section.id, section);
      chapterBySectionId.set(section.id, chapter);
      let textNo = 0;
      for (const item of section.items) {
        item.kind = item.type === "example" ? "example" : "text";
        item.no = item.kind === "text" ? ++textNo : null;
        // 項目の問題は checks（1問以上。重要な項目ほど多い）。1問だけの旧形式 check も読む。問題を削除した項目は空（説明だけのページ）
        item.checks = (Array.isArray(item.checks) ? item.checks : item.check ? [item.check] : []).filter(Boolean);
        item.checks.forEach((q, k) => { questionById.set(q.id, q); checkInfo.set(q.id, { section, item, sub: k }); });
      }
    }
    for (const question of chapter.exercise || []) { questionById.set(question.id, question); drillChapter.set(question.id, chapter); }
  }
  for (const question of finalExam) { questionById.set(question.id, question); drillChapter.set(question.id, null); }
  const orderedSections = chapters.flatMap((chapter) => chapter.sections);
  const allIds = [...questionById.keys()];

  const chapterNo = (chapter) => chapters.indexOf(chapter) + 1;
  function sectionCode(section) {
    const chapter = chapterBySectionId.get(section.id);
    return `${chapterNo(chapter)}-${chapter.sections.indexOf(section) + 1}`;
  }
  const chapterLabel = (chapter) => `第${chapterNo(chapter)}章 ${chapter.title}`;
  const itemLabel = (item) => (item.kind === "example" ? "例題" : `${item.no}. ${item.title}`);
  function parseRef(ref) {
    const [sectionId, itemId] = String(ref).split("#");
    const section = sectionById.get(sectionId);
    if (!section) return null;
    return { section, item: itemId ? section.items.find((item) => item.id === itemId) || null : null };
  }
  function refLabel(ref) {
    const target = parseRef(ref);
    if (!target) return "";
    const base = `${sectionCode(target.section)} ${target.section.title}`;
    return target.item ? `${base} ›「${itemLabel(target.item)}」` : base;
  }
  // 問題が教科書のどこに属するか（すぐ確認は置かれた項目、演習は refs の1件目）
  function homeOf(id) {
    const info = checkInfo.get(id);
    if (info) return { section: info.section, item: info.item };
    return parseRef((questionById.get(id).refs || [])[0]);
  }
  function scopeLabel(id) {
    if (checkInfo.has(id)) { const { section } = checkInfo.get(id); return `${sectionCode(section)} ${section.title}`; }
    const chapter = drillChapter.get(id);
    return chapter ? `第${chapterNo(chapter)}章 章末演習` : "総合演習";
  }

  // ===== 日付（端末のローカル日付。?today=YYYY-MM-DD で検証用に上書きできる） =====
  const debugToday = new URLSearchParams(location.search).get("today");
  function toDateString(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }
  function today() {
    if (debugToday && /^\d{4}-\d{2}-\d{2}$/.test(debugToday)) return debugToday;
    return toDateString(new Date());
  }
  function addDays(dateString, days) {
    const [y, m, d] = dateString.split("-").map(Number);
    return toDateString(new Date(y, m - 1, d + days));
  }
  function formatDate(dateString) {
    const [, m, d] = dateString.split("-").map(Number);
    if (dateString === addDays(today(), 1)) return `明日（${m}/${d}）`;
    return `${m}/${d}`;
  }

  // ===== 学習履歴 =====
  // questions[id]：status（new／learning／closed／excluded）、track（fast：2回でクローズ／standard：3回）、
  //                streak（日を変えた正解の数）、due（次に出す日）、lastCounted（最後に数えた日）、wrongDay（最後に間違えた日）、
  //                everCorrect（一度でも正解した）、attempts、lapses、lastAnswered、prevStatus（出さない前の状態）
  function createEmptyProgress() {
    return { version: PROGRESS_VERSION, contentId: content.meta.id, questions: {}, rtRatios: [], memos: {}, lastSectionId: null, stats: { answered: 0, correct: 0 } };
  }
  function normalizeProgress(saved) {
    const base = createEmptyProgress();
    if (!saved || saved.version !== PROGRESS_VERSION) return base; // 形の違う古い履歴は引き継がない
    return { ...base, ...saved, questions: saved.questions || {}, rtRatios: saved.rtRatios || [], memos: saved.memos || {}, stats: { ...base.stats, ...saved.stats } };
  }
  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.contentId === content.meta.id) return normalizeProgress(saved);
    } catch (error) { /* 読めないときは空の履歴で始める */ }
    return createEmptyProgress();
  }
  let progress = loadProgress();
  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (error) {
      showToast("学習履歴を保存できませんでした。右上の ⚙ 設定から学習履歴を書き出して控えを取ってください。");
    }
  }

  // ===== 出題の判断（すべてシステムが行う） =====
  const recOf = (id) => progress.questions[id] || { status: "new", attempts: 0 };
  // 画面に出す状態：new 未出題 / due 今日出す / wait 次の出題日を待つ / closed 覚えた / excluded 出さない
  function stateOf(id) {
    const r = recOf(id);
    if (r.status === "learning") return r.due <= today() ? "due" : "wait";
    return r.status;
  }
  const isActive = (id) => recOf(id).status !== "excluded";
  const STATE_TEXT = { new: "未出題", due: "今日出す", wait: "次の出題を待つ", closed: "覚えた", excluded: "出さない" };
  function stateTag(id) {
    const s = stateOf(id);
    const text = s === "wait" ? `次は ${formatDate(recOf(id).due)}` : STATE_TEXT[s];
    return el("span", { class: `qs ${s}`, text });
  }

  // 回答時間の基準：選択肢などの文字数から見積もり、学習者のふだんの速さで補正する
  function baseMs(q) {
    if (q.type === "fill") return 3000 + Math.max(...q.answer.map((a) => a.length)) * 350;
    if (q.type === "order") return 4000 + q.options.join("").length * 60;
    if (q.type === "truefalse") return 2500 + (q.code ? 1500 : 0);
    return 2000 + q.options.join("").length * 50 + (q.code ? 1500 : 0);
  }
  function personalFactor() {
    const a = progress.rtRatios;
    if (a.length < 5) return 1;
    const sorted = [...a].sort((x, y) => x - y);
    return Math.min(1.6, Math.max(0.7, sorted[Math.floor(sorted.length / 2)]));
  }
  // good：速く正解 / hard：遅い正解、またはその日に間違えたあとの正解 / again：不正解
  function gradeOf(q, correct, rtMs, id) {
    if (!correct) return "again";
    const ratio = rtMs / baseMs(q);
    progress.rtRatios = [...progress.rtRatios, Math.round(ratio * 100) / 100].slice(-20);
    if (recOf(id).wrongDay === today()) return "hard";
    return ratio <= personalFactor() ? "good" : "hard";
  }
  // クローズまでの道筋：初回に速く正解 → 翌日もう一度正解でクローズ（2回）。それ以外は日を変えて3回正解（間隔 1日 → 3日）
  function applyResult(id, grade) {
    const r = { ...recOf(id) };
    const d = today();
    r.attempts = (r.attempts || 0) + 1;
    r.lastAnswered = d;
    progress.stats.answered += 1;
    if (grade !== "again") { progress.stats.correct += 1; r.everCorrect = true; }
    if (r.status === "excluded") { progress.questions[id] = r; saveProgress(); return r; }
    if (grade === "again") {
      if (r.status === "closed") r.reopened = d;
      r.status = "learning";
      r.track = "standard";
      r.streak = 0;
      r.due = addDays(d, 1);
      r.wrongDay = d;
      r.lapses = (r.lapses || 0) + 1;
    } else if (r.status === "new") {
      r.status = "learning";
      r.track = grade === "good" ? "fast" : "standard";
      r.streak = 1;
      r.lastCounted = d;
      r.due = addDays(d, 1);
    } else if (r.status === "learning" && r.due <= d && r.lastCounted !== d && r.wrongDay !== d) {
      // 数えるのは、期日が来た日の、その日に間違えていない正解だけ（同じ日の正解・期日前の正解は数えない）
      r.streak = (r.streak || 0) + 1;
      r.lastCounted = d;
      if (r.streak >= (r.track === "fast" ? 2 : 3)) {
        r.status = "closed";
        r.closedOn = d;
        delete r.due;
      } else {
        r.due = addDays(d, r.streak === 1 ? 1 : 3);
      }
    }
    progress.questions[id] = r;
    saveProgress();
    return r;
  }
  function setExcluded(id, on) {
    const r = { ...recOf(id) };
    if (on && r.status !== "excluded") { r.prevStatus = r.status; r.status = "excluded"; }
    if (!on && r.status === "excluded") { r.status = r.prevStatus || "new"; delete r.prevStatus; }
    progress.questions[id] = r;
    saveProgress();
  }
  const dueIds = () => allIds.filter((id) => stateOf(id) === "due");
