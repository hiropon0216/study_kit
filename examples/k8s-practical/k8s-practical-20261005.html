<script>
"use strict";
(() => {
  // ===== 定数 =====
  const PROGRESS_VERSION = 2;
  const RUN_SIZE = 10;          // 章末演習・総合演習・復習は1回10問ずつ
  const READ_CHARS_PER_MINUTE = 400; // 読了目安の見積もり（minutes がない節）
  const KANA = ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク"];
  const TYPE_LABELS = { choice: "選択", predict: "結果予測", fill: "入力", order: "並べ替え", truefalse: "○×" };

  const app = document.getElementById("app");

  // ===== 教材データ =====
  let content;
  try {
    content = JSON.parse(document.getElementById("study-data").textContent);
  } catch (error) {
    app.innerHTML = "<p>教材データを読み込めません。scripts/build_html.py で教材JSONを埋め込んだHTMLを開いてください。</p>";
    return;
  }

  const STORAGE_KEY = "study-kit:" + content.meta.id;
  const chapters = content.chapters;
  const finalExam = content.finalExam || [];
  const sectionById = new Map();
  const chapterBySectionId = new Map();
  const checkInfo = new Map();    // すぐ確認の問題ID → { question, section, item }
  const drillInfo = new Map();    // 章末演習・総合演習の問題ID → { question, chapter|null }
  const factById = new Map((content.factsheet || []).map((fact) => [fact.id, fact]));

  for (const chapter of chapters) {
    for (const section of chapter.sections) {
      sectionById.set(section.id, section);
      chapterBySectionId.set(section.id, chapter);
      let textNo = 0;
      for (const item of section.items) {
        item.kind = item.type === "example" ? "example" : "text";
        item.no = item.kind === "text" ? ++textNo : null;
        checkInfo.set(item.check.id, { question: item.check, section, item });
      }
    }
    for (const question of chapter.exercise || []) drillInfo.set(question.id, { question, chapter });
  }
  for (const question of finalExam) drillInfo.set(question.id, { question, chapter: null });
  const orderedSections = chapters.flatMap((chapter) => chapter.sections);
  const allChecks = [...checkInfo.values()].map((info) => info.question);
  const allDrills = [...drillInfo.values()].map((info) => info.question);

  function chapterNo(chapter) { return chapters.indexOf(chapter) + 1; }
  function sectionCode(section) {
    const chapter = chapterBySectionId.get(section.id);
    return `${chapterNo(chapter)}-${chapter.sections.indexOf(section) + 1}`;
  }
  function chapterLabel(chapter) { return `第${chapterNo(chapter)}章 ${chapter.title}`; }
  function itemLabel(item) { return item.kind === "example" ? "例題" : `${item.no}. ${item.title}`; }
  // refs の1件（"ch1-s2" か "ch1-s2#i3"）を、節と項目に分ける
  function parseRef(ref) {
    const [sectionId, itemId] = String(ref).split("#");
    const section = sectionById.get(sectionId);
    if (!section) return null;
    return { section, item: itemId ? section.items.find((item) => item.id === itemId) || null : null };
  }
  function refLabel(ref) {
    const target = parseRef(ref);
    if (!target) return "";
    const base = `${sectionCode(target.section)} ${target.section.title}`;
    return target.item ? `${base} ›「${itemLabel(target.item)}」` : base;
  }

  // ===== 日付（端末のローカル日付） =====
  function today() {
    const date = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }

  // ===== 学習履歴の保存 =====
  // checks   : すぐ確認の問題ID → "ok" | "ng"（復習の記録は持たない）
  // questions: 章末演習・総合演習の問題ID → { result: "ok"|"ng", flagged, attempts, lastAnswered }
  function createEmptyProgress() {
    return { version: PROGRESS_VERSION, contentId: content.meta.id, checks: {}, questions: {}, memos: {}, lastSectionId: null, stats: { answered: 0, correct: 0 } };
  }
  function normalizeProgress(saved) {
    const base = createEmptyProgress();
    if (!saved || saved.version !== PROGRESS_VERSION) return base; // 形の違う古い履歴は引き継がない
    return { ...base, ...saved, checks: saved.checks || {}, questions: saved.questions || {}, memos: saved.memos || {}, stats: { ...base.stats, ...saved.stats } };
  }
  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.contentId === content.meta.id) return normalizeProgress(saved);
    } catch (error) { /* 読めないときは空の履歴で始める */ }
    return createEmptyProgress();
  }
  let progress = loadProgress();
  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (error) {
      showToast("学習履歴を保存できませんでした。右上の ⚙ 設定から学習履歴を書き出して控えを取ってください。");
    }
  }
  function countAnswer(isCorrect) {
    progress.stats.answered += 1;
    if (isCorrect) progress.stats.correct += 1;
  }

  // ===== 状態の判定 =====
  function checkStatus(questionId) { return progress.checks[questionId] || "new"; }
  function drillRecord(questionId) { return progress.questions[questionId] || null; }
  function drillResult(questionId) { const record = drillRecord(questionId); return record ? record.result : "new"; }
  function sectionChecks(section) { return section.items.map((item) => item.check); }
  function sectionOkCount(section) { return sectionChecks(section).filter((q) => checkStatus(q.id) === "ok").length; }
  // 節の完了：すぐ確認にすべて正解した（次の節へ進める）
  function isSectionDone(section) { return sectionOkCount(section) === section.items.length; }
  function chapterStatus(chapter) {
    if (chapter.sections.every(isSectionDone)) return "done";
    const touched = chapter.sections.some((s) => sectionChecks(s).some((q) => checkStatus(q.id) !== "new"))
      || (chapter.exercise || []).some((q) => drillResult(q.id) !== "new");
    return touched ? "learning" : "new";
  }
  // 進捗率 = 正解済みの問題 ÷ 全問題（すぐ確認＋章末演習＋総合演習）
  function progressPercent() {
    const total = allChecks.length + allDrills.length;
    if (!total) return 0;
    const done = allChecks.filter((q) => checkStatus(q.id) === "ok").length + allDrills.filter((q) => drillResult(q.id) === "ok").length;
    return Math.floor((done / total) * 100);
  }
  function accuracyText() {
    const { answered, correct } = progress.stats;
    return answered ? `${Math.round((correct / answered) * 100)}%` : "—";
  }
  // 復習リスト：章末演習・総合演習で最後に間違えた問題と、「あとで復習」に登録した問題
  function reviewIds() {
    return allDrills.filter((q) => { const r = drillRecord(q.id); return r && (r.result === "ng" || r.flagged); }).map((q) => q.id);
  }
  function readingMinutes(section) {
    if (Number.isInteger(section.minutes) && section.minutes > 0) return section.minutes;
    const chars = section.items.map((item) => stripTags(item.title + item.body)).join("").length;
    return Math.max(1, Math.ceil(chars / READ_CHARS_PER_MINUTE));
  }

  // ===== 正誤判定 =====
  function normalizeFill(text) { return String(text).normalize("NFKC").toLowerCase().replace(/\s+/g, ""); }
  function isAnswerCorrect(question, response) {
    if (response === null || response === undefined) return false;
    switch (question.type) {
      case "choice":
      case "predict": return response === question.answer;
      case "truefalse": return response === question.answer;
      case "fill": return question.answer.some((accepted) => normalizeFill(accepted) === normalizeFill(response));
      case "order": return response.length === question.answer.length && response.every((item, i) => item === question.answer[i]);
      default: return false;
    }
  }

  // ===== 小さなユーティリティ =====
  function el(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "html") node.innerHTML = value; // 教材の本文・問題文・解説（スキルが生成した信頼済みHTML）だけに使う
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function stripTags(html) { const div = document.createElement("div"); div.innerHTML = html; return div.textContent || ""; }
  function shuffled(items) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
  function shuffledAvoiding(items, forbiddenOrder) {
    if (items.length < 2) return items.slice();
    let result;
    do { result = shuffled(items); } while (result.every((item, i) => item === forbiddenOrder[i]));
    return result;
  }
  function formatClock(totalSeconds) {
    const abs = Math.max(0, Math.floor(totalSeconds));
    return `${String(Math.floor(abs / 60)).padStart(2, "0")}:${String(abs % 60).padStart(2, "0")}`;
  }
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollToEl(node, block = "start") { if (node) node.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth", block }); }
  function flash(node) { if (!node) return; node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
  function shake(node) { if (!node) return; node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); }
  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
  }
  function bookIcon() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "16"); svg.setAttribute("height", "16"); svg.setAttribute("viewBox", "0 0 16 16");
    svg.innerHTML = '<rect x="3" y="2" width="10" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/>';
    return svg;
  }

  // ===== 演出：紙吹雪（クラッカー） =====
  const confettiCanvas = document.getElementById("confetti");
  const confettiContext = confettiCanvas.getContext("2d");
  const CONFETTI_COLORS = ["#7b94ff", "#3cc28d", "#f2c94c", "#f0894f", "#e7eaf0", "#6aa8ff"];
  let confettiPieces = [];
  let confettiRunning = false;
  function resizeConfettiCanvas() {
    const ratio = window.devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * ratio;
    confettiCanvas.height = innerHeight * ratio;
    confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener("resize", resizeConfettiCanvas);
  resizeConfettiCanvas();
  function burstConfetti(x, y, { count = 70, angle = -Math.PI / 2, spread = Math.PI / 2.2, power = 13 } = {}) {
    if (prefersReducedMotion) return;
    for (let i = 0; i < count; i++) {
      const direction = angle + (Math.random() - 0.5) * spread;
      const speed = power * (0.55 + Math.random() * 0.6);
      confettiPieces.push({
        x, y, vx: Math.cos(direction) * speed, vy: Math.sin(direction) * speed,
        rotation: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.4,
        width: 6 + Math.random() * 6, height: 4 + Math.random() * 5,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)], life: 110 + Math.random() * 50,
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(drawConfetti); }
  }
  function drawConfetti() {
    confettiContext.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of confettiPieces) {
      p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.rotation += p.spin; p.life -= 1;
      confettiContext.save();
      confettiContext.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      confettiContext.translate(p.x, p.y);
      confettiContext.rotate(p.rotation);
      confettiContext.fillStyle = p.color;
      confettiContext.fillRect(-p.width / 2, -p.height / 2, p.width, p.height * Math.abs(Math.cos(p.rotation * 2)) + 1);
      confettiContext.restore();
    }
    confettiPieces = confettiPieces.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    if (confettiPieces.length) requestAnimationFrame(drawConfetti);
    else { confettiRunning = false; confettiContext.clearRect(0, 0, innerWidth, innerHeight); }
  }
  // 正解したとき：回答した場所から小さなクラッカー
  function celebrateAt(node) {
    if (!node) return;
    const rect = node.getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top + 10, { count: 60 });
  }
  // 節の全問正解・演習の全問正解：画面の両下から大きなクラッカー
  function celebrateBig() {
    burstConfetti(0, innerHeight, { count: 110, angle: -Math.PI / 3, spread: Math.PI / 4, power: 22 });
    burstConfetti(innerWidth, innerHeight, { count: 110, angle: (-2 * Math.PI) / 3, spread: Math.PI / 4, power: 22 });
  }

  // ===== 画面の切り替え =====
  // home: ホーム / lesson: 節のページ / run: 演習 / settings: 設定
  let currentView = "home";
  let lesson = null;       // 表示中の節のページの状態
  let run = null;          // 演習の1回分
  let keyHandler = null;   // 表示中の画面のキー操作
  let readingObserver = null;

  function render(options = {}) {
    keyHandler = null;
    if (readingObserver) { readingObserver.disconnect(); readingObserver = null; }
    app.replaceChildren();
    const gear = document.getElementById("gear");
    if (currentView === "settings") gear.setAttribute("aria-current", "page"); else gear.removeAttribute("aria-current");
    if (currentView === "home") renderHome();
    else if (currentView === "lesson") renderLesson();
    else if (currentView === "run") renderRun();
    else if (currentView === "settings") renderSettings();
    renderHeader();
    if (!options.keepScroll) window.scrollTo(0, 0);
  }
  function showView(view) {
    if (currentView === "run" && view !== "run" && run && run.kind === "mock" && !run.finished) {
      showToast("模擬試験中です。「採点して終了」で終えてから移動してください。");
      return;
    }
    if (view !== currentView) confettiPieces = [];
    currentView = view;
    render();
  }
  // 節を開く。itemId を渡すとその項目まで移動して光らせる
  function openSection(sectionId, { mode = "read", itemId = null } = {}) {
    const section = sectionById.get(sectionId);
    if (!section) return;
    if (currentView === "run" && run && run.kind === "mock" && !run.finished) { showView("lesson"); return; }
    lesson = { sectionId, mode, ui: {}, readingItem: section.items[0].id };
    progress.lastSectionId = sectionId;
    saveProgress();
    currentView = "lesson";
    render();
    if (itemId) {
      requestAnimationFrame(() => {
        const head = document.getElementById(`head-${itemId}`);
        scrollToEl(document.getElementById(`blk-${itemId}`));
        flash(head);
      });
    }
  }
  document.getElementById("brand").addEventListener("click", () => showView("home"));
  document.getElementById("gear").addEventListener("click", () => showView("settings"));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeSearch(); closeToc(); }
    if (!keyHandler || event.isComposing) return;
    const tag = event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (tag === "BUTTON" && event.key === "Enter")) return;
    keyHandler(event);
  });

  // ===== 上部バー =====
  function renderHeader() {
    const percent = progressPercent();
    document.getElementById("hdr-progress").hidden = currentView === "home";
    document.getElementById("hdr-meter").style.width = percent + "%";
    document.getElementById("hdr-pct").textContent = percent + "%";
  }

  // ===== 検索（用語・本文・問題） =====
  const searchIndex = [];
  for (const section of orderedSections) {
    for (const item of section.items) {
      searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} ›「${itemLabel(item)}」`, text: stripTags(`${item.title}\n${item.body}`) });
      searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} › すぐ確認`, text: stripTags(item.check.prompt) });
    }
    if (section.keyPoints) searchIndex.push({ section, item: null, label: `${sectionCode(section)} ${section.title} › この節の要点`, text: section.keyPoints.map(stripTags).join(" ／ ") });
  }
  for (const [id, info] of drillInfo) {
    const target = parseRef((info.question.refs || [])[0]);
    if (target) searchIndex.push({ section: target.section, item: target.item, label: `${info.chapter ? chapterLabel(info.chapter) + " 章末演習" : "総合演習"} の問題`, text: stripTags(info.question.prompt), drillId: id });
  }
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");
  function snippet(text, query) {
    const flat = text.replace(/\s+/g, " ");
    const index = flat.toLowerCase().indexOf(query.toLowerCase());
    const start = Math.max(0, index - 24);
    const piece = flat.slice(start, index + query.length + 40);
    const at = index - start;
    return [start > 0 ? "…" : "", piece.slice(0, at), el("mark", { text: piece.slice(at, at + query.length) }), piece.slice(at + query.length), "…"];
  }
  function runSearch() {
    const query = searchInput.value.trim();
    if (!query) { closeSearch(); return; }
    const hits = searchIndex.filter((entry) => entry.text.toLowerCase().includes(query.toLowerCase())).slice(0, 8);
    searchResults.replaceChildren(...(hits.length ? hits.map((hit) => el("button", {
      role: "option",
      onclick: () => { closeSearch(); searchInput.value = ""; openSection(hit.section.id, { itemId: hit.item ? hit.item.id : null }); },
    }, [el("small", { text: hit.label }), el("span", {}, snippet(hit.text, query))])) : [el("div", { class: "empty", text: "見つかりませんでした" })]));
    searchResults.hidden = false;
  }
  function closeSearch() { searchResults.hidden = true; }
  searchInput.addEventListener("input", runSearch);
  searchInput.addEventListener("focus", () => { if (searchInput.value.trim()) runSearch(); });
  document.addEventListener("click", (event) => { if (!event.target.closest("#search")) closeSearch(); });

  // ===== ホーム =====
  function renderHome() {
    const percent = progressPercent();
    const doneSections = orderedSections.filter(isSectionDone).length;
    const allDone = doneSections === orderedSections.length;
    const lastSection = sectionById.get(progress.lastSectionId);
    const resumeSection = lastSection || orderedSections.find((s) => !isSectionDone(s)) || orderedSections[0];
    const resumeChapter = chapterBySectionId.get(resumeSection.id);

    const resume = el("section", { class: "panel resume" }, [
      el("div", { class: "eyebrow", text: lastSection ? "続きから学習" : "ここから学習を始める" }),
      el("div", { class: "muted", style: "font-size:.85rem;margin-top:10px", text: chapterLabel(resumeChapter) }),
      el("h2", { text: `${sectionCode(resumeSection)}　${resumeSection.title}` }),
      el("div", { class: "meta" }, [
        el("span", { text: `すぐ確認 ${sectionOkCount(resumeSection)} / ${resumeSection.items.length}` }),
        el("span", { text: `読了目安 ${readingMinutes(resumeSection)}分` }),
        isSectionDone(resumeSection) ? el("span", { class: "tag ok", text: "完了" }) : null,
      ]),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn primary", text: lastSection ? "学習を再開 ›" : "学習を始める ›", onclick: () => openSection(resumeSection.id) }),
        el("button", { class: "btn", text: "問題だけ解く", onclick: () => openSection(resumeSection.id, { mode: "quiz" }) }),
      ]),
      allDone ? el("p", { class: "muted", style: "margin:14px 0 0;font-size:.85rem", text: "🎉 すべての節のすぐ確認に正解しました。章末演習と総合演習で仕上げましょう。" }) : null,
    ]);

    const chapterCards = chapters.map((chapter) => {
      const status = chapterStatus(chapter);
      const checks = chapter.sections.flatMap(sectionChecks);
      const drills = chapter.exercise || [];
      const okChecks = checks.filter((q) => checkStatus(q.id) === "ok").length;
      const okDrills = drills.filter((q) => drillResult(q.id) === "ok").length;
      const ratio = (okChecks + okDrills) / Math.max(1, checks.length + drills.length);
      const first = chapter.sections.find((s) => !isSectionDone(s)) || chapter.sections[0];
      return el("button", { class: "chapter-card", onclick: () => openSection(first.id) }, [
        el("div", { class: "row" }, [
          el("span", { class: "no", text: `第${chapterNo(chapter)}章` }),
          el("span", { class: `tag ${status === "done" ? "ok" : status === "learning" ? "now" : ""}`, text: { done: "完了", learning: "学習中", new: "未着手" }[status] }),
        ]),
        el("h3", { text: chapter.title }),
        el("div", { class: "meter" }, [el("span", { style: `width:${Math.round(ratio * 100)}%` })]),
        el("div", { class: "foot" }, [
          el("span", { text: `節 ${chapter.sections.filter(isSectionDone).length} / ${chapter.sections.length}` }),
          el("span", { text: drills.length ? `章末演習 ${okDrills} / ${drills.length}問` : "章末演習 —" }),
        ]),
      ]);
    });

    const drillCards = [];
    if (finalExam.length) {
      const ok = finalExam.filter((q) => drillResult(q.id) === "ok").length;
      drillCards.push(el("section", { class: "panel drill-card" }, [
        el("div", {}, [el("h3", { text: "総合演習" }), el("p", { text: `章をまたいだ問題 ${ok} / ${finalExam.length}問 正解。1回${RUN_SIZE}問ずつ出題します。` })]),
        el("button", { class: "btn primary", text: "挑戦する ›", onclick: () => startRun("final") }),
      ]));
    }
    if (content.meta.exam) {
      const exam = content.meta.exam;
      drillCards.push(el("section", { class: "panel drill-card" }, [
        el("div", {}, [el("h3", { text: "模擬試験" }), el("p", { text: `${exam.questionCount}問・${exam.minutes}分${exam.passingRate ? `・合格ライン ${exam.passingRate}%` : ""}。途中で正誤は出さず、学習履歴にも記録しません。` })]),
        el("button", { class: "btn", text: "受験する ›", onclick: () => startRun("mock") }),
      ]));
    }

    const review = reviewIds();
    const reviewItems = review.slice(0, 5).map((id) => {
      const info = drillInfo.get(id);
      const record = drillRecord(id);
      return el("div", { class: "review-item" }, [
        el("div", { class: "row" }, [
          el("span", { text: info.chapter ? `第${chapterNo(info.chapter)}章 章末演習` : "総合演習" }),
          el("span", { class: `tag ${record.result === "ng" ? "ng" : "now"}`, text: record.result === "ng" ? "不正解" : "あとで復習" }),
        ]),
        el("p", { text: stripTags(info.question.prompt) }),
      ]);
    });

    app.append(el("div", { class: "wrap home" }, [
      el("div", { class: "home-main" }, [
        resume,
        el("section", {}, [el("h2", { class: "sec-title", text: "目次" }), el("div", { class: "cards" }, chapterCards)]),
        drillCards.length ? el("section", {}, [el("h2", { class: "sec-title", text: "演習" }), el("div", { style: "display:grid;gap:14px" }, drillCards)]) : null,
      ]),
      el("aside", { class: "home-side" }, [
        el("section", { class: "panel" }, [
          el("div", { class: "eyebrow", text: "全体の進捗" }),
          el("div", { class: "big-pct num" }, [String(percent), el("small", { text: "%" })]),
          el("div", { class: "meter" }, [el("span", { style: `width:${percent}%` })]),
          el("div", { class: "mini-stats" }, [
            el("div", {}, [el("span", { text: "完了した節" }), el("b", { class: "num", text: `${doneSections} / ${orderedSections.length}` })]),
            el("div", {}, [el("span", { text: "問題の正答率" }), el("b", { class: "num", text: accuracyText() })]),
          ]),
        ]),
        el("section", { class: "panel" }, [
          el("div", { class: "review-head" }, [el("h3", { text: "復習リスト" }), el("span", { class: "muted num", style: "font-size:.85rem", text: `${review.length}問` })]),
          el("p", { class: "muted", style: "font-size:.8rem;margin:6px 0 0;line-height:1.6", text: "章末演習・総合演習で間違えた問題と、「あとで復習」に登録した問題です。正解するとリストから外れます。" }),
          review.length ? el("div", { class: "review-list" }, reviewItems) : el("p", { class: "muted", style: "font-size:.85rem", text: "いまは復習する問題はありません。" }),
          review.length > 5 ? el("p", { class: "muted", style: "font-size:.8rem;margin:-6px 0 12px", text: `ほか ${review.length - 5}問` }) : null,
          el("button", { class: "btn primary block", text: "復習リストをまとめて解く", disabled: !review.length, onclick: () => startRun("review") }),
        ]),
        el("section", { class: "panel" }, [
          el("h3", { style: "font-size:.95rem;margin:0", text: "この教材のゴール" }),
          el("ul", { class: "goal-list" }, (content.meta.goals || []).map((goal) => el("li", { text: goal }))),
        ]),
      ]),
    ]));
  }

  // ===== 節のページ =====
  function closeToc() {
    const toc = document.querySelector(".toc");
    if (!toc || !toc.classList.contains("open")) return;
    toc.classList.remove("open");
    document.querySelector(".toc-backdrop").classList.remove("open");
  }
  function buildToc(current) {
    const currentChapter = chapterBySectionId.get(current.id);
    const children = [el("div", { class: "toc-head" }, [el("span", { class: "eyebrow", text: "目次" }), el("button", { class: "btn small", "aria-label": "目次を閉じる", text: "✕", onclick: closeToc })])];
    for (const chapter of chapters) {
      children.push(el("div", { class: "ch" }, [`第${chapterNo(chapter)}章 ${chapter.title}`, el("span", { class: "num", text: `${chapter.sections.filter(isSectionDone).length}/${chapter.sections.length}` })]));
      for (const section of chapter.sections) {
        const isCurrent = section.id === current.id;
        children.push(el("button", { class: `toc-link${isCurrent ? " current" : ""}`, "aria-current": isCurrent ? "page" : null, onclick: () => openSection(section.id, { mode: lesson.mode }) }, [
          el("span", { class: `st ${isSectionDone(section) ? "done" : isCurrent ? "cur" : ""}`, text: isSectionDone(section) ? "✓" : "" }),
          `${sectionCode(section)} ${section.title}`,
        ]));
      }
    }
    children.push(el("hr"));
    if ((currentChapter.exercise || []).length) {
      children.push(el("button", { class: "toc-link", onclick: () => startRun("chapter", currentChapter.id) }, [el("span", { class: "st drill", text: "✓" }), `第${chapterNo(currentChapter)}章 章末演習へ`]));
    }
    if (finalExam.length) children.push(el("button", { class: "toc-link", onclick: () => startRun("final") }, [el("span", { class: "st drill", text: "★" }), "総合演習へ"]));
    return el("nav", { class: "panel toc", "aria-label": "目次" }, children);
  }

  function renderLesson() {
    const section = sectionById.get(lesson.sectionId);
    const chapter = chapterBySectionId.get(section.id);
    const index = orderedSections.indexOf(section);
    const prev = orderedSections[index - 1];
    const next = orderedSections[index + 1];

    const toc = buildToc(section);
    const backdrop = el("div", { class: "toc-backdrop", onclick: closeToc });
    const openToc = () => { toc.classList.add("open"); backdrop.classList.add("open"); };

    const blocks = section.items.map((item, i) => renderBlock(section, item, i));
    const sources = (section.sources || []).map((id) => factById.get(id)).filter(Boolean);
    const prereqs = (section.prerequisites || []).map((id) => sectionById.get(id)).filter(Boolean);

    const article = el("article", { class: "panel article" }, [
      el("span", { class: "sec-no", text: sectionCode(section) }),
      el("h1", { text: section.title }),
      el("div", { class: "meta" }, [
        el("span", { text: `読了目安 ${readingMinutes(section)}分` }),
        el("span", { text: `すぐ確認 ${section.items.length}問` }),
        prereqs.length ? el("span", { text: `前提：${prereqs.map((p) => `${sectionCode(p)} ${p.title}`).join("、")}` }) : null,
      ]),
      el("div", { class: "guide" }, [el("b", { text: "⚡" }), "各項目のすぐ下に「すぐ確認」があります。読んだらその場で1問解いてから次へ進みましょう。すべてに正解すると、次の節へ進めます。"]),
      ...blocks,
      sources.length ? el("details", { class: "sources explain" }, [
        el("summary", { text: `参考出典（${sources.length}件）` }),
        el("ul", {}, sources.map((fact) => el("li", {}, [el("span", { class: "rank", text: fact.rank }), fact.claim + " ", el("a", { href: fact.url, target: "_blank", rel: "noopener", text: "出典" })]))),
      ]) : null,
    ]);

    const nextButton = el("button", { class: "btn", id: "next-sec", onclick: () => next ? openSection(next.id, { mode: lesson.mode }) : startRun("chapter", chapter.id) });
    const main = el("div", { style: "min-width:0" }, [
      el("div", { class: "lesson-top" }, [
        el("div", { class: "crumbs" }, [
          el("button", { class: "btn small toc-open-btn", text: "☰ 目次", onclick: openToc }),
          el("button", { class: "link-btn", text: "ホーム", onclick: () => showView("home") }), "›",
          el("span", { text: chapterLabel(chapter) }), "›", el("span", { text: sectionCode(section) }),
        ]),
        el("div", { class: "seg", role: "group", "aria-label": "表示" }, [
          el("button", { "aria-pressed": String(lesson.mode === "read"), text: "読んで解く", onclick: () => setLessonMode("read") }),
          el("button", { "aria-pressed": String(lesson.mode === "quiz"), text: "問題だけ解く", onclick: () => setLessonMode("quiz") }),
        ]),
      ]),
      article,
      el("div", { class: "pager" }, [
        prev ? el("button", { class: "btn", text: `‹ ${sectionCode(prev)} ${prev.title}`, onclick: () => openSection(prev.id, { mode: lesson.mode }) }) : el("span"),
        nextButton,
      ]),
      el("p", { class: "gate-text", id: "gate-text" }),
    ]);

    const memo = el("textarea", { class: "memo", id: "memo", placeholder: "気づいたことを書き留めておけます（このブラウザに保存されます）", "aria-label": "メモ" });
    memo.value = progress.memos[section.id] || "";
    let memoTimer = null;
    memo.addEventListener("input", () => {
      clearTimeout(memoTimer);
      memoTimer = setTimeout(() => {
        if (memo.value) progress.memos[section.id] = memo.value; else delete progress.memos[section.id];
        saveProgress();
      }, 400);
    });

    const side = el("aside", { class: "side" }, [
      el("section", { class: "panel" }, [
        el("h3", { text: "本文とすぐ確認の対応" }),
        el("div", { class: "score num" }, [el("span", { id: "side-score" }), el("small", { text: `/ ${section.items.length} 問 正解` })]),
        el("div", { class: "meter ok", style: "margin-top:6px" }, [el("span", { id: "side-meter" })]),
        el("div", { class: "side-gate", id: "side-gate" }),
        el("div", { class: "map", id: "side-map" }),
      ]),
      section.keyPoints && section.keyPoints.length ? el("section", { class: "panel" }, [
        el("h3", { text: "この節の要点" }),
        el("ul", { class: "keypoints" }, section.keyPoints.map((point) => el("li", { html: point }))),
      ]) : null,
      el("section", { class: "panel" }, [el("h3", { text: "メモ" }), memo]),
    ]);

    app.append(el("div", { class: `lesson${lesson.mode === "quiz" ? " only-quiz" : ""}`, id: "lesson" }, [toc, main, side]), backdrop);
    updateLessonStatus();

    // いま読んでいる項目を、右の対応表で強調する
    readingObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        const itemId = entry.target.dataset.item;
        if (entry.isIntersecting && lesson && lesson.readingItem !== itemId) { lesson.readingItem = itemId; updateLessonStatus(); }
      }
    }, { rootMargin: "-35% 0px -60% 0px" });
    document.querySelectorAll(".block").forEach((block) => readingObserver.observe(block));
  }
  function setLessonMode(mode) {
    lesson.mode = mode;
    document.getElementById("lesson").classList.toggle("only-quiz", mode === "quiz");
    document.querySelectorAll(".seg button").forEach((button, i) => button.setAttribute("aria-pressed", String((i === 0) === (mode === "read"))));
  }

  function renderBlock(section, item, index) {
    const children = [];
    if (item.kind === "example") {
      children.push(el("div", { class: "example", id: `head-${item.id}` }, [
        el("div", { class: "example-head" }, [el("span", { class: "lbl", text: "例題" }), el("b", { html: item.title })]),
        el("div", { class: "lesson-body explain", html: item.body }),
      ]));
    } else {
      children.push(el("h2", { id: `head-${item.id}`, text: itemLabel(item) }));
      children.push(el("div", { class: "lesson-body explain", html: item.body }));
    }
    children.push(renderCheck(section, item, index));
    return el("section", { class: "block", id: `blk-${item.id}`, "data-item": item.id }, children);
  }

  // すぐ確認の画面上の状態：answering（解答中）/ wrong（不正解。正解は見せない）/ correct（正解）/ solved（以前に正解済み）
  function checkUi(question) {
    if (!lesson.ui[question.id]) lesson.ui[question.id] = { phase: checkStatus(question.id) === "ok" ? "solved" : "answering", view: buildView(question, false) };
    return lesson.ui[question.id];
  }
  function renderCheck(section, item, index) {
    const question = item.check;
    const ui = checkUi(question);
    const isExample = item.kind === "example";
    const box = el("div", { class: `check${ui.phase === "correct" || ui.phase === "solved" ? " is-ok" : ui.phase === "wrong" ? " is-ng" : ""}`, id: `chk-${question.id}` });
    box.append(el("div", { class: "check-head" }, [
      el("span", { class: "check-badge", text: `⚡ すぐ確認 ${index + 1}${isExample ? "　類題" : ""}` }),
      el("span", { text: isExample ? "「例題」と同じ考え方で" : `「${itemLabel(item)}」から` }),
      checkStatus(question.id) === "ng" && ui.phase === "answering" ? el("span", { class: "tag ng", text: "前回は不正解" }) : null,
    ]));
    box.append(promptNode(question, "check-q"));

    if (ui.phase === "solved") {
      box.append(el("div", { class: "result ok" }, [
        el("div", { class: "v", text: "✓ 正解済み" }),
        el("p", { html: question.explanation }),
        el("div", { class: "acts" }, [el("button", { class: "btn small", text: "↻ もう一度解いてみる（練習）", onclick: () => retryCheck(section, item, index) })]),
      ]));
      return box;
    }

    const answered = ui.phase !== "answering";
    box.append(answerControls(question, ui.view, {
      disabled: answered,
      response: ui.response,
      reveal: false, // すぐ確認では、正解するまで正解を見せない
      onSubmit: (response) => submitCheck(section, item, index, response),
    }));
    if (question.hint && ui.phase !== "correct") {
      if (ui.hintOpen) box.append(el("div", { class: "hint", text: `💡 ${question.hint}` }));
      else box.append(el("div", { class: "submit-row" }, [el("button", { class: "btn small", text: "💡 ヒント", onclick: () => { ui.hintOpen = true; replaceCheck(section, item, index); } })]));
    }

    if (ui.phase === "wrong") {
      box.append(el("div", { class: "result ng" }, [
        el("div", { class: "v", text: "✕ 不正解" }),
        el("p", { text: "どこで間違えたかを本文で確かめてから、もう一度解いてみましょう。" }),
        el("div", { class: "acts" }, [
          el("button", { class: "btn", text: `📖 「${itemLabel(item)}」を読み直す`, onclick: () => {
            setLessonMode("read");
            const head = document.getElementById(`head-${item.id}`);
            scrollToEl(head, "center");
            flash(head);
          } }),
          el("button", { class: "btn primary", text: "↻ もう一度解く", onclick: () => retryCheck(section, item, index) }),
        ]),
      ]));
    } else if (ui.phase === "correct") {
      const nextItem = section.items[index + 1];
      const done = isSectionDone(section);
      const nextSection = orderedSections[orderedSections.indexOf(section) + 1];
      let action = null;
      if (done) {
        action = nextSection
          ? el("button", { class: "btn primary", text: `🔓 全問正解！ 次の節「${nextSection.title}」へ ›`, onclick: () => openSection(nextSection.id, { mode: lesson.mode }) })
          : el("button", { class: "btn primary", text: "🔓 全問正解！ 章末演習へ ›", onclick: () => startRun("chapter", chapterBySectionId.get(section.id).id) });
      } else if (nextItem) {
        action = el("button", { class: "btn primary", text: "次の項目へ ↓", onclick: () => scrollToEl(document.getElementById(`blk-${nextItem.id}`)) });
      } else {
        const firstOpen = section.items.find((it) => checkStatus(it.check.id) !== "ok");
        action = firstOpen ? el("button", { class: "btn", text: `まだ正解していない「${itemLabel(firstOpen)}」へ ↑`, onclick: () => scrollToEl(document.getElementById(`blk-${firstOpen.id}`)) }) : null;
      }
      box.append(el("div", { class: "result ok" }, [
        el("div", { class: "v", text: "✓ 正解" }),
        el("p", { html: question.explanation }),
        action ? el("div", { class: "acts" }, [action]) : null,
      ]));
    }
    return box;
  }
  function replaceCheck(section, item, index) {
    const old = document.getElementById(`chk-${item.check.id}`);
    const fresh = renderCheck(section, item, index);
    old.replaceWith(fresh);
    return fresh;
  }
  function retryCheck(section, item, index) {
    lesson.ui[item.check.id] = { phase: "answering", view: buildView(item.check, true), hintOpen: lesson.ui[item.check.id].hintOpen };
    const box = replaceCheck(section, item, index);
    const first = box.querySelector("input, .choice, .ox button, .order-item button");
    if (first) first.focus({ preventScroll: true });
  }
  function submitCheck(section, item, index, response) {
    const question = item.check;
    const ui = checkUi(question);
    const isCorrect = isAnswerCorrect(question, response);
    const wasDone = isSectionDone(section);
    countAnswer(isCorrect);
    if (isCorrect) progress.checks[question.id] = "ok";
    else if (checkStatus(question.id) !== "ok") progress.checks[question.id] = "ng"; // 一度正解した問題は、練習で間違えても戻さない
    saveProgress();
    ui.phase = isCorrect ? "correct" : "wrong";
    ui.response = response;
    const box = replaceCheck(section, item, index);
    updateLessonStatus();
    renderHeader();
    if (isCorrect) {
      celebrateAt(box.querySelector(".result"));
      if (!wasDone && isSectionDone(section)) {
        setTimeout(celebrateBig, 250);
        showToast("🔓 すぐ確認に全問正解しました。次の節へ進めます。");
      }
    } else {
      shake(box);
    }
  }
  function updateLessonStatus() {
    const section = sectionById.get(lesson.sectionId);
    const ok = sectionOkCount(section);
    const left = section.items.length - ok;
    const index = orderedSections.indexOf(section);
    const next = orderedSections[index + 1];
    const chapter = chapterBySectionId.get(section.id);
    document.getElementById("side-score").textContent = ok;
    document.getElementById("side-meter").style.width = `${(ok / section.items.length) * 100}%`;

    // 次の節へのゲート：すぐ確認に全問正解するまで進めない
    const nextButton = document.getElementById("next-sec");
    const target = next ? `${sectionCode(next)} ${next.title}` : (chapter.exercise || []).length ? `第${chapterNo(chapter)}章 章末演習` : null;
    nextButton.hidden = !target;
    nextButton.disabled = left > 0;
    nextButton.className = `btn${left ? "" : " primary"}`;
    nextButton.textContent = `${left ? "🔒 " : ""}${target} ›`;
    const gate = document.getElementById("gate-text");
    gate.innerHTML = "";
    gate.classList.toggle("open", left === 0);
    if (left) gate.append(`すぐ確認 ${section.items.length}問すべてに正解すると、次へ進めます（あと `, el("b", { text: String(left) }), " 問）");
    else gate.append("🔓 全問正解しました。次へ進めます");
    const sideGate = document.getElementById("side-gate");
    sideGate.innerHTML = "";
    sideGate.classList.toggle("open", left === 0);
    if (left) sideGate.append("🔒 次へ進むまで あと ", el("b", { text: String(left) }), " 問正解");
    else sideGate.append("🔓 次へ進めます");

    const labels = { new: ["未回答", ""], ok: ["正解", "ok"], ng: ["不正解", "ng"] };
    document.getElementById("side-map").replaceChildren(...section.items.map((item, i) => {
      const [text, cls] = labels[checkStatus(item.check.id)];
      return el("button", { class: lesson.readingItem === item.id ? "active" : "", onclick: () => scrollToEl(document.getElementById(`blk-${item.id}`)) }, [
        el("span", {}, [el("small", { text: itemLabel(item) }), el("b", { text: `すぐ確認 ${i + 1}（${TYPE_LABELS[item.check.type]}）` })]),
        el("span", { class: `tag ${cls}`, text }),
      ]);
    }));
  }

  // ===== 解答の部品（すぐ確認・演習で共通） =====
  // 表示順。retry（解き直し・2回目以降）のときは選択肢と並べ替え項目をシャッフルする
  function buildView(question, shuffle) {
    if (question.type === "choice" || question.type === "predict") {
      const indexes = question.options.map((_, i) => i);
      return { order: shuffle ? shuffled(indexes) : indexes };
    }
    if (question.type === "order") return { items: shuffle ? shuffledAvoiding(question.options, question.answer) : question.options.slice() };
    return { text: "" };
  }
  function promptNode(question, className) {
    const node = el("div", { class: className });
    if (question.type === "truefalse") {
      node.append("正しければ○、誤りなら×。", el("br"), el("b", { html: `「${question.prompt}」` }));
    } else {
      node.innerHTML = question.prompt;
    }
    const wrap = el("div", {}, [node]);
    if (question.code) wrap.append(el("pre", {}, [el("code", { text: question.code })]));
    if (question.type === "order") wrap.append(el("p", { class: "muted", style: "font-size:.8rem;margin:6px 0 0", text: "↑↓ で並べ替えてから「答え合わせ」を押してください。" }));
    return wrap;
  }
  // reveal: 解答後に正解を示すか（演習は示す。すぐ確認は示さない）
  function answerControls(question, view, { disabled, response, reveal, onSubmit, mock = false }) {
    const answered = disabled && response !== undefined;
    const correct = answered && isAnswerCorrect(question, response);
    if (question.type === "choice" || question.type === "predict") {
      const long = question.type === "predict" || question.options.some((o) => o.length > 18);
      return el("div", { class: `choices${long ? " wide" : ""}` }, view.order.map((optionIndex, position) => {
        let cls = "choice";
        let note = null;
        if (answered && !mock) {
          if (optionIndex === response) { cls += correct ? " is-ok" : " is-ng"; note = correct ? "正解" : "あなたの解答"; }
          else if (reveal && optionIndex === question.answer) { cls += " is-ok"; note = "正解"; }
          else cls += " dim";
        }
        return el("button", { class: cls, disabled: disabled, "data-key": String(position + 1), onclick: () => onSubmit(optionIndex) }, [
          el("span", { class: "k", text: KANA[position] }), el("span", { class: "t", text: question.options[optionIndex] }), note ? el("span", { class: "note", text: note }) : null,
        ]);
      }));
    }
    if (question.type === "truefalse") {
      return el("div", { class: "ox" }, [[true, "○"], [false, "×"]].map(([value, mark], position) => {
        let cls = "";
        if (answered && !mock) {
          if (value === response) cls = correct ? "is-ok" : "is-ng";
          else if (reveal && value === question.answer) cls = "is-ok";
          else cls = "dim";
        }
        return el("button", { class: cls, disabled, "data-key": String(position + 1), "aria-label": value ? "正しい（○）" : "誤り（×）", text: mark, onclick: () => onSubmit(value) });
      }));
    }
    if (question.type === "fill") {
      const input = el("input", { type: "text", placeholder: "答えを入力", "aria-label": "答え", autocomplete: "off", spellcheck: "false", disabled, class: answered && !mock ? (correct ? "is-ok" : "is-ng") : null });
      input.value = answered ? response : view.text || "";
      const button = el("button", { class: "btn", text: "答え合わせ", disabled: disabled || !input.value.trim(), onclick: () => onSubmit(input.value) });
      input.addEventListener("input", () => { view.text = input.value; button.disabled = !input.value.trim(); button.classList.toggle("primary", Boolean(input.value.trim())); });
      input.addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.isComposing && input.value.trim()) button.click(); });
      return el("div", { class: "fillrow" }, [input, question.unit ? el("span", { text: question.unit }) : null, disabled ? null : button]);
    }
    if (question.type === "order") {
      const items = answered ? response : view.items;
      const list = el("ol", { class: `order-list${answered && !mock ? (correct ? " is-ok" : " is-ng") : ""}` });
      const draw = () => list.replaceChildren(...items.map((text, i) => el("li", { class: "order-item" }, [
        el("span", { class: "n", text: String(i + 1) }), el("span", { class: "t", text }),
        disabled ? null : el("span", { class: "mv" }, [
          el("button", { "aria-label": "上へ", text: "↑", disabled: i === 0, onclick: () => { [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); } }),
          el("button", { "aria-label": "下へ", text: "↓", disabled: i === items.length - 1, onclick: () => { [items[i + 1], items[i]] = [items[i], items[i + 1]]; draw(); } }),
        ]),
      ])));
      draw();
      return el("div", {}, [list, disabled ? null : el("div", { class: "submit-row" }, [el("button", { class: "btn primary", text: "答え合わせ", onclick: () => onSubmit(items.slice()) })])]);
    }
    return el("div");
  }
  // 正解の文字列（演習の結果に出す）
  function correctAnswerText(question, view) {
    switch (question.type) {
      case "choice":
      case "predict": {
        const position = view && view.order ? view.order.indexOf(question.answer) : question.answer;
        return `${KANA[position]}．${question.options[question.answer]}`;
      }
      case "truefalse": return question.answer ? "○（正しい）" : "×（誤り）";
      case "fill": return question.answer.join(" ／ ");
      case "order": return "\n" + question.answer.map((item, i) => `${i + 1}. ${item}`).join("\n");
      default: return "";
    }
  }

  // ===== 演習（章末演習・総合演習・復習・模擬試験） =====
  // kind: chapter（章末演習）/ final（総合演習）/ review（復習リスト）/ mock（模擬試験。記録しない）
  function startRun(kind, chapterId = null) {
    let ids;
    let title;
    let label;
    const chapter = chapterId ? chapters.find((c) => c.id === chapterId) : null;
    // 未解答 → 不正解 → 正解済み の順に、1回10問
    const pick = (questions) => {
      const byResult = (result) => questions.filter((q) => drillResult(q.id) === result).map((q) => q.id);
      return [...byResult("new"), ...shuffled(byResult("ng")), ...shuffled(byResult("ok"))].slice(0, RUN_SIZE);
    };
    if (kind === "chapter") { ids = pick(chapter.exercise || []); title = "章末演習"; label = chapterLabel(chapter); }
    else if (kind === "final") { ids = pick(finalExam); title = "総合演習"; label = "章をまたいだ問題"; }
    else if (kind === "review") { ids = reviewIds().slice(0, RUN_SIZE); title = "復習リスト"; label = "間違えた問題・あとで復習"; }
    else { ids = shuffled(allDrills.map((q) => q.id)).slice(0, content.meta.exam.questionCount); title = "模擬試験"; label = `${content.meta.exam.minutes}分`; }
    if (!ids.length) { showToast("いま解ける問題はありません。"); return; }
    const backSection = currentView === "lesson" && lesson ? lesson.sectionId : null;
    run = {
      kind, chapterId, ids, title, label, backSection,
      views: Object.fromEntries(ids.map((id) => [id, buildView(drillInfo.get(id).question, kind === "mock" || Boolean(drillRecord(id)))])),
      answers: {}, cursor: 0, shown: 0, startedAt: Date.now(), finished: false, celebrated: false,
    };
    confettiPieces = [];
    currentView = "run";
    render();
  }
  function runAnsweredCount() { return Object.keys(run.answers).length; }
  function finishRun() { run.finished = true; render(); }
  function leaveRun() {
    if (run.kind === "mock" && !run.finished) { finishRun(); return; }
    const back = run.backSection;
    run = null;
    if (back) openSection(back); else showView("home");
  }

  function renderRun() {
    if (!run) { currentView = "home"; renderHome(); return; }
    const total = run.ids.length;
    const isMock = run.kind === "mock";
    const answeredCount = runAnsweredCount();
    const bar = el("div", { class: "run-bar" }, [
      el("button", { class: "btn", text: isMock && !run.finished ? "‹ 採点して終了" : run.backSection ? "‹ 教科書に戻る" : "‹ ホームへ", onclick: leaveRun }),
      el("div", { class: "ttl" }, [el("small", { text: run.label }), el("b", { text: run.title })]),
      el("div", { class: "run-prog" }, [
        el("b", { class: "num", text: `${Math.min(run.shown + 1, total)} / ${total}問` }),
        el("span", { class: "meter" }, [el("span", { style: `width:${(answeredCount / total) * 100}%` })]),
        el("span", { class: "num", id: "run-time", text: runTimeText() }),
      ]),
    ]);
    const card = run.finished ? renderRunResult() : renderRunCard();
    app.append(bar, el("div", { class: "run" }, [card, renderRunSide()]));
  }
  function runTimeText() {
    const elapsed = (Date.now() - run.startedAt) / 1000;
    if (run.kind === "mock") return `残り ${formatClock(content.meta.exam.minutes * 60 - elapsed)}`;
    return `経過 ${formatClock(elapsed)}`;
  }
  setInterval(() => {
    if (currentView !== "run" || !run || run.finished) return;
    const node = document.getElementById("run-time");
    if (node) node.textContent = runTimeText();
    if (run.kind === "mock" && (Date.now() - run.startedAt) / 1000 >= content.meta.exam.minutes * 60) {
      showToast("制限時間になりました。採点します。");
      finishRun();
    }
  }, 1000);

  function renderRunCard() {
    const id = run.ids[run.shown];
    const { question } = drillInfo.get(id);
    const view = run.views[id];
    const answer = run.answers[id];
    const isMock = run.kind === "mock";
    const answered = Boolean(answer) && !isMock;
    const scope = parseRef((question.refs || [])[0]);
    const card = el("section", { class: "panel card", id: "run-card" }, [
      el("div", { class: "qtop" }, [el("b", { text: `問題 ${run.shown + 1}` }), scope ? el("span", { class: "muted", text: `出題範囲：${sectionCode(scope.section)} ${scope.section.title}` }) : null]),
      promptNode(question, "stem"),
      answerControls(question, view, {
        disabled: answered, response: answer ? answer.response : undefined, reveal: true, mock: isMock,
        onSubmit: (response) => submitRun(id, response),
      }),
    ]);
    if (!answered) {
      card.append(el("div", { class: "submit-row" }, [el("span", { class: "kbd-hint", text: question.type === "choice" || question.type === "predict" || question.type === "truefalse" ? "数字キーでも選べます" : "" })]));
      keyHandler = (event) => {
        const button = card.querySelector(`[data-key="${event.key}"]`);
        if (button && !button.disabled) button.click();
      };
      return card;
    }
    const record = drillRecord(id);
    const refs = (question.refs || []).filter((ref) => parseRef(ref)).slice(0, 2);
    const flag = el("button", { class: "btn flag" });
    const drawFlag = () => {
      const r = drillRecord(id);
      const inList = r.result === "ng" || r.flagged;
      flag.setAttribute("aria-pressed", String(inList));
      flag.textContent = r.result === "ng" ? "⚑ 復習リストに追加済み" : r.flagged ? "⚑ 復習リストに登録済み" : "⚑ あとで復習";
      flag.disabled = r.result === "ng";
    };
    flag.addEventListener("click", () => { record.flagged = !record.flagged; saveProgress(); drawFlag(); });
    drawFlag();
    const nextButton = el("button", { class: "btn primary", text: runAnsweredCount() === run.ids.length ? "結果を見る ›" : "次の問題へ ›", onclick: advanceRun });
    card.append(
      el("div", { class: `result ${answer.isCorrect ? "ok" : "ng"}` }, [
        el("div", { class: "v" }, answer.isCorrect ? ["✓ 正解"] : ["✕ 不正解　正解は ", el("span", { class: "answer-text", text: correctAnswerText(question, view) })]),
        el("p", { html: question.explanation }),
      ]),
      ...refs.map((ref) => {
        const target = parseRef(ref);
        return el("button", { class: "goto", onclick: () => openSection(target.section.id, { itemId: target.item ? target.item.id : null }) }, [
          el("span", { class: "ic" }, [bookIcon()]),
          el("span", {}, [el("small", { text: "教科書で確認する" }), el("b", { text: refLabel(ref) })]),
          el("span", { class: "arr", text: "›" }),
        ]);
      }),
      el("div", { class: "run-actions" }, [flag, el("div", { class: "btn-row" }, [el("span", { class: "kbd-hint", text: "Enter で次へ" }), nextButton])]),
    );
    keyHandler = (event) => { if (event.key === "Enter") nextButton.click(); };
    return card;
  }
  function submitRun(id, response) {
    const { question } = drillInfo.get(id);
    const isCorrect = isAnswerCorrect(question, response);
    run.answers[id] = { response, isCorrect };
    if (run.kind === "mock") { advanceRun(); return; }
    // 学習履歴：最後の結果を残す。正解したら「あとで復習」も外す（復習リストから外れる）
    const record = drillRecord(id) || { result: "new", flagged: false, attempts: 0 };
    record.result = isCorrect ? "ok" : "ng";
    record.attempts = (record.attempts || 0) + 1;
    record.lastAnswered = today();
    if (isCorrect) record.flagged = false;
    progress.questions[id] = record;
    countAnswer(isCorrect);
    saveProgress();
    render({ keepScroll: true });
    const card = document.getElementById("run-card");
    if (isCorrect) celebrateAt(card.querySelector(".result"));
    else shake(card);
  }
  function advanceRun() {
    const next = run.ids.findIndex((id) => !run.answers[id]);
    if (next === -1) { finishRun(); return; }
    run.shown = next;
    render();
  }
  function renderRunSide() {
    const isMock = run.kind === "mock";
    const answers = Object.values(run.answers);
    const okCount = answers.filter((a) => a.isCorrect).length;
    const grid = el("div", { class: "grid10" }, run.ids.map((id, i) => {
      const answer = run.answers[id];
      let cls = "";
      if (!run.finished && i === run.shown) cls = "cur";
      else if (answer) cls = isMock && !run.finished ? "done" : answer.isCorrect ? "ok" : "ng";
      return el("button", {
        class: cls, "aria-label": `問題${i + 1}`, text: String(i + 1),
        onclick: () => { if ((answer && !isMock) || i === run.ids.findIndex((x) => !run.answers[x])) { run.shown = i; run.finished = false; render(); } },
      });
    }));
    const legend = isMock && !run.finished
      ? el("div", { class: "legend" }, [el("span", {}, [el("i", { style: "background:var(--line-strong)" }), "回答済み"]), el("span", {}, [el("i", { style: "border:2px solid var(--accent)" }), "表示中"])])
      : el("div", { class: "legend" }, [
        el("span", {}, [el("i", { style: "background:var(--ok-strong)" }), "正解"]),
        el("span", {}, [el("i", { style: "background:var(--ng-strong)" }), "不正解"]),
        el("span", {}, [el("i", { style: "border:2px solid var(--accent)" }), "表示中"]),
        el("span", {}, [el("i", { style: "background:var(--surface-2)" }), "未解答"]),
      ]);
    const children = [el("section", { class: "panel" }, [
      el("div", { class: "review-head" }, [el("h3", { style: "font-size:.9rem", text: "問題一覧" }), isMock && !run.finished ? null : el("span", { class: "muted num", style: "font-size:.8rem", text: `正解 ${okCount} ／ 解答 ${answers.length}` })]),
      grid, legend,
    ])];
    if (!isMock || run.finished) {
      // 範囲ごとの正答：章末演習は節ごと、それ以外は章ごと
      const groups = new Map();
      for (const id of run.ids) {
        const target = parseRef((drillInfo.get(id).question.refs || [])[0]);
        if (!target) continue;
        const key = run.kind === "chapter" ? target.section.id : chapterBySectionId.get(target.section.id).id;
        const name = run.kind === "chapter" ? `${sectionCode(target.section)} ${target.section.title}` : chapterLabel(chapterBySectionId.get(target.section.id));
        if (!groups.has(key)) groups.set(key, { name, total: 0, answered: 0, ok: 0 });
        const group = groups.get(key);
        group.total += 1;
        if (run.answers[id]) { group.answered += 1; if (run.answers[id].isCorrect) group.ok += 1; }
      }
      children.push(el("section", { class: "panel" }, [
        el("h3", { style: "font-size:.9rem", text: run.kind === "chapter" ? "節ごとの正答" : "章ごとの正答" }),
        el("div", { class: "scope-scores" }, [...groups.values()].map((g) => el("div", {}, [
          el("div", { class: "row" }, [el("span", { text: g.name }), el("span", { class: "num muted", text: g.answered ? `${g.ok} / ${g.answered}` : "未解答" })]),
          el("div", { class: "meter ok" }, [el("span", { style: `width:${g.answered ? (g.ok / g.total) * 100 : 0}%` })]),
        ]))),
      ]));
    }
    return el("aside", { class: "side" }, children);
  }
  function renderRunResult() {
    const results = run.ids.map((id) => ({ id, question: drillInfo.get(id).question, answer: run.answers[id] || { response: null, isCorrect: false } }));
    const okCount = results.filter((r) => r.answer.isCorrect).length;
    const wrong = results.filter((r) => !r.answer.isCorrect);
    const isMock = run.kind === "mock";
    const children = [el("div", { class: "eyebrow", text: `${run.label ? run.label + " " : ""}${run.title}の結果` })];
    children.push(el("div", { class: "score num", style: "margin:10px 0" }, [String(okCount), el("small", { text: `/ ${results.length} 問 正解` })]));
    if (isMock) {
      const rate = Math.round((okCount / results.length) * 100);
      const passing = content.meta.exam.passingRate;
      children.push(el("p", { style: "font-weight:700;font-size:1.1rem", text: passing ? `正答率 ${rate}%（合格ライン ${passing}%）… ${rate >= passing ? "合格" : "不合格"}` : `正答率 ${rate}%` }));
      children.push(el("p", { class: "muted", text: "模擬試験の結果は学習履歴に記録しません。" }));
      if (passing && rate >= passing && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    } else {
      children.push(el("p", { class: "muted", text: wrong.length ? `間違えた ${wrong.length}問は復習リストに入りました。ホームからまとめて解き直せます。` : "全問正解です！" }));
      if (!wrong.length && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    }
    const buttons = [el("button", { class: "btn", text: "ホームへ", onclick: () => { run = null; showView("home"); } })];
    if (run.kind === "chapter" || run.kind === "final") {
      const pool = run.kind === "chapter" ? chapters.find((c) => c.id === run.chapterId).exercise : finalExam;
      const remaining = pool.filter((q) => drillResult(q.id) !== "ok").length;
      if (remaining) buttons.push(el("button", { class: "btn primary", text: `続けて解く（残り ${remaining}問）`, onclick: () => startRun(run.kind, run.chapterId) }));
      if (run.kind === "chapter") {
        const chapter = chapters.find((c) => c.id === run.chapterId);
        const nextChapter = chapters[chapters.indexOf(chapter) + 1];
        if (nextChapter) buttons.push(el("button", { class: remaining ? "btn" : "btn primary", text: `第${chapterNo(nextChapter)}章 ${nextChapter.title}へ ›`, onclick: () => { run = null; openSection(nextChapter.sections[0].id); } }));
      }
    }
    children.push(el("div", { class: "btn-row", style: "justify-content:center;margin-top:16px" }, buttons));
    for (const r of wrong) {
      children.push(el("div", { class: "miss" }, [
        el("div", { html: r.question.type === "truefalse" ? `「${r.question.prompt}」` : r.question.prompt }),
        el("p", {}, [el("b", { text: "正解：" }), el("span", { class: "answer-text", style: "white-space:pre-line", text: correctAnswerText(r.question, run.views[r.id]) })]),
        el("p", { class: "muted", html: r.question.explanation }),
        ...(r.question.refs || []).filter((ref) => parseRef(ref)).slice(0, 1).map((ref) => el("button", { class: "link-btn", style: "font-size:.85rem", text: `📖 ${refLabel(ref)}`, onclick: () => { const target = parseRef(ref); run = null; openSection(target.section.id, { itemId: target.item ? target.item.id : null }); } })),
      ]));
    }
    return el("section", { class: "panel card done-card" }, children);
  }

  // ===== 設定（学習履歴） =====
  function renderSettings() {
    const resetButton = el("button", { class: "btn danger", text: "学習履歴を消す" });
    resetButton.addEventListener("click", () => {
      if (resetButton.dataset.armed) {
        progress = createEmptyProgress();
        saveProgress();
        run = null;
        showToast("学習履歴を消しました。");
        render();
      } else {
        resetButton.dataset.armed = "1";
        resetButton.textContent = "もう一度押すと消えます";
      }
    });
    app.append(el("div", { class: "settings" }, [
      el("h1", { text: "⚙ 設定" }),
      el("section", { class: "panel" }, [
        el("h3", { style: "margin:0 0 6px", text: "学習履歴" }),
        el("p", { class: "muted", style: "font-size:.88rem;margin:0 0 14px", text: "学習履歴（すぐ確認の正解、演習の結果、復習リスト、メモ）はこのブラウザにだけ保存されます。ブラウザを変えるときやデータを消す前に、書き出して控えを取ってください。" }),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn", text: "書き出す", onclick: exportProgress }),
          el("button", { class: "btn", text: "読み込む", onclick: () => document.getElementById("import-file").click() }),
          resetButton,
        ]),
      ]),
      el("div", {}, [el("button", { class: "btn", text: "‹ ホームへ", onclick: () => showView("home") })]),
    ]));
  }
  function exportProgress() {
    const blob = new Blob([JSON.stringify(progress, null, 2)], { type: "application/json" });
    const link = el("a", { href: URL.createObjectURL(blob), download: `study-kit_${content.meta.id}_${today()}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }
  document.getElementById("import-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (imported.contentId !== content.meta.id) { showToast(`別の教材の履歴です（${imported.contentId}）。読み込みませんでした。`); return; }
      if (imported.version !== PROGRESS_VERSION) { showToast("古い形式の学習履歴のため読み込めませんでした。"); return; }
      progress = normalizeProgress(imported);
      saveProgress();
      run = null;
      showToast("学習履歴を読み込みました。");
      render();
    } catch (error) {
      showToast("学習履歴のファイルを読めませんでした。");
    }
  });

  // ===== 起動 =====
  document.title = content.meta.title;
  document.getElementById("brand-title").textContent = content.meta.title;
  document.getElementById("brand-series").textContent = content.meta.series || "";
  render();
})();
</script>
</body>
</html>
