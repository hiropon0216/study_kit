<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Kit</title>
<style>
/* ===== テーマ ===== */
:root {
  --bg: #f3f0ff;
  --bg-pattern: #e9e3ff;
  --surface: #ffffff;
  --surface-muted: #f1eefb;
  --text: #1d1640;
  --text-muted: #6a6488;
  --border: #ddd6f5;
  --primary: #6c4cf1;
  --primary-dark: #4b30c4;
  --primary-soft: #ebe5ff;
  --on-primary: #ffffff;
  --gold: #f5b301;
  --gold-dark: #c78f00;
  --gold-soft: #fff4d1;
  --correct: #1fa463;
  --correct-dark: #137d48;
  --correct-soft: #dcf5e8;
  --wrong: #e5484d;
  --wrong-dark: #b8292e;
  --wrong-soft: #fde4e5;
  --unknown: #d98a00;
  --unknown-soft: #fff0d6;
  --info: #2f80ed;
  --info-soft: #e1edff;
  --code-bg: #f1eefb;
  --shadow: 0 4px 0 rgba(43, 26, 120, 0.12);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14112b;
    --bg-pattern: #1a1636;
    --surface: #1f1b3d;
    --surface-muted: #2a2550;
    --text: #eeeaff;
    --text-muted: #a59fcb;
    --border: #3a3468;
    --primary: #8f75ff;
    --primary-dark: #6247e0;
    --primary-soft: #2e2760;
    --on-primary: #ffffff;
    --gold: #ffc933;
    --gold-dark: #c99a14;
    --gold-soft: #3a3115;
    --correct: #3ccf85;
    --correct-dark: #1f9a5c;
    --correct-soft: #173828;
    --wrong: #ff6b70;
    --wrong-dark: #c9393e;
    --wrong-soft: #3d1d22;
    --unknown: #ffb547;
    --unknown-soft: #3a2a12;
    --info: #6aa8ff;
    --info-soft: #1a2a48;
    --code-bg: #2a2550;
    --shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-pattern) 2px, transparent 2px);
  background-size: 22px 22px;
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  font-size: 16px;
  line-height: 1.75;
}
code, pre { font-family: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace; font-size: 0.92em; }
:not(pre) > code { background: var(--code-bg); padding: 0.1em 0.4em; border-radius: 6px; }
pre { background: #1d1640; color: #eeeaff; padding: 14px 16px; border-radius: 12px; overflow-x: auto; line-height: 1.55; }
@media (prefers-color-scheme: dark) { pre { background: #0d0b1f; } }
a { color: var(--primary); }
button { font: inherit; cursor: pointer; color: inherit; }
button:disabled { cursor: not-allowed; }

/* ===== 上部バー ===== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 16px;
  background: var(--surface); border-bottom: 2px solid var(--border);
}
.topbar .title { font-weight: 800; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40vw; }
.hud { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.88rem; }
.progress-label { white-space: nowrap; color: var(--correct); font-variant-numeric: tabular-nums; }
.progress-bar { width: 120px; height: 12px; background: var(--surface-muted); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.progress-bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--correct), #6fe0a3); transition: width 0.6s ease; }
.todo-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 2px solid var(--border); }
.stage-btn { background: none; border: none; padding: 0; color: inherit; cursor: pointer; }
.stage-btn:hover .stage-node { transform: translateY(-2px); }
.challenge { border-color: var(--primary); margin-top: 2em; }
.status-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--surface); margin-bottom: 0.5em; }
.challenge p { margin: 10px 0 0; }
.streak { white-space: nowrap; color: var(--unknown); }
.timer { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 0.85rem; font-weight: 700; }
.timer.over { color: var(--wrong); }
.debug-badge { font-size: 0.72rem; background: var(--unknown-soft); color: var(--unknown); padding: 2px 8px; border-radius: 99px; font-weight: 700; }
.topbar nav { display: flex; gap: 4px; }
.nav-btn { background: none; border: 2px solid transparent; border-radius: 10px; padding: 3px 12px; font-weight: 700; }
.nav-btn[aria-current="page"] { border-color: var(--border); background: var(--primary-soft); color: var(--primary); }

main { max-width: 1600px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 40px) 100px; }
h1 { font-size: 1.6rem; line-height: 1.35; margin: 0.3em 0; font-weight: 800; }
h2 { font-size: 1.25rem; line-height: 1.4; margin: 1.6em 0 0.6em; font-weight: 800; }
h3 { font-size: 1.08rem; margin: 1.5em 0 0.5em; font-weight: 800; }
h4 { margin: 0 0 0.4em; font-size: 1rem; }
.muted { color: var(--text-muted); }
.small { font-size: 0.88em; }
.center { text-align: center; }

/* ===== 共通部品 ===== */
.card { background: var(--surface); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 16px 0; box-shadow: var(--shadow); position: relative; }
.btn {
  border: 2px solid var(--border); background: var(--surface); color: var(--text);
  border-radius: 14px; padding: 10px 20px; font-weight: 800;
  box-shadow: 0 4px 0 var(--border); transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary-dark); box-shadow: 0 4px 0 var(--primary-dark); }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--primary-dark); }
.btn.go { background: var(--correct); color: #fff; border-color: var(--correct-dark); box-shadow: 0 4px 0 var(--correct-dark); }
.btn.big { font-size: 1.1rem; padding: 14px 28px; }
.btn.danger { color: var(--wrong); border-color: var(--wrong); box-shadow: 0 4px 0 var(--wrong-soft); }
.btn:disabled { opacity: 0.45; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.link-btn { background: none; border: none; padding: 0; color: var(--primary); text-align: left; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.kbd-hint { font-size: 0.78rem; color: var(--text-muted); }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.06em; padding: 2px 10px; border-radius: 99px; background: var(--primary-soft); color: var(--primary); }
.pill.gold { background: var(--gold-soft); color: var(--gold-dark); }

/* ===== ホーム ===== */
.hero { display: grid; gap: 14px; }
.hero h1 { margin: 0; }
.goal-list { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.goal-list li { display: flex; gap: 8px; }
.goal-list li::before { content: "🎯"; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-muted); border-radius: 12px; padding: 10px 14px; border: 2px solid var(--border); }
.stat .label { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; }
.stat .value { font-size: 1.45rem; font-weight: 800; font-variant-numeric: tabular-nums; }

.world { padding-bottom: 14px; }
.world-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.world-title { font-weight: 800; font-size: 1.05rem; }
.meter { height: 12px; background: var(--surface-muted); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); margin-top: 8px; }
.meter > span { display: block; height: 100%; background: linear-gradient(90deg, var(--correct), #6fe0a3); }
.stage-node {
  width: 58px; height: 58px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; font-size: 1.05rem;
  border: 3px solid var(--border); background: var(--surface-muted); color: var(--text-muted);
  box-shadow: 0 4px 0 var(--border);
}
.stage-node.learning { background: var(--wrong-soft); border-color: var(--wrong); color: var(--wrong); box-shadow: 0 4px 0 var(--wrong); }
.stage-node.now { background: var(--unknown); border-color: var(--unknown); color: #fff; box-shadow: 0 4px 0 color-mix(in srgb, var(--unknown) 70%, #000); animation: pulse 1.6s ease-in-out infinite; }
.stage-node.done { background: var(--gold); border-color: var(--gold-dark); color: #fff; box-shadow: 0 4px 0 var(--gold-dark); }
.stage-node.next { background: var(--primary); border-color: var(--primary-dark); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); animation: pulse 1.6s ease-in-out infinite; }
.stage-node.boss { width: 70px; height: 70px; font-size: 1.6rem; flex: none; }
.stage-node.small { width: 44px; height: 44px; font-size: 0.9rem; border-width: 3px; flex: none; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

/* 節カード（ステージマップ）と問題の丸 */
.section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 14px; }
.section-card { display: grid; gap: 10px; text-align: left; padding: 12px 14px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: 0 4px 0 var(--border); transition: transform 0.06s; }
.section-card:hover { border-color: var(--primary); }
.section-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
.section-card.is-done { background: color-mix(in srgb, var(--gold) 8%, var(--surface)); border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-dark); }
.section-card-head { display: flex; align-items: center; gap: 10px; }
.section-card-title { font-weight: 800; line-height: 1.35; }
.qdots { display: flex; flex-wrap: wrap; gap: 5px; }
.qdot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 0.72rem; font-weight: 800; border: 2px solid var(--border); color: var(--text-muted); background: var(--surface); }
.qdot.closed { background: var(--correct); border-color: var(--correct); color: #fff; }
.qdot.now { background: var(--unknown); border-color: var(--unknown); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
.qdot.wait { background: var(--wrong); border-color: var(--wrong); color: #fff; }
.qdot.mini { width: 14px; height: 14px; display: inline-block; vertical-align: -2px; margin-right: 4px; animation: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-muted); margin-bottom: 4px; }
.state-line { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.82rem; font-weight: 700; margin-top: 6px; }
.state-text.now { color: var(--unknown); }
.state-text.wait { color: var(--wrong); }
.state-text.new { color: var(--text-muted); }
.state-text.closed { color: var(--correct); }
.review-card { border-color: var(--unknown); }
.next-chance { box-shadow: none; text-align: left; }
.next-text { margin-top: 10px; padding-top: 8px; border-top: 2px dashed currentColor; font-weight: 700; }


/* ===== 問題 ===== */
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.q-dots { display: flex; gap: 5px; }
.q-dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
.q-dots span.done { background: var(--primary); }
.q-dots span.now { background: var(--gold); transform: scale(1.3); }
.q-prompt { margin: 14px 0 4px; font-weight: 700; font-size: 1.08rem; }
.combo { font-weight: 800; color: var(--unknown); font-size: 0.9rem; }
.options { display: grid; gap: 10px; margin-top: 14px; }
.option {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
  padding: 12px 14px; border: 2px solid var(--border); border-radius: 14px;
  background: var(--surface); box-shadow: 0 4px 0 var(--border); font-weight: 600;
  transition: transform 0.06s;
}
.option:hover:not(:disabled) { border-color: var(--primary); }
.option:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--border); }
.option:disabled { cursor: default; }
.option[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); box-shadow: 0 4px 0 var(--primary); }
.option .mark { flex: none; width: 2em; height: 2em; border-radius: 10px; border: 2px solid var(--border); display: grid; place-items: center; font-size: 0.85em; font-weight: 800; }
.option[aria-pressed="true"] .mark { background: var(--primary); color: #fff; border-color: var(--primary); }
.option.is-answer { border-color: var(--correct); background: var(--correct-soft); box-shadow: 0 4px 0 var(--correct); }
.option.is-answer .mark { background: var(--correct); color: #fff; border-color: var(--correct); }
.option.is-picked-wrong { border-color: var(--wrong); background: var(--wrong-soft); box-shadow: 0 4px 0 var(--wrong); }
.option.is-picked-wrong .mark { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.fill-input { width: 100%; font: inherit; font-size: 1.1rem; font-weight: 700; padding: 12px 14px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); margin-top: 14px; }
.fill-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.order-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
.order-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 2px solid var(--border); border-radius: 14px; background: var(--surface); box-shadow: 0 4px 0 var(--border); font-weight: 600; }
.order-item .num { flex: none; width: 2em; height: 2em; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-weight: 800; }
.order-item .text { flex: 1; }
.order-item .move { display: flex; gap: 4px; }
.order-item .move button { width: 2.3em; height: 2.3em; border: 2px solid var(--border); background: var(--surface-muted); border-radius: 10px; font-weight: 800; }
.order-item .move button:disabled { opacity: 0.3; }

.feedback { margin-top: 18px; border-radius: 14px; padding: 14px 18px; border: 2px solid transparent; animation: pop-in 0.25s ease-out; }
.feedback.correct { background: var(--correct-soft); border-color: var(--correct); }
.feedback.wrong { background: var(--wrong-soft); border-color: var(--wrong); }
.feedback.unknown { background: var(--unknown-soft); border-color: var(--unknown); }
.feedback .verdict { font-weight: 800; font-size: 1.2rem; }
.feedback.correct .verdict { color: var(--correct); }
.feedback.wrong .verdict { color: var(--wrong); }
.feedback.unknown .verdict { color: var(--unknown); }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes pop-in { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.float-text { position: fixed; z-index: 60; pointer-events: none; font-weight: 900; font-size: 1.3rem; color: var(--correct); white-space: nowrap; animation: float-up 1.2s ease-out forwards; }
@keyframes float-up { from { transform: translate(-50%, 0) scale(0.8); opacity: 0; } 15% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } to { transform: translate(-50%, -70px) scale(1); opacity: 0; } }

/* ===== 節の開始・結果・セッション結果 ===== */
.stage-banner { text-align: center; padding: 28px 20px; }
.stage-banner .big-label { font-size: 0.85rem; font-weight: 900; letter-spacing: 0.2em; color: var(--primary); }
.stage-banner h2 { margin: 6px 0 10px; font-size: 1.45rem; }
.stamp { display: inline-block; font-size: 2rem; font-weight: 900; letter-spacing: 0.08em; padding: 4px 18px; border: 4px solid currentColor; border-radius: 14px; transform: rotate(-6deg); animation: stamp 0.45s cubic-bezier(.2, 1.6, .4, 1); }
.stamp.perfect { color: var(--gold-dark); }
.stamp.clear { color: var(--primary); }
@keyframes stamp { from { transform: rotate(-6deg) scale(2.2); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }
.miss-card { border-left: 6px solid var(--wrong); }
.result-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-top: 16px; }
.result-tiles .stat { text-align: center; }

/* ===== 教科書 ===== */
/* 目次は常に出さず、左下のボタンで左からスライドして出す */
.toc-toggle { position: fixed; z-index: 30; left: 16px; bottom: 20px; display: flex; align-items: center; gap: 6px; }
.toc-backdrop { position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.4); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.toc-backdrop.open { opacity: 1; pointer-events: auto; }
.toc { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; width: min(340px, 86vw); overflow-y: auto; font-size: 0.92em; background: var(--surface); border-right: 2px solid var(--border); box-shadow: 6px 0 24px rgba(0, 0, 0, 0.25); padding: 12px 18px 24px; transform: translateX(-105%); transition: transform 0.25s ease; }
.toc.open { transform: translateX(0); }
.toc-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
.toc-head .close { background: none; border: 2px solid var(--border); border-radius: 10px; width: 2.2em; height: 2.2em; font-weight: 800; }
.toc ol { padding-left: 0; list-style: none; margin: 0.3em 0 0.9em; }
.toc li { margin: 2px 0; }
.toc .chapter-title { font-weight: 800; margin-top: 0.6em; }
.toc .link-btn { text-decoration: none; display: flex; gap: 6px; align-items: center; }
.toc .link-btn.active { color: var(--text); font-weight: 800; }
.toc .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex: none; }
.toc .dot.done { background: var(--correct); }
.toc .dot.now { background: var(--unknown); }
.toc .dot.learning { background: var(--wrong); }
.book-body { min-width: 0; padding-bottom: 40px; }
.book-body h2:first-of-type { margin-top: 0.2em; }
.book-body table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 1em 0; }
.book-body th, .book-body td { border: 2px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
.book-body th { background: var(--primary-soft); }
.sources { font-size: 0.86em; padding-left: 0; list-style: none; }
.sources li { margin: 6px 0; }
.rank { display: inline-block; min-width: 1.7em; text-align: center; font-size: 0.78em; font-weight: 800; border-radius: 6px; margin-right: 6px; background: var(--primary-soft); color: var(--primary); }

/* ----- 教科書の部品（教材JSONの body で使う。references/textbook-components.md） ----- */
.sk-goals { background: var(--primary-soft); border: 2px solid var(--primary); border-radius: 14px; padding: 12px 18px; margin: 1em 0; }
.sk-goals::before { content: "この節でわかること"; display: block; font-weight: 800; color: var(--primary); font-size: 0.85rem; letter-spacing: 0.05em; }
.sk-goals ul { margin: 4px 0 0; padding-left: 1.3em; }

.sk-callout { border-radius: 14px; padding: 12px 18px 12px 52px; margin: 1.2em 0; position: relative; border: 2px solid; }
.sk-callout::before { position: absolute; left: 14px; top: 12px; font-size: 1.3rem; line-height: 1.4; }
.sk-callout::after { position: absolute; left: 52px; top: -0.8em; font-size: 0.75rem; font-weight: 800; padding: 0 8px; border-radius: 99px; color: #fff; }
.sk-callout p { margin: 0.3em 0; }
.sk-callout.point { background: var(--gold-soft); border-color: var(--gold); }
.sk-callout.point::before { content: "💡"; }
.sk-callout.point::after { content: "ポイント"; background: var(--gold-dark); }
.sk-callout.warn { background: var(--wrong-soft); border-color: var(--wrong); }
.sk-callout.warn::before { content: "⚠️"; }
.sk-callout.warn::after { content: "注意"; background: var(--wrong); }
.sk-callout.analogy { background: var(--info-soft); border-color: var(--info); }
.sk-callout.analogy::before { content: "🧩"; }
.sk-callout.analogy::after { content: "たとえると"; background: var(--info); }
.sk-callout.tip { background: var(--correct-soft); border-color: var(--correct); }
.sk-callout.tip::before { content: "🛠️"; }
.sk-callout.tip::after { content: "実務メモ"; background: var(--correct-dark); }

.sk-premise { background: var(--info-soft); border: 2px solid var(--info); border-left-width: 8px; border-radius: 14px; padding: 12px 18px; margin: 1.2em 0; }
.sk-premise::before { content: "📘 前提：" attr(data-term) " とは"; display: block; font-weight: 800; color: var(--info); margin-bottom: 4px; }
.sk-premise p { margin: 0.4em 0; }

.sk-terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 1em 0; }
.sk-terms > div { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow); }
.sk-terms dt { font-weight: 800; color: var(--primary); }
.sk-terms dd { margin: 2px 0 0; font-size: 0.92em; }

.sk-flow { list-style: none; padding: 0; margin: 1.2em 0; display: flex; flex-wrap: wrap; gap: 10px; counter-reset: sk-step; }

.sk-nest { border: 2px dashed var(--primary); border-radius: 14px; padding: 26px 12px 12px; margin: 10px 0; position: relative; background: color-mix(in srgb, var(--primary) 5%, transparent); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }

.sk-nest .sk-nest .sk-nest::before { color: var(--unknown); }
.sk-item { display: inline-block; background: var(--surface); border: 2px solid var(--border); border-radius: 10px; padding: 4px 12px; font-weight: 700; font-size: 0.88em; box-shadow: 0 3px 0 var(--border); }
.sk-caption { flex-basis: 100%; font-size: 0.82em; color: var(--text-muted); margin: 0; }

.sk-compare > div { background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); }
.sk-compare > div:first-child { border-top: 6px solid var(--text-muted); }
.sk-compare > div:nth-child(2) { border-top: 6px solid var(--primary); }
.sk-compare > div:nth-child(3) { border-top: 6px solid var(--correct); }
.sk-compare ul { margin: 0; padding-left: 1.2em; font-size: 0.92em; }

.sk-figure { margin: 1.4em 0; background: var(--surface); border: 2px solid var(--border); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.sk-figure svg { display: block; width: 100%; height: auto; max-height: 340px; }
.sk-figure figcaption { font-size: 0.85em; color: var(--text-muted); text-align: center; margin-top: 6px; }
.sk-figure .sk-fill-primary { fill: var(--primary); }
.sk-figure .sk-fill-primary-soft { fill: var(--primary-soft); }
.sk-figure .sk-fill-accent { fill: var(--correct); }
.sk-figure .sk-fill-accent-soft { fill: var(--correct-soft); }
.sk-figure .sk-fill-warn { fill: var(--wrong); }
.sk-figure .sk-fill-muted { fill: var(--surface-muted); }

.sk-figure .sk-stroke { stroke: var(--border); }

.sk-badge { display: inline-block; font-family: ui-monospace, Consolas, monospace; font-size: 0.85em; font-weight: 700; padding: 1px 10px; border-radius: 99px; border: 2px solid; }
.sk-badge.ok { color: var(--correct-dark); border-color: var(--correct); background: var(--correct-soft); }

.sk-badge.err { color: var(--wrong-dark); border-color: var(--wrong); background: var(--wrong-soft); }
.sk-badge.info { color: var(--info); border-color: var(--info); background: var(--info-soft); }
.sk-badge-list { display: grid; gap: 8px; margin: 1em 0; }
.sk-badge-list > div { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 12px; align-items: start; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 8px 12px; }

.sk-summary { background: var(--surface); border: 3px solid var(--gold); border-radius: 14px; padding: 12px 18px; margin: 1.6em 0 1em; }

.sk-summary ul { margin: 4px 0 0; padding-left: 1.3em; }

/* ===== トースト・紙吹雪 ===== */
.toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 14px; max-width: calc(100vw - 32px); font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,0.25); animation: pop-in 0.2s; }

<script id="study-data" type="application/json">{"meta": {"id": "k8s-practical-20261005", "title": "Kubernetes 実務入門（サンプル）", "purpose": "実務", "level": "Docker は日常的に使うが、Kubernetes は触ったことがない", "targetVersion": "Kubernetes v1.34 系の公式ドキュメント（2026-10 時点）", "createdAt": "2026-10-05", "goals": ["Pod と Deployment の関係を説明し、Deployment でアプリを動かせる", "Pod が起動しないとき、kubectl で原因を切り分けられる"], "exam": null}, "chapters": [{"id": "ch1", "title": "1章 Kubernetes の基本オブジェクト", "sections": [{"id": "ch1-s1", "title": "1.1 Pod", "body": "<div class=\"sk-goals\"><ul><li>Pod とコンテナの関係<\/li><li>同じ Pod のコンテナどうしが通信する方法<\/li><li>実務で Pod を直接作らない理由<\/li><\/ul><\/div>\n<div class=\"sk-premise\" data-term=\"Kubernetes\"><p><strong>何か：<\/strong>コンテナで動くアプリ（ワークロード）とサービスを管理する、オープンソースのソフトウェアです。K と s の間に8文字あるので K8s とも書きます。<\/p><p><strong>誰が作ったか：<\/strong>Google が開発し、2014年にオープンソースとして公開しました。<\/p><p><strong>なぜ必要か：<\/strong>コンテナが増えると、どのサーバーでどのコンテナを動かすかを人手で管理するのが難しくなります。Kubernetes はその管理をまとめて引き受けます。<\/p><p><strong>この教材との関係：<\/strong>この教材全体の主役です。以降に出てくる Pod や Deployment は、すべて Kubernetes が管理する仕組みです。<\/p><\/div><div class=\"sk-premise\" data-term=\"Docker\"><p><strong>何か：<\/strong>アプリをコンテナという隔離された環境で開発・配布・実行するためのソフトウェアです。<\/p><p><strong>誰が作ったか：<\/strong>Docker 社が提供しています。<\/p><p><strong>なぜ必要か：<\/strong>アプリと動かすのに必要なものをコンテナにまとめると、どの環境でも同じように動かせます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes が動かすのも、Docker と同じ形式のコンテナです。この教材では、Docker でコンテナを動かしたことがある前提で、その違いから説明します。<\/p><\/div>\n<p>Kubernetes でアプリを動かすとき、最小の単位になるのが <strong>Pod<\/strong> です。Docker ではコンテナを1つずつ起動しましたが、Kubernetes ではコンテナを Pod という入れ物に入れて動かします。<\/p>\n<div class=\"sk-premise\" data-term=\"YAML\"><p><strong>何か：<\/strong>人が読み書きしやすいように作られた、データを書くための言語（ファイル形式）です。字下げで階層を表します。<\/p><p><strong>なぜ必要か：<\/strong>設定を人が読める文字で書いておけば、ファイルとして保存したり見直したりできます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes では、作りたいもの（Pod など）の定義を YAML で書きます。このファイルをマニフェストと呼びます。<\/p><\/div><div class=\"sk-premise\" data-term=\"kubectl\"><p><strong>何か：<\/strong>Kubernetes を操作するためのコマンドラインツールです。<\/p><p><strong>誰が作ったか：<\/strong>Kubernetes プロジェクトが Kubernetes 本体と一緒に提供しています。<\/p><p><strong>なぜ必要か：<\/strong>kubectl は、Kubernetes の中でサーバー群（クラスタ）全体を管理する部分に、人の指示を伝えます。人はこのコマンドを通して Kubernetes を操作します。<\/p><p><strong>この教材との関係：<\/strong>マニフェストを適用する <code>kubectl apply<\/code> や、状態を調べる <code>kubectl get<\/code> など、以降の節でくり返し使います。<\/p><\/div><div class=\"sk-premise\" data-term=\"nginx\"><p><strong>何か：<\/strong>Web サーバーとして広く使われているソフトウェアです。<\/p><p><strong>この教材との関係：<\/strong>この教材では、コンテナで動かすアプリの例として使います。下の YAML の <code>image: nginx:1.27<\/code> は「nginx のバージョン 1.27 のコンテナイメージを使う」という意味です。<\/p><\/div>\n<div class=\"sk-compare\"><div><h4>Docker（これまで）<\/h4><ul><li>コンテナを1つずつ起動する<\/li><li><code>docker run<\/code> で起動する<\/li><\/ul><\/div><div><h4>Kubernetes（これから）<\/h4><ul><li>1つ以上のコンテナを Pod にまとめて起動する<\/li><li>マニフェスト（YAML）を書いて <code>kubectl apply<\/code> する<\/li><\/ul><\/div><\/div>\n<p>Pod は1つ以上のコンテナのグループです。同じ Pod に入ったコンテナは、ストレージとネットワークを共有します。ネットワークを共有しているので、同じ Pod の中のコンテナどうしは <code>localhost<\/code> で通信できます。<\/p>\n<div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ: web<\/span><span class=\"sk-item\">コンテナ: log-agent<\/span><p class=\"sk-caption\">ネットワークとストレージを共有する。web と log-agent は localhost で通信できる<\/p><\/div>\n<div class=\"sk-callout analogy\"><p>Pod は1つの部屋、コンテナは部屋の中にいる人のようなものです。同じ部屋にいる人は、住所を調べなくても声をかければ話せます。<\/p><\/div>\n<p>Pod の定義は次のような YAML で書きます。<\/p>\n<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27\n    ports:\n    - containerPort: 80<\/code><\/pre>\n<div class=\"sk-callout warn\"><p>実務で Pod を直接作ることはあまりありません。Pod は使い捨てを前提にした比較的短命なものとして設計されており、消えても自動では作り直されないためです。<\/p><\/div>\n<p>通常は、次の節で扱う Deployment のようなワークロードリソースに Pod を作らせます。<\/p>\n<div class=\"sk-summary\"><ul><li>Pod は Kubernetes で作成・管理できる最小のデプロイ単位<\/li><li>同じ Pod のコンテナは localhost で通信できる<\/li><li>Pod は直接作らず、Deployment などに作らせる<\/li><\/ul><\/div>", "sources": ["F-001", "F-002", "F-003", "F-019", "F-020", "F-021", "F-022", "F-023", "F-024"], "questions": [{"id": "q-ch1-s1-01", "type": "choice", "prompt": "Kubernetes で作成・管理できる最小のデプロイ単位はどれですか。", "code": null, "options": ["コンテナ", "Pod", "Node", "Deployment"], "answer": 1, "explanation": "Kubernetes で作成・管理できる最小のデプロイ単位は Pod です。コンテナは Pod の中に入れて動かします。", "refs": ["ch1-s1"]}, {"id": "q-ch1-s1-02", "type": "fill", "prompt": "同じ Pod に入ったコンテナどうしは、宛先を <code>____<\/code> にして通信できます。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["localhost", "127.0.0.1"], "explanation": "同じ Pod のコンテナはネットワークを共有しているため、<code>localhost<\/code> で互いに通信できます。", "refs": ["ch1-s1"]}, {"id": "q-ch1-s1-03", "type": "choice", "prompt": "実務でアプリを Kubernetes 上で動かすとき、Pod は通常どのように作りますか。", "code": null, "options": ["Pod のマニフェストを書いて、Pod を直接作る", "Deployment などのワークロードリソースに Pod を作らせる", "ノードにログインして docker run を実行する", "kubectl exec でコンテナを追加する"], "answer": 1, "explanation": "Pod は使い捨てを前提にしており、消えても自動では作り直されません。そのため通常は Deployment などのワークロードリソースに Pod を作らせ、管理を任せます。", "refs": ["ch1-s1", "ch1-s2"]}, {"id": "q-ch1-s1-04", "type": "choice", "prompt": "同じ Pod に入ったコンテナどうしが共有するものの組み合わせとして正しいものはどれですか。", "code": null, "options": ["ネットワークとストレージ", "コンテナイメージとタグ", "Deployment と ReplicaSet", "マニフェストと kubectl の設定"], "answer": 0, "explanation": "同じ Pod のコンテナは、ネットワークとストレージを共有します。ネットワークを共有しているので、<code>localhost<\/code> で互いに通信できます。", "refs": ["ch1-s1"]}, {"id": "q-ch1-s1-05", "type": "predict", "prompt": "Deployment を使わず、Pod のマニフェストで直接作った Pod web を、次のように削除しました。最後のコマンドを実行したとき、web はどうなっていますか。", "code": "$ kubectl apply -f web-pod.yaml\n$ kubectl delete pod web\n$ kubectl get pods", "options": ["一覧に web は出てこない（作り直されない）", "同じ名前の web が自動で作り直されている", "web が Pending のまま残っている", "削除できずに Running のまま残っている"], "answer": 0, "explanation": "Pod 自体には、消えたときに自分を作り直す仕組みがありません。直接作った Pod は、作り直すコントローラーがないので、削除したらそれきりです。作り直しが必要なら Deployment などに Pod を作らせます。", "refs": ["ch1-s1", "ch1-s2"]}, {"id": "q-ch1-s1-06", "type": "fill", "prompt": "Pod のマニフェストでは、作るオブジェクトの種類を <code>kind: ____<\/code> と書きます。Pod を作るときに空欄に入る値を答えてください。", "code": null, "options": [], "answer": ["Pod"], "explanation": "Pod を作るマニフェストでは <code>kind: Pod<\/code> と書きます。", "refs": ["ch1-s1"]}, {"id": "q-ch1-s1-07", "type": "choice", "prompt": "1つの Pod に入れられるコンテナの数として正しいものはどれですか。", "code": null, "options": ["必ず1つ", "1つ以上", "2つまで", "0個でもよい"], "answer": 1, "explanation": "Pod は1つ以上のコンテナのグループです。1つだけのこともあれば、複数のコンテナをまとめることもあります。", "refs": ["ch1-s1"]}]}, {"id": "ch1-s2", "title": "1.2 Deployment と ReplicaSet", "body": "<div class=\"sk-goals\"><ul><li>Deployment・ReplicaSet・Pod の関係<\/li><li>ロールアウトが始まる操作と始まらない操作<\/li><li>前のバージョンに戻す方法<\/li><\/ul><\/div>\n<p><strong>Deployment<\/strong> は、Pod を指定した数だけ動かし続け、更新も宣言的に行うためのオブジェクトです。Deployment を作ると、Deployment は <strong>ReplicaSet<\/strong> を作り、ReplicaSet が指定された数の Pod を維持します。<\/p>\n<div class=\"sk-nest\" data-label=\"Deployment: web（replicas: 3）\"><div class=\"sk-nest\" data-label=\"ReplicaSet: web-7c9d8f6b5\"><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><\/div><\/div>\n<div class=\"sk-callout point\"><p>Pod を1つ削除しても、ReplicaSet が数の不足を検知して新しい Pod を作ります。Pod を直接作ったときとの大きな違いはここです。<\/p><\/div>\n<p>Deployment の <code>.spec.template<\/code>（Pod のひな形）を変更すると、ロールアウトが始まります。たとえばコンテナイメージのタグを変えると、新しい ReplicaSet が作られ、古い Pod から新しい Pod へ順に入れ替わります。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"ロールアウトで、旧 ReplicaSet の Pod が新 ReplicaSet の Pod に順に入れ替わる様子\"><rect x=\"10\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新前<\/text><text x=\"22\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"22\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"47\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"80\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"105\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"138\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"163\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><text x=\"22\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"22\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"80\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"138\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"217\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"235\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"330\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">入れ替え中<\/text><text x=\"247\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"247\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"272\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"305\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"330\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"363\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"247\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"247\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"272\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"305\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"363\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"442\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"460\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"555\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新後<\/text><text x=\"472\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"472\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"530\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"588\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"472\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"472\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"497\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"530\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"555\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"588\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"613\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><\/svg><figcaption>イメージを v1 から v2 に変えたときのロールアウト<\/figcaption><\/figure>\n<div class=\"sk-callout warn\"><p><code>replicas<\/code> の数を変えるだけのスケールでは、ロールアウトは起きません。ロールアウトが始まるのは、Pod のひな形が変わったときだけです。<\/p><\/div>\n<p>新しいバージョンに問題があったときは、<code>kubectl rollout undo<\/code> で前のリビジョンに戻せます。<\/p>\n<ol class=\"sk-flow\"><li><strong>更新する<\/strong><br><code>kubectl set image<\/code><\/li><li><strong>見守る<\/strong><br><code>kubectl rollout status<\/code><\/li><li><strong>問題があれば戻す<\/strong><br><code>kubectl rollout undo<\/code><\/li><\/ol>\n<pre><code>$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web<\/code><\/pre>\n<div class=\"sk-summary\"><ul><li>Deployment → ReplicaSet → Pod の順に管理する<\/li><li>ロールアウトは Pod のひな形が変わったときだけ始まる<\/li><li><code>kubectl rollout undo<\/code> で前のリビジョンに戻せる<\/li><\/ul><\/div>", "sources": ["F-004", "F-005", "F-006", "F-015"], "questions": [{"id": "q-ch1-s2-01", "type": "order", "prompt": "Deployment でアプリを動かしたときの管理の関係を、管理する側（上位）から順に並べてください。", "code": null, "options": ["Pod", "Deployment", "コンテナ", "ReplicaSet"], "answer": ["Deployment", "ReplicaSet", "Pod", "コンテナ"], "explanation": "Deployment が ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。コンテナは Pod の中で動きます。", "refs": ["ch1-s2", "ch1-s1"]}, {"id": "q-ch1-s2-02", "type": "choice", "prompt": "Deployment に対する次の操作のうち、ロールアウトが始まるものはどれですか。", "code": null, "options": ["replicas を 3 から 5 に変える", ".spec.template のコンテナイメージのタグを変える", "kubectl scale で Pod の数を減らす", "kubectl get deployment で状態を確認する"], "answer": 1, "explanation": "ロールアウトが始まるのは、Deployment の <code>.spec.template<\/code>（Pod のひな形）が変わったときです。コンテナイメージのタグの変更はこれに当たります。<code>replicas<\/code> の変更や <code>kubectl scale<\/code> はスケールなので、ロールアウトは起きません。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-03", "type": "predict", "prompt": "nginx:1.26 で動いていた Deployment web に、次のコマンドを順に実行しました。最後のコマンドのあと、web の Pod はどうなりますか。", "code": "$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web", "options": ["nginx:1.26 のコンテナで動く Pod に戻る", "Deployment ごと削除され、Pod がなくなる", "nginx:1.27 のまま、Pod が再起動される", "Pod は停止したまま、手動の再開を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> は Deployment を前のリビジョンに戻します。直前のリビジョンは nginx:1.26 なので、nginx:1.26 で動く Pod に戻ります。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-04", "type": "fill", "prompt": "Deployment が作り、指定された数の Pod を維持するオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-05", "type": "predict", "prompt": "replicas: 3 で動いている Deployment の replicas を 5 に変えて適用しました。どうなりますか。", "code": "$ kubectl scale deployment/web --replicas=5", "options": ["今の ReplicaSet のまま、Pod が5つに増える", "新しい ReplicaSet が作られ、Pod がすべて入れ替わる", "Deployment が作り直される", "ロールアウトが始まり、前のリビジョンが保存される"], "answer": 0, "explanation": "<code>replicas<\/code> を変えるだけのスケールでは、ロールアウトは起きません。今の ReplicaSet が Pod の数を5つに増やします。新しい ReplicaSet が作られるのは、Pod のひな形が変わったときです。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-06", "type": "order", "prompt": "Deployment のコンテナイメージを v1 から v2 に変えたときのロールアウトの流れを、起きる順に並べてください。", "code": null, "options": ["新しい Pod が増え、古い Pod が減っていく", ".spec.template のイメージを v2 に変える", "古い ReplicaSet の Pod が 0 になる", "新しい ReplicaSet が作られる"], "answer": [".spec.template のイメージを v2 に変える", "新しい ReplicaSet が作られる", "新しい Pod が増え、古い Pod が減っていく", "古い ReplicaSet の Pod が 0 になる"], "explanation": "Pod のひな形を変えるとロールアウトが始まり、新しい ReplicaSet が作られます。新しい Pod が増えるのに合わせて古い Pod が減り、最後は古い ReplicaSet の Pod が 0 になります。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-07", "type": "fill", "prompt": "Deployment web を前のリビジョンに戻すコマンドは <code>kubectl rollout ____ deployment/web<\/code> です。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["undo"], "explanation": "<code>kubectl rollout undo<\/code> で、Deployment を前のリビジョンに戻せます。", "refs": ["ch1-s2"]}, {"id": "q-ch1-s2-08", "type": "choice", "prompt": "イメージを更新したあと、ロールアウトが終わったかどうかを確かめるコマンドはどれですか。", "code": null, "options": ["kubectl rollout status deployment/web", "kubectl rollout undo deployment/web", "kubectl logs deployment/web --previous", "kubectl scale deployment/web --replicas=0"], "answer": 0, "explanation": "<code>kubectl rollout status<\/code> で、ロールアウトの進み具合と完了を確認できます。<code>rollout undo<\/code> は前のリビジョンに戻すコマンドです。", "refs": ["ch1-s2"]}]}]}, {"id": "ch2", "title": "2章 Pod のトラブルシューティング", "sections": [{"id": "ch2-s1", "title": "2.1 Pod の状態を読む", "body": "<div class=\"sk-goals\"><ul><li><code>kubectl get pods<\/code> の出力の読み方<\/li><li>Pod の phase の5つの値<\/li><li>CrashLoopBackOff と ImagePullBackOff の意味<\/li><\/ul><\/div>\n<p>Pod の様子は <code>kubectl get pods<\/code> で確認します。最初に見るのは <code>STATUS<\/code> 列と <code>RESTARTS<\/code> 列です。<\/p>\n<pre><code>$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\nweb-7c9d8f6b5-x2k4p   1/1     Running            0             12m\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m\nbatch-6d7e8f9a0-z9y8  0/1     Pending            0             3m<\/code><\/pre>\n<p>Pod のライフサイクルは <strong>phase<\/strong> という値で表します。phase は次の5つです。<\/p>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge warn\">Pending<\/span><span>クラスタには受け入れられたが、コンテナがまだ動く状態になっていない。ノードへのスケジュール待ちや、イメージのダウンロード中もここに含まれる<\/span><\/div><div><span class=\"sk-badge ok\">Running<\/span><span>ノードに割り当てられ、少なくとも1つのコンテナが動いている<\/span><\/div><div><span class=\"sk-badge info\">Succeeded<\/span><span>すべてのコンテナが正常に終了し、再起動しない<\/span><\/div><div><span class=\"sk-badge err\">Failed<\/span><span>すべてのコンテナが終了し、少なくとも1つが失敗で終わった<\/span><\/div><div><span class=\"sk-badge info\">Unknown<\/span><span>Pod の状態を取得できない<\/span><\/div><\/div>\n<p><code>STATUS<\/code> 列には phase 以外の値も出ます。トラブルのときによく見るのは次の2つです。<\/p>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge err\">CrashLoopBackOff<\/span><span>コンテナが起動しては異常終了することを繰り返し、kubelet が再起動までの待ち時間を延ばしながら再起動を試みている。<code>RESTARTS<\/code> が増えていく<\/span><\/div><div><span class=\"sk-badge err\">ImagePullBackOff<\/span><span>コンテナイメージを取得できず、取得の再試行を待っている。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こる<\/span><\/div><\/div>\n<div class=\"sk-callout warn\"><p><code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出ますが、phase ではありません。phase は Pending、Running、Succeeded、Failed、Unknown の5つだけです。<\/p><\/div>\n<div class=\"sk-summary\"><ul><li>まず <code>STATUS<\/code> と <code>RESTARTS<\/code> を見る<\/li><li>phase は Pending・Running・Succeeded・Failed・Unknown の5つ<\/li><li>CrashLoopBackOff は起動と異常終了の繰り返し、ImagePullBackOff はイメージ取得の失敗<\/li><\/ul><\/div>", "sources": ["F-007", "F-008", "F-009", "F-010", "F-014", "F-016", "F-017"], "questions": [{"id": "q-ch2-s1-01", "type": "choice", "prompt": "次のうち、Pod の phase ではないものはどれですか。", "code": null, "options": ["Pending", "Running", "CrashLoopBackOff", "Succeeded"], "answer": 2, "explanation": "phase は Pending、Running、Succeeded、Failed、Unknown の5つです。<code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出る値ですが、phase ではありません。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-02", "type": "choice", "prompt": "次の出力の Pod について、正しい説明はどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m", "options": ["コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod を割り当てるノードがまだ決まっていない", "コンテナは正常に動いている"], "answer": 0, "explanation": "<code>CrashLoopBackOff<\/code> は、コンテナが起動しては異常終了することを繰り返し、kubelet が待ち時間を延ばしながら再起動を試みている状態です。<code>RESTARTS<\/code> が 5 になっていることからも、再起動を繰り返していると分かります。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-03", "type": "predict", "prompt": "存在しないタグを指定して Pod を作りました。数分後に <code>kubectl get pods<\/code> を実行したとき、<code>STATUS<\/code> 列に出る値として最も可能性が高いものはどれですか。", "code": "$ kubectl run web --image=nginx:9.99-not-exist\n（数分待つ）\n$ kubectl get pods", "options": ["Running", "ImagePullBackOff", "CrashLoopBackOff", "Completed"], "answer": 1, "explanation": "指定したタグのイメージが存在しないため、コンテナイメージを取得できません。取得に失敗して再試行を待っている間、<code>STATUS<\/code> には <code>ImagePullBackOff<\/code> が出ます。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-04", "type": "fill", "prompt": "クラスタに受け入れられたものの、ノードへのスケジュール待ちやイメージのダウンロード中で、コンテナがまだ動いていない Pod の phase を答えてください。", "code": null, "options": [], "answer": ["Pending"], "explanation": "Pending は、Pod がクラスタに受け入れられたものの、コンテナがまだ動く状態になっていない phase です。スケジュール待ちやイメージのダウンロード中もここに含まれます。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-05", "type": "choice", "prompt": "Pod の phase が Succeeded のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが正常に終了し、再起動しない", "少なくとも1つのコンテナが動いている", "コンテナがまだ動く状態になっていない", "Pod の状態を取得できない"], "answer": 0, "explanation": "Succeeded は、すべてのコンテナが正常に終了し、再起動しない phase です。少なくとも1つのコンテナが動いているのは Running です。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-06", "type": "choice", "prompt": "次の出力の Pod について、原因として最も考えられるものはどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS   AGE\nweb-6d8f7c9b5-k3m2n   0/1     ImagePullBackOff   0          2m", "options": ["イメージ名やタグの書き間違い", "ノードの CPU の空きが足りない", "アプリが起動直後に異常終了している", "同じ Pod のコンテナが localhost で通信できない"], "answer": 0, "explanation": "<code>ImagePullBackOff<\/code> は、コンテナイメージを取得できずに再試行を待っている状態です。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こります。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-07", "type": "fill", "prompt": "<code>kubectl get pods<\/code> の出力で、コンテナが再起動した回数を示す列の名前を答えてください。", "code": null, "options": [], "answer": ["RESTARTS"], "explanation": "<code>RESTARTS<\/code> 列はコンテナの再起動回数です。CrashLoopBackOff の Pod では、この数が増えていきます。", "refs": ["ch2-s1"]}, {"id": "q-ch2-s1-08", "type": "choice", "prompt": "Pod の phase が Failed のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが終了し、少なくとも1つが失敗で終わった", "コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod をノードに割り当てられていない"], "answer": 0, "explanation": "Failed は、すべてのコンテナが終了し、少なくとも1つが失敗で終わった phase です。起動と異常終了の繰り返しは CrashLoopBackOff で、phase ではありません。", "refs": ["ch2-s1"]}]}, {"id": "ch2-s2", "title": "2.2 describe と logs で原因を探す", "body": "<div class=\"sk-goals\"><ul><li>Pod の不具合を調べて直す手順<\/li><li>Pending と CrashLoopBackOff で、見る場所が違う理由<\/li><li><code>kubectl logs --previous<\/code> の使いどころ<\/li><\/ul><\/div>\n<p><code>STATUS<\/code> で様子が分かったら、次は原因を探して直します。全体の流れは次のとおりです。<\/p>\n<ol class=\"sk-flow\"><li><strong>見つける<\/strong><br><code>kubectl get pods<\/code> で問題のある Pod と STATUS を確認<\/li><li><strong>調べる<\/strong><br><code>describe<\/code> や <code>logs<\/code> で原因を探す<\/li><li><strong>直す<\/strong><br>原因を直したマニフェストを適用<\/li><li><strong>確かめる<\/strong><br><code>kubectl get pods<\/code> で Running を確認<\/li><\/ol>\n<p>原因を調べるときに使うコマンドは主に2つです。どちらを先に見るかは、Pod の状態で変わります。<\/p>\n<div class=\"sk-compare\"><div><h4>Pending のまま<\/h4><ul><li>ノードに割り当てられていないことが多い<\/li><li>コンテナが動いていないので、ログからは手がかりを得られない<\/li><li><code>kubectl describe pod<\/code> の <code>Events<\/code> を見る<\/li><\/ul><\/div><div><h4>CrashLoopBackOff<\/h4><ul><li>コンテナは起動するが、すぐ異常終了する<\/li><li>いま動いているコンテナはすぐ終了してしまう<\/li><li><code>kubectl logs --previous<\/code> で前回のログを見る<\/li><\/ul><\/div><\/div>\n<p><code>kubectl describe pod<\/code> は、Pod の設定と状態の詳細を表示します。出力の最後にある <code>Events<\/code> には、スケジュールやイメージ取得の結果など、Pod に起きた出来事が時系列で並びます。<\/p>\n<pre><code>$ kubectl describe pod batch-6d7e8f9a0-z9y8\n...\nEvents:\n  Type     Reason            Age   From               Message\n  ----     ------            ----  ----               -------\n  Warning  FailedScheduling  3m    default-scheduler  0/3 nodes are available: 3 Insufficient cpu.<\/code><\/pre>\n<p>Pending のまま進まない Pod の原因の多くは、CPU やメモリの空きが足りず、ノードに割り当てられないことです。上の例では、3つのノードすべてで CPU が足りないと出ています。<\/p>\n<p><code>kubectl logs<\/code> は、コンテナの標準出力と標準エラー出力を表示します。<code>--previous<\/code>（短縮形は <code>-p<\/code>）を付けると、前回終了したコンテナのログを表示します。<\/p>\n<pre><code>$ kubectl logs api-5f6c7d8e9-q1w2e --previous<\/code><\/pre>\n<div class=\"sk-callout tip\"><p>CrashLoopBackOff の Pod を <code>kubectl delete pod<\/code> で消しても、Deployment の Pod なら同じひな形から作り直されるので、同じ状態に戻ります。消す前にログで原因を確かめましょう。<\/p><\/div>\n<div class=\"sk-summary\"><ul><li>見つける → 調べる → 直す → 確かめる の順に進める<\/li><li>Pending は <code>describe<\/code> の <code>Events<\/code>、CrashLoopBackOff は <code>logs --previous<\/code><\/li><li>原因を直したら、Running になったことを必ず確かめる<\/li><\/ul><\/div>", "sources": ["F-004", "F-011", "F-012", "F-013", "F-018"], "questions": [{"id": "q-ch2-s2-01", "type": "fill", "prompt": "再起動を繰り返しているコンテナについて、前回終了したコンテナのログを見たいときは <code>kubectl logs &lt;Pod名&gt; ____<\/code> とします。空欄に入るオプションを答えてください。", "code": null, "options": [], "answer": ["--previous", "-p"], "explanation": "<code>kubectl logs<\/code> に <code>--previous<\/code>（短縮形 <code>-p<\/code>）を付けると、前回終了したコンテナのログを表示します。", "refs": ["ch2-s2"]}, {"id": "q-ch2-s2-02", "type": "choice", "prompt": "Pending のまま進まない Pod の原因を探すとき、最初に確認するものとして適切なのはどれですか。", "code": null, "options": ["kubectl describe pod の Events", "kubectl logs の出力", "kubectl exec で入ったコンテナの中のファイル", "kubectl rollout undo の結果"], "answer": 0, "explanation": "Pending のまま進まない Pod は、ノードに割り当てられていないことがよくあります。その場合コンテナは動いていないので、ログからは手がかりを得られません。<code>kubectl describe pod<\/code> の <code>Events<\/code> に出るスケジューラのメッセージを確認します。", "refs": ["ch2-s2"]}, {"id": "q-ch2-s2-03", "type": "order", "prompt": "Pod の不具合を調べて直すときの手順を、正しい順に並べてください。", "code": null, "options": ["原因を直したマニフェストを適用する", "kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl get pods で Pod が Running になったことを確かめる", "kubectl describe pod で Events を確認する"], "answer": ["kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl describe pod で Events を確認する", "原因を直したマニフェストを適用する", "kubectl get pods で Pod が Running になったことを確かめる"], "explanation": "まず <code>kubectl get pods<\/code> で問題のある Pod を見つけ、<code>kubectl describe pod<\/code> の <code>Events<\/code> で原因を探します。原因を直したマニフェストを適用したら、最後にもう一度 <code>kubectl get pods<\/code> で Running になったことを確かめます。", "refs": ["ch2-s2", "ch2-s1"]}, {"id": "q-ch2-s2-04", "type": "choice", "prompt": "<code>kubectl describe pod<\/code> の出力で、スケジュールやイメージ取得など Pod に起きた出来事が時系列で並ぶのはどこですか。", "code": null, "options": ["Events", "Labels", "Annotations", "Volumes"], "answer": 0, "explanation": "<code>kubectl describe pod<\/code> の出力の最後にある <code>Events<\/code> に、Pod に起きた出来事が時系列で並びます。", "refs": ["ch2-s2"]}, {"id": "q-ch2-s2-05", "type": "choice", "prompt": "ある Pod の <code>kubectl describe pod<\/code> の <code>Events<\/code> に次の行がありました。この Pod の <code>STATUS<\/code> として最も考えられるものはどれですか。", "code": "Warning  FailedScheduling  2m  default-scheduler  0/3 nodes are available: 3 Insufficient memory.", "options": ["Pending", "CrashLoopBackOff", "ImagePullBackOff", "Running"], "answer": 0, "explanation": "<code>FailedScheduling<\/code> は、ノードのメモリが足りず、Pod をどのノードにも割り当てられなかったことを示します。コンテナはまだ動いていないので、Pod は Pending のままです。", "refs": ["ch2-s2", "ch2-s1"]}, {"id": "q-ch2-s2-06", "type": "choice", "prompt": "<code>kubectl logs<\/code> で表示されるものはどれですか。", "code": null, "options": ["コンテナが標準出力と標準エラー出力に書いたログ", "Pod に起きた出来事（Events）", "ノードの CPU とメモリの空き", "Deployment のリビジョンの一覧"], "answer": 0, "explanation": "<code>kubectl logs<\/code> は、コンテナが標準出力と標準エラー出力に書いたログを表示します。Pod に起きた出来事は <code>kubectl describe pod<\/code> の <code>Events<\/code> で見ます。", "refs": ["ch2-s2"]}, {"id": "q-ch2-s2-07", "type": "choice", "prompt": "CrashLoopBackOff の Pod の原因を調べるとき、アプリが異常終了する前に出したメッセージを見るのに適したコマンドはどれですか。", "code": null, "options": ["kubectl logs <Pod名> --previous", "kubectl rollout status deployment/web", "kubectl get pods", "kubectl scale deployment/web --replicas=1"], "answer": 0, "explanation": "CrashLoopBackOff の Pod では、いま動いているコンテナはすぐ終了してしまいます。<code>--previous<\/code> を付けて、前回終了したコンテナのログを見ます。", "refs": ["ch2-s2"]}]}]}], "finalExam": [{"id": "q-final-01", "type": "choice", "prompt": "Deployment web のイメージを新しいタグに更新したところ、新しい Pod が CrashLoopBackOff になりました。まずサービスを元の状態に戻し、原因はそのあとで調べたいと考えています。最初に実行するコマンドとして適切なのはどれですか。", "code": null, "options": ["kubectl rollout undo deployment/web", "kubectl delete pod で CrashLoopBackOff の Pod を消す", "kubectl logs で新しい Pod のログを見る", "kubectl get pods を繰り返して回復を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> で前のリビジョンに戻せば、動いていたイメージの Pod に戻ります。Pod を消しても ReplicaSet が同じひな形で作り直すため、同じ状態に戻ります。原因の調査は、元に戻したあとで行います。", "refs": ["ch1-s2", "ch2-s1"]}, {"id": "q-final-02", "type": "choice", "prompt": "Deployment web の <code>replicas<\/code> を 3 から 10 に増やしたところ、新しく増えた Pod の一部が Pending のまま進みません。その Pod に <code>kubectl describe pod<\/code> を実行し、<code>Events<\/code> に次の行を見つけました。この Pod について正しい見立てはどれですか。", "code": "Warning  FailedScheduling  3m  default-scheduler  0/3 nodes are available: 3 Insufficient cpu.", "options": ["どのノードも CPU の空きが足りず、Pod を割り当てられていない", "コンテナが起動直後に異常終了を繰り返している", "コンテナイメージのタグが存在しない", "Pod は動いているが、ログの出力が止まっている"], "answer": 0, "explanation": "<code>replicas<\/code> を増やすと ReplicaSet が Pod を追加で作りますが、<code>FailedScheduling<\/code> と <code>Insufficient cpu<\/code> は、CPU の空きがあるノードがなく、スケジューラが Pod をノードに割り当てられなかったことを示します。コンテナはまだ動いていないので、ログからは手がかりを得られません。", "refs": ["ch2-s2", "ch1-s2"]}, {"id": "q-final-03", "type": "order", "prompt": "Deployment のイメージのタグを書き間違え、新しい Pod が ImagePullBackOff になりました。調べて直すまでの手順を、正しい順に並べてください。", "code": null, "options": ["Deployment のイメージを正しいタグに更新する", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "kubectl get pods で新しい Pod が Running になったことを確かめる", "kubectl get pods で ImagePullBackOff の Pod を見つける"], "answer": ["kubectl get pods で ImagePullBackOff の Pod を見つける", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "Deployment のイメージを正しいタグに更新する", "kubectl get pods で新しい Pod が Running になったことを確かめる"], "explanation": "<code>kubectl get pods<\/code> で ImagePullBackOff の Pod を見つけ、<code>describe<\/code> の <code>Events<\/code> でどのイメージの取得に失敗したかを確かめます。Deployment の Pod のひな形を正しいタグに直すとロールアウトが始まり、新しい Pod が作られます。最後に Running になったことを確かめます。", "refs": ["ch2-s1", "ch2-s2", "ch1-s2"]}, {"id": "q-final-04", "type": "fill", "prompt": "Deployment で動かしている Pod が CrashLoopBackOff になっていたので、<code>kubectl delete pod<\/code> で消しました。少しすると新しい Pod が作られ、その Pod もまた CrashLoopBackOff になりました。新しい Pod を作ったオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment が作った ReplicaSet は、指定された数の Pod を維持します。Pod が1つ減ると、ReplicaSet が同じひな形から新しい Pod を作ります。ひな形は変わっていないので、新しい Pod も同じ理由で異常終了を繰り返します。Pod を消すのではなく、<code>kubectl logs --previous<\/code> などで原因を調べます。", "refs": ["ch1-s2", "ch2-s1"]}], "factsheet": [{"id": "F-001", "claim": "Pod は Kubernetes で作成・管理できる最小のデプロイ単位で、1つ以上のコンテナのグループである", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-002", "claim": "同じ Pod のコンテナはストレージとネットワークを共有し、localhost で互いに通信できる", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-003", "claim": "Pod は使い捨て（比較的短命）を前提にしており、Pod 自体は自己修復しない。通常は直接作らず Deployment などのワークロードリソースで作る", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-004", "claim": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持する", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-005", "claim": "Deployment のロールアウトは .spec.template が変わったときだけ始まり、新しい ReplicaSet を作って Pod を順に入れ替える（既定の RollingUpdate）。スケールではロールアウトは起きない", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-006", "claim": "kubectl rollout undo で Deployment を前のリビジョンに戻せる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-007", "claim": "Pod の phase は Pending・Running・Succeeded・Failed・Unknown の5つ", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-008", "claim": "Pending はクラスタに受け入れられたがコンテナがまだ動く状態にない phase で、スケジュール待ちやイメージのダウンロード中を含む", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-009", "claim": "CrashLoopBackOff は phase ではなく、コンテナが起動と異常終了を繰り返し、kubelet が待ち時間を延ばしながら再起動している状態", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-010", "claim": "イメージを取得できないとき、Pod は ImagePullBackOff になり取得を再試行する。イメージ名の誤りや非公開レジストリの認証情報不足などで起こる", "url": "https://kubernetes.io/docs/concepts/containers/images/", "rank": "S"}, {"id": "F-011", "claim": "kubectl describe pod は Pod の詳細と Events を表示する。Pending のまま進まない Pod は、スケジューラのメッセージを Events で確認する", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-012", "claim": "Pending のまま進まない Pod の多くは、CPU やメモリの不足でノードに割り当てられていない", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-013", "claim": "kubectl logs の --previous（-p）は、前回終了したコンテナのログを表示する", "url": "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/", "rank": "S"}, {"id": "F-014", "claim": "kubectl get pods で Pod の一覧と状態を表示できる", "url": "https://kubernetes.io/docs/reference/kubectl/quick-reference/", "rank": "S"}, {"id": "F-015", "claim": "kubectl rollout status で Deployment のロールアウトの状況を確認できる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-016", "claim": "phase の意味：Running は少なくとも1つのコンテナが動いている、Succeeded はすべてのコンテナが正常終了し再起動しない、Failed はすべてのコンテナが終了し少なくとも1つが失敗、Unknown は状態を取得できない", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-017", "claim": "kubectl get pods の RESTARTS 列はコンテナの再起動回数を示す", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-018", "claim": "コンテナが標準出力・標準エラー出力に書いたログは kubectl logs で見られる", "url": "https://kubernetes.io/docs/concepts/cluster-administration/logging/", "rank": "S"}, {"id": "F-019", "claim": "Kubernetes はコンテナ化されたワークロードとサービスを管理する、ポータブルで拡張可能なオープンソースのプラットフォームである", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-020", "claim": "Kubernetes は Google が2014年にオープンソース化したプロジェクトで、K8s と略される（K と s の間の8文字を数えた略記）", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-021", "claim": "Docker はアプリケーションを開発・配布・実行するためのオープンなプラットフォームで、アプリをコンテナという隔離された環境で動かす", "url": "https://docs.docker.com/get-started/docker-overview/", "rank": "S"}, {"id": "F-022", "claim": "kubectl は Kubernetes API を使ってクラスタのコントロールプレーンと通信するコマンドラインツールである", "url": "https://kubernetes.io/docs/reference/kubectl/", "rank": "S"}, {"id": "F-023", "claim": "YAML は人が読み書きしやすいデータのシリアライズ（記述）言語である", "url": "https://yaml.org/", "rank": "S"}, {"id": "F-024", "claim": "nginx は HTTP サーバー・リバースプロキシサーバーなどとして動くソフトウェアである", "url": "https://nginx.org/en/", "rank": "S"}]}</script>
<script>
"use strict";
(() => {
  // ===== 定数 =====
  const STAGE2_DELAY_DAYS = 1;   // 誤答した日の翌日以降に段階2
  const STAGE3_DELAY_DAYS = 3;   // 段階2で正解した日の3日後以降に段階3
  const PROGRESS_VERSION = 1;
  const FINAL_EXAM_ID = "final";

  // 演出（学習エンジンの判定には使わない）
  const PRAISE = ["ナイス！", "お見事！", "その調子！", "完璧！", "さすが！"];

  const app = document.getElementById("app");

  // ===== 教材データ =====
  let content;
  try {
    content = JSON.parse(document.getElementById("study-data").textContent);
  } catch (error) {
    app.innerHTML = "<p>教材データを読み込めません。scripts/build_html.py で教材JSONを埋め込んだHTMLを開いてください。</p>";
    return;
  }

  const STORAGE_KEY = "study-kit:" + content.meta.id;
  const sectionById = new Map();
  const chapterBySectionId = new Map();
  const questionById = new Map();
  const sectionIdByQuestionId = new Map(); // 総合演習の問題は FINAL_EXAM_ID
  const factById = new Map((content.factsheet || []).map((fact) => [fact.id, fact]));
  const finalExamQuestions = content.finalExam || [];

  for (const chapter of content.chapters) {
    for (const section of chapter.sections) {
      sectionById.set(section.id, section);
      chapterBySectionId.set(section.id, chapter);
      for (const question of section.questions) {
        questionById.set(question.id, question);
        sectionIdByQuestionId.set(question.id, section.id);
      }
    }
  }
  for (const question of finalExamQuestions) {
    questionById.set(question.id, question);
    sectionIdByQuestionId.set(question.id, FINAL_EXAM_ID);
  }
  const orderedSections = content.chapters.flatMap((chapter) => chapter.sections);

  // ===== 日付（端末のローカル日付。?today=YYYY-MM-DD で検証用に上書きできる） =====
  const debugToday = new URLSearchParams(location.search).get("today");

  function toDateString(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }
  function today() {
    if (debugToday && /^\d{4}-\d{2}-\d{2}$/.test(debugToday)) return debugToday;
    return toDateString(new Date());
  }
  function addDays(dateString, days) {
    const [y, m, d] = dateString.split("-").map(Number);
    return toDateString(new Date(y, m - 1, d + days));
  }

  // ===== 学習履歴の保存 =====
  function createEmptyProgress() {
    return {
      version: PROGRESS_VERSION,
      contentId: content.meta.id,
      questions: {},
      settings: {},
      game: { activeDays: [], bestCombo: 0 },
    };
  }
  function normalizeProgress(saved) {
    const base = createEmptyProgress();
    return {
      ...base,
      ...saved,
      questions: saved.questions || {},
      settings: { ...base.settings, ...saved.settings },
      game: { ...base.game, ...saved.game },
    };
  }
  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.contentId === content.meta.id) return normalizeProgress(saved);
    } catch (error) { /* 読めないときは空の履歴で始める */ }
    return createEmptyProgress();
  }
  let progress = loadProgress();

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (error) {
      showToast("学習履歴を保存できませんでした。右上の ⚙ 設定から学習履歴を書き出して控えを取ってください。");
    }
  }

  // ===== 問題ごとの状態 =====
  // status: "new"（未出題） / "learning"（再学習中） / "closed"（学習済み）
  // stage : 1 = 同じセッションの最後に再出題, 2 = 翌日以降, 3 = 段階2で正解した日の3日後以降
  function getRecord(questionId) {
    return progress.questions[questionId] || { status: "new", attempts: 0 };
  }

  // 段階1の再出題を受けずにセッションが終わった問題は、段階2として扱う
  function effectiveStage(record, currentSessionId) {
    if (record.status !== "learning") return null;
    if (record.stage === 1 && record.sessionId !== currentSessionId) return 2;
    return record.stage;
  }

  function applyAnswer(questionId, isCorrect, sessionId) {
    const record = { ...getRecord(questionId) };
    const stage = effectiveStage(record, sessionId);
    record.attempts = (record.attempts || 0) + 1;
    record.lastAnswered = today();

    const close = () => { record.status = "closed"; delete record.stage; delete record.due; delete record.sessionId; };
    const restartRelearning = () => {
      record.status = "learning";
      record.stage = 1;
      record.due = addDays(today(), STAGE2_DELAY_DAYS);
      record.sessionId = sessionId;
    };

    if (record.status === "new") {
      isCorrect ? close() : restartRelearning();
    } else if (stage === 1) {
      // 解説を読んだ直後の正解はクローズの根拠にしない。正誤にかかわらず段階2へ
      record.stage = 2;
      record.due = addDays(today(), STAGE2_DELAY_DAYS);
    } else if (stage === 2) {
      if (isCorrect) {
        record.stage = 3;
        record.due = addDays(today(), STAGE3_DELAY_DAYS);
      } else {
        restartRelearning();
      }
    } else if (stage === 3) {
      isCorrect ? close() : restartRelearning();
    }
    progress.questions[questionId] = record;
    saveProgress();
    return record;
  }

  // ===== 完了の判定 =====
  function countClosed(questions) {
    return questions.filter((q) => getRecord(q.id).status === "closed").length;
  }
  function sectionStatus(section) {
    const records = section.questions.map((q) => getRecord(q.id));
    if (records.every((r) => r.status === "closed")) return "done";
    if (records.some((r) => r.status !== "new")) return "learning";
    return "new";
  }
  function chapterQuestions(chapter) {
    return chapter.sections.flatMap((section) => section.questions);
  }
  function isChapterDone(chapter) {
    return chapter.sections.every((section) => sectionStatus(section) === "done");
  }
  function isFinalExamUnlocked() {
    return content.chapters.every(isChapterDone);
  }
  function isMaterialDone() {
    return finalExamQuestions.length > 0 && countClosed(finalExamQuestions) === finalExamQuestions.length;
  }
  function hasNewQuestions(questions) {
    return questions.some((q) => getRecord(q.id).status === "new");
  }

  // ===== 進捗率と連続学習日数 =====
  // 進捗率 = クローズ済みの問題数 ÷ 全問題数（節の問題＋総合演習）
  function progressPercent() {
    const all = [...questionById.values()];
    return all.length ? Math.floor((countClosed(all) / all.length) * 100) : 0;
  }
  function markActiveToday() {
    const days = progress.game.activeDays;
    if (days[days.length - 1] !== today()) {
      days.push(today());
      progress.game.activeDays = days.slice(-400);
      saveProgress();
    }
  }
  function dailyStreak() {
    const days = new Set(progress.game.activeDays);
    let cursor = days.has(today()) ? today() : addDays(today(), -1);
    let streak = 0;
    while (days.has(cursor)) {
      streak += 1;
      cursor = addDays(cursor, -1);
    }
    return streak;
  }
  function renderHud() {
    const percent = progressPercent();
    const streak = dailyStreak();
    const hud = document.getElementById("hud");
    const items = [
      el("span", { class: "progress-label", text: `進捗 ${percent}%` }),
      el("span", { class: "progress-bar", role: "progressbar", "aria-label": "教材全体の進捗", "aria-valuenow": String(percent), "aria-valuemin": "0", "aria-valuemax": "100" }, [el("span", { style: `width:${percent}%` })]),
    ];
    if (streak > 0) items.push(el("span", { class: "streak", title: "連続学習日数", text: `🔥 ${streak}日` }));
    hud.replaceChildren(...items);
  }

  // ===== 正誤判定 =====
  function normalizeFillAnswer(text) {
    return text.normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  }
  function isAnswerCorrect(question, response) {
    if (response === null) return false; // 「不明」
    switch (question.type) {
      case "choice":
      case "predict":
        return response === question.answer;
      case "fill":
        return question.answer.some((accepted) => normalizeFillAnswer(accepted) === normalizeFillAnswer(response));
      case "order":
        return response.length === question.answer.length && response.every((item, i) => item === question.answer[i]);
      default:
        return false;
    }
  }
  function describeCorrectAnswer(question) {
    switch (question.type) {
      case "choice":
      case "predict":
        return question.options[question.answer];
      case "fill":
        return question.answer.join(" ／ ");
      case "order":
        return question.answer.map((item, i) => `${i + 1}. ${item}`).join("\n");
      default:
        return "";
    }
  }

  // ===== 小さなユーティリティ =====
  function el(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "html") node.innerHTML = value; // 教材の本文・問題文・解説（スキルが生成した信頼済みHTML）だけに使う
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function shuffled(items) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }
  function shuffledAvoiding(items, forbiddenOrder) {
    if (items.length < 2) return items.slice();
    let result;
    do { result = shuffled(items); } while (result.every((item, i) => item === forbiddenOrder[i]));
    return result;
  }
  function randomPick(items) {
    return items[Math.floor(Math.random() * items.length)];
  }
  function formatSeconds(totalSeconds) {
    const sign = totalSeconds < 0 ? "-" : "";
    const abs = Math.abs(Math.floor(totalSeconds));
    return `${sign}${Math.floor(abs / 60)}:${String(abs % 60).padStart(2, "0")}`;
  }
  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
  }
  function sectionLabel(sectionId) {
    if (sectionId === FINAL_EXAM_ID) return "総合演習";
    return `${chapterBySectionId.get(sectionId).title} ／ ${sectionById.get(sectionId).title}`;
  }
  function stageCode(sectionId) {
    if (sectionId === FINAL_EXAM_ID) return "BOSS";
    const chapterIndex = content.chapters.indexOf(chapterBySectionId.get(sectionId)) + 1;
    const sectionIndex = chapterBySectionId.get(sectionId).sections.indexOf(sectionById.get(sectionId)) + 1;
    return `${chapterIndex}-${sectionIndex}`;
  }

  // ===== 演出：紙吹雪（クラッカー）と浮き上がる文字 =====
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const confettiCanvas = document.getElementById("confetti");
  const confettiContext = confettiCanvas.getContext("2d");
  const CONFETTI_COLORS = ["#6c4cf1", "#f5b301", "#1fa463", "#e5484d", "#2f80ed", "#ff8ad8", "#22d3ee"];
  const GRAVITY = 0.32;
  let confettiPieces = [];
  let confettiRunning = false;

  function resizeConfettiCanvas() {
    const ratio = window.devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * ratio;
    confettiCanvas.height = innerHeight * ratio;
    confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener("resize", resizeConfettiCanvas);
  resizeConfettiCanvas();

  // angle: 打ち出す向き（ラジアン。-π/2 が真上）、spread: 広がり
  function burstConfetti(x, y, { count = 70, angle = -Math.PI / 2, spread = Math.PI / 2.2, power = 13 } = {}) {
    if (prefersReducedMotion) return;
    for (let i = 0; i < count; i++) {
      const direction = angle + (Math.random() - 0.5) * spread;
      const speed = power * (0.55 + Math.random() * 0.6);
      confettiPieces.push({
        x, y,
        vx: Math.cos(direction) * speed,
        vy: Math.sin(direction) * speed,
        rotation: Math.random() * Math.PI,
        spin: (Math.random() - 0.5) * 0.4,
        width: 6 + Math.random() * 6,
        height: 4 + Math.random() * 5,
        color: randomPick(CONFETTI_COLORS),
        life: 110 + Math.random() * 50,
      });
    }
    if (!confettiRunning) {
      confettiRunning = true;
      requestAnimationFrame(drawConfetti);
    }
  }
  function drawConfetti() {
    confettiContext.clearRect(0, 0, innerWidth, innerHeight);
    for (const piece of confettiPieces) {
      piece.vy += GRAVITY;
      piece.vx *= 0.985;
      piece.vy *= 0.985;
      piece.x += piece.vx;
      piece.y += piece.vy;
      piece.rotation += piece.spin;
      piece.life -= 1;
      confettiContext.save();
      confettiContext.globalAlpha = Math.max(0, Math.min(1, piece.life / 40));
      confettiContext.translate(piece.x, piece.y);
      confettiContext.rotate(piece.rotation);
      confettiContext.fillStyle = piece.color;
      confettiContext.fillRect(-piece.width / 2, -piece.height / 2, piece.width, piece.height * Math.abs(Math.cos(piece.rotation * 2)) + 1);
      confettiContext.restore();
    }
    confettiPieces = confettiPieces.filter((piece) => piece.life > 0 && piece.y < innerHeight + 40);
    if (confettiPieces.length) {
      requestAnimationFrame(drawConfetti);
    } else {
      confettiRunning = false;
      confettiContext.clearRect(0, 0, innerWidth, innerHeight);
    }
  }
  // 正解したとき：回答した場所から小さなクラッカー
  function celebrateAt(element) {
    const rect = element.getBoundingClientRect();
    burstConfetti(rect.left + rect.width / 2, rect.top + 10, { count: 60 });
  }
  // 節を全問正解・教材の完了：画面の両下からクラッカー
  function celebrateBig() {
    burstConfetti(0, innerHeight, { count: 110, angle: -Math.PI / 3, spread: Math.PI / 4, power: 22 });
    burstConfetti(innerWidth, innerHeight, { count: 110, angle: (-2 * Math.PI) / 3, spread: Math.PI / 4, power: 22 });
  }
  function floatText(element, text) {
    const rect = element.getBoundingClientRect();
    const float = el("div", { class: "float-text", text, style: `left:${rect.left + rect.width / 2}px;top:${rect.top - 10}px` });
    document.body.append(float);
    setTimeout(() => float.remove(), 1300);
  }

  // ===== 画面の切り替え =====
  // home: ステージマップ / section: 節のページ（問題への入口と本文） / run: 問題を解いている最中
  // settings: 設定（学習履歴） / exam: 模擬試験
  let currentView = "home";
  let currentSectionId = orderedSections[0] && orderedSections[0].id;
  let afterRender = null; // 描画後に1回だけ実行する処理（演出など）
  let keyHandler = null;  // 表示中の画面のキー操作

  function render() {
    keyHandler = null; // キー操作は描画した画面が設定し直す
    document.querySelectorAll(".nav-btn").forEach((button) => {
      button.removeAttribute("aria-current");
      if (button.dataset.view === currentView) button.setAttribute("aria-current", "page");
    });
    app.replaceChildren();
    if (currentView === "home") renderHome();
    else if (currentView === "section") renderSectionPage();
    else if (currentView === "run") renderRun();
    else if (currentView === "settings") renderSettings();
    else if (currentView === "exam") renderExam();
    renderHud();
    if (afterRender) {
      const task = afterRender;
      afterRender = null;
      requestAnimationFrame(task);
    } else {
      window.scrollTo(0, 0);
    }
  }
  function showView(view) {
    if (currentView === "exam" && view !== "exam" && exam && !exam.finished) {
      showToast("模擬試験中です。終了してから移動してください。");
      return;
    }
    if (view !== currentView) confettiPieces = []; // 前の画面の紙吹雪を持ち越さない
    currentView = view;
    render();
  }
  function openSection(sectionId) {
    currentSectionId = sectionId;
    showView("section");
  }
  document.querySelectorAll(".nav-btn").forEach((button) => {
    button.addEventListener("click", () => showView(button.dataset.view));
  });

  // ===== セッションと出題の単位 =====
  // ページを開いてから閉じるまでが1セッション。段階1（同じセッションの中の再挑戦）はこの ID で判定する
  const PAGE_SESSION_ID = "s" + Date.now();
  const sessionStats = { combo: 0 };
  let run = null; // 問題を解いている最中の1回分（節・総合演習・復習・再挑戦のどれか）

  // ===== 問題ごとの「いま解けるか」 =====
  // new: 未挑戦 / now: 今すぐ解ける / wait: 再出題日を待っている / closed: クリア
  const STATE_LABELS = { new: "未挑戦", now: "今すぐ解ける", wait: "待ち", closed: "クリア" };

  function questionState(questionId) {
    const record = getRecord(questionId);
    if (record.status === "new") return { state: "new" };
    if (record.status === "closed") return { state: "closed" };
    const stage = effectiveStage(record, PAGE_SESSION_ID);
    if (stage === 1 || record.due <= today()) return { state: "now" };
    return { state: "wait", date: record.due };
  }
  function summarizeStates(questions) {
    const summary = { new: 0, now: 0, wait: 0, closed: 0, total: questions.length, nextDate: null };
    for (const question of questions) {
      const { state, date } = questionState(question.id);
      summary[state] += 1;
      if (state === "wait" && (!summary.nextDate || date < summary.nextDate)) summary.nextDate = date;
    }
    return summary;
  }
  function idsInState(questions, state) {
    return questions.filter((q) => questionState(q.id).state === state).map((q) => q.id);
  }
  function newQuestionIds(questions) {
    return idsInState(questions, "new");
  }
  // 再出題日の表示：明日なら「明日（10/6）」、それ以外は「10/9」
  function formatDue(date) {
    const [, month, day] = date.split("-").map(Number);
    const label = `${month}/${day}`;
    return date === addDays(today(), 1) ? `明日（${label}）` : label;
  }
  function isStageRun(kind) {
    return kind === "section" || kind === "final";
  }
  function runLabel() {
    return {
      section: () => `STAGE ${stageCode(run.sectionId)}`,
      final: () => "👑 総合演習",
      review: () => "🔁 復習",
      relearn: () => "🔥 再挑戦",
    }[run.kind]();
  }

  // 問題1問を1つの丸で表す。番号入りで、色が状態を表す
  function questionDots(questions) {
    return el("span", { class: "qdots" }, questions.map((question, index) => {
      const { state, date } = questionState(question.id);
      const title = `問題${index + 1}：${STATE_LABELS[state]}${state === "wait" ? `（${formatDue(date)}から）` : ""}`;
      return el("span", { class: `qdot ${state}`, title, "aria-label": title, text: state === "closed" ? "✓" : String(index + 1) });
    }));
  }
  function stateLegend() {
    return el("div", { class: "legend small" }, ["closed", "now", "wait", "new"].map((state) => el("span", {}, [
      el("span", { class: `qdot ${state} mini` }), STATE_LABELS[state],
    ])));
  }
  // 状態の内訳を1行で（例：未挑戦 3 ・ 今すぐ 1 ・ 待ち 2（10/9から）・ クリア 2/8）
  function stateSummaryLine(summary) {
    if (summary.closed === summary.total) return [el("span", { class: "state-text closed", text: "✅ クリア" })];
    const parts = [];
    if (summary.now) parts.push(el("span", { class: "state-text now", text: `🔥 今すぐ ${summary.now}` }));
    if (summary.new) parts.push(el("span", { class: "state-text new", text: `未挑戦 ${summary.new}` }));
    if (summary.wait) parts.push(el("span", { class: "state-text wait", text: `⏳ 待ち ${summary.wait}（${formatDue(summary.nextDate)}から）` }));
    parts.push(el("span", { class: "state-text closed", text: `✓ ${summary.closed}/${summary.total}` }));
    return parts;
  }
  function relearnFlowNote() {
    return el("p", { class: "small muted", text: "間違えた問題は「すぐ再挑戦 → 翌日以降 → そこで正解した3日後以降」と出題し、翌日以降の2回に続けて正解するとクリアです。" });
  }

  // ===== ホーム（ステージマップ） =====
  function renderHome() {
    const meta = content.meta;
    const allQuestions = [...questionById.values()];
    const overall = summarizeStates(allQuestions);

    app.append(el("div", { class: "card hero" }, [
      el("div", {}, [el("span", { class: "pill", text: { 資格: "資格対策", 実務: "実務トレーニング", 教養: "教養" }[meta.purpose] || meta.purpose })]),
      el("h1", { text: meta.title }),
      meta.goals && meta.goals.length ? el("ul", { class: "goal-list" }, meta.goals.map((goal) => el("li", { text: goal }))) : null,
      el("div", { class: "stat-row" }, [
        stat("🔥 今すぐ解ける", `${overall.now}問`),
        stat("未挑戦", `${overall.new}問`),
        stat("✅ クリア", `${overall.closed}／${overall.total}`),
        stat("連続学習", `${dailyStreak()}日`),
      ]),
      isMaterialDone() ? el("p", { class: "center", html: "🏆 <strong>総合演習まですべてクリアしました。この教材は完了です！</strong>" }) : null,
    ]));

    if (overall.now || overall.wait) app.append(reviewCard(allQuestions, overall));

    app.append(el("h2", { text: "ステージマップ" }));
    app.append(el("p", { class: "small muted", style: "margin-bottom:4px", text: "読みたい節を選んでください。丸1つが問題1問です。" }));
    app.append(stateLegend());
    content.chapters.forEach((chapter, chapterIndex) => {
      const questions = chapterQuestions(chapter);
      const closed = countClosed(questions);
      app.append(el("div", { class: "card world" }, [
        el("div", { class: "world-head" }, [
          el("div", {}, [el("span", { class: "pill", text: `WORLD ${chapterIndex + 1}` }), " ", el("span", { class: "world-title", text: chapter.title })]),
          el("span", { class: "small muted", text: `クリア ${closed}問／全 ${questions.length}問` }),
        ]),
        meter(closed, questions.length),
        el("div", { class: "section-grid" }, chapter.sections.map(sectionCard)),
      ]));
    });

    if (finalExamQuestions.length || meta.exam) app.append(bossCard());
  }

  // 今日の復習：今すぐ解ける問題と、次に解けるようになる日
  function reviewCard(allQuestions, overall) {
    const waitingByDate = new Map();
    for (const question of allQuestions) {
      const { state, date } = questionState(question.id);
      if (state === "wait") waitingByDate.set(date, (waitingByDate.get(date) || 0) + 1);
    }
