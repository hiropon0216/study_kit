<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Kit</title>
<style>
/* ===== テーマ（ダーク基調。references/learning-engine.md「画面」） ===== */
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --surface: #161a21;
  --surface-2: #1d222b;
  --line: #2a303b;
  --line-strong: #3a4250;
  --text: #e7eaf0;
  --muted: #98a1b0;
  --accent: #7b94ff;
  --accent-strong: #4e6ef2;
  --accent-soft: rgba(123, 148, 255, 0.14);
  --ok: #3cc28d;
  --ok-strong: #1f9e6c;
  --ok-soft: rgba(60, 194, 141, 0.14);
  --ng: #f0894f;
  --ng-strong: #c9612a;
  --ng-soft: rgba(240, 137, 79, 0.14);
  --mark: #f2c94c;
  --mark-soft: rgba(242, 201, 76, 0.22);
  --mark-ink: #1b1606;
  --info: #6aa8ff;
  --info-soft: rgba(106, 168, 255, 0.09);
  --pre-bg: #0a0c10;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.8; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { text-wrap: balance; }
code, pre { font-family: var(--mono); font-size: 0.92em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line); padding: 0.05em 0.4em; border-radius: 5px; }
pre { background: var(--pre-bg); border: 1px solid var(--line); color: var(--text); padding: 12px 14px; border-radius: 10px; overflow-x: auto; line-height: 1.55; margin: 0.9em 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ===== 共通部品 ===== */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 0.9rem; line-height: 1.5; text-decoration: none; color: var(--text); }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #5d7cff; }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn:disabled { opacity: 0.45; }
.btn.block { width: 100%; padding: 11px 16px; }
.btn.small { padding: 4px 12px; font-size: 0.8rem; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.ng { background: var(--ng-soft); color: var(--ng); }
.tag.now { background: var(--accent-soft); color: var(--accent); }
.meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent-strong); border-radius: 99px; transition: width 0.5s ease; }
.meter.ok > span { background: var(--ok-strong); }
.eyebrow { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.link-btn { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.flash { animation: flash 1.8s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 35% { background: var(--mark-soft); } 100% { background: transparent; } }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }

/* ===== 上部バー ===== */
.appbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: rgba(14, 17, 22, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: none; padding: 0; text-align: left; }
.brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-strong); display: grid; place-items: center; flex: none; }
.brand-name { line-height: 1.25; min-width: 0; }
.brand-name small { display: block; font-size: 0.7rem; color: var(--muted); }
.brand-name strong { display: block; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
.search { position: relative; flex: 0 1 380px; min-width: 0; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.search-box input { background: none; border: none; outline: none; width: 100%; font-size: 0.88rem; }
.search-box input::placeholder { color: var(--muted); }
.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: min(420px, 90vw); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); padding: 6px; max-height: 60vh; overflow-y: auto; z-index: 40; }
.search-results button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; padding: 8px 10px; }
.search-results button:hover, .search-results button:focus-visible { background: var(--surface-2); }
.search-results small { display: block; color: var(--muted); font-size: 0.72rem; }
.search-results span { display: block; font-size: 0.85rem; line-height: 1.5; }
.search-results mark { background: var(--mark-soft); color: var(--text); border-radius: 3px; }
.search-results .empty { padding: 8px 10px; color: var(--muted); font-size: 0.85rem; }
.appbar .spacer { flex: 1; }
.hdr-progress { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.hdr-progress .meter { width: 110px; }
.hdr-progress b { color: var(--text); }
.gear { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 1rem; }
.gear[aria-current="page"] { border-color: var(--accent); color: var(--accent); }

main { padding: 28px 20px 70px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ===== ホーム ===== */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.home-main, .home-side { display: grid; gap: 24px; min-width: 0; }
.resume h2 { font-size: 1.75rem; margin: 2px 0 6px; line-height: 1.35; }
.resume .meta, .article .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.resume .btn-row { margin-top: 16px; }
.big-pct { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; margin: 6px 0 10px; }
.big-pct small { font-size: 1rem; color: var(--text); margin-left: 4px; }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.mini-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.mini-stats span { display: block; font-size: 0.72rem; color: var(--muted); }
.mini-stats b { font-size: 1.25rem; }
.home h2.sec-title { font-size: 1.1rem; margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.chapter-card { display: grid; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.chapter-card:hover { border-color: var(--accent); }
.chapter-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chapter-card .no { color: var(--accent); font-weight: 700; font-size: 0.8rem; }
.chapter-card h3 { font-size: 1.05rem; margin: 0; line-height: 1.4; }
.chapter-card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.drill-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.drill-card h3 { margin: 0; font-size: 1rem; }
.drill-card p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
.review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.review-head h3 { font-size: 1.05rem; margin: 0; }
.review-list { display: grid; gap: 10px; margin: 12px 0 16px; }
.review-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface-2); }
.review-item .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72rem; color: var(--muted); }
.review-item p { margin: 2px 0 0; font-size: 0.88rem; line-height: 1.55; }
.goal-list { margin: 8px 0 0; padding-left: 1.2em; font-size: 0.86rem; }

/* ===== 節のページ ===== */
.lesson { display: grid; grid-template-columns: 230px minmax(0, 1fr) 260px; gap: 24px; align-items: start; max-width: 1440px; margin: 0 auto; }
.toc { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; font-size: 0.86rem; padding: 14px 10px; }
.toc-head { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 6px; }
.toc-head .btn { display: none; }
.toc .ch { display: flex; justify-content: space-between; gap: 6px; padding: 10px 8px 2px; font-weight: 700; font-size: 0.82rem; }
.toc .ch span { color: var(--muted); font-weight: 400; }
.toc-link { display: flex; gap: 8px; align-items: center; width: 100%; padding: 5px 8px; border-radius: 6px; color: var(--text); background: none; border: none; text-align: left; line-height: 1.5; }
.toc-link:hover { background: var(--surface-2); }
.toc-link.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.toc .st { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; display: grid; place-items: center; font-size: 9px; }
.toc .st.done { border-color: var(--ok); color: var(--ok); }
.toc .st.cur { border-color: var(--accent); }
.toc .st.cur::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.toc .st.drill { border-radius: 3px; border-color: var(--accent); color: var(--accent); }
.toc hr { border: none; border-top: 1px solid var(--line); margin: 10px 4px; }
.toc-backdrop { display: none; }
.toc-open-btn { display: none; }
.lesson-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs { font-size: 0.8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: none; background: none; border-radius: 7px; padding: 5px 14px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); }
.article { padding: 34px 44px 40px; }
.sec-no { display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 0.8rem; padding: 0 10px; border-radius: 6px; }
.article h1 { font-size: 2rem; margin: 6px 0 4px; line-height: 1.35; }
.guide { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 9px 14px; font-size: 0.85rem; color: var(--muted); margin: 18px 0 4px; }
.guide b { color: var(--accent); }
.block { scroll-margin-top: 80px; }
.block > h2 { font-size: 1.3rem; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); scroll-margin-top: 80px; line-height: 1.45; }
.example { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 16px 20px; margin: 30px 0 0; scroll-margin-top: 80px; }
.example-head { display: flex; align-items: baseline; gap: 12px; }
.example-head .lbl { flex: none; background: var(--surface-2); color: var(--muted); font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
.example-head b { font-size: 1.02rem; }
.sources { margin-top: 30px; font-size: 0.82rem; color: var(--muted); }
.sources summary { cursor: pointer; font-weight: 700; }
.sources ul { padding-left: 0; list-style: none; }
.sources li { margin: 6px 0; }
.rank { display: inline-block; min-width: 1.7em; text-align: center; font-size: 0.75em; font-weight: 700; border-radius: 4px; margin-right: 6px; background: var(--accent-soft); color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 22px; border-radius: 10px; }
.gate-text { text-align: right; font-size: 0.82rem; color: var(--muted); margin: 8px 0 0; }
.gate-text b, .side-gate b { color: var(--ng); }
.gate-text.open, .side-gate.open { color: var(--ok); font-weight: 700; }
.lesson.only-quiz .explain, .lesson.only-quiz .guide { display: none; }
.lesson.only-quiz .block > h2 { font-size: 1rem; margin-top: 22px; }
.lesson.only-quiz .example { border: none; padding: 0; }

/* すぐ確認 */
.check { margin: 22px 0 8px; border: 1px solid rgba(123, 148, 255, 0.35); background: rgba(123, 148, 255, 0.07); border-radius: 12px; padding: 14px 18px 16px; scroll-margin-top: 90px; }
.check.is-ok { border-color: rgba(60, 194, 141, 0.55); }
.check.is-ng { border-color: rgba(240, 137, 79, 0.55); }
.check-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.check-badge { background: var(--accent-strong); color: #fff; font-weight: 700; padding: 1px 10px; border-radius: 6px; }
.check-q { margin: 10px 0 0; }
.hint { margin-top: 10px; font-size: 0.88rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }

/* 解答の部品（すぐ確認と演習で共通） */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0 0; }
.choices.wide { grid-template-columns: 1fr; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 9px 14px; min-width: 0; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.8rem; color: var(--muted); }
.choice .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.run .choices { grid-template-columns: 1fr; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-pressed="true"] .k { background: var(--accent-strong); color: #fff; }
.choice.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-ok .k { background: var(--ok-strong); color: #fff; }
.choice.is-ng { border-color: var(--ng); background: var(--ng-soft); }
.choice.is-ng .k { background: var(--ng-strong); color: #fff; }
.choice.dim { opacity: 0.55; }
.choice .note { margin-left: auto; font-size: 0.75rem; font-weight: 700; flex: none; }
.choice.is-ok .note { color: var(--ok); }
.choice.is-ng .note { color: var(--ng); }
.ox { display: flex; gap: 12px; margin-top: 14px; }
.ox button { width: 84px; height: 64px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; font-size: 1.7rem; }
.ox button:hover:not(:disabled) { border-color: var(--accent); }
.ox button:disabled { cursor: default; }
.ox button.is-ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.ox button.is-ng { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }
.ox button.dim { opacity: 0.55; }
.fillrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.fillrow input { flex: 0 1 260px; min-width: 120px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; font-size: 1.02rem; }
.fillrow input::placeholder { color: var(--muted); }
.fillrow input.is-ok { border-color: var(--ok); }
.fillrow input.is-ng { border-color: var(--ng); }
.order-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.order-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.order-item .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; }
.order-item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 2.1em; height: 2.1em; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 6px; }
.order-item .mv button:disabled { opacity: 0.3; }
.order-list.is-ok .order-item { border-color: var(--ok); }
.order-list.is-ng .order-item { border-color: var(--ng); }
.submit-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.result { margin-top: 14px; border-radius: 10px; padding: 12px 16px; animation: pop 0.25s ease-out; }
.result.ok { background: var(--ok-soft); }
.result.ng { background: var(--ng-soft); }
.result .v { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.result.ok .v { color: var(--ok); }
.result.ng .v { color: var(--ng); }
.result p { margin: 4px 0 0; font-size: 0.92rem; }
.result .answer-text { white-space: pre-line; }
.result .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* 右の列 */
.side { display: grid; gap: 16px; position: sticky; top: 76px; min-width: 0; }
.side h3 { font-size: 0.9rem; margin: 0 0 4px; }
.score { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
.score small { font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.side-gate { margin-top: 10px; font-size: 0.8rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.map { display: grid; gap: 8px; margin-top: 12px; }
.map button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; }
.map button:hover { border-color: var(--accent); }
.map button.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.map small { display: block; font-size: 0.7rem; color: var(--muted); line-height: 1.4; }
.map b { font-size: 0.82rem; }
.keypoints { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.86rem; }
.memo { width: 100%; min-height: 130px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 0.86rem; margin-top: 6px; }
.memo::placeholder { color: var(--muted); }

/* ===== 演習（章末演習・総合演習・復習・模擬試験） ===== */
.run-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1060px; margin: 0 auto 22px; }
.run-bar .ttl { line-height: 1.3; margin-right: auto; min-width: 0; }
.run-bar .ttl small { display: block; font-size: 0.72rem; color: var(--muted); }
.run-bar .ttl b { font-size: 1.05rem; }
.run-prog { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; }
.run-prog .meter { width: 170px; }
.run-prog b { color: var(--text); }
.run-prog .over { color: var(--ng); font-weight: 700; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 22px; align-items: start; max-width: 1060px; margin: 0 auto; }
.run .card { padding: 28px 34px; }
.qtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; }
.qtop b { color: var(--accent); font-size: 0.9rem; }
.stem { font-size: 1.15rem; font-weight: 700; margin: 14px 0 0; }
.goto { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid var(--accent-strong); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin-top: 14px; }
.goto .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-strong); display: grid; place-items: center; flex: none; }
.goto small { display: block; font-size: 0.72rem; color: var(--muted); }
.goto b { font-size: 0.95rem; }
.goto .arr { margin-left: auto; color: var(--accent); }

<script id="study-data" type="application/json">{"meta": {"id": "k8s-practical-20261005", "series": "study-kit お手本", "title": "Kubernetes 実務入門（サンプル）", "purpose": "実務", "level": "Docker は日常的に使うが、Kubernetes は触ったことがない", "targetVersion": "Kubernetes v1.34 系の公式ドキュメント（2026-10 時点）", "createdAt": "2026-10-05", "goals": ["Pod と Deployment の関係を説明し、Deployment でアプリを動かせる", "Pod が起動しないとき、kubectl で原因を切り分けられる"], "exam": null}, "chapters": [{"id": "ch1", "title": "Kubernetes の基本オブジェクト", "sections": [{"id": "ch1-s1", "title": "Pod", "keyPoints": ["Pod は Kubernetes で作成・管理できる最小のデプロイ単位", "同じ Pod のコンテナは <code>localhost<\/code> で通信できる", "Pod は直接作らず、Deployment などに作らせる"], "sources": ["F-001", "F-002", "F-003", "F-019", "F-020", "F-021", "F-022", "F-023", "F-024"], "items": [{"id": "i1", "title": "Pod は最小のデプロイ単位", "body": "<div class=\"sk-premise\" data-term=\"Kubernetes\"><p><strong>何か：<\/strong>コンテナで動くアプリ（ワークロード）とサービスを管理する、オープンソースのソフトウェアです。K と s の間に8文字あるので K8s とも書きます。<\/p><p><strong>誰が作ったか：<\/strong>Google が開発し、2014年にオープンソースとして公開しました。<\/p><p><strong>なぜ必要か：<\/strong>コンテナが増えると、どのサーバーでどのコンテナを動かすかを人手で管理するのが難しくなります。Kubernetes はその管理をまとめて引き受けます。<\/p><p><strong>この教材との関係：<\/strong>この教材全体の主役です。以降に出てくる Pod や Deployment は、すべて Kubernetes が管理する仕組みです。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"Docker\"><p><strong>何か：<\/strong>アプリをコンテナという隔離された環境で開発・配布・実行するためのソフトウェアです。<\/p><p><strong>誰が作ったか：<\/strong>Docker 社が提供しています。<\/p><p><strong>なぜ必要か：<\/strong>アプリと動かすのに必要なものをコンテナにまとめると、どの環境でも同じように動かせます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes が動かすのも、Docker と同じ形式のコンテナです。この教材では、Docker でコンテナを動かしたことがある前提で、その違いから説明します。<\/p><\/div>\n<p>Kubernetes でアプリを動かすとき、最小の単位になるのが <strong>Pod<\/strong> です。Docker ではコンテナを1つずつ起動しましたが、Kubernetes ではコンテナを Pod という入れ物に入れて動かします。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Docker はコンテナを1つずつ起動し、Kubernetes はコンテナを Pod に入れて動かす\">\n<rect x=\"10\" y=\"34\" width=\"280\" height=\"186\" rx=\"14\" class=\"sk-fill-muted\"/>\n<text x=\"150\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text-muted\">Docker（これまで）<\/text>\n<rect x=\"40\" y=\"86\" width=\"100\" height=\"56\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"90\" y=\"119\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"160\" y=\"86\" width=\"100\" height=\"56\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"210\" y=\"119\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">コンテナ<\/text>\n<text x=\"150\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">コンテナを1つずつ起動する<\/text>\n<rect x=\"330\" y=\"34\" width=\"300\" height=\"186\" rx=\"14\" class=\"sk-fill-muted\"/>\n<text x=\"480\" y=\"22\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text-primary\">Kubernetes（これから）<\/text>\n<rect x=\"348\" y=\"56\" width=\"116\" height=\"116\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"6 4\" class=\"sk-stroke-primary\"/>\n<text x=\"360\" y=\"76\" font-size=\"13\" class=\"sk-text-primary\">Pod<\/text>\n<rect x=\"366\" y=\"92\" width=\"80\" height=\"56\" rx=\"8\" class=\"sk-fill-primary\"/><text x=\"406\" y=\"125\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"480\" y=\"56\" width=\"132\" height=\"116\" rx=\"12\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"6 4\" class=\"sk-stroke-primary\"/>\n<text x=\"492\" y=\"76\" font-size=\"13\" class=\"sk-text-primary\">Pod<\/text>\n<rect x=\"492\" y=\"88\" width=\"108\" height=\"34\" rx=\"7\" class=\"sk-fill-primary\"/><text x=\"546\" y=\"110\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<rect x=\"492\" y=\"128\" width=\"108\" height=\"34\" rx=\"7\" class=\"sk-fill-primary\"/><text x=\"546\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-on\">コンテナ<\/text>\n<text x=\"480\" y=\"196\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">コンテナを Pod に入れて動かす<\/text>\n<\/svg><figcaption>図 1-1-1　Docker はコンテナを1つずつ、Kubernetes はコンテナを Pod に入れて動かす<\/figcaption><\/figure>\n<p>Pod は1つ以上のコンテナのグループです。コンテナが1つだけの Pod もあれば、複数のコンテナをまとめた Pod もあります。Kubernetes が作ったり消したりするのは、コンテナ単体ではなく Pod です。<\/p>\n<div class=\"sk-callout analogy\"><p>Pod は「お弁当箱」、コンテナは「おかず」のようなものです。Kubernetes は、おかずを1つずつではなく、お弁当箱ごと受け渡しします。<\/p><\/div>", "check": {"id": "q-ch1-s1-01", "type": "choice", "prompt": "Kubernetes で作成・管理できる最小のデプロイ単位はどれですか。", "code": null, "options": ["コンテナ", "Pod", "Node", "Deployment"], "answer": 1, "explanation": "Kubernetes で作成・管理できる最小のデプロイ単位は Pod です。コンテナは Pod の中に入れて動かします。", "hint": "図 1-1-1 の右側で、Kubernetes が扱っている一番外側の入れ物は何でしょうか。"}}, {"id": "i2", "title": "同じ Pod のコンテナは localhost で通信できる", "body": "<p>同じ Pod に入ったコンテナは、<strong>ストレージとネットワークを共有<\/strong>します。ネットワークを共有しているので、同じ Pod の中のコンテナどうしは <code>localhost<\/code> で通信できます。<\/p>\n<div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ: web<\/span><span class=\"sk-item\">コンテナ: log-agent<\/span><p class=\"sk-caption\">ネットワークとストレージを共有する。web と log-agent は localhost で通信できる<\/p><\/div>\n<p>上の図では、Web サーバーのコンテナ web と、ログを扱うコンテナ log-agent が同じ Pod に入っています。log-agent は、宛先に <code>localhost<\/code> を指定するだけで web とやり取りできます。<\/p>\n<div class=\"sk-callout analogy\"><p>Pod は1つの部屋、コンテナは部屋の中にいる人のようなものです。同じ部屋にいる人は、住所を調べなくても声をかければ話せます。<\/p><\/div>", "check": {"id": "q-ch1-s1-02", "type": "fill", "prompt": "同じ Pod に入ったコンテナどうしは、宛先を <code>____<\/code> にして通信できます。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["localhost", "127.0.0.1"], "explanation": "同じ Pod のコンテナはネットワークを共有しているため、<code>localhost<\/code> で互いに通信できます。", "hint": "同じ Pod のコンテナはネットワークを共有しています。自分自身を指す宛先の名前を思い出しましょう。"}}, {"id": "i3", "title": "Pod の定義はマニフェストに書く", "body": "<div class=\"sk-premise\" data-term=\"YAML\"><p><strong>何か：<\/strong>人が読み書きしやすいように作られた、データを書くための言語（ファイル形式）です。字下げで階層を表します。<\/p><p><strong>なぜ必要か：<\/strong>設定を人が読める文字で書いておけば、ファイルとして保存したり見直したりできます。<\/p><p><strong>この教材との関係：<\/strong>Kubernetes では、作りたいもの（Pod など）の定義を YAML で書きます。このファイルをマニフェストと呼びます。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"kubectl\"><p><strong>何か：<\/strong>Kubernetes を操作するためのコマンドラインツールです。<\/p><p><strong>誰が作ったか：<\/strong>Kubernetes プロジェクトが Kubernetes 本体と一緒に提供しています。<\/p><p><strong>なぜ必要か：<\/strong>kubectl は、Kubernetes の中でサーバー群（クラスタ）全体を管理する部分に、人の指示を伝えます。人はこのコマンドを通して Kubernetes を操作します。<\/p><p><strong>この教材との関係：<\/strong>マニフェストを適用する <code>kubectl apply<\/code> や、状態を調べる <code>kubectl get<\/code> など、以降の節でくり返し使います。<\/p><\/div>\n<div class=\"sk-premise\" data-term=\"nginx\"><p><strong>何か：<\/strong>Web サーバーとして広く使われているソフトウェアです。<\/p><p><strong>この教材との関係：<\/strong>この教材では、コンテナで動かすアプリの例として使います。下の YAML の <code>image: nginx:1.27<\/code> は「nginx のバージョン 1.27 のコンテナイメージを使う」という意味です。<\/p><\/div>\n<p>Kubernetes では、作りたいものの定義を YAML のファイルに書きます。このファイルを<strong>マニフェスト<\/strong>と呼びます。Pod のマニフェストは次のように書きます。<\/p>\n<pre><code>apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27\n    ports:\n    - containerPort: 80<\/code><\/pre>\n<dl class=\"sk-terms\"><div><dt>kind<\/dt><dd>作るオブジェクトの種類。Pod を作るときは <code>Pod<\/code> と書く<\/dd><\/div><div><dt>metadata.name<\/dt><dd>Pod の名前。この例では web<\/dd><\/div><div><dt>spec.containers<\/dt><dd>Pod に入れるコンテナの一覧。<code>image<\/code> に使うコンテナイメージを書く<\/dd><\/div><\/dl>\n<p>書いたマニフェストは、kubectl で Kubernetes に渡します。Docker との違いを並べると次のとおりです。<\/p>\n<ol class=\"sk-flow\"><li><strong>書く<\/strong><br>マニフェスト（YAML）に Pod の定義を書く<\/li><li><strong>渡す<\/strong><br><code>kubectl apply<\/code> で適用する<\/li><li><strong>動く<\/strong><br>Kubernetes が Pod を作る<\/li><\/ol>\n<div class=\"sk-compare\"><div><h4>Docker（これまで）<\/h4><ul><li>コンテナを1つずつ起動する<\/li><li><code>docker run<\/code> で起動する<\/li><\/ul><\/div><div><h4>Kubernetes（これから）<\/h4><ul><li>1つ以上のコンテナを Pod にまとめて起動する<\/li><li>マニフェスト（YAML）を書いて <code>kubectl apply<\/code> する<\/li><\/ul><\/div><\/div>", "check": {"id": "q-ch1-s1-06", "type": "fill", "prompt": "Pod のマニフェストでは、作るオブジェクトの種類を <code>kind: ____<\/code> と書きます。Pod を作るときに空欄に入る値を答えてください。", "code": null, "options": [], "answer": ["Pod"], "explanation": "Pod を作るマニフェストでは <code>kind: Pod<\/code> と書きます。", "hint": "kind には、作るオブジェクトの種類をそのまま書きます。"}}, {"id": "i4", "title": "Pod は直接作らない", "body": "<p>ここまでで Pod を直接作る方法を見ましたが、実務で Pod を直接作ることはあまりありません。Pod は使い捨てを前提にした比較的短命なものとして設計されていて、<strong>消えても自動では作り直されない<\/strong>からです。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"直接作った Pod は削除するとそれきりだが、Deployment に作らせた Pod は新しく作り直される\">\n<defs><marker id=\"ah-recreate\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-surface\"/><\/marker><\/defs>\n<text x=\"10\" y=\"30\" font-size=\"14\" font-weight=\"700\" class=\"sk-text\">Pod を直接作った場合<\/text>\n<rect x=\"10\" y=\"44\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"65\" y=\"76\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Pod<\/text>\n<path d=\"M130 70H190\" stroke-width=\"2\" class=\"sk-stroke\" marker-end=\"url(#ah-recreate)\"/>\n<text x=\"160\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">削除<\/text>\n<rect x=\"200\" y=\"44\" width=\"110\" height=\"52\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke-warn\"/><text x=\"255\" y=\"76\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-warn\">なし<\/text>\n<text x=\"330\" y=\"76\" font-size=\"13\" class=\"sk-text-muted\">消えたまま。作り直されない<\/text>\n<text x=\"10\" y=\"140\" font-size=\"14\" font-weight=\"700\" class=\"sk-text\">Deployment に作らせた場合<\/text>\n<rect x=\"10\" y=\"154\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"65\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Pod<\/text>\n<path d=\"M130 180H190\" stroke-width=\"2\" class=\"sk-stroke\" marker-end=\"url(#ah-recreate)\"/>\n<text x=\"160\" y=\"170\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">削除<\/text>\n<rect x=\"200\" y=\"154\" width=\"110\" height=\"52\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"255\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">新しい Pod<\/text>\n<text x=\"330\" y=\"186\" font-size=\"13\" class=\"sk-text-muted\">足りなくなった分が作り直される<\/text>\n<\/svg><figcaption>図 1-1-2　直接作った Pod は消えたまま。Deployment に作らせた Pod は作り直される<\/figcaption><\/figure>\n<p>そのため通常は、次の節で扱う <strong>Deployment<\/strong> のようなワークロードリソースに Pod を作らせます。Deployment は、Pod が消えて数が足りなくなると、新しい Pod を作り直します。<\/p>\n<div class=\"sk-callout warn\"><p>Pod のマニフェストを直接適用して作った Pod は、削除したり、動いているサーバーが止まったりすると、それきり戻りません。<\/p><\/div>", "check": {"id": "q-ch1-s1-08", "type": "truefalse", "prompt": "Pod のマニフェストで直接作った Pod を削除すると、同じ Pod が自動で作り直される。", "code": null, "options": [], "answer": false, "explanation": "Pod 自体には、消えたときに自分を作り直す仕組みがありません。直接作った Pod は、削除したらそれきりです。作り直しが必要なら Deployment などに Pod を作らせます。"}}]}, {"id": "ch1-s2", "title": "Deployment と ReplicaSet", "prerequisites": ["ch1-s1"], "keyPoints": ["Deployment → ReplicaSet → Pod の順に管理する", "ロールアウトは Pod のひな形（<code>.spec.template<\/code>）が変わったときだけ始まる", "<code>kubectl rollout undo<\/code> で前のリビジョンに戻せる"], "sources": ["F-004", "F-005", "F-006", "F-015"], "items": [{"id": "i1", "title": "Deployment → ReplicaSet → Pod の3段で管理する", "body": "<p><strong>Deployment<\/strong> は、Pod を指定した数だけ動かし続け、更新も宣言的に行うためのオブジェクトです。Deployment を作ると、Deployment は <strong>ReplicaSet<\/strong> を作り、ReplicaSet が指定された数の Pod を維持します。<\/p>\n<div class=\"sk-nest\" data-label=\"Deployment: web（replicas: 3）\"><div class=\"sk-nest\" data-label=\"ReplicaSet: web-7c9d8f6b5\"><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><div class=\"sk-nest\" data-label=\"Pod\"><span class=\"sk-item\">コンテナ<\/span><\/div><\/div><\/div>\n<p>図のように、Deployment の中に ReplicaSet があり、その中に Pod が3つあります。<code>replicas: 3<\/code> は「Pod を3つ動かし続ける」という指定です。<\/p>\n<div class=\"sk-callout point\"><p>Pod を1つ削除しても、ReplicaSet が数の不足を検知して新しい Pod を作ります。Pod を直接作ったときとの大きな違いはここです。<\/p><\/div>", "check": {"id": "q-ch1-s2-04", "type": "fill", "prompt": "Deployment が作り、指定された数の Pod を維持するオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。", "hint": "Deployment と Pod の間に入るオブジェクトです。"}}, {"id": "i2", "title": "ロールアウトは Pod のひな形が変わったときだけ", "body": "<p>Deployment の <code>.spec.template<\/code>（Pod のひな形）を変更すると、<strong>ロールアウト<\/strong>が始まります。たとえばコンテナイメージのタグを変えると、新しい ReplicaSet が作られ、古い Pod から新しい Pod へ順に入れ替わります。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 660 250\" role=\"img\" aria-label=\"ロールアウトで、旧 ReplicaSet の Pod が新 ReplicaSet の Pod に順に入れ替わる様子\"><rect x=\"10\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新前<\/text><text x=\"22\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"22\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"47\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"80\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"105\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"138\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"163\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><text x=\"22\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"22\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"80\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"138\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"217\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"235\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"330\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">入れ替え中<\/text><text x=\"247\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"247\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"272\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"305\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"330\" y=\"102\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v1<\/text><rect x=\"363\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"247\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"247\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"272\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"305\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"363\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"442\" y=\"146\" text-anchor=\"middle\" font-size=\"22\" class=\"sk-text-muted\">→<\/text><rect x=\"460\" y=\"36\" width=\"190\" height=\"204\" rx=\"14\" class=\"sk-fill-muted\"/><text x=\"555\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" class=\"sk-text\">更新後<\/text><text x=\"472\" y=\"62\" font-size=\"13\" class=\"sk-text-muted\">旧 ReplicaSet<\/text><rect x=\"472\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"530\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><rect x=\"588\" y=\"74\" width=\"50\" height=\"44\" rx=\"10\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" class=\"sk-stroke\"/><text x=\"472\" y=\"158\" font-size=\"13\" class=\"sk-text-muted\">新 ReplicaSet<\/text><rect x=\"472\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"497\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"530\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"555\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><rect x=\"588\" y=\"170\" width=\"50\" height=\"44\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"613\" y=\"198\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">v2<\/text><\/svg><figcaption>図 1-2-1　イメージを v1 から v2 に変えたときのロールアウト<\/figcaption><\/figure>\n<div class=\"sk-compare\"><div><h4>ロールアウトが始まらない<\/h4><ul><li><code>replicas<\/code> の数を変える<\/li><li><code>kubectl scale<\/code> で Pod を増減する<\/li><\/ul><\/div><div><h4>ロールアウトが始まる<\/h4><ul><li><code>.spec.template<\/code> を変える<\/li><li>コンテナイメージのタグを変える<\/li><\/ul><\/div><\/div>\n<div class=\"sk-callout warn\"><p><code>replicas<\/code> の数を変えるだけのスケールでは、ロールアウトは起きません。ロールアウトが始まるのは、Pod のひな形が変わったときだけです。<\/p><\/div>", "check": {"id": "q-ch1-s2-02", "type": "choice", "prompt": "Deployment に対する次の操作のうち、ロールアウトが始まるものはどれですか。", "code": null, "options": ["replicas を 3 から 5 に変える", ".spec.template のコンテナイメージのタグを変える", "kubectl scale で Pod の数を減らす", "kubectl get deployment で状態を確認する"], "answer": 1, "explanation": "ロールアウトが始まるのは、Deployment の <code>.spec.template<\/code>（Pod のひな形）が変わったときです。コンテナイメージのタグの変更はこれに当たります。<code>replicas<\/code> の変更や <code>kubectl scale<\/code> はスケールなので、ロールアウトは起きません。"}}, {"id": "i3", "title": "rollout status で見守り、rollout undo で戻す", "body": "<p>ロールアウトの進み具合は <code>kubectl rollout status<\/code> で確かめます。新しいバージョンに問題があったときは、<code>kubectl rollout undo<\/code> で前のリビジョンに戻せます。<\/p>\n<ol class=\"sk-flow\"><li><strong>更新する<\/strong><br><code>kubectl set image<\/code><\/li><li><strong>見守る<\/strong><br><code>kubectl rollout status<\/code><\/li><li><strong>問題があれば戻す<\/strong><br><code>kubectl rollout undo<\/code><\/li><\/ol>\n<pre><code>$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web<\/code><\/pre>\n<div class=\"sk-callout tip\"><p>更新したら、まず <code>rollout status<\/code> で最後まで入れ替わったかを見届けます。入れ替わったあとに不具合が見つかったら、原因を調べる前に <code>rollout undo<\/code> で元に戻すと、利用者への影響を小さくできます。<\/p><\/div>", "check": {"id": "q-ch1-s2-07", "type": "fill", "prompt": "Deployment web を前のリビジョンに戻すコマンドは <code>kubectl rollout ____ deployment/web<\/code> です。空欄に入る語を答えてください。", "code": null, "options": [], "answer": ["undo"], "explanation": "<code>kubectl rollout undo<\/code> で、Deployment を前のリビジョンに戻せます。", "hint": "「元に戻す」を英語で言うと何でしょうか。"}}, {"id": "i4", "type": "example", "title": "<code>replicas: 3<\/code> で動いている Deployment の <code>replicas<\/code> を 5 に変えました。ロールアウトは始まりますか。", "body": "<ol class=\"sk-steps\"><li><p>変えたのは <code>replicas<\/code>、つまり Pod の数です。<\/p><\/li><li><p>Pod のひな形 <code>.spec.template<\/code> は変わっていません。<\/p><\/li><li><p>ロールアウトが始まるのはひな形が変わったときだけなので、<strong>ロールアウトは始まりません<\/strong>。今の ReplicaSet が Pod を5つに増やします。<\/p><div class=\"sk-cells\" data-label=\"同じ ReplicaSet の Pod が 3 → 5 に増える\"><span>Pod<\/span><span>Pod<\/span><span>Pod<\/span><span class=\"on\">Pod<\/span><span class=\"on\">Pod<\/span><\/div><\/li><\/ol>", "check": {"id": "q-ch1-s2-09", "type": "truefalse", "prompt": "Deployment のコンテナイメージのタグを変えると、新しい ReplicaSet が作られる。", "code": null, "options": [], "answer": true, "explanation": "イメージのタグは Pod のひな形（<code>.spec.template<\/code>）の一部です。ひな形が変わるとロールアウトが始まり、新しい ReplicaSet が作られます。"}}]}], "exercise": [{"id": "q-ch1-ex-01", "type": "choice", "prompt": "実務でアプリを Kubernetes 上で動かすとき、Pod は通常どのように作りますか。", "code": null, "options": ["Pod のマニフェストを書いて、Pod を直接作る", "Deployment などのワークロードリソースに Pod を作らせる", "ノードにログインして docker run を実行する", "kubectl exec でコンテナを追加する"], "answer": 1, "explanation": "Pod は使い捨てを前提にしており、消えても自動では作り直されません。そのため通常は Deployment などのワークロードリソースに Pod を作らせ、管理を任せます。", "refs": ["ch1-s1#i4", "ch1-s2#i1"]}, {"id": "q-ch1-ex-02", "type": "choice", "prompt": "同じ Pod に入ったコンテナどうしが共有するものの組み合わせとして正しいものはどれですか。", "code": null, "options": ["ネットワークとストレージ", "コンテナイメージとタグ", "Deployment と ReplicaSet", "マニフェストと kubectl の設定"], "answer": 0, "explanation": "同じ Pod のコンテナは、ネットワークとストレージを共有します。ネットワークを共有しているので、<code>localhost<\/code> で互いに通信できます。", "refs": ["ch1-s1#i2"]}, {"id": "q-ch1-ex-03", "type": "predict", "prompt": "Deployment を使わず、Pod のマニフェストで直接作った Pod web を、次のように削除しました。最後のコマンドを実行したとき、web はどうなっていますか。", "code": "$ kubectl apply -f web-pod.yaml\n$ kubectl delete pod web\n$ kubectl get pods", "options": ["一覧に web は出てこない（作り直されない）", "同じ名前の web が自動で作り直されている", "web が Pending のまま残っている", "削除できずに Running のまま残っている"], "answer": 0, "explanation": "Pod 自体には、消えたときに自分を作り直す仕組みがありません。直接作った Pod は、作り直すコントローラーがないので、削除したらそれきりです。作り直しが必要なら Deployment などに Pod を作らせます。", "refs": ["ch1-s1#i4"]}, {"id": "q-ch1-ex-04", "type": "choice", "prompt": "1つの Pod に入れられるコンテナの数として正しいものはどれですか。", "code": null, "options": ["必ず1つ", "1つ以上", "2つまで", "0個でもよい"], "answer": 1, "explanation": "Pod は1つ以上のコンテナのグループです。1つだけのこともあれば、複数のコンテナをまとめることもあります。", "refs": ["ch1-s1#i1"]}, {"id": "q-ch1-ex-05", "type": "order", "prompt": "Deployment でアプリを動かしたときの管理の関係を、管理する側（上位）から順に並べてください。", "code": null, "options": ["Pod", "Deployment", "コンテナ", "ReplicaSet"], "answer": ["Deployment", "ReplicaSet", "Pod", "コンテナ"], "explanation": "Deployment が ReplicaSet を作り、ReplicaSet が指定数の Pod を維持します。コンテナは Pod の中で動きます。", "refs": ["ch1-s2#i1", "ch1-s1#i1"]}, {"id": "q-ch1-ex-06", "type": "predict", "prompt": "nginx:1.26 で動いていた Deployment web に、次のコマンドを順に実行しました。最後のコマンドのあと、web の Pod はどうなりますか。", "code": "$ kubectl set image deployment/web web=nginx:1.27\n$ kubectl rollout status deployment/web\n$ kubectl rollout undo deployment/web", "options": ["nginx:1.26 のコンテナで動く Pod に戻る", "Deployment ごと削除され、Pod がなくなる", "nginx:1.27 のまま、Pod が再起動される", "Pod は停止したまま、手動の再開を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> は Deployment を前のリビジョンに戻します。直前のリビジョンは nginx:1.26 なので、nginx:1.26 で動く Pod に戻ります。", "refs": ["ch1-s2#i3"]}, {"id": "q-ch1-ex-07", "type": "predict", "prompt": "replicas: 3 で動いている Deployment の replicas を 5 に変えて適用しました。どうなりますか。", "code": "$ kubectl scale deployment/web --replicas=5", "options": ["今の ReplicaSet のまま、Pod が5つに増える", "新しい ReplicaSet が作られ、Pod がすべて入れ替わる", "Deployment が作り直される", "ロールアウトが始まり、前のリビジョンが保存される"], "answer": 0, "explanation": "<code>replicas<\/code> を変えるだけのスケールでは、ロールアウトは起きません。今の ReplicaSet が Pod の数を5つに増やします。新しい ReplicaSet が作られるのは、Pod のひな形が変わったときです。", "refs": ["ch1-s2#i2"]}, {"id": "q-ch1-ex-08", "type": "order", "prompt": "Deployment のコンテナイメージを v1 から v2 に変えたときのロールアウトの流れを、起きる順に並べてください。", "code": null, "options": ["新しい Pod が増え、古い Pod が減っていく", ".spec.template のイメージを v2 に変える", "古い ReplicaSet の Pod が 0 になる", "新しい ReplicaSet が作られる"], "answer": [".spec.template のイメージを v2 に変える", "新しい ReplicaSet が作られる", "新しい Pod が増え、古い Pod が減っていく", "古い ReplicaSet の Pod が 0 になる"], "explanation": "Pod のひな形を変えるとロールアウトが始まり、新しい ReplicaSet が作られます。新しい Pod が増えるのに合わせて古い Pod が減り、最後は古い ReplicaSet の Pod が 0 になります。", "refs": ["ch1-s2#i2"]}, {"id": "q-ch1-ex-09", "type": "choice", "prompt": "イメージを更新したあと、ロールアウトが終わったかどうかを確かめるコマンドはどれですか。", "code": null, "options": ["kubectl rollout status deployment/web", "kubectl rollout undo deployment/web", "kubectl logs deployment/web --previous", "kubectl scale deployment/web --replicas=0"], "answer": 0, "explanation": "<code>kubectl rollout status<\/code> で、ロールアウトの進み具合と完了を確認できます。<code>rollout undo<\/code> は前のリビジョンに戻すコマンドです。", "refs": ["ch1-s2#i3"]}, {"id": "q-ch1-ex-10", "type": "truefalse", "prompt": "<code>kubectl scale<\/code> で Deployment の Pod の数を減らすと、ロールアウトが始まる。", "code": null, "options": [], "answer": false, "explanation": "<code>kubectl scale<\/code> は Pod の数を変えるスケールです。Pod のひな形（<code>.spec.template<\/code>）は変わらないので、ロールアウトは始まりません。", "refs": ["ch1-s2#i2"]}]}, {"id": "ch2", "title": "Pod のトラブルシューティング", "sections": [{"id": "ch2-s1", "title": "Pod の状態を読む", "prerequisites": ["ch1-s2"], "keyPoints": ["まず <code>STATUS<\/code> と <code>RESTARTS<\/code> を見る", "phase は Pending・Running・Succeeded・Failed・Unknown の5つ", "CrashLoopBackOff は起動と異常終了の繰り返し、ImagePullBackOff はイメージ取得の失敗"], "sources": ["F-007", "F-008", "F-009", "F-010", "F-014", "F-016", "F-017"], "items": [{"id": "i1", "title": "まず STATUS と RESTARTS を見る", "body": "<p>Pod の様子は <code>kubectl get pods<\/code> で確認します。最初に見るのは <code>STATUS<\/code> 列と <code>RESTARTS<\/code> 列です。<\/p>\n<pre><code>$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\nweb-7c9d8f6b5-x2k4p   1/1     Running            0             12m\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m\nbatch-6d7e8f9a0-z9y8  0/1     Pending            0             3m<\/code><\/pre>\n<dl class=\"sk-terms\"><div><dt>STATUS<\/dt><dd>Pod の状態。phase（次の項目）のほか、CrashLoopBackOff などの値も出る<\/dd><\/div><div><dt>RESTARTS<\/dt><dd>コンテナが再起動した回数。異常終了を繰り返すと増えていく<\/dd><\/div><\/dl>\n<p>上の出力では、web は Running で再起動は 0 回です。api は CrashLoopBackOff で、再起動を 5 回繰り返しています。batch は Pending のままです。<\/p>", "check": {"id": "q-ch2-s1-07", "type": "fill", "prompt": "<code>kubectl get pods<\/code> の出力で、コンテナが再起動した回数を示す列の名前を答えてください。", "code": null, "options": [], "answer": ["RESTARTS"], "explanation": "<code>RESTARTS<\/code> 列はコンテナの再起動回数です。CrashLoopBackOff の Pod では、この数が増えていきます。", "hint": "出力の列名を、英語のまま答えます。「再起動」は英語で restart です。"}}, {"id": "i2", "title": "phase は5つ", "body": "<p>Pod のライフサイクルは <strong>phase<\/strong> という値で表します。phase は次の5つだけです。意味で分けると、図のように4つのグループになります。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Pod の phase を、まだ動いていない・動いている・終わった・分からないの4つに分けた図\">\n<rect x=\"10\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"175\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"340\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<rect x=\"505\" y=\"40\" width=\"150\" height=\"150\" rx=\"12\" class=\"sk-fill-muted\"/>\n<text x=\"85\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">まだ動いていない<\/text>\n<text x=\"250\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">動いている<\/text>\n<text x=\"415\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">終わった<\/text>\n<text x=\"580\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">分からない<\/text>\n<rect x=\"25\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" class=\"sk-fill-mark\"/><text x=\"85\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-dark\">Pending<\/text>\n<text x=\"85\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">スケジュール待ちや<\/text>\n<text x=\"85\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">イメージ取得中も含む<\/text>\n<rect x=\"190\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" class=\"sk-fill-accent\"/><text x=\"250\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">Running<\/text>\n<text x=\"250\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">少なくとも1つの<\/text>\n<text x=\"250\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">コンテナが動いている<\/text>\n<rect x=\"355\" y=\"56\" width=\"120\" height=\"32\" rx=\"16\" class=\"sk-fill-primary\"/><text x=\"415\" y=\"78\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Succeeded<\/text>\n<text x=\"415\" y=\"106\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">すべて正常に終了<\/text>\n<rect x=\"355\" y=\"124\" width=\"120\" height=\"32\" rx=\"16\" class=\"sk-fill-warn\"/><text x=\"415\" y=\"146\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">Failed<\/text>\n<text x=\"415\" y=\"174\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">少なくとも1つが失敗<\/text>\n<rect x=\"520\" y=\"62\" width=\"120\" height=\"36\" rx=\"18\" stroke-width=\"1.5\" class=\"sk-fill-surface sk-stroke\"/><text x=\"580\" y=\"86\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text\">Unknown<\/text>\n<text x=\"580\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">Pod の状態を<\/text>\n<text x=\"580\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" class=\"sk-text-muted\">取得できない<\/text>\n<\/svg><figcaption>図 2-1-1　Pod の phase を意味で分けたもの<\/figcaption><\/figure>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge warn\">Pending<\/span><span>クラスタには受け入れられたが、コンテナがまだ動く状態になっていない。ノードへのスケジュール待ちや、イメージのダウンロード中もここに含まれる<\/span><\/div><div><span class=\"sk-badge ok\">Running<\/span><span>ノードに割り当てられ、少なくとも1つのコンテナが動いている<\/span><\/div><div><span class=\"sk-badge info\">Succeeded<\/span><span>すべてのコンテナが正常に終了し、再起動しない<\/span><\/div><div><span class=\"sk-badge err\">Failed<\/span><span>すべてのコンテナが終了し、少なくとも1つが失敗で終わった<\/span><\/div><div><span class=\"sk-badge info\">Unknown<\/span><span>Pod の状態を取得できない<\/span><\/div><\/div>", "check": {"id": "q-ch2-s1-05", "type": "choice", "prompt": "Pod の phase が Succeeded のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが正常に終了し、再起動しない", "少なくとも1つのコンテナが動いている", "コンテナがまだ動く状態になっていない", "Pod の状態を取得できない"], "answer": 0, "explanation": "Succeeded は、すべてのコンテナが正常に終了し、再起動しない phase です。少なくとも1つのコンテナが動いているのは Running です。"}}, {"id": "i3", "title": "CrashLoopBackOff と ImagePullBackOff", "body": "<p><code>STATUS<\/code> 列には phase 以外の値も出ます。トラブルのときによく見るのは次の2つです。<\/p>\n<div class=\"sk-badge-list\"><div><span class=\"sk-badge err\">CrashLoopBackOff<\/span><span>コンテナが起動しては異常終了することを繰り返し、再起動までの待ち時間を延ばしながら再起動が続いている。<code>RESTARTS<\/code> が増えていく<\/span><\/div><div><span class=\"sk-badge err\">ImagePullBackOff<\/span><span>コンテナイメージを取得できず、取得の再試行を待っている。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こる<\/span><\/div><\/div>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 600 190\" role=\"img\" aria-label=\"CrashLoopBackOff では、起動・異常終了・待つ・再起動を繰り返す\">\n<defs><marker id=\"ah-crash\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-primary\"/><\/marker><\/defs>\n<rect x=\"20\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-accent\"/><text x=\"95\" y=\"71\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">起動する<\/text>\n<rect x=\"225\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-warn\"/><text x=\"300\" y=\"71\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">すぐ異常終了<\/text>\n<rect x=\"430\" y=\"40\" width=\"150\" height=\"50\" rx=\"10\" class=\"sk-fill-surface\"/><text x=\"505\" y=\"64\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">待つ<\/text><text x=\"505\" y=\"82\" text-anchor=\"middle\" font-size=\"11\" class=\"sk-text-muted\">待ち時間は毎回のびる<\/text>\n<path d=\"M172 65H220\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<path d=\"M377 65H425\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<path d=\"M505 92C505 160 95 160 95 96\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-crash)\"/>\n<text x=\"300\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-primary\">再起動（RESTARTS が 1 増える）<\/text>\n<\/svg><figcaption>図 2-1-2　CrashLoopBackOff：起動と異常終了を繰り返している<\/figcaption><\/figure>\n<div class=\"sk-callout warn\"><p><code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出ますが、phase ではありません。phase は Pending、Running、Succeeded、Failed、Unknown の5つだけです。<\/p><\/div>", "check": {"id": "q-ch2-s1-01", "type": "choice", "prompt": "次のうち、Pod の phase ではないものはどれですか。", "code": null, "options": ["Pending", "Running", "CrashLoopBackOff", "Succeeded"], "answer": 2, "explanation": "phase は Pending、Running、Succeeded、Failed、Unknown の5つです。<code>CrashLoopBackOff<\/code> は <code>STATUS<\/code> 列に出る値ですが、phase ではありません。"}}]}, {"id": "ch2-s2", "title": "describe と logs で原因を探す", "prerequisites": ["ch2-s1"], "keyPoints": ["見つける → 調べる → 直す → 確かめる の順に進める", "Pending は <code>describe<\/code> の <code>Events<\/code>、CrashLoopBackOff は <code>logs --previous<\/code>", "原因を直したら、Running になったことを必ず確かめる"], "sources": ["F-004", "F-011", "F-012", "F-013", "F-018"], "items": [{"id": "i1", "title": "見つける → 調べる → 直す → 確かめる", "body": "<p><code>STATUS<\/code> で様子が分かったら、次は原因を探して直します。全体の流れは次のとおりです。<\/p>\n<ol class=\"sk-flow\"><li><strong>見つける<\/strong><br><code>kubectl get pods<\/code> で問題のある Pod と STATUS を確認<\/li><li><strong>調べる<\/strong><br><code>describe<\/code> や <code>logs<\/code> で原因を探す<\/li><li><strong>直す<\/strong><br>原因を直したマニフェストを適用<\/li><li><strong>確かめる<\/strong><br><code>kubectl get pods<\/code> で Running を確認<\/li><\/ol>\n<p>このうち「調べる」で使うコマンドは主に2つあり、どちらを先に見るかは Pod の状態で変わります。次の2つの項目で順に見ていきます。<\/p>", "check": {"id": "q-ch2-s2-03", "type": "order", "prompt": "Pod の不具合を調べて直すときの手順を、正しい順に並べてください。", "code": null, "options": ["原因を直したマニフェストを適用する", "kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl get pods で Pod が Running になったことを確かめる", "kubectl describe pod で Events を確認する"], "answer": ["kubectl get pods で問題のある Pod と STATUS を確認する", "kubectl describe pod で Events を確認する", "原因を直したマニフェストを適用する", "kubectl get pods で Pod が Running になったことを確かめる"], "explanation": "まず <code>kubectl get pods<\/code> で問題のある Pod を見つけ、<code>kubectl describe pod<\/code> の <code>Events<\/code> で原因を探します。原因を直したマニフェストを適用したら、最後にもう一度 <code>kubectl get pods<\/code> で Running になったことを確かめます。"}}, {"id": "i2", "title": "Pending は describe の Events を見る", "body": "<p><code>kubectl describe pod<\/code> は、Pod の設定と状態の詳細を表示します。出力の最後にある <code>Events<\/code> には、スケジュールやイメージ取得の結果など、Pod に起きた出来事が時系列で並びます。<\/p>\n<figure class=\"sk-figure\"><svg viewBox=\"0 0 640 170\" role=\"img\" aria-label=\"ノードに CPU やメモリの空きがないと、Pod は Pending のままになる\">\n<defs><marker id=\"ah-pending\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" class=\"sk-fill-primary\"/><\/marker><\/defs>\n<rect x=\"10\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-primary\"/><text x=\"95\" y=\"63\" text-anchor=\"middle\" font-size=\"15\" class=\"sk-text-on\">Pod を作る<\/text>\n<rect x=\"235\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-surface\"/><text x=\"320\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">割り当てるノードを<\/text><text x=\"320\" y=\"74\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text\">探す<\/text>\n<rect x=\"460\" y=\"30\" width=\"170\" height=\"54\" rx=\"10\" class=\"sk-fill-warn\"/><text x=\"545\" y=\"55\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">CPU・メモリの<\/text><text x=\"545\" y=\"74\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-on\">空きがない<\/text>\n<path d=\"M182 57H230\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-pending)\"/>\n<path d=\"M407 57H455\" stroke-width=\"2\" fill=\"none\" class=\"sk-stroke-primary\" marker-end=\"url(#ah-pending)\"/>\n<text x=\"320\" y=\"124\" text-anchor=\"middle\" font-size=\"14\" class=\"sk-text-warn\">Pod は Pending のまま（コンテナは動いていない）<\/text>\n<text x=\"320\" y=\"150\" text-anchor=\"middle\" font-size=\"13\" class=\"sk-text-muted\">理由は describe の Events に FailedScheduling として出る<\/text>\n<\/svg><figcaption>図 2-2-1　空きのあるノードがないと、Pod は Pending のまま進まない<\/figcaption><\/figure>\n<pre><code>$ kubectl describe pod batch-6d7e8f9a0-z9y8\n...\nEvents:\n  Type     Reason            Age   From               Message\n  ----     ------            ----  ----               -------\n  Warning  FailedScheduling  3m    default-scheduler  0/3 nodes are available: 3 Insufficient cpu.<\/code><\/pre>\n<p>Pending のまま進まない Pod の原因の多くは、CPU やメモリの空きが足りず、ノードに割り当てられないことです。上の例では、3つのノードすべてで CPU が足りないと出ています。コンテナがまだ動いていないので、ログからは手がかりを得られません。<\/p>", "check": {"id": "q-ch2-s2-04", "type": "choice", "prompt": "<code>kubectl describe pod<\/code> の出力で、スケジュールやイメージ取得など Pod に起きた出来事が時系列で並ぶのはどこですか。", "code": null, "options": ["Events", "Labels", "Annotations", "Volumes"], "answer": 0, "explanation": "<code>kubectl describe pod<\/code> の出力の最後にある <code>Events<\/code> に、Pod に起きた出来事が時系列で並びます。"}}, {"id": "i3", "title": "CrashLoopBackOff は logs --previous を見る", "body": "<p><code>kubectl logs<\/code> は、コンテナの標準出力と標準エラー出力を表示します。<code>--previous<\/code>（短縮形は <code>-p<\/code>）を付けると、<strong>前回終了したコンテナ<\/strong>のログを表示します。<\/p>\n<div class=\"sk-cells\" data-label=\"--previous で見るのは、直前に異常終了したコンテナのログ\"><span class=\"dim\">1回目<\/span><span class=\"dim\">2回目<\/span><span class=\"on\">前回<\/span><span>いま<\/span><\/div>\n<p>CrashLoopBackOff の Pod では、いま動いているコンテナはすぐ終了してしまいます。異常終了する前にアプリが出したメッセージは、前回のコンテナのログに残っています。<\/p>\n<pre><code>$ kubectl logs api-5f6c7d8e9-q1w2e --previous<\/code><\/pre>\n<div class=\"sk-callout tip\"><p>CrashLoopBackOff の Pod を <code>kubectl delete pod<\/code> で消しても、Deployment の Pod なら同じひな形から作り直されるので、同じ状態に戻ります。消す前にログで原因を確かめましょう。<\/p><\/div>", "check": {"id": "q-ch2-s2-01", "type": "fill", "prompt": "再起動を繰り返しているコンテナについて、前回終了したコンテナのログを見たいときは <code>kubectl logs &lt;Pod名&gt; ____<\/code> とします。空欄に入るオプションを答えてください。", "code": null, "options": [], "answer": ["--previous", "-p"], "explanation": "<code>kubectl logs<\/code> に <code>--previous<\/code>（短縮形 <code>-p<\/code>）を付けると、前回終了したコンテナのログを表示します。", "hint": "「前の」という意味の英単語がオプション名です。"}}, {"id": "i4", "type": "example", "title": "Pending のままの Pod と、CrashLoopBackOff の Pod があります。それぞれ、最初に何を見ればよいですか。", "body": "<ol class=\"sk-steps\"><li><p>Pending の Pod は、コンテナがまだ動いていません。ログはまだないので、<code>kubectl describe pod<\/code> の <code>Events<\/code> を見ます。<\/p><\/li><li><p>CrashLoopBackOff の Pod は、コンテナが起動してはすぐ終了します。前回終了したコンテナのログを <code>kubectl logs --previous<\/code> で見ます。<\/p><\/li><li><p>まとめると次のとおりです。<\/p><div class=\"sk-compare\"><div><h4>Pending のまま<\/h4><ul><li>ノードに割り当てられていないことが多い<\/li><li>コンテナが動いていないので、ログからは手がかりを得られない<\/li><li><code>kubectl describe pod<\/code> の <code>Events<\/code> を見る<\/li><\/ul><\/div><div><h4>CrashLoopBackOff<\/h4><ul><li>コンテナは起動するが、すぐ異常終了する<\/li><li>いま動いているコンテナはすぐ終了してしまう<\/li><li><code>kubectl logs --previous<\/code> で前回のログを見る<\/li><\/ul><\/div><\/div><\/li><\/ol>", "check": {"id": "q-ch2-s2-08", "type": "truefalse", "prompt": "STATUS が ImagePullBackOff の Pod は、コンテナイメージを取得できておらずコンテナが動いていないので、まず <code>kubectl describe pod<\/code> の <code>Events<\/code> を確認するのがよい。", "code": null, "options": [], "answer": true, "explanation": "ImagePullBackOff の Pod はコンテナイメージを取得できていないので、コンテナは動いておらず、ログもありません。<code>Events<\/code> には、どのイメージの取得に失敗したかなど、Pod に起きた出来事が並びます。"}}]}], "exercise": [{"id": "q-ch2-ex-01", "type": "choice", "prompt": "次の出力の Pod について、正しい説明はどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS      AGE\napi-5f6c7d8e9-q1w2e   0/1     CrashLoopBackOff   5 (40s ago)   4m", "options": ["コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod を割り当てるノードがまだ決まっていない", "コンテナは正常に動いている"], "answer": 0, "explanation": "<code>CrashLoopBackOff<\/code> は、コンテナが起動しては異常終了することを繰り返し、待ち時間を延ばしながら再起動が続いている状態です。<code>RESTARTS<\/code> が 5 になっていることからも、再起動を繰り返していると分かります。", "refs": ["ch2-s1#i3", "ch2-s1#i1"]}, {"id": "q-ch2-ex-02", "type": "predict", "prompt": "存在しないタグを指定して Pod を作りました。数分後に <code>kubectl get pods<\/code> を実行したとき、<code>STATUS<\/code> 列に出る値として最も可能性が高いものはどれですか。", "code": "$ kubectl run web --image=nginx:9.99-not-exist\n（数分待つ）\n$ kubectl get pods", "options": ["Running", "ImagePullBackOff", "CrashLoopBackOff", "Completed"], "answer": 1, "explanation": "指定したタグのイメージが存在しないため、コンテナイメージを取得できません。取得に失敗して再試行を待っている間、<code>STATUS<\/code> には <code>ImagePullBackOff<\/code> が出ます。", "refs": ["ch2-s1#i3"]}, {"id": "q-ch2-ex-03", "type": "fill", "prompt": "クラスタに受け入れられたものの、ノードへのスケジュール待ちやイメージのダウンロード中で、コンテナがまだ動いていない Pod の phase を答えてください。", "code": null, "options": [], "answer": ["Pending"], "explanation": "Pending は、Pod がクラスタに受け入れられたものの、コンテナがまだ動く状態になっていない phase です。スケジュール待ちやイメージのダウンロード中もここに含まれます。", "refs": ["ch2-s1#i2"]}, {"id": "q-ch2-ex-04", "type": "choice", "prompt": "次の出力の Pod について、原因として最も考えられるものはどれですか。", "code": "$ kubectl get pods\nNAME                  READY   STATUS             RESTARTS   AGE\nweb-6d8f7c9b5-k3m2n   0/1     ImagePullBackOff   0          2m", "options": ["イメージ名やタグの書き間違い", "ノードの CPU の空きが足りない", "アプリが起動直後に異常終了している", "同じ Pod のコンテナが localhost で通信できない"], "answer": 0, "explanation": "<code>ImagePullBackOff<\/code> は、コンテナイメージを取得できずに再試行を待っている状態です。イメージ名やタグの書き間違い、非公開レジストリの認証情報の不足などで起こります。", "refs": ["ch2-s1#i3"]}, {"id": "q-ch2-ex-05", "type": "choice", "prompt": "Pod の phase が Failed のとき、正しい説明はどれですか。", "code": null, "options": ["すべてのコンテナが終了し、少なくとも1つが失敗で終わった", "コンテナが起動と異常終了を繰り返している", "コンテナイメージを取得できていない", "Pod をノードに割り当てられていない"], "answer": 0, "explanation": "Failed は、すべてのコンテナが終了し、少なくとも1つが失敗で終わった phase です。起動と異常終了の繰り返しは CrashLoopBackOff で、phase ではありません。", "refs": ["ch2-s1#i2"]}, {"id": "q-ch2-ex-06", "type": "choice", "prompt": "Pending のまま進まない Pod の原因を探すとき、最初に確認するものとして適切なのはどれですか。", "code": null, "options": ["kubectl describe pod の Events", "kubectl logs の出力", "kubectl exec で入ったコンテナの中のファイル", "kubectl rollout undo の結果"], "answer": 0, "explanation": "Pending のまま進まない Pod は、ノードに割り当てられていないことがよくあります。その場合コンテナは動いていないので、ログからは手がかりを得られません。<code>kubectl describe pod<\/code> の <code>Events<\/code> に出るスケジューラのメッセージを確認します。", "refs": ["ch2-s2#i2"]}, {"id": "q-ch2-ex-07", "type": "choice", "prompt": "ある Pod の <code>kubectl describe pod<\/code> の <code>Events<\/code> に次の行がありました。この Pod の <code>STATUS<\/code> として最も考えられるものはどれですか。", "code": "Warning  FailedScheduling  2m  default-scheduler  0/3 nodes are available: 3 Insufficient memory.", "options": ["Pending", "CrashLoopBackOff", "ImagePullBackOff", "Running"], "answer": 0, "explanation": "<code>FailedScheduling<\/code> は、ノードのメモリが足りず、Pod をどのノードにも割り当てられなかったことを示します。コンテナはまだ動いていないので、Pod は Pending のままです。", "refs": ["ch2-s2#i2", "ch2-s1#i2"]}, {"id": "q-ch2-ex-08", "type": "choice", "prompt": "<code>kubectl logs<\/code> で表示されるものはどれですか。", "code": null, "options": ["コンテナが標準出力と標準エラー出力に書いたログ", "Pod に起きた出来事（Events）", "ノードの CPU とメモリの空き", "Deployment のリビジョンの一覧"], "answer": 0, "explanation": "<code>kubectl logs<\/code> は、コンテナが標準出力と標準エラー出力に書いたログを表示します。Pod に起きた出来事は <code>kubectl describe pod<\/code> の <code>Events<\/code> で見ます。", "refs": ["ch2-s2#i3"]}, {"id": "q-ch2-ex-09", "type": "choice", "prompt": "CrashLoopBackOff の Pod の原因を調べるとき、アプリが異常終了する前に出したメッセージを見るのに適したコマンドはどれですか。", "code": null, "options": ["kubectl logs <Pod名> --previous", "kubectl rollout status deployment/web", "kubectl get pods", "kubectl scale deployment/web --replicas=1"], "answer": 0, "explanation": "CrashLoopBackOff の Pod では、いま動いているコンテナはすぐ終了してしまいます。<code>--previous<\/code> を付けて、前回終了したコンテナのログを見ます。", "refs": ["ch2-s2#i3"]}, {"id": "q-ch2-ex-10", "type": "truefalse", "prompt": "phase が Running の Pod では、Pod の中のすべてのコンテナが動いている。", "code": null, "options": [], "answer": false, "explanation": "Running は、Pod がノードに割り当てられ、<strong>少なくとも1つ<\/strong>のコンテナが動いている phase です。すべてのコンテナが動いているとは限りません。", "refs": ["ch2-s1#i2"]}]}], "finalExam": [{"id": "q-final-01", "type": "choice", "prompt": "Deployment web のイメージを新しいタグに更新したところ、新しい Pod が CrashLoopBackOff になりました。まずサービスを元の状態に戻し、原因はそのあとで調べたいと考えています。最初に実行するコマンドとして適切なのはどれですか。", "code": null, "options": ["kubectl rollout undo deployment/web", "kubectl delete pod で CrashLoopBackOff の Pod を消す", "kubectl logs で新しい Pod のログを見る", "kubectl get pods を繰り返して回復を待つ"], "answer": 0, "explanation": "<code>kubectl rollout undo<\/code> で前のリビジョンに戻せば、動いていたイメージの Pod に戻ります。Pod を消しても ReplicaSet が同じひな形で作り直すため、同じ状態に戻ります。原因の調査は、元に戻したあとで行います。", "refs": ["ch1-s2#i3", "ch2-s1#i3"]}, {"id": "q-final-02", "type": "choice", "prompt": "Deployment web の <code>replicas<\/code> を 3 から 10 に増やしたところ、新しく増えた Pod の一部が Pending のまま進みません。その Pod に <code>kubectl describe pod<\/code> を実行し、<code>Events<\/code> に次の行を見つけました。この Pod について正しい見立てはどれですか。", "code": "Warning  FailedScheduling  3m  default-scheduler  0/3 nodes are available: 3 Insufficient cpu.", "options": ["どのノードも CPU の空きが足りず、Pod を割り当てられていない", "コンテナが起動直後に異常終了を繰り返している", "コンテナイメージのタグが存在しない", "Pod は動いているが、ログの出力が止まっている"], "answer": 0, "explanation": "<code>replicas<\/code> を増やすと ReplicaSet が Pod を追加で作りますが、<code>FailedScheduling<\/code> と <code>Insufficient cpu<\/code> は、CPU の空きがあるノードがなく、スケジューラが Pod をノードに割り当てられなかったことを示します。コンテナはまだ動いていないので、ログからは手がかりを得られません。", "refs": ["ch2-s2#i2", "ch1-s2#i2"]}, {"id": "q-final-03", "type": "order", "prompt": "Deployment のイメージのタグを書き間違え、新しい Pod が ImagePullBackOff になりました。調べて直すまでの手順を、正しい順に並べてください。", "code": null, "options": ["Deployment のイメージを正しいタグに更新する", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "kubectl get pods で新しい Pod が Running になったことを確かめる", "kubectl get pods で ImagePullBackOff の Pod を見つける"], "answer": ["kubectl get pods で ImagePullBackOff の Pod を見つける", "kubectl describe pod の Events で、取得に失敗したイメージ名を確認する", "Deployment のイメージを正しいタグに更新する", "kubectl get pods で新しい Pod が Running になったことを確かめる"], "explanation": "<code>kubectl get pods<\/code> で ImagePullBackOff の Pod を見つけ、<code>describe<\/code> の <code>Events<\/code> でどのイメージの取得に失敗したかを確かめます。Deployment の Pod のひな形を正しいタグに直すとロールアウトが始まり、新しい Pod が作られます。最後に Running になったことを確かめます。", "refs": ["ch2-s1#i3", "ch2-s2#i2", "ch1-s2#i2"]}, {"id": "q-final-04", "type": "fill", "prompt": "Deployment で動かしている Pod が CrashLoopBackOff になっていたので、<code>kubectl delete pod<\/code> で消しました。少しすると新しい Pod が作られ、その Pod もまた CrashLoopBackOff になりました。新しい Pod を作ったオブジェクトの名前を答えてください。", "code": null, "options": [], "answer": ["ReplicaSet", "レプリカセット"], "explanation": "Deployment が作った ReplicaSet は、指定された数の Pod を維持します。Pod が1つ減ると、ReplicaSet が同じひな形から新しい Pod を作ります。ひな形は変わっていないので、新しい Pod も同じ理由で異常終了を繰り返します。Pod を消すのではなく、<code>kubectl logs --previous<\/code> などで原因を調べます。", "refs": ["ch1-s2#i1", "ch2-s1#i3"]}], "factsheet": [{"id": "F-001", "claim": "Pod は Kubernetes で作成・管理できる最小のデプロイ単位で、1つ以上のコンテナのグループである", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-002", "claim": "同じ Pod のコンテナはストレージとネットワークを共有し、localhost で互いに通信できる", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-003", "claim": "Pod は使い捨て（比較的短命）を前提にしており、Pod 自体は自己修復しない。通常は直接作らず Deployment などのワークロードリソースで作る", "url": "https://kubernetes.io/docs/concepts/workloads/pods/", "rank": "S"}, {"id": "F-004", "claim": "Deployment は ReplicaSet を作り、ReplicaSet が指定数の Pod を維持する", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-005", "claim": "Deployment のロールアウトは .spec.template が変わったときだけ始まり、新しい ReplicaSet を作って Pod を順に入れ替える（既定の RollingUpdate）。スケールではロールアウトは起きない", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-006", "claim": "kubectl rollout undo で Deployment を前のリビジョンに戻せる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-007", "claim": "Pod の phase は Pending・Running・Succeeded・Failed・Unknown の5つ", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-008", "claim": "Pending はクラスタに受け入れられたがコンテナがまだ動く状態にない phase で、スケジュール待ちやイメージのダウンロード中を含む", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-009", "claim": "CrashLoopBackOff は phase ではなく、コンテナが起動と異常終了を繰り返し、kubelet が待ち時間を延ばしながら再起動している状態", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-010", "claim": "イメージを取得できないとき、Pod は ImagePullBackOff になり取得を再試行する。イメージ名の誤りや非公開レジストリの認証情報不足などで起こる", "url": "https://kubernetes.io/docs/concepts/containers/images/", "rank": "S"}, {"id": "F-011", "claim": "kubectl describe pod は Pod の詳細と Events を表示する。Pending のまま進まない Pod は、スケジューラのメッセージを Events で確認する", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-012", "claim": "Pending のまま進まない Pod の多くは、CPU やメモリの不足でノードに割り当てられていない", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-013", "claim": "kubectl logs の --previous（-p）は、前回終了したコンテナのログを表示する", "url": "https://kubernetes.io/docs/reference/kubectl/generated/kubectl_logs/", "rank": "S"}, {"id": "F-014", "claim": "kubectl get pods で Pod の一覧と状態を表示できる", "url": "https://kubernetes.io/docs/reference/kubectl/quick-reference/", "rank": "S"}, {"id": "F-015", "claim": "kubectl rollout status で Deployment のロールアウトの状況を確認できる", "url": "https://kubernetes.io/docs/concepts/workloads/controllers/deployment/", "rank": "S"}, {"id": "F-016", "claim": "phase の意味：Running は少なくとも1つのコンテナが動いている、Succeeded はすべてのコンテナが正常終了し再起動しない、Failed はすべてのコンテナが終了し少なくとも1つが失敗、Unknown は状態を取得できない", "url": "https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/", "rank": "S"}, {"id": "F-017", "claim": "kubectl get pods の RESTARTS 列はコンテナの再起動回数を示す", "url": "https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/", "rank": "S"}, {"id": "F-018", "claim": "コンテナが標準出力・標準エラー出力に書いたログは kubectl logs で見られる", "url": "https://kubernetes.io/docs/concepts/cluster-administration/logging/", "rank": "S"}, {"id": "F-019", "claim": "Kubernetes はコンテナ化されたワークロードとサービスを管理する、ポータブルで拡張可能なオープンソースのプラットフォームである", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-020", "claim": "Kubernetes は Google が2014年にオープンソース化したプロジェクトで、K8s と略される（K と s の間の8文字を数えた略記）", "url": "https://kubernetes.io/docs/concepts/overview/", "rank": "S"}, {"id": "F-021", "claim": "Docker はアプリケーションを開発・配布・実行するためのオープンなプラットフォームで、アプリをコンテナという隔離された環境で動かす", "url": "https://docs.docker.com/get-started/docker-overview/", "rank": "S"}, {"id": "F-022", "claim": "kubectl は Kubernetes API を使ってクラスタのコントロールプレーンと通信するコマンドラインツールである", "url": "https://kubernetes.io/docs/reference/kubectl/", "rank": "S"}, {"id": "F-023", "claim": "YAML は人が読み書きしやすいデータのシリアライズ（記述）言語である", "url": "https://yaml.org/", "rank": "S"}, {"id": "F-024", "cl
