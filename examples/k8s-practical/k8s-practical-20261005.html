    const schedule = [...waitingByDate.entries()].sort(([a], [b]) => (a < b ? -1 : 1))
      .map(([date, count]) => `${formatDue(date)} ${count}問`).join(" ・ ");
    return el("div", { class: "card review-card" }, [
      el("h3", { style: "margin-top:0", text: "📌 復習" }),
      overall.now
        ? el("div", { class: "todo-row" }, [
          el("div", {}, [el("strong", { text: "🔥 今すぐ解ける問題" }), " ", el("span", { class: "muted", text: `${overall.now}問` })]),
          el("button", { class: "btn go", text: "▶ 復習する", onclick: () => startRun("review") }),
        ])
        : el("div", { class: "todo-row" }, [el("span", { text: "今すぐ解ける復習はありません。" })]),
      schedule ? el("div", { class: "todo-row" }, [el("div", {}, [el("strong", { text: "⏳ 次に解けるようになる日" }), el("div", { class: "small", text: schedule })])]) : null,
      relearnFlowNote(),
    ]);
  }

  function sectionCard(section) {
    const summary = summarizeStates(section.questions);
    const done = summary.closed === summary.total;
    const started = summary.new < summary.total;
    let nodeClass = done ? "done" : summary.now ? "now" : started ? "learning" : "new";
    return el("button", { class: `section-card ${done ? "is-done" : ""}`, onclick: () => openSection(section.id), "aria-label": `${section.title}を開く` }, [
      el("div", { class: "section-card-head" }, [
        el("span", { class: `stage-node small ${nodeClass}`, text: done ? "★" : stageCode(section.id) }),
        el("span", { class: "section-card-title", text: section.title }),
      ]),
      questionDots(section.questions),
      el("div", { class: "state-line" }, stateSummaryLine(summary)),
    ]);
  }

  function bossCard() {
    const meta = content.meta;
    const unlocked = isFinalExamUnlocked();
    const summary = summarizeStates(finalExamQuestions);
    const done = finalExamQuestions.length > 0 && summary.closed === summary.total;
    return el("div", { class: "card world" }, [
      el("div", { class: "world-head" }, [
        el("div", {}, [el("span", { class: "pill gold", text: "BOSS" }), " ", el("span", { class: "world-title", text: "総合演習" })]),
        el("span", { class: "small muted", text: `クリア ${summary.closed}問／全 ${summary.total}問` }),
      ]),
      meter(summary.closed, summary.total),
      el("div", { class: "section-card-head", style: "margin-top:14px" }, [
        el("span", { class: `stage-node boss ${done ? "done" : unlocked ? "next" : ""}`, text: done ? "🏆" : unlocked ? "👑" : "🔒" }),
        el("div", {}, [
          unlocked ? questionDots(finalExamQuestions) : null,
          el("div", { class: "state-line" }, unlocked ? stateSummaryLine(summary) : [el("span", { class: "state-text new", text: "全ワールドをクリアすると解放されます" })]),
        ]),
      ]),
      el("div", { class: "btn-row" }, [
        unlocked && summary.new ? el("button", { class: "btn go", text: `👑 総合演習に挑戦（${summary.new}問）`, onclick: () => startRun("final") }) : null,
        meta.exam ? el("button", { class: "btn", text: `⏱ 模擬試験（${meta.exam.questionCount}問・${meta.exam.minutes}分）`, onclick: startExam }) : null,
      ]),
    ]);
  }

  function stat(label, value) {
    return el("div", { class: "stat" }, [el("div", { class: "label", text: label }), el("div", { class: "value", text: value })]);
  }
  function meter(done, total) {
    const percent = total ? Math.round((done / total) * 100) : 0;
    return el("div", { class: "meter", role: "progressbar", "aria-valuenow": String(percent), "aria-valuemin": "0", "aria-valuemax": "100" }, [
      el("span", { style: `width:${percent}%` }),
    ]);
  }

  // ===== 設定（学習履歴の書き出し・読み込み・削除） =====
  function renderSettings() {
    const resetButton = el("button", { class: "btn danger", text: "学習履歴を消す" });
    resetButton.addEventListener("click", () => {
      if (resetButton.dataset.armed) {
        progress = createEmptyProgress();
        saveProgress();
        run = null;
        showToast("学習履歴を消しました。");
        render();
      } else {
        resetButton.dataset.armed = "1";
        resetButton.textContent = "もう一度押すと消えます";
      }
    });
    app.append(el("h1", { text: "⚙ 設定" }));
    app.append(el("div", { class: "card" }, [
      el("h3", { style: "margin-top:0", text: "学習履歴" }),
      el("p", { class: "small muted", text: "学習履歴はこのブラウザにだけ保存されます。ブラウザを変えるときやデータを消す前に、書き出して控えを取ってください。" }),
      el("div", { class: "btn-row" }, [
        el("button", { class: "btn", text: "書き出す", onclick: exportProgress }),
        el("button", { class: "btn", text: "読み込む", onclick: () => document.getElementById("import-file").click() }),
        resetButton,
      ]),
    ]));
  }
  function exportProgress() {
    const blob = new Blob([JSON.stringify(progress, null, 2)], { type: "application/json" });
    const link = el("a", { href: URL.createObjectURL(blob), download: `study-kit_${content.meta.id}_${today()}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }
  document.getElementById("import-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (imported.contentId !== content.meta.id) {
        showToast(`別の教材の履歴です（${imported.contentId}）。読み込みませんでした。`);
        return;
      }
      progress = normalizeProgress(imported);
      saveProgress();
      run = null;
      showToast("学習履歴を読み込みました。");
      render();
    } catch (error) {
      showToast("学習履歴のファイルを読めませんでした。");
    }
  });

  // ===== 節のページ（問題への入口と本文） =====
  function renderSectionPage() {
    const section = sectionById.get(currentSectionId) || orderedSections[0];
    // 目次は常に出さず、ボタンを押すと左からスライドして出る
    const closeButton = el("button", { class: "close", "aria-label": "目次を閉じる", text: "✕" });
    const toc = el("nav", { class: "toc", id: "toc", "aria-label": "目次", inert: true }, [
      el("div", { class: "toc-head" }, [el("strong", { text: "目次" }), closeButton]),
      ...content.chapters.map((chapter) => el("div", {}, [
        el("div", { class: "chapter-title", text: chapter.title }),
        el("ol", {}, chapter.sections.map((s) => el("li", {}, [
          el("button", { class: `link-btn${s.id === section.id ? " active" : ""}`, onclick: () => openSection(s.id) }, [
            el("span", { class: `dot ${tocDotState(s)}` }), s.title,
          ]),
        ]))),
      ])),
    ]);
    const backdrop = el("div", { class: "toc-backdrop" });
    const toggleButton = el("button", { class: "btn primary toc-toggle", "aria-controls": "toc", "aria-expanded": "false" }, ["☰ 目次"]);
    const setTocOpen = (open) => {
      toc.classList.toggle("open", open);
      backdrop.classList.toggle("open", open);
      toc.inert = !open;
      toggleButton.setAttribute("aria-expanded", String(open));
      if (open) (toc.querySelector(".link-btn.active") || closeButton).focus({ preventScroll: true });
      else toggleButton.focus({ preventScroll: true });
    };
    toggleButton.addEventListener("click", () => setTocOpen(!toc.classList.contains("open")));
    closeButton.addEventListener("click", () => setTocOpen(false));
    backdrop.addEventListener("click", () => setTocOpen(false));
    keyHandler = (event) => { if (event.key === "Escape" && toc.classList.contains("open")) setTocOpen(false); };

    const sourceItems = (section.sources || []).map((factId) => factById.get(factId)).filter(Boolean).map((fact) => el("li", {}, [
      el("span", { class: "rank", text: fact.rank }),
      fact.claim + " ",
      el("a", { href: fact.url, target: "_blank", rel: "noopener", text: "出典" }),
    ]));

    const body = el("article", { class: "book-body" }, [
      el("div", {}, [el("span", { class: "pill", text: `STAGE ${stageCode(section.id)}` }), " ", el("span", { class: "small muted", text: chapterBySectionId.get(section.id).title })]),
      el("h2", { text: section.title }),
      sectionStatusBar(section),
      // インプット（本文）→ アウトプット（問題）の順に並べる
      el("div", { html: section.body }),
      challengeCard(section),
      sourceItems.length ? el("h3", { text: "参考出典" }) : null,
      sourceItems.length ? el("ul", { class: "sources" }, sourceItems) : null,
      el("div", { class: "btn-row" }, [nextSectionButton(section)]),
    ]);
    app.append(body, toggleButton, backdrop, toc);
  }
  // 節のページの先頭に置く、問題の状態の早見（本文を読み直さずに問題へ飛べる）
  function sectionStatusBar(section) {
    const summary = summarizeStates(section.questions);
    return el("div", { class: "status-bar" }, [
      questionDots(section.questions),
      el("div", { class: "state-line", style: "margin-top:0" }, stateSummaryLine(summary)),
      el("a", { class: "small", href: "#", onclick: (event) => {
        event.preventDefault();
        document.querySelector(".challenge").scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth" });
      }, text: "問題へ ↓" }),
    ]);
  }
  function tocDotState(section) {
    const summary = summarizeStates(section.questions);
    if (summary.closed === summary.total) return "done";
    if (summary.now) return "now";
    return summary.new === summary.total ? "new" : "learning";
  }
  // 節のページの末尾（本文のあと）に置く「この節の問題」カード
  function challengeCard(section) {
    const summary = summarizeStates(section.questions);
    const done = summary.closed === summary.total;
    let message;
    if (done) message = "🏆 この節はクリア済みです。";
    else if (summary.new === summary.total) message = "読んだ内容を、問題を解いて確かめましょう。思い出しながら解くと、読み返すより記憶に残ります。";
    else if (summary.now) message = "🔥 今すぐ解ける問題があります。";
    else if (summary.wait && !summary.new) message = `⏳ 残りの問題は ${formatDue(summary.nextDate)} から解けるようになります。`;
    else message = "";

    return el("div", { class: "card challenge" }, [
      el("div", { class: "world-head" }, [
        el("strong", { text: "🎮 この節の問題" }),
        el("span", { class: "small muted", text: `クリア ${summary.closed}問／全 ${summary.total}問` }),
      ]),
      questionDots(section.questions),
      el("div", { class: "state-line" }, stateSummaryLine(summary)),
      message ? el("p", { class: "small", text: message }) : null,
      summary.wait ? relearnFlowNote() : null,
      el("div", { class: "btn-row", style: "margin-top:4px" }, [
        summary.now ? el("button", { class: "btn go big", text: `🔥 今すぐ解ける問題（${summary.now}問）`, onclick: () => startRun("review", section.id) }) : null,
        summary.new ? el("button", { class: summary.now ? "btn big" : "btn go big", text: `▶ 未挑戦の問題に挑戦（${summary.new}問）`, onclick: () => startRun("section", section.id) }) : null,
      ]),
    ]);
  }
  function nextSectionButton(section) {
    const next = orderedSections[orderedSections.indexOf(section) + 1];
    return next ? el("button", { class: "btn", text: `次の節：${next.title} →`, onclick: () => openSection(next.id) }) : null;
  }

  // ===== 問題を解く（1回分） =====
  // kind: section（節の未挑戦の問題） / final（総合演習の未挑戦の問題）
  //       review（今すぐ解ける問題。sectionId があればその節だけ） / relearn（直前の回で間違えた問題）
  function startRun(kind, sectionId = null, explicitIds = null) {
    const scope = sectionId ? sectionById.get(sectionId).questions : [...questionById.values()];
    const ids = explicitIds || {
      section: () => newQuestionIds(scope),
      final: () => newQuestionIds(finalExamQuestions),
      review: () => shuffled(idsInState(scope, "now")),
    }[kind]();
    if (!ids.length) {
      showToast("いま解ける問題はありません。");
      return;
    }
    markActiveToday();
    run = { kind, sectionId, queue: ids, total: ids.length, answeredIds: [], wrongIds: [], answered: 0, correct: 0, closedCount: 0, percentBefore: progressPercent(), step: null };
    confettiPieces = [];
    currentView = "run";
    advanceRun();
  }
  function advanceRun() {
    run.step = run.queue.length ? { kind: "question", questionId: run.queue.shift() } : { kind: "result" };
    render();
  }
  function quitRun() {
    // 答えなかった問題は、そのままの状態で残る
    run = null;
    showView("home");
  }

  function renderRun() {
    if (!run) {
      currentView = "home";
      renderHome();
      return;
    }
    if (run.step.kind === "question") renderQuestionStep(run.step);
    else renderRunResult();
  }

  function renderQuestionStep(step) {
    const question = questionById.get(step.questionId);
    if (!step.view) step.view = buildQuestionView(question, getRecord(question.id).attempts > 0);

    const done = run.total - run.queue.length - 1;
    const dots = el("span", { class: "q-dots", "aria-label": `${done + 1}問目／${run.total}問` },
      Array.from({ length: run.total }, (_, i) => el("span", { class: i < done ? "done" : i === done ? "now" : "" })));

    app.append(el("div", { class: "card" }, [
      el("div", { class: "q-head" }, [
        el("span", { class: "pill", text: runLabel() }),
        sessionStats.combo >= 2 ? el("span", { class: "combo", text: `🔥 ${sessionStats.combo} COMBO` }) : null,
        dots,
      ]),
      renderQuestionBody(question, step.view, step.result, (response) => submitRunAnswer(step, question, response)),
      step.result ? el("div", { class: "btn-row" }, [
        el("button", { class: "btn go big", text: run.queue.length ? "次へ" : "結果を見る", onclick: advanceRun }),
        el("span", { class: "kbd-hint", text: "Enter で次へ" }),
      ]) : null,
    ]));
    app.append(el("div", { class: "btn-row" }, [el("button", { class: "btn", text: "中断してホームへ", onclick: quitRun })]));
  }

  // 回答後に「この問題は次にいつ出るか」を1行で伝える
  function nextChanceText(questionId) {
    const { state, date } = questionState(questionId);
    if (state === "closed") return "✅ この問題はクリアです。もう出題しません。";
    if (state === "now") return "🔥 このあと「再挑戦」ですぐにもう一度解けます（ここで正解しても、翌日以降にもう一度出題します）。";
    return `⏳ 次は ${formatDue(date)} 以降に出題します。`;
  }

  function submitRunAnswer(step, question, response) {
    const isCorrect = isAnswerCorrect(question, response);
    const before = getRecord(question.id);
    const after = applyAnswer(question.id, isCorrect, PAGE_SESSION_ID);
    run.answered += 1;
    run.answeredIds.push(question.id);
    if (isCorrect) {
      run.correct += 1;
      sessionStats.combo += 1;
      if (sessionStats.combo > progress.game.bestCombo) {
        progress.game.bestCombo = sessionStats.combo;
        saveProgress();
      }
    } else {
      sessionStats.combo = 0;
      run.wrongIds.push(question.id);
    }

    const closed = before.status !== "closed" && after.status === "closed";
    const closedAfterRelearning = closed && before.status === "learning";
    if (closed) run.closedCount += 1;

    step.result = { response, isCorrect, nextText: nextChanceText(question.id) };
    afterRender = () => {
      const feedback = app.querySelector(".feedback");
      if (!feedback) return;
      feedback.scrollIntoView({ block: "nearest", behavior: prefersReducedMotion ? "auto" : "smooth" });
      if (isCorrect) {
        celebrateAt(feedback);
        if (closed) floatText(feedback, `進捗 ${progressPercent()}%`);
      } else {
        app.querySelector(".card").classList.add("shake");
      }
      if (closedAfterRelearning) showToast("🏅 マスター！ つまずいた問題をクリアしました");
    };
    render();
  }

  function renderRunResult() {
    const perfect = run.wrongIds.length === 0;
    // 節（総合演習）の全問正解と教材のクリアは、大きなクラッカーで祝う（表示し直したときは繰り返さない）
    if (!run.celebrated && ((isStageRun(run.kind) && perfect) || (run.kind === "final" && isMaterialDone()))) {
      run.celebrated = true;
      afterRender = celebrateBig;
    }

    const title = {
      section: () => sectionById.get(run.sectionId).title,
      final: () => "総合演習",
      review: () => (run.sectionId ? `復習：${sectionById.get(run.sectionId).title}` : "復習"),
      relearn: () => "再挑戦",
    }[run.kind]();
    let message;
    if (run.kind === "section") message = perfect ? "全問正解！ この節の内容は身についています。" : "間違えた問題の解説を読み、本文の該当箇所を読み直しましょう。";
    else message = perfect ? "全問正解！" : "間違えた問題の解説を読んでおきましょう。";

    // この回で答えた問題が、次にいつ解けるか
    const answered = run.answeredIds.map((id) => questionById.get(id));
    const summary = summarizeStates(answered);
    const retryIds = idsInState(answered, "now");
    const next = run.kind === "section" ? orderedSections[orderedSections.indexOf(sectionById.get(run.sectionId)) + 1] : null;

    const buttons = [];
    if (retryIds.length) buttons.push(el("button", { class: "btn go big", text: `🔥 今すぐ再挑戦（${retryIds.length}問）`, onclick: () => startRun("relearn", null, shuffled(retryIds)) }));
    if (run.kind === "section" && !perfect) buttons.push(el("button", { class: "btn", text: "📖 この節の本文を読み直す", onclick: () => openSection(run.sectionId) }));
    if (run.kind === "section" && perfect && next) buttons.push(el("button", { class: "btn go big", text: `次の節：${next.title} →`, onclick: () => openSection(next.id) }));
    buttons.push(el("button", { class: "btn primary big", text: "🗺 ホームへ", onclick: () => { run = null; showView("home"); } }));

    const children = [
      el("div", { class: "center" }, [el("span", { class: `stamp ${perfect ? "perfect" : "clear"}`, text: perfect ? "PERFECT!" : "CLEAR" })]),
      el("h2", { class: "center", text: title }),
      el("div", { class: "result-tiles" }, [
        stat("正解", `${run.correct}／${run.answered}`),
        stat("✅ クリア", `+${run.closedCount}問`),
        stat("進捗", `${run.percentBefore}% → ${progressPercent()}%`),
      ]),
      el("p", { class: "center", style: "margin-top:14px", text: message }),
      summary.closed < summary.total ? el("div", { class: "card next-chance" }, [
        el("strong", { text: "この回の問題の次の出題" }),
        el("div", { class: "state-line" }, stateSummaryLine(summary)),
        relearnFlowNote(),
      ]) : null,
    ];
    for (const questionId of run.wrongIds) {
      const question = questionById.get(questionId);
      children.push(el("div", { class: "card miss-card" }, [
        el("div", { class: "q-prompt", style: "margin-top:0", html: question.prompt }),
        el("div", { class: "small" }, [el("strong", { text: "正解：" }), el("span", { style: "white-space:pre-line", text: describeCorrectAnswer(question) })]),
        el("div", { class: "small", html: question.explanation }),
        refLinks(question),
      ]));
    }
    children.push(el("div", { class: "btn-row", style: "justify-content:center" }, buttons));
    app.append(el("div", { class: "card" }, children));
    keyHandler = (event) => { if (event.key === "Enter") buttons[0].click(); };
  }

  function refLinks(question) {
    const refs = (question.refs || []).filter((id) => sectionById.has(id));
    if (!refs.length) return null;
    return el("div", { class: "small", style: "margin-top:8px" }, [
      "📖 教科書：",
      ...refs.flatMap((id, i) => [i ? "、" : "", el("button", { class: "link-btn", text: sectionLabel(id), onclick: () => openSection(id) })]),
    ]);
  }

  // 出題ごとの表示順。2回目以降は選択肢・並べ替え項目をシャッフルする
  function buildQuestionView(question, shuffleOptions) {
    if (question.type === "choice" || question.type === "predict") {
      const indexes = question.options.map((_, i) => i);
      return { optionOrder: shuffleOptions ? shuffled(indexes) : indexes, selected: null };
    }
    if (question.type === "order") {
      return { items: shuffleOptions ? shuffledAvoiding(question.options, question.answer) : question.options.slice() };
    }
    return { text: "" };
  }

  // キーボード操作：数字キーで選択肢、Enter で回答・次へ（keyHandler は render の先頭で宣言済み）
  document.addEventListener("keydown", (event) => {
    if (!keyHandler || event.isComposing) return;
    const tag = event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (tag === "BUTTON" && event.key === "Enter")) return;
    keyHandler(event);
  });

  // onSubmit(response) — response は「不明」のとき null
  function renderQuestionBody(question, view, result, onSubmit, options = {}) {
    const answered = Boolean(result);
    const container = el("div", {});
    container.append(el("div", { class: "q-prompt", html: question.prompt }));
    if (question.code) container.append(el("pre", {}, [el("code", { text: question.code })]));

    let readResponse;
    let selectByNumber = null;
    if (question.type === "choice" || question.type === "predict") {
      const select = (optionIndex) => {
        view.selected = optionIndex;
        optionButtons.forEach((b, i) => b.setAttribute("aria-pressed", String(view.optionOrder[i] === optionIndex)));
        submitButton.disabled = false;
      };
      const optionButtons = view.optionOrder.map((optionIndex, position) => {
        const classes = ["option"];
        if (answered && !options.hideAnswer) {
          if (optionIndex === question.answer) classes.push("is-answer");
          else if (result.response === optionIndex) classes.push("is-picked-wrong");
        }
        return el("button", {
          class: classes.join(" "),
          "aria-pressed": String(view.selected === optionIndex),
          disabled: answered,
          onclick: () => select(optionIndex),
        }, [el("span", { class: "mark", text: String(position + 1) }), el("span", { text: question.options[optionIndex] })]);
      });
      container.append(el("div", { class: "options" }, optionButtons));
      readResponse = () => view.selected;
      selectByNumber = (n) => { if (n >= 1 && n <= view.optionOrder.length) select(view.optionOrder[n - 1]); };
    } else if (question.type === "fill") {
      const input = el("input", { class: "fill-input", type: "text", value: answered && result.response !== null ? result.response : view.text, disabled: answered, placeholder: "答えを入力して Enter", "aria-label": "答え", autocomplete: "off", spellcheck: "false" });
      input.addEventListener("input", () => { view.text = input.value; submitButton.disabled = !input.value.trim(); });
      input.addEventListener("keydown", (event) => { if (event.key === "Enter" && input.value.trim() && !event.isComposing) submitButton.click(); });
      container.append(input);
      readResponse = () => view.text;
      if (!answered) setTimeout(() => input.focus(), 0);
    } else if (question.type === "order") {
      const list = el("ol", { class: "order-list" });
      const drawOrderList = () => {
        list.replaceChildren(...view.items.map((item, i) => el("li", { class: "order-item" }, [
          el("span", { class: "num", text: String(i + 1) }),
          el("span", { class: "text", text: item }),
          answered ? null : el("span", { class: "move" }, [
            el("button", { "aria-label": "上へ", text: "↑", disabled: i === 0, onclick: () => { moveItem(view.items, i, -1); drawOrderList(); } }),
            el("button", { "aria-label": "下へ", text: "↓", disabled: i === view.items.length - 1, onclick: () => { moveItem(view.items, i, 1); drawOrderList(); } }),
          ]),
        ])));
      };
      drawOrderList();
      container.append(list);
      readResponse = () => view.items.slice();
    }

    const submitButton = el("button", { class: "btn primary big", text: "回答する", disabled: question.type !== "order" && !(question.type === "fill" && view.text.trim()) && view.selected == null, onclick: () => onSubmit(readResponse()) });
    if (!answered) {
      container.append(el("div", { class: "btn-row" }, [
        submitButton,
        el("button", { class: "btn", text: "🤔 不明", onclick: () => onSubmit(null) }),
        el("span", { class: "kbd-hint", text: selectByNumber ? "数字キーで選択・Enter で回答" : "" }),
      ]));
      keyHandler = (event) => {
        if (selectByNumber && /^[1-9]$/.test(event.key)) selectByNumber(Number(event.key));
        else if (event.key === "Enter" && !submitButton.disabled) submitButton.click();
      };
    } else {
      if (!options.hideAnswer) container.append(renderFeedback(question, result));
      keyHandler = (event) => {
        if (event.key !== "Enter") return;
        const next = [...app.querySelectorAll("button.btn.go")].pop();
        if (next) next.click();
      };
    }
    return container;
  }
  function moveItem(items, index, offset) {
    const target = index + offset;
    [items[index], items[target]] = [items[target], items[index]];
  }
  function renderFeedback(question, result) {
    const kind = result.response === null ? "unknown" : result.isCorrect ? "correct" : "wrong";
    const verdict = {
      correct: `🎉 正解！ ${randomPick(PRAISE)}`,
      wrong: "😣 おしい！ ここで覚えよう",
      unknown: "📘 ここで確認しよう（不正解として扱います）",
    }[kind];
    return el("div", { class: `feedback ${kind}` }, [
      el("div", { class: "verdict", text: verdict }),
      result.isCorrect ? null : el("div", { class: "small" }, [el("strong", { text: "正解：" }), el("span", { style: "white-space:pre-line", text: describeCorrectAnswer(question) })]),
      el("div", { class: "small", html: question.explanation }),
      refLinks(question),
      result.nextText ? el("div", { class: "next-text small", text: result.nextText }) : null,
    ]);
  }

  // ===== 模擬試験（資格トピックのみ。学習履歴には記録しない） =====
  let exam = null;

  function startExam() {
    const questions = shuffled([...questionById.values()]).slice(0, content.meta.exam.questionCount);
    exam = {
      questions,
      views: questions.map((q) => buildQuestionView(q, true)),
      responses: [],
      index: 0,
      startedAt: Date.now(),
      finished: false,
    };
    currentView = "exam";
    render();
  }
  function examSecondsLeft() {
    return content.meta.exam.minutes * 60 - (Date.now() - exam.startedAt) / 1000;
  }
  function finishExam() {
    exam.finished = true;
    render();
  }
  function renderExam() {
    if (!exam) { showView("home"); return; }
    if (exam.finished) { renderExamResult(); return; }
    const question = exam.questions[exam.index];
    app.append(el("div", { class: "card" }, [
      el("div", { class: "q-head" }, [el("span", { class: "pill gold", text: "⏱ 模擬試験" }), el("span", { class: "small muted", text: `${exam.index + 1}／${exam.questions.length}問` })]),
      renderQuestionBody(question, exam.views[exam.index], null, (response) => {
        exam.responses[exam.index] = response;
        exam.index += 1;
        if (exam.index >= exam.questions.length) finishExam();
        else render();
      }),
    ]));
    app.append(el("div", { class: "btn-row" }, [el("button", { class: "btn", text: "ここで採点する", onclick: finishExam })]));
  }
  function renderExamResult() {
    keyHandler = null;
    const results = exam.questions.map((q, i) => {
      const response = i in exam.responses ? exam.responses[i] : null;
      return { question: q, response, isCorrect: isAnswerCorrect(q, response) };
    });
    const correctCount = results.filter((r) => r.isCorrect).length;
    const rate = Math.round((correctCount / results.length) * 100);
    const passingRate = content.meta.exam.passingRate;
    const passed = passingRate ? rate >= passingRate : null;
    if (passed && !exam.celebrated) { exam.celebrated = true; afterRender = celebrateBig; }
    app.append(el("div", { class: "card stage-banner" }, [
      el("div", { class: "big-label", text: "EXAM RESULT" }),
      passed === null ? null : el("div", {}, [el("span", { class: `stamp ${passed ? "perfect" : "clear"}`, text: passed ? "合格" : "不合格" })]),
      el("h2", { text: `${results.length}問中 ${correctCount}問正解（${rate}%）` }),
      passingRate ? el("p", { text: `合格ライン ${passingRate}%` }) : null,
      el("p", { class: "small muted", text: "模擬試験の結果は学習履歴（クローズの判定）には記録しません。" }),
      el("div", { class: "btn-row", style: "justify-content:center" }, [el("button", { class: "btn primary big", text: "ホームへ", onclick: () => { exam = null; showView("home"); } })]),
    ]));
    const wrong = results.filter((r) => !r.isCorrect);
    if (wrong.length) app.append(el("h2", { text: "間違えた問題" }));
    for (const r of wrong) {
      app.append(el("div", { class: "card miss-card" }, [
        renderQuestionBody(r.question, buildQuestionView(r.question, false), { response: r.response, isCorrect: false }, () => {}, { hideAnswer: true }),
        renderFeedback(r.question, { response: r.response, isCorrect: false }),
      ]));
    }
    keyHandler = null;
  }

  // ===== タイマー表示（模擬試験の残り時間だけ） =====
  function updateTimer() {
    const timer = document.getElementById("timer");
    if (currentView === "exam" && exam && !exam.finished) {
      const left = examSecondsLeft();
      timer.hidden = false;
      timer.textContent = `⏱ ${formatSeconds(left)}`;
      timer.classList.toggle("over", left < 60);
      if (left <= 0) { showToast("制限時間になりました。採点します。"); finishExam(); }
      return;
    }
    timer.hidden = true;
  }
  setInterval(updateTimer, 1000);

  // ===== 起動 =====
  document.title = content.meta.title;
  document.getElementById("topbar-title").textContent = content.meta.title;
  if (debugToday) {
    const badge = document.getElementById("debug-badge");
    badge.hidden = false;
    badge.textContent = `検証用の日付：${today()}`;
  }
  render();
})();
</script>
</body>
</html>
