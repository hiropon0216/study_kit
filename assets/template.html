<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Kit</title>
<style>
/* ===== テーマ（ダーク基調。references/learning-engine.md「画面」） ===== */
:root {
  color-scheme: dark;
  --bg: #0e1116;
  --surface: #161a21;
  --surface-2: #1d222b;
  --line: #2a303b;
  --line-strong: #3a4250;
  --text: #e7eaf0;
  --muted: #98a1b0;
  --accent: #7b94ff;
  --accent-strong: #4e6ef2;
  --accent-soft: rgba(123, 148, 255, 0.14);
  --ok: #3cc28d;
  --ok-strong: #1f9e6c;
  --ok-soft: rgba(60, 194, 141, 0.14);
  --ng: #f0894f;
  --ng-strong: #c9612a;
  --ng-soft: rgba(240, 137, 79, 0.14);
  --mark: #f2c94c;
  --mark-soft: rgba(242, 201, 76, 0.22);
  --mark-ink: #1b1606;
  --info: #6aa8ff;
  --info-soft: rgba(106, 168, 255, 0.09);
  --pre-bg: #0a0c10;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.8; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { text-wrap: balance; }
code, pre { font-family: var(--mono); font-size: 0.92em; }
:not(pre) > code { background: var(--surface-2); border: 1px solid var(--line); padding: 0.05em 0.4em; border-radius: 5px; }
pre { background: var(--pre-bg); border: 1px solid var(--line); color: var(--text); padding: 12px 14px; border-radius: 10px; overflow-x: auto; line-height: 1.55; margin: 0.9em 0; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ===== 共通部品 ===== */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 8px 16px; font-weight: 700; font-size: 0.9rem; line-height: 1.5; text-decoration: none; color: var(--text); }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn.primary:hover:not(:disabled) { background: #5d7cff; }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn:disabled { opacity: 0.45; }
.btn.block { width: 100%; padding: 11px 16px; }
.btn.small { padding: 4px 12px; font-size: 0.8rem; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 1px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.ng { background: var(--ng-soft); color: var(--ng); }
.tag.now { background: var(--accent-soft); color: var(--accent); }
.meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--accent-strong); border-radius: 99px; transition: width 0.5s ease; }
.meter.ok > span { background: var(--ok-strong); }
.eyebrow { font-size: 0.78rem; color: var(--muted); font-weight: 700; }
.link-btn { background: none; border: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-align: left; }
.flash { animation: flash 1.8s ease-out; border-radius: 6px; }
@keyframes flash { 0%, 35% { background: var(--mark-soft); } 100% { background: transparent; } }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }

/* ===== 上部バー ===== */
.appbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: rgba(14, 17, 22, 0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: none; padding: 0; text-align: left; }
.brand-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-strong); display: grid; place-items: center; flex: none; }
.brand-name { line-height: 1.25; min-width: 0; }
.brand-name small { display: block; font-size: 0.7rem; color: var(--muted); }
.brand-name strong { display: block; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32vw; }
.search { position: relative; flex: 0 1 380px; min-width: 0; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
.search-box input { background: none; border: none; outline: none; width: 100%; font-size: 0.88rem; }
.search-box input::placeholder { color: var(--muted); }
.search-results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; min-width: min(420px, 90vw); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45); padding: 6px; max-height: 60vh; overflow-y: auto; z-index: 40; }
.search-results button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; padding: 8px 10px; }
.search-results button:hover, .search-results button:focus-visible { background: var(--surface-2); }
.search-results small { display: block; color: var(--muted); font-size: 0.72rem; }
.search-results span { display: block; font-size: 0.85rem; line-height: 1.5; }
.search-results mark { background: var(--mark-soft); color: var(--text); border-radius: 3px; }
.search-results .empty { padding: 8px 10px; color: var(--muted); font-size: 0.85rem; }
.appbar .spacer { flex: 1; }
.hdr-progress { display: flex; align-items: center; gap: 10px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
.hdr-progress .meter { width: 110px; }
.hdr-progress b { color: var(--text); }
.gear { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; flex: none; font-size: 1rem; }
.gear[aria-current="page"] { border-color: var(--accent); color: var(--accent); }

main { padding: 28px 20px 70px; }
.wrap { max-width: 1180px; margin: 0 auto; }

/* ===== ホーム ===== */
.home { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
.home-main, .home-side { display: grid; gap: 24px; min-width: 0; }
.resume h2 { font-size: 1.75rem; margin: 2px 0 6px; line-height: 1.35; }
.resume .meta, .article .meta { display: flex; gap: 6px 18px; flex-wrap: wrap; font-size: 0.85rem; color: var(--muted); }
.resume .btn-row { margin-top: 16px; }
.big-pct { font-size: 3rem; font-weight: 700; color: var(--accent); line-height: 1.1; margin: 6px 0 10px; }
.big-pct small { font-size: 1rem; color: var(--text); margin-left: 4px; }
.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.mini-stats div { background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }
.mini-stats span { display: block; font-size: 0.72rem; color: var(--muted); }
.mini-stats b { font-size: 1.25rem; }
.home h2.sec-title { font-size: 1.1rem; margin: 0 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.chapter-card { display: grid; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.chapter-card:hover { border-color: var(--accent); }
.chapter-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chapter-card .no { color: var(--accent); font-weight: 700; font-size: 0.8rem; }
.chapter-card h3 { font-size: 1.05rem; margin: 0; line-height: 1.4; }
.chapter-card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.drill-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.drill-card h3 { margin: 0; font-size: 1rem; }
.drill-card p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }
.review-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.review-head h3 { font-size: 1.05rem; margin: 0; }
.review-list { display: grid; gap: 10px; margin: 12px 0 16px; }
.review-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface-2); }
.review-item .row { display: flex; justify-content: space-between; gap: 8px; font-size: 0.72rem; color: var(--muted); }
.review-item p { margin: 2px 0 0; font-size: 0.88rem; line-height: 1.55; }
.goal-list { margin: 8px 0 0; padding-left: 1.2em; font-size: 0.86rem; }

/* ===== 節のページ ===== */
.lesson { display: grid; grid-template-columns: 230px minmax(0, 1fr) 260px; gap: 24px; align-items: start; max-width: 1440px; margin: 0 auto; }
.toc { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; font-size: 0.86rem; padding: 14px 10px; }
.toc-head { display: flex; justify-content: space-between; align-items: center; padding: 0 8px 6px; }
.toc-head .btn { display: none; }
.toc .ch { display: flex; justify-content: space-between; gap: 6px; padding: 10px 8px 2px; font-weight: 700; font-size: 0.82rem; }
.toc .ch span { color: var(--muted); font-weight: 400; }
.toc-link { display: flex; gap: 8px; align-items: center; width: 100%; padding: 5px 8px; border-radius: 6px; color: var(--text); background: none; border: none; text-align: left; line-height: 1.5; }
.toc-link:hover { background: var(--surface-2); }
.toc-link.current { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.toc .st { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--line-strong); flex: none; display: grid; place-items: center; font-size: 9px; }
.toc .st.done { border-color: var(--ok); color: var(--ok); }
.toc .st.cur { border-color: var(--accent); }
.toc .st.cur::after { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.toc .st.drill { border-radius: 3px; border-color: var(--accent); color: var(--accent); }
.toc hr { border: none; border-top: 1px solid var(--line); margin: 10px 4px; }
.toc-backdrop { display: none; }
.toc-open-btn { display: none; }
.lesson-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.crumbs { font-size: 0.8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: none; background: none; border-radius: 7px; padding: 5px 14px; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--accent); }
.article { padding: 34px 44px 40px; }
.sec-no { display: inline-block; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 0.8rem; padding: 0 10px; border-radius: 6px; }
.article h1 { font-size: 2rem; margin: 6px 0 4px; line-height: 1.35; }
.guide { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 9px 14px; font-size: 0.85rem; color: var(--muted); margin: 18px 0 4px; }
.guide b { color: var(--accent); }
.block { scroll-margin-top: 80px; }
.block > h2 { font-size: 1.3rem; margin: 30px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line-strong); scroll-margin-top: 80px; line-height: 1.45; }
.example { border: 1px dashed var(--line-strong); border-radius: 10px; padding: 16px 20px; margin: 30px 0 0; scroll-margin-top: 80px; }
.example-head { display: flex; align-items: baseline; gap: 12px; }
.example-head .lbl { flex: none; background: var(--surface-2); color: var(--muted); font-size: 0.72rem; font-weight: 700; padding: 1px 8px; border-radius: 4px; }
.example-head b { font-size: 1.02rem; }
.sources { margin-top: 30px; font-size: 0.82rem; color: var(--muted); }
.sources summary { cursor: pointer; font-weight: 700; }
.sources ul { padding-left: 0; list-style: none; }
.sources li { margin: 6px 0; }
.rank { display: inline-block; min-width: 1.7em; text-align: center; font-size: 0.75em; font-weight: 700; border-radius: 4px; margin-right: 6px; background: var(--accent-soft); color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 22px; border-radius: 10px; }
.gate-text { text-align: right; font-size: 0.82rem; color: var(--muted); margin: 8px 0 0; }
.gate-text b, .side-gate b { color: var(--ng); }
.gate-text.open, .side-gate.open { color: var(--ok); font-weight: 700; }
.lesson.only-quiz .explain, .lesson.only-quiz .guide { display: none; }
.lesson.only-quiz .block > h2 { font-size: 1rem; margin-top: 22px; }
.lesson.only-quiz .example { border: none; padding: 0; }

/* すぐ確認 */
.check { margin: 22px 0 8px; border: 1px solid rgba(123, 148, 255, 0.35); background: rgba(123, 148, 255, 0.07); border-radius: 12px; padding: 14px 18px 16px; scroll-margin-top: 90px; }
.check.is-ok { border-color: rgba(60, 194, 141, 0.55); }
.check.is-ng { border-color: rgba(240, 137, 79, 0.55); }
.check-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.check-badge { background: var(--accent-strong); color: #fff; font-weight: 700; padding: 1px 10px; border-radius: 6px; }
.check-q { margin: 10px 0 0; }
.hint { margin-top: 10px; font-size: 0.88rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; }

/* 解答の部品（すぐ確認と演習で共通） */
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 14px 0 0; }
.choices.wide { grid-template-columns: 1fr; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px; padding: 9px 14px; min-width: 0; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:disabled { cursor: default; }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-size: 0.8rem; color: var(--muted); }
.choice .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.run .choices { grid-template-columns: 1fr; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-pressed="true"] .k { background: var(--accent-strong); color: #fff; }
.choice.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.is-ok .k { background: var(--ok-strong); color: #fff; }
.choice.is-ng { border-color: var(--ng); background: var(--ng-soft); }
.choice.is-ng .k { background: var(--ng-strong); color: #fff; }
.choice.dim { opacity: 0.55; }
.choice .note { margin-left: auto; font-size: 0.75rem; font-weight: 700; flex: none; }
.choice.is-ok .note { color: var(--ok); }
.choice.is-ng .note { color: var(--ng); }
.ox { display: flex; gap: 12px; margin-top: 14px; }
.ox button { width: 84px; height: 64px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; font-size: 1.7rem; }
.ox button:hover:not(:disabled) { border-color: var(--accent); }
.ox button:disabled { cursor: default; }
.ox button.is-ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.ox button.is-ng { border-color: var(--ng); background: var(--ng-soft); color: var(--ng); }
.ox button.dim { opacity: 0.55; }
.fillrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.fillrow input { flex: 0 1 260px; min-width: 120px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 12px; font-size: 1.02rem; }
.fillrow input::placeholder { color: var(--muted); }
.fillrow input.is-ok { border-color: var(--ok); }
.fillrow input.is-ng { border-color: var(--ng); }
.order-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.order-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.order-item .n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; }
.order-item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.order-item .mv { display: flex; gap: 4px; }
.order-item .mv button { width: 2.1em; height: 2.1em; border: 1px solid var(--line-strong); background: var(--surface-2); border-radius: 6px; }
.order-item .mv button:disabled { opacity: 0.3; }
.order-list.is-ok .order-item { border-color: var(--ok); }
.order-list.is-ng .order-item { border-color: var(--ng); }
.submit-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.result { margin-top: 14px; border-radius: 10px; padding: 12px 16px; animation: pop 0.25s ease-out; }
.result.ok { background: var(--ok-soft); }
.result.ng { background: var(--ng-soft); }
.result .v { font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.result.ok .v { color: var(--ok); }
.result.ng .v { color: var(--ng); }
.result p { margin: 4px 0 0; font-size: 0.92rem; }
.result .answer-text { white-space: pre-line; }
.result .acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

/* 右の列 */
.side { display: grid; gap: 16px; position: sticky; top: 76px; min-width: 0; }
.side h3 { font-size: 0.9rem; margin: 0 0 4px; }
.score { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1.2; }
.score small { font-size: 0.85rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.side-gate { margin-top: 10px; font-size: 0.8rem; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.map { display: grid; gap: 8px; margin-top: 12px; }
.map button { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; }
.map button:hover { border-color: var(--accent); }
.map button.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.map small { display: block; font-size: 0.7rem; color: var(--muted); line-height: 1.4; }
.map b { font-size: 0.82rem; }
.keypoints { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.86rem; }
.memo { width: 100%; min-height: 130px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 8px; padding: 8px 10px; font-size: 0.86rem; margin-top: 6px; }
.memo::placeholder { color: var(--muted); }

/* ===== 演習（章末演習・総合演習・復習・模擬試験） ===== */
.run-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 1060px; margin: 0 auto 22px; }
.run-bar .ttl { line-height: 1.3; margin-right: auto; min-width: 0; }
.run-bar .ttl small { display: block; font-size: 0.72rem; color: var(--muted); }
.run-bar .ttl b { font-size: 1.05rem; }
.run-prog { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; color: var(--muted); flex-wrap: wrap; }
.run-prog .meter { width: 170px; }
.run-prog b { color: var(--text); }
.run-prog .over { color: var(--ng); font-weight: 700; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 22px; align-items: start; max-width: 1060px; margin: 0 auto; }
.run .card { padding: 28px 34px; }
.qtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.8rem; }
.qtop b { color: var(--accent); font-size: 0.9rem; }
.stem { font-size: 1.15rem; font-weight: 700; margin: 14px 0 0; }
.goto { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid var(--accent-strong); background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; margin-top: 14px; }
.goto .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--accent-strong); display: grid; place-items: center; flex: none; }
.goto small { display: block; font-size: 0.72rem; color: var(--muted); }
.goto b { font-size: 0.95rem; }
.goto .arr { margin-left: auto; color: var(--accent); }
.run-actions { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.flag[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.kbd-hint { font-size: 0.75rem; color: var(--muted); }
.grid10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.grid10 button { aspect-ratio: 1; border-radius: 8px; border: 1px solid transparent; background: var(--surface-2); color: var(--muted); font-weight: 700; padding: 0; }
.grid10 button.ok { background: var(--ok-strong); color: #fff; }
.grid10 button.ng { background: var(--ng-strong); color: #fff; }
.grid10 button.done { background: var(--line-strong); color: var(--text); }
.grid10 button.cur { border: 2px solid var(--accent); background: transparent; color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.72rem; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.scope-scores { display: grid; gap: 10px; margin-top: 10px; font-size: 0.82rem; }
.scope-scores .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.done-card { text-align: center; padding: 34px; }
.done-card .score { font-size: 3rem; }
.miss { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-top: 12px; text-align: left; }
.miss p { margin: 4px 0; font-size: 0.9rem; }

/* ===== 設定 ===== */
.settings { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
.settings h1 { font-size: 1.5rem; margin: 0; }

/* ===== 教科書の部品（教材JSONの body で使う。references/textbook-components.md） ===== */
.lesson-body p { margin: 0.65em 0; max-width: 48em; }
.lesson-body ul, .lesson-body ol:not([class]) { padding-left: 1.4em; }
.lesson-body h3 { font-size: 1.08rem; margin: 1.4em 0 0.4em; }
.lesson-body h4 { font-size: 1rem; margin: 0 0 0.3em; }
.lesson-body table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
.lesson-body th, .lesson-body td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.lesson-body th { background: var(--surface-2); font-weight: 700; }
.lesson-body .sk-table, .lesson-body > table { display: block; overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin: 1.2em 0; }
/* 本文の重要語は蛍光ペンで目立たせる */
.lesson-body p strong, .lesson-body li strong, .lesson-body dd strong { background: linear-gradient(transparent 55%, var(--mark-soft) 55%); color: #fff3cf; }

.sk-goals { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 10px 16px; margin: 1em 0; }
.sk-goals::before { content: "この節でわかること"; display: block; font-weight: 700; color: var(--accent); font-size: 0.8rem; }
.sk-goals ul, .sk-summary ul { margin: 4px 0 0; padding-left: 1.3em; }

.sk-premise { background: var(--info-soft); border: 1px solid rgba(106, 168, 255, 0.35); border-left: 6px solid var(--info); border-radius: 10px; padding: 12px 18px; margin: 1.2em 0; }
.sk-premise::before { content: "📘 前提：" attr(data-term) " とは"; display: block; font-weight: 700; color: var(--info); margin-bottom: 4px; }
.sk-premise p { margin: 0.4em 0; }
.lesson-body .sk-premise strong { background: none; color: #a9c9ff; }

.sk-callout { display: block; border-radius: 10px; padding: 12px 16px 12px 52px; margin: 1.2em 0; position: relative; border: 1px solid; }
.sk-callout::before { position: absolute; left: 16px; top: 12px; font-size: 1.2rem; line-height: 1.5; }
.sk-callout::after { position: absolute; left: 52px; top: -0.75em; font-size: 0.7rem; font-weight: 700; padding: 0 8px; border-radius: 4px; }
.sk-callout p { margin: 0.25em 0; }
.sk-callout.point { background: rgba(242, 201, 76, 0.09); border-color: rgba(242, 201, 76, 0.3); }
.sk-callout.point::before { content: "💡"; }
.sk-callout.point::after { content: "POINT"; background: var(--mark); color: var(--mark-ink); letter-spacing: 0.05em; }
.sk-callout.warn { background: var(--ng-soft); border-color: rgba(240, 137, 79, 0.4); }
.sk-callout.warn::before { content: "⚠️"; }
.sk-callout.warn::after { content: "注意"; background: var(--ng-strong); color: #fff; }
.sk-callout.analogy { background: var(--info-soft); border-color: rgba(106, 168, 255, 0.3); }
.sk-callout.analogy::before { content: "🧩"; }
.sk-callout.analogy::after { content: "たとえると"; background: #3b6fc4; color: #fff; }
.sk-callout.tip { background: var(--ok-soft); border-color: rgba(60, 194, 141, 0.35); }
.sk-callout.tip::before { content: "🛠️"; }
.sk-callout.tip::after { content: "実務メモ"; background: var(--ok-strong); color: #fff; }

.sk-terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 1em 0; }
.sk-terms > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
.sk-terms dt { font-weight: 700; color: var(--accent); }
.sk-terms dd { margin: 2px 0 0; font-size: 0.9rem; }

.sk-flow { list-style: none; padding: 0; margin: 1.2em 0; display: flex; flex-wrap: wrap; gap: 14px; counter-reset: sk-step; }
.sk-flow > li { counter-increment: sk-step; flex: 1 1 150px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 32px 12px 10px; position: relative; font-size: 0.9em; }
.sk-flow > li::before { content: counter(sk-step); position: absolute; top: 7px; left: 10px; width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent-strong); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 0.78rem; }
.sk-flow > li:not(:last-child)::after { content: "▶"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 0.8rem; z-index: 1; }

.sk-steps { list-style: none; padding: 0; margin: 1em 0; display: grid; gap: 12px; counter-reset: sk-steps; }
.sk-steps > li { counter-increment: sk-steps; position: relative; padding-left: 38px; }
.sk-steps > li::before { content: counter(sk-steps); position: absolute; left: 0; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line-strong); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; }
.sk-steps > li p { margin: 0 0 6px; }

.sk-nest { border: 1.5px dashed var(--accent); border-radius: 12px; padding: 26px 12px 12px; margin: 10px 0; position: relative; background: rgba(123, 148, 255, 0.05); display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.sk-nest > .sk-nest { flex: 1 1 180px; margin: 0; }
.sk-nest::before { content: attr(data-label); position: absolute; top: 4px; left: 12px; font-size: 0.78rem; font-weight: 700; color: var(--accent); }
.sk-nest .sk-nest { border-color: var(--ok); background: rgba(60, 194, 141, 0.06); }
.sk-nest .sk-nest::before { color: var(--ok); }
.sk-nest .sk-nest .sk-nest { border-color: var(--mark); background: rgba(242, 201, 76, 0.06); }
.sk-nest .sk-nest .sk-nest::before { color: var(--mark); }
.sk-item { display: inline-block; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 4px 12px; font-weight: 700; font-size: 0.88em; }
.sk-caption { flex-basis: 100%; font-size: 0.82em; color: var(--muted); margin: 0; }

.sk-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 1.2em 0; }
.sk-compare > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.sk-compare > div:first-child { border-top: 5px solid var(--muted); }
.sk-compare > div:nth-child(2) { border-top: 5px solid var(--accent); }
.sk-compare > div:nth-child(3) { border-top: 5px solid var(--ok); }
.sk-compare ul { margin: 0; padding-left: 1.2em; font-size: 0.92em; }

.sk-cells { margin: 1.2em 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 20px 16px 14px; text-align: center; }
.sk-cells > span { display: inline-grid; place-items: center; min-width: 44px; height: 44px; padding: 0 8px; margin: 3px; border: 1.5px solid var(--accent); border-radius: 6px; color: var(--accent); font-family: var(--mono); font-size: 1.15rem; background: var(--surface); vertical-align: middle; }
.sk-cells > span.on { background: var(--mark); border-color: var(--mark); color: var(--mark-ink); }
.sk-cells > span.dim { opacity: 0.45; border-style: dashed; }
.sk-cells[data-label]::after { content: attr(data-label); display: block; width: min(100%, 460px); margin: 8px auto 0; padding-top: 14px; color: var(--accent); font-weight: 700; font-size: 0.85rem;
  background: linear-gradient(var(--muted), var(--muted)) 0 8px / 100% 1.5px no-repeat, linear-gradient(var(--muted), var(--muted)) 0 0 / 1.5px 9.5px no-repeat, linear-gradient(var(--muted), var(--muted)) 100% 0 / 1.5px 9.5px no-repeat; }

.sk-figure { margin: 1.3em 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.sk-figure svg { display: block; width: 100%; height: auto; max-height: 340px; }
.sk-figure figcaption { font-size: 0.8rem; color: var(--muted); text-align: center; margin-top: 8px; }
.sk-figure .sk-fill-primary { fill: var(--accent-strong); }
.sk-figure .sk-fill-primary-soft { fill: var(--accent-soft); }
.sk-figure .sk-fill-accent { fill: var(--ok-strong); }
.sk-figure .sk-fill-accent-soft { fill: var(--ok-soft); }
.sk-figure .sk-fill-warn { fill: var(--ng-strong); }
.sk-figure .sk-fill-warn-soft { fill: var(--ng-soft); }
.sk-figure .sk-fill-mark { fill: var(--mark); }
.sk-figure .sk-fill-mark-soft { fill: var(--mark); opacity: 0.16; }
.sk-figure .sk-fill-muted { fill: var(--surface); }
.sk-figure .sk-fill-surface { fill: var(--surface-2); }
.sk-figure .sk-stroke { stroke: var(--line-strong); }
.sk-figure .sk-stroke-primary { stroke: var(--accent); }
.sk-figure .sk-stroke-accent { stroke: var(--ok); }
.sk-figure .sk-stroke-warn { stroke: var(--ng); }
.sk-figure .sk-stroke-mark { stroke: var(--mark); }
.sk-figure .sk-text { fill: var(--text); font-family: var(--font); }
.sk-figure .sk-text-muted { fill: var(--muted); font-family: var(--font); }
.sk-figure .sk-text-on { fill: #fff; font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-dark { fill: var(--mark-ink); font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-primary { fill: var(--accent); font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-accent { fill: var(--ok); font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-warn { fill: var(--ng); font-family: var(--font); font-weight: 700; }

.sk-badge { display: inline-block; font-family: var(--mono); font-size: 0.85em; font-weight: 700; padding: 1px 10px; border-radius: 99px; border: 1px solid; }
.sk-badge.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
.sk-badge.warn { color: var(--mark); border-color: var(--mark); background: rgba(242, 201, 76, 0.1); }
.sk-badge.err { color: var(--ng); border-color: var(--ng); background: var(--ng-soft); }
.sk-badge.info { color: var(--info); border-color: var(--info); background: var(--info-soft); }
.sk-badge-list { display: grid; gap: 8px; margin: 1em 0; }
.sk-badge-list > div { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }

.sk-summary { background: var(--surface); border: 1px solid var(--mark); border-radius: 12px; padding: 10px 16px; margin: 1.4em 0 0.6em; }
.sk-summary::before { content: "⭐ まとめ"; display: block; font-weight: 700; color: var(--mark); }

/* ===== 出題（システムが制御する。学習者は答えるだけ） ===== */
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.qhead-l { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--muted); }
.qs { font-size: 0.72rem; font-weight: 700; padding: 1px 9px; border-radius: 99px; white-space: nowrap; }
.qs.new { background: var(--surface-2); color: var(--muted); }
.qs.due { background: rgba(242, 201, 76, 0.16); color: var(--mark); }
.qs.wait { background: var(--accent-soft); color: var(--accent); }
.qs.closed { background: var(--ok-soft); color: var(--ok); }
.qs.excluded { background: transparent; color: var(--muted); border: 1px dashed var(--line-strong); }
.exclude-btn { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 1px 10px; font-size: 0.72rem; color: var(--muted); }
.exclude-btn:hover { border-color: var(--ng); color: var(--ng); }
.think { margin-top: 14px; }
.think-label { font-size: 0.8rem; color: var(--muted); }
.think-bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 6px; }
.think-bar span { display: block; height: 100%; width: 0; background: var(--accent); }
.think-bar span.run { animation: think 3s linear forwards; }
@keyframes think { to { width: 100%; } }
.q-note { margin-top: 10px; font-size: 0.86rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.q-done { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.86rem; margin-top: 8px; }
.q-done .okmark { color: var(--ok); font-weight: 700; }
.result .sched { margin-top: 6px; font-size: 0.84rem; color: var(--text); }
.check.warmup { border-color: rgba(242, 201, 76, 0.45); background: rgba(242, 201, 76, 0.05); }
.check.warmup .check-badge { background: var(--mark); color: var(--mark-ink); }
.check.retry { border-color: rgba(240, 137, 79, 0.5); background: rgba(240, 137, 79, 0.05); }
.check.retry .check-badge { background: var(--ng-strong); }
.today-card { border-color: rgba(242, 201, 76, 0.35); }
.today-card h2 b { color: var(--mark); }
.queue { display: grid; gap: 6px; margin-top: 8px; font-size: 0.8rem; }
.queue div { display: flex; justify-content: space-between; gap: 8px; background: var(--surface-2); border-radius: 8px; padding: 5px 10px; }
.queue div.cur { box-shadow: inset 3px 0 0 var(--accent); }
.queue .ok { color: var(--ok); }
.queue .ng { color: var(--ng); }
.ex-list { display: grid; gap: 8px; margin-top: 10px; }
.ex-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 8px; padding: 8px 12px; font-size: 0.86rem; }
.ex-row span { min-width: 0; overflow-wrap: anywhere; }

/* ===== トースト・紙吹雪 ===== */
.toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px; max-width: calc(100vw - 32px); font-weight: 700; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); animation: pop 0.2s; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ===== 幅に合わせた並べ替え ===== */
@media (max-width: 1100px) {
  .lesson { grid-template-columns: minmax(0, 1fr) 240px; }
  /* 目次は左からスライドして出す */
  .toc { position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; max-height: none; width: min(320px, 86vw); border-radius: 0; transform: translateX(-105%); transition: transform 0.25s ease; box-shadow: 6px 0 24px rgba(0, 0, 0, 0.5); }
  .toc.open { transform: none; }
  .toc-head .btn { display: inline-flex; }
  .toc-backdrop { display: block; position: fixed; inset: 0; z-index: 45; background: rgba(0, 0, 0, 0.5); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .toc-backdrop.open { opacity: 1; pointer-events: auto; }
  .toc-open-btn { display: inline-flex; }
}
@media (max-width: 860px) {
  .home, .lesson, .run { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .article { padding: 22px 18px 28px; }
  .run .card { padding: 20px 18px; }
  .search { display: none; }
  .hdr-progress .meter { display: none; }
  .brand-name strong { max-width: 50vw; }
}
@media (max-width: 480px) {
  main { padding: 18px 16px 56px; }
  .appbar { padding: 8px 16px; gap: 10px; }
  .article h1 { font-size: 1.6rem; }
  .sk-flow > li:not(:last-child)::after { display: none; }
  .sk-badge-list > div { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="appbar">
  <button class="brand" id="brand" aria-label="ホームへ">
    <span class="brand-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M6 5.5h4"/></svg></span>
    <span class="brand-name"><small id="brand-series"></small><strong id="brand-title">Study Kit</strong></span>
  </button>
  <div class="search" id="search">
    <label class="search-box"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--muted)" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="search-input" type="search" placeholder="用語・問題を検索" aria-label="用語・問題を検索" autocomplete="off"></label>
    <div class="search-results" id="search-results" role="listbox" hidden></div>
  </div>
  <span class="spacer"></span>
  <span class="hdr-progress" id="hdr-progress">覚えた割合 <span class="meter"><span id="hdr-meter"></span></span><b class="num" id="hdr-pct"></b></span>
  <button class="gear" id="gear" aria-label="設定（学習履歴の書き出し・読み込み・削除）" title="設定">⚙</button>
</header>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script id="study-data" type="application/json">__STUDY_DATA__</script>
<script>
"use strict";
(() => {
  // ===== 定数（references/learning-engine.md） =====
  const PROGRESS_VERSION = 3;
  const RUN_SIZE = 10;          // 今日の想起・章末演習・総合演習は1回10問まで
  const THINK_MS = 3000;        // 選択肢を出す前に、問題文だけを見せる時間
  const ADVANCE_MS = 1200;      // 演習で正解したあと、次の問題へ自動で進むまでの時間
  const RETRY_GAP = 3;          // 演習で間違えた問題は、3問あとにもう一度出す
  const MAX_RETRY = 3;          // 同じ回の中でのくり返しは3回まで
  const WARMUP_SIZE = 2;        // 節を開いたときに出す、ほかの節の期日が来た問題の数
  const READ_CHARS_PER_MINUTE = 400;
  const KANA = ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク"];

  const app = document.getElementById("app");

  // ===== 教材データ =====
  let content;
  try {
    content = JSON.parse(document.getElementById("study-data").textContent);
  } catch (error) {
    app.innerHTML = "<p>教材データを読み込めません。scripts/build_html.py で教材JSONを埋め込んだHTMLを開いてください。</p>";
    return;
  }

  const STORAGE_KEY = "study-kit:" + content.meta.id;
  const chapters = content.chapters;
  const finalExam = content.finalExam || [];
  const sectionById = new Map();
  const chapterBySectionId = new Map();
  const questionById = new Map();   // すべての問題（すぐ確認・章末演習・総合演習）
  const checkInfo = new Map();      // すぐ確認の問題ID → { section, item }
  const drillChapter = new Map();   // 章末演習・総合演習の問題ID → 章（総合演習は null）
  const factById = new Map((content.factsheet || []).map((fact) => [fact.id, fact]));

  for (const chapter of chapters) {
    for (const section of chapter.sections) {
      sectionById.set(section.id, section);
      chapterBySectionId.set(section.id, chapter);
      let textNo = 0;
      for (const item of section.items) {
        item.kind = item.type === "example" ? "example" : "text";
        item.no = item.kind === "text" ? ++textNo : null;
        questionById.set(item.check.id, item.check);
        checkInfo.set(item.check.id, { section, item });
      }
    }
    for (const question of chapter.exercise || []) { questionById.set(question.id, question); drillChapter.set(question.id, chapter); }
  }
  for (const question of finalExam) { questionById.set(question.id, question); drillChapter.set(question.id, null); }
  const orderedSections = chapters.flatMap((chapter) => chapter.sections);
  const allIds = [...questionById.keys()];

  const chapterNo = (chapter) => chapters.indexOf(chapter) + 1;
  function sectionCode(section) {
    const chapter = chapterBySectionId.get(section.id);
    return `${chapterNo(chapter)}-${chapter.sections.indexOf(section) + 1}`;
  }
  const chapterLabel = (chapter) => `第${chapterNo(chapter)}章 ${chapter.title}`;
  const itemLabel = (item) => (item.kind === "example" ? "例題" : `${item.no}. ${item.title}`);
  function parseRef(ref) {

  }

  function homeOf(id) {

  }
  function scopeLabel(id) {
    if (checkInfo.has(id)) { const { section } = checkInfo.get(id); return `${sectionCode(section)} ${section.title}`; }

  // ===== 日付（端末のローカル日付。?today=YYYY-MM-DD で検証用に上書きできる） =====

  // ===== 学習履歴 =====

  // ===== 出題の判断（すべてシステムが行う） =====

  // 画面に出す状態：new 未出題 / due 今日出す / wait 次の出題日を待つ / closed 覚えた / excluded 出さない
  function stateOf(id) {

  function stateTag(id) {

  // 回答時間の基準：選択肢などの文字数から見積もり、学習者のふだんの速さで補正する
  function baseMs(q) {

    if (q.type === "order") return 4000 + q.options.join("").length * 60;

  function personalFactor() {

  // good：速く正解 / hard：遅い正解、またはその日に間違えたあとの正解 / again：不正解

  // クローズまでの道筋：初回に速く正解 → 翌日もう一度正解でクローズ（2回）。それ以外は日を変えて3回正解（間隔 1日 → 3日）

  }
  function readingMinutes(section) {
    if (Number.isInteger(section.minutes) && section.minutes > 0) return section.minutes;
    const chars = section.items.map((item) => stripTags(item.title + item.body)).join("").length;
    return Math.max(1, Math.ceil(chars / READ_CHARS_PER_MINUTE));
  }

  // ===== 正誤判定 =====
  const normalizeFill = (text) => String(text).normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  function isAnswerCorrect(q, response) {

  // ===== 小さな道具 =====

      else if (key === "html") node.innerHTML = value; // 教材の本文・問題文・解説（スキルが生成した信頼済みHTML）だけに使う
      else if (key === "text") node.textContent = value;

  }
  function formatClock(totalSeconds) {
    const abs = Math.max(0, Math.floor(totalSeconds));

  }
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function flash(node) { if (!node) return; node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
  function shake(node) { if (!node) return; node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); }
  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
  }
  function bookIcon() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "16"); svg.setAttribute("height", "16"); svg.setAttribute("viewBox", "0 0 16 16");
    svg.innerHTML = '<rect x="3" y="2" width="10" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/>';
    return svg;
  }

  // ===== 演出：紙吹雪（クラッカー） =====
  const confettiCanvas = document.getElementById("confetti");
  const confettiContext = confettiCanvas.getContext("2d");
  const CONFETTI_COLORS = ["#7b94ff", "#3cc28d", "#f2c94c", "#f0894f", "#e7eaf0", "#6aa8ff"];
  let confettiPieces = [];
  let confettiRunning = false;
  function resizeConfettiCanvas() {
    const ratio = window.devicePixelRatio || 1;

    confettiCanvas.height = innerHeight * ratio;
    confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener("resize", resizeConfettiCanvas);
  resizeConfettiCanvas();
  function burstConfetti(x, y, { count = 70, angle = -Math.PI / 2, spread = Math.PI / 2.2, power = 13 } = {}) {

  }

    burstConfetti(innerWidth, innerHeight, { count: 110, angle: (-2 * Math.PI) / 3, spread: Math.PI / 4, power: 22 });
  }

  // ===== 問いのカード（すぐ確認・演習・今日の想起で共通） =====
  // 学習者の操作は「答える」と、間違えたときの「次へ」だけ。考える時間・判定・次の出題日はシステムが決める。
  // opts.record：学習履歴に記録する / opts.practice：練習（記録しない） / opts.mock：模擬試験（正誤を出さない）
  // opts.onDone(result) / opts.onNext（ある場合は次へボタン。正解なら autoAdvance で自動）/ opts.onExcludeChange(on)
  let keyTarget = null; // 数字キー・Enter を受けるカード（演習の画面だけ）
  function buildView(q, shuffle) {

  }
  function questionCard(id, opts = {}) {
    const q = questionById.get(id);
    const view = buildView(q, opts.mock || recOf(id).attempts > 0 || opts.retry);

    const root = el("div", { class: "qcard" });

    const body = el("div");
    const result = el("div");

      const left = el("div", { class: "qhead-l" }, [opts.label || null, opts.mock ? null : stateTag(id)]);
      const right = opts.mock ? null : el("button", { class: "exclude-btn", type: "button", text: isActive(id) ? "この問題はもう出さない" : "出題に戻す", onclick: toggleExclude });

        start();
      }

    }

      body.replaceChildren();

      body.append(el("div", { class: "answer-area" }));
    }

        a.append(el("div", { class: `choices${wide ? " wide" : ""}` }, view.order.map((optionIndex, position) => el("button", { class: "choice", type: "button", "data-index": String(optionIndex), onclick: () => submit(optionIndex) }, [el("span", { class: "k", text: KANA[position] }), el("span", { class: "t", text: q.options[optionIndex] })]))));
      } else if (q.type === "truefalse") {
        a.append(el("div", { class: "ox" }, [[true, "○"], [false, "×"]].map(([value, mark]) => el("button", { type: "button", "data-value": String(value), "aria-label": value ? "正しい（○）" : "誤り（×）", text: mark, onclick: () => submit(value) }))));

        input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && input.value.trim()) submit(input.value); });

        const items = view.items;
        const list = el("ol", { class: "order-list" });

          el("span", { class: "n", text: String(i + 1) }), el("span", { class: "t", text }),

          ]),
        ])));

    }
    function submit(response) {
      if (st.phase !== "answer") return;

      if (opts.mock) { if (opts.onDone) opts.onDone({ correct, response }); return; }

      showResult(correct, grade, rec, response);
      if (opts.onDone) opts.onDone({ correct, grade, response });
    }

      a.querySelectorAll("button, input").forEach((x) => { x.disabled = true; });
      if (opts.mock) return;
      a.querySelectorAll(".choice").forEach((b) => {
        const i = Number(b.dataset.index);
        if (i === response) { b.classList.add(correct ? "is-ok" : "is-ng"); b.append(el("span", { class: "note", text: correct ? "正解" : "あなたの答え" })); }
        else if (i === q.answer) { b.classList.add("is-ok"); b.append(el("span", { class: "note", text: "正解" })); }
        else b.classList.add("dim");
      });
      a.querySelectorAll(".ox button").forEach((b) => {
        const v = b.dataset.value === "true";
        if (v === response) b.classList.add(correct ? "is-ok" : "is-ng");
        else if (v === q.answer) b.classList.add("is-ok");
        else b.classList.add("dim");
      });
      const input = a.querySelector("input");
      if (input) input.classList.add(correct ? "is-ok" : "is-ng");
      const list = a.querySelector(".order-list");
      if (list) list.classList.add(correct ? "is-ok" : "is-ng");
    }
    function scheduleText(rec) {
      if (!rec) return null;
      if (rec.status === "closed") return "🎉 覚えました。この問題はもう出しません（演習で間違えたら、また出します）。";
      if (rec.status === "learning" && rec.due) return `次は ${formatDate(rec.due)} に出します。`;
      return null;
    }
    function showResult(correct, grade, rec, response) {
      const box = el("div", { class: `result ${correct ? "ok" : "ng"}` });
      if (correct) {
        const note = opts.practice ? "（練習なので、記録はしません）" : grade === "hard" ? (recOf(id).wrongDay === today() ? "間違えたあとの正解なので、日を変えてもう一度出します。" : "少し時間がかかったので、日を変えてもう一度確かめます。") : "";
        box.append(el("div", { class: "v", text: "✓ 正解" }), note ? el("p", { class: "muted small", text: note }) : null);
      } else {
        box.append(el("div", { class: "v" }, ["✕ 不正解　正解は ", el("span", { style: "white-space:pre-line", text: correctAnswerText(q, view) })]));
        const notes = q.optionNotes;
        if (notes && typeof response === "number" && notes[response]) box.append(el("p", {}, [el("b", { text: `あなたの答え「${q.options[response]}」：` }), notes[response]]));
      }
      box.append(el("p", { html: q.explanation }));
      const sched = scheduleText(rec);
      if (sched) box.append(el("p", { class: "sched", text: sched }));
      if (!correct && opts.retryNote) box.append(el("p", { class: "sched", text: opts.retryNote }));
      if (opts.refs) {
        for (const ref of (q.refs || []).filter((r) => parseRef(r)).slice(0, 1)) {
          const target = parseRef(ref);
          box.append(el("button", { class: "goto", type: "button", onclick: () => openSection(target.section.id, { itemId: target.item ? target.item.id : null }) }, [el("span", { class: "ic" }, [bookIcon()]), el("span", {}, [el("small", { text: "教科書で確認する" }), el("b", { text: refLabel(ref) })]), el("span", { class: "arr", text: "›" })]));
        }
      }
      result.replaceChildren(box);
      if (opts.onNext) {
        const next = el("button", { class: "btn primary", type: "button", text: opts.nextLabel || "次へ ›", onclick: () => goNext() });
        result.append(el("div", { class: "acts" }, [next, correct && opts.autoAdvance ? el("span", { class: "kbd-hint", text: "自動で次へ進みます" }) : el("span", { class: "kbd-hint", text: "Enter で次へ" })]));
        if (correct && opts.autoAdvance) st.advanceTimer = setTimeout(goNext, ADVANCE_MS);
      }
      if (correct) celebrateAt(box); else shake(root);
    }
    function goNext() {
      clearTimeout(st.advanceTimer);
      if (st.nexted) return;
      st.nexted = true;
      opts.onNext();
    }
    // 演習の画面のキー操作：数字キーで選択肢、Enter で次へ
    function key(e) {
      if (st.phase === "answer" && /^[1-9]$/.test(e.key)) {
        const buttons = area().querySelectorAll(".choice, .ox button");
        const b = buttons[Number(e.key) - 1];
        if (b && !b.disabled) { b.click(); return true; }
      }
      if (e.key === "Enter" && (st.phase === "done" || st.phase === "excluded") && opts.onNext) { goNext(); return true; }
      return false;
    }

    renderHead();
    if (!isActive(id) && !opts.mock) {

    // 画面に入ったときから考える時間を数える（読みながら下へ進むすぐ確認のため）
    const api = { el: root, key, start, stop: () => { clearTimeout(st.timer); clearTimeout(st.advanceTimer); } };
    if (opts.startNow) start();
    else waitingCards.add(api);
    return api;
  }
  // まだ始まっていない問いは、画面に入ったときに始める（スクロールのたびに位置を見る）
  const waitingCards = new Set();
  function startVisibleCards() {
    for (const card of waitingCards) {
      if (!card.el.isConnected) { waitingCards.delete(card); continue; }
      const r = card.el.getBoundingClientRect();
      const visible = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
      if (r.height && visible >= Math.min(r.height * 0.3, innerHeight * 0.3)) { waitingCards.delete(card); card.start(); }
    }
  }
  window.addEventListener("scroll", startVisibleCards, { passive: true });

  // ===== 画面の切り替え =====
  // home: ホーム / lesson: 節のページ / run: 今日の想起・演習・模擬試験 / settings: 設定

  function showView(view) {

      return;

    if (run && run.card) run.card.stop();

  }
  function openSection(sectionId, { itemId = null } = {}) {
    const section = sectionById.get(sectionId);

    lesson = { sectionId, retries: {} };
    progress.lastSectionId = sectionId;
    saveProgress();

  document.addEventListener("keydown", (event) => {

    if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
    const tag = event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (tag === "BUTTON" && event.key === "Enter")) return;
    if (keyTarget && keyTarget.key(event)) { event.preventDefault(); return; }

  // ===== 上部バー =====
  function renderHeader() {

  // ===== 検索（用語・本文・問題） =====
  const searchIndex = [];
  for (const section of orderedSections) {
    for (const item of section.items) {
      searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} ›「${itemLabel(item)}」`, text: stripTags(`${item.title}\n${item.body}`) });
      searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} › すぐ確認`, text: stripTags(item.check.prompt) });
    }
    if (section.keyPoints) searchIndex.push({ section, item: null, label: `${sectionCode(section)} ${section.title} › この節の要点`, text: section.keyPoints.map(stripTags).join(" ／ ") });
  }
  for (const [id, chapter] of drillChapter) {
    const target = parseRef((questionById.get(id).refs || [])[0]);
    if (target) searchIndex.push({ section: target.section, item: target.item, label: `${chapter ? chapterLabel(chapter) + " 章末演習" : "総合演習"} の問題`, text: stripTags(questionById.get(id).prompt) });
  }
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");
  function snippet(text, query) {
    const flat = text.replace(/\s+/g, " ");
    const index = flat.toLowerCase().indexOf(query.toLowerCase());
    const start = Math.max(0, index - 24);
    const piece = flat.slice(start, index + query.length + 40);
    const at = index - start;
    return [start > 0 ? "…" : "", piece.slice(0, at), el("mark", { text: piece.slice(at, at + query.length) }), piece.slice(at + query.length), "…"];
  }
  function runSearch() {
    const query = searchInput.value.trim();
    if (!query) { closeSearch(); return; }
    const hits = searchIndex.filter((entry) => entry.text.toLowerCase().includes(query.toLowerCase())).slice(0, 8);
    searchResults.replaceChildren(...(hits.length ? hits.map((hit) => el("button", {
      role: "option",
      onclick: () => { closeSearch(); searchInput.value = ""; openSection(hit.section.id, { itemId: hit.item ? hit.item.id : null }); },
    }, [el("small", { text: hit.label }), el("span", {}, snippet(hit.text, query))])) : [el("div", { class: "empty", text: "見つかりませんでした" })]));

  }

  function renderLesson() {

    if (ownDue.length) opening.push(blockOf("revisit", "この節の復習", "前に解いたこの節の問題のうち、もう一度確かめる日が来たものです。", ownDue));

    const article = el("article", { class: "panel article" }, [
      el("span", { class: "sec-no", text: sectionCode(section) }),
      el("h1", { text: section.title }),
      el("div", { class: "meta" }, [

      el("div", { class: "guide" }, [el("b", { text: "⚡" }), "各項目のすぐ下に「すぐ確認」があります。問題文を読んで答えを思い浮かべると、選択肢が出ます。すべてに一度正解すると、次の節へ進めます。"]),
      ...blocks,
      el("div", { id: "retry-end" }),
      sources.length ? el("details", { class: "sources" }, [
        el("summary", { text: `参考出典（${sources.length}件）` }),
        el("ul", {}, sources.map((fact) => el("li", {}, [el("span", { class: "rank", text: fact.rank }), fact.claim + " ", el("a", { href: fact.url, target: "_blank", rel: "noopener", text: "出典" })]))),
      ]) : null,
    ]);

    // 章の最後の節では、次へで章末演習に進む
    const toExercise = chapter.sections[chapter.sections.length - 1] === section && (chapter.exercise || []).length > 0;
    const nextButton = el("button", { class: "btn", id: "next-sec", onclick: () => toExercise || !next ? startRun("chapter", chapter.id) : openSection(next.id) });
    const main = el("div", { style: "min-width:0" }, [
      el("div", { class: "lesson-top" }, [
        el("div", { class: "crumbs" }, [
          el("button", { class: "btn small toc-open-btn", text: "☰ 目次", onclick: openToc }),
          el("button", { class: "link-btn", text: "ホーム", onclick: () => showView("home") }), "›",
          el("span", { text: chapterLabel(chapter) }), "›", el("span", { text: sectionCode(section) }),
        ]),

      article,
      el("div", { class: "pager" }, [
        prev ? el("button", { class: "btn", text: `‹ ${sectionCode(prev)} ${prev.title}`, onclick: () => openSection(prev.id) }) : el("span"),
        nextButton,
      ]),
      el("p", { class: "gate-text", id: "gate-text" }),
    ]);

    const memo = el("textarea", { class: "memo", id: "memo", placeholder: "気づいたことを書き留めておけます（このブラウザに保存されます）", "aria-label": "メモ" });
    memo.value = progress.memos[section.id] || "";
    let memoTimer = null;
    memo.addEventListener("input", () => {
      clearTimeout(memoTimer);
      memoTimer = setTimeout(() => { if (memo.value) progress.memos[section.id] = memo.value; else delete progress.memos[section.id]; saveProgress(); }, 400);
    });
    const side = el("aside", { class: "side" }, [
      el("section", { class: "panel" }, [
        el("h3", { text: "本文とすぐ確認の対応" }),
        el("div", { class: "side-gate", id: "side-gate" }),
        el("div", { class: "map", id: "side-map" }),
      ]),
      section.keyPoints && section.keyPoints.length ? el("section", { class: "panel" }, [el("h3", { text: "この節の要点" }), el("ul", { class: "keypoints" }, section.keyPoints.map((p) => el("li", { html: p })))]) : null,
      el("section", { class: "panel" }, [el("h3", { text: "メモ" }), memo]),
    ]);

    app.append(el("div", { class: "lesson", id: "lesson" }, [toc, main, side]), backdrop);
    updateLessonStatus();
  }
  function blockOf(kind, title, text, ids) {
    return el("div", { class: `check ${kind === "warmup" ? "warmup" : ""}` }, [
      el("div", { class: "check-head" }, [el("span", { class: "check-badge", text: title }), el("span", { text })]),
      ...ids.map((id) => el("div", { style: "margin-top:10px" }, [questionCard(id, { record: true, label: el("span", { text: scopeLabel(id) }), onDone: () => updateLessonStatus() }).el])),
    ]);
  }
  function renderBlock(section, item, index) {
    const children = [];
    if (item.kind === "example") {
      children.push(el("div", { class: "example", id: `head-${item.id}` }, [
        el("div", { class: "example-head" }, [el("span", { class: "lbl", text: "例題" }), el("b", { html: item.title })]),
        el("div", { class: "lesson-body", html: item.body }),
      ]));
    } else {
      children.push(el("h2", { id: `head-${item.id}`, text: itemLabel(item) }));
      children.push(el("div", { class: "lesson-body", html: item.body }));
    }
    children.push(checkBox(section, item, index));
    children.push(el("div", { class: "retry-slot", "data-after": item.id }));
    return el("section", { class: "block", id: `blk-${item.id}`, "data-item": item.id }, children);
  }
  // すぐ確認：初めて解くときは記録する。もう解いた問題は、出題日が来たら上の「この節の復習」に出るので、ここでは練習として解ける
  function checkBox(section, item, index) {
    const id = item.check.id;
    const isExample = item.kind === "example";
    const box = el("div", { class: "check", id: `chk-${id}` }, [
      el("div", { class: "check-head" }, [
        el("span", { class: "check-badge", text: `⚡ すぐ確認 ${index + 1}${isExample ? "　類題" : ""}` }),
        el("span", { text: isExample ? "「例題」と同じ考え方で" : `「${itemLabel(item)}」から` }),
      ]),
    ]);
    const r = recOf(id);
    if (r.everCorrect || r.status === "excluded") {
      const holder = el("div");
      const summary = el("div", { class: "q-done" }, [
        r.status === "excluded" ? null : el("span", { class: "okmark", text: "✓ 正解済み" }),
        stateTag(id),
        el("button", { class: "link-btn", type: "button", text: r.status === "excluded" ? "問題を見る" : "練習で解く（記録しない）", onclick: () => { holder.replaceChildren(questionCard(id, { practice: true, onDone: () => updateLessonStatus(), onExcludeChange: () => updateLessonStatus() }).el); setTimeout(startVisibleCards, 0); } }),
      ]);
      holder.append(summary);
      box.append(holder);
      return box;
    }
    box.append(questionCard(id, {
      record: true,
      retryNote: "この問題は、次の項目を読んだあとにもう一度出します。",
      onDone: (res) => {
        updateLessonStatus();
        if (!res.correct) queueRetry(section, item, id);
        else if (isSectionDone(section)) { setTimeout(celebrateBig, 250); showToast("🔓 すぐ確認に全問正解しました。次の節へ進めます。"); }
      },
      onExcludeChange: () => updateLessonStatus(),
    }).el);
    return box;
  }
  // 間違えたすぐ確認は、次の項目のあと（最後の項目なら節の終わり）にもう一度出す
  function queueRetry(section, item, id) {
    const count = (lesson.retries[id] || 0) + 1;
    if (count > MAX_RETRY) return;
    lesson.retries[id] = count;
    const i = section.items.indexOf(item);
    const nextItem = section.items[i + 1];
    const slot = nextItem ? document.querySelector(`.retry-slot[data-after="${nextItem.id}"]`) : document.getElementById("retry-end");
    if (!slot) return;
    slot.append(el("div", { class: "check retry" }, [
      el("div", { class: "check-head" }, [el("span", { class: "check-badge", text: "↻ もう一度" }), el("span", { text: `さっき間違えた「${itemLabel(item)}」の問題です` })]),
      questionCard(id, {
        record: true, retry: true,
        retryNote: "日を変えて、もう一度出します。",
        onDone: (res) => {
          updateLessonStatus();
          if (!res.correct) queueRetry(section, nextItem || item, id);
          else if (isSectionDone(section)) { setTimeout(celebrateBig, 250); showToast("🔓 すぐ確認に全問正解しました。次の節へ進めます。"); }
        },
        onExcludeChange: () => updateLessonStatus(),
      }).el,
    ]));
    setTimeout(startVisibleCards, 0);
  }
  function updateLessonStatus() {
    if (currentView !== "lesson" || !lesson) return;
    const section = sectionById.get(lesson.sectionId);
    const ids = sectionChecks(section);
    const left = ids.filter((id) => !recOf(id).everCorrect).length;
    const index = orderedSections.indexOf(section);
    const next = orderedSections[index + 1];
    const chapter = chapterBySectionId.get(section.id);
    const nextButton = document.getElementById("next-sec");
    const toExercise = chapter.sections[chapter.sections.length - 1] === section && (chapter.exercise || []).length > 0;
    const target = toExercise ? `第${chapterNo(chapter)}章 章末演習` : next ? `${sectionCode(next)} ${next.title}` : null;
    nextButton.hidden = !target;
    nextButton.disabled = left > 0;
    nextButton.className = `btn${left ? "" : " primary"}`;
    nextButton.textContent = `${left ? "🔒 " : ""}${target} ›`;
    const gate = document.getElementById("gate-text");
    gate.replaceChildren(left ? "すぐ確認すべてに一度正解すると、次へ進めます（あと " : "🔓 次へ進めます", left ? el("b", { text: String(left) }) : null, left ? " 問）" : null);
    gate.classList.toggle("open", left === 0);
    const sideGate = document.getElementById("side-gate");
    sideGate.replaceChildren(left ? "🔒 次へ進むまで あと " : "🔓 次へ進めます", left ? el("b", { text: String(left) }) : null, left ? " 問正解" : null);
    sideGate.classList.toggle("open", left === 0);
    renderHeader();
    document.getElementById("side-map").replaceChildren(...section.items.map((item) => el("button", { type: "button", onclick: () => scrollToEl(document.getElementById(`blk-${item.id}`)) }, [
      el("span", {}, [el("small", { text: itemLabel(item) }), el("b", { text: recOf(item.check.id).everCorrect ? "正解済み" : "未正解" })]),
      stateTag(item.check.id),
    ])));
  }

  // ===== 今日の想起・演習・模擬試験 =====
  // kind: today（期日が来た問題）/ chapter（章末演習）/ final（総合演習）/ mock（模擬試験。記録しない）
  function startRun(kind, chapterId = null) {
    const chapter = chapterId ? chapters.find((c) => c.id === chapterId) : null;
    let ids;
    let title;
    let label;
    // 演習：まだ解いていない問題 → 期日が来た問題 の順（覚えた問題・出さない問題は出さない）
    const pickDrill = (questions) => {
      const list = questions.map((q) => q.id).filter(isActive);
      return [...list.filter((id) => stateOf(id) === "new"), ...sortDue(list.filter((id) => stateOf(id) === "due"))].slice(0, RUN_SIZE);
    };
    if (kind === "today") { ids = interleave(sortDue(dueIds())).slice(0, RUN_SIZE); title = "今日の想起"; label = "もう一度確かめる日が来た問題"; }
    else if (kind === "chapter") { ids = pickDrill(chapter.exercise || []); title = "章末演習"; label = chapterLabel(chapter); }
    else if (kind === "final") { ids = pickDrill(finalExam); title = "総合演習"; label = "章をまたいだ問題"; }
    else { ids = shuffled([...drillChapter.keys()].filter(isActive)).slice(0, content.meta.exam.questionCount); title = "模擬試験"; label = `${content.meta.exam.minutes}分`; }
    if (!ids.length) { showToast(kind === "today" ? "今日解く問題はありません。" : "いま出す問題はありません。まだ覚えていない問題は、出題日が来たら「今日の想起」に出ます。"); return; }
    const backSection = currentView === "lesson" && lesson ? lesson.sectionId : null;
    run = { kind, chapterId, title, label, backSection, queue: ids.slice(), retries: {}, log: [], current: null, startedAt: Date.now(), finished: false, celebrated: false, total: ids.length };
    confettiPieces = [];
    currentView = "run";
    advanceRun(true);
  }
  function advanceRun(first = false) {
    if (run.card) run.card.stop();
    run.current = run.queue.shift() || null;
    if (!run.current) run.finished = true;
    if (first) render(); else render({ keepScroll: false });
  }
  function finishRun() { if (run.card) run.card.stop(); run.finished = true; render(); }
  function leaveRun() {
    if (run.kind === "mock" && !run.finished) { finishRun(); return; }
    const back = run.backSection;
    if (run.card) run.card.stop();
    run = null;
    if (back) openSection(back); else showView("home");
  }
  function renderRun() {
    if (!run) { currentView = "home"; renderHome(); return; }
    const answered = run.log.length;
    const bar = el("div", { class: "run-bar" }, [
      el("button", { class: "btn", text: run.kind === "mock" && !run.finished ? "‹ 採点して終了" : run.backSection ? "‹ 教科書に戻る" : "‹ ホームへ", onclick: leaveRun }),
      el("div", { class: "ttl" }, [el("small", { text: run.label }), el("b", { text: run.title })]),
      el("div", { class: "run-prog" }, [
        el("b", { class: "num", text: run.finished ? `${answered}問` : `${answered + 1}問目（残り ${run.queue.length}問）` }),
        el("span", { class: "num", id: "run-time", text: runTimeText() }),
      ]),
    ]);
    app.append(bar, el("div", { class: "run" }, [run.finished ? renderRunResult() : renderRunCard(), renderRunSide()]));
  }
  function runTimeText() {
    const elapsed = (Date.now() - run.startedAt) / 1000;
    if (run.kind === "mock") return `残り ${formatClock(content.meta.exam.minutes * 60 - elapsed)}`;
    return `経過 ${formatClock(elapsed)}`;
  }
  setInterval(() => {
    if (currentView !== "run" || !run || run.finished) return;
    const node = document.getElementById("run-time");
    if (node) node.textContent = runTimeText();
    if (run.kind === "mock" && (Date.now() - run.startedAt) / 1000 >= content.meta.exam.minutes * 60) { showToast("制限時間になりました。採点します。"); finishRun(); }
  }, 1000);
  function renderRunCard() {
    const id = run.current;
    const isMock = run.kind === "mock";
    const isRetry = (run.retries[id] || 0) > 0;
    const card = questionCard(id, {
      record: !isMock, mock: isMock, retry: isRetry, startNow: true, focus: true, refs: true, autoAdvance: true,
      label: el("span", { text: `${isRetry ? "↻ もう一度 ・ " : ""}${scopeLabel(id)}` }),
      retryNote: isMock ? null : "このあと、もう一度出します。",
      onDone: (res) => {
        run.log.push({ id, correct: res.correct, response: res.response, retry: isRetry });
        if (isMock) { advanceRun(); return; }
        // 間違えた問題は、3問あとにもう一度出す（同じ回で3回まで）
        if (!res.correct && (run.retries[id] || 0) < MAX_RETRY) {
          run.retries[id] = (run.retries[id] || 0) + 1;
          run.queue.splice(Math.min(RETRY_GAP, run.queue.length), 0, id);
        }
        renderRunSideInto();
      },
      onNext: () => advanceRun(),
      onExcludeChange: (on) => { if (on) { run.queue = run.queue.filter((x) => x !== id); renderRunSideInto(); } },
    });
    run.card = card;
    keyTarget = card;
    const wrap = el("section", { class: "panel card", id: "run-card" }, [card.el]);
    if (isMock) wrap.append(el("div", { class: "submit-row" }, [el("span", { class: "kbd-hint", text: "答えると次の問題へ進みます" })]));
    else wrap.append(el("div", { class: "submit-row" }, [el("span", { class: "kbd-hint", text: "選択肢は数字キーでも選べます" })]));
    return wrap;
  }
  function renderRunSide() { return el("aside", { class: "side", id: "run-side" }, runSideChildren()); }
  function renderRunSideInto() { const side = document.getElementById("run-side"); if (side) side.replaceChildren(...runSideChildren()); }
  function runSideChildren() {
    const isMock = run.kind === "mock";
    const rows = run.log.map((entry, i) => el("div", {}, [el("span", { text: `${i + 1}. ${scopeLabel(entry.id)}${entry.retry ? "（もう一度）" : ""}` }), isMock && !run.finished ? el("span", { class: "muted", text: "回答済み" }) : el("span", { class: entry.correct ? "ok" : "ng", text: entry.correct ? "○" : "×" })]));
    if (!run.finished && run.current) rows.push(el("div", { class: "cur" }, [el("span", { text: `${run.log.length + 1}. ${scopeLabel(run.current)}` }), el("span", { class: "muted", text: "解答中" })]));
    return [el("section", { class: "panel" }, [
      el("h3", { style: "font-size:.9rem", text: "この回の問題" }),
      el("p", { class: "muted", style: "font-size:.8rem;margin:0", text: isMock ? "答えると次の問題へ進みます。" : `残り ${run.queue.length}問。間違えた問題は、少しあとにもう一度出ます。` }),
      el("div", { class: "queue" }, rows),
    ])];
  }
  function renderRunResult() {
    keyTarget = null;
    const isMock = run.kind === "mock";
    const firstTries = run.log.filter((e) => !e.retry);
    const okFirst = firstTries.filter((e) => e.correct).length;
    const ids = [...new Set(run.log.map((e) => e.id))];
    const closedNow = ids.filter((id) => recOf(id).closedOn === today()).length;
    const children = [el("div", { class: "eyebrow", text: `${run.label} ${run.title}の結果` })];
    children.push(el("div", { class: "score num", style: "margin:10px 0" }, [String(okFirst), el("small", { text: `/ ${firstTries.length} 問 正解（1回目）` })]));
    if (isMock) {
      const rate = firstTries.length ? Math.round((okFirst / firstTries.length) * 100) : 0;
      const passing = content.meta.exam.passingRate;
      children.push(el("p", { style: "font-weight:700;font-size:1.1rem", text: passing ? `正答率 ${rate}%（合格ライン ${passing}%）… ${rate >= passing ? "合格" : "不合格"}` : `正答率 ${rate}%` }));
      children.push(el("p", { class: "muted", text: "模擬試験の結果は学習履歴に記録しません。" }));
      if (passing && rate >= passing && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    } else {
      children.push(el("p", { class: "muted", text: closedNow ? `この回で ${closedNow}問を「覚えた」にしました。` : "覚えていない問題は、日を変えてもう一度出します。" }));
      if (okFirst === firstTries.length && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    }
    const buttons = [el("button", { class: "btn", text: "ホームへ", onclick: () => { run = null; showView("home"); } })];
    if (run.kind === "chapter") {
      const chapter = chapters.find((c) => c.id === run.chapterId);
      const nextChapter = chapters[chapters.indexOf(chapter) + 1];
      if (nextChapter) buttons.push(el("button", { class: "btn primary", text: `第${chapterNo(nextChapter)}章 ${nextChapter.title}へ ›`, onclick: () => { run = null; openSection(nextChapter.sections[0].id); } }));
    }
    children.push(el("div", { class: "btn-row", style: "justify-content:center;margin-top:16px" }, buttons));
    if (isMock) {
      for (const entry of run.log.filter((e) => !e.correct)) {
        const q = questionById.get(entry.id);
        children.push(el("div", { class: "miss" }, [
          el("div", { html: q.type === "truefalse" ? `「${q.prompt}」` : q.prompt }),
          el("p", {}, [el("b", { text: "正解：" }), el("span", { style: "white-space:pre-line", text: correctAnswerText(q, null) })]),
          el("p", { class: "muted", html: q.explanation }),
        ]));
      }
    }
    return el("section", { class: "panel card done-card" }, children);
  }

  // ===== 設定（学習履歴・出さない問題） =====
  function renderSettings() {
    const resetButton = el("button", { class: "btn danger", text: "学習履歴を消す" });
    resetButton.addEventListener("click", () => {
      if (resetButton.dataset.armed) { progress = createEmptyProgress(); saveProgress(); run = null; showToast("学習履歴を消しました。"); render(); }
      else { resetButton.dataset.armed = "1"; resetButton.textContent = "もう一度押すと消えます"; }
    });
    const excluded = allIds.filter((id) => !isActive(id));
    app.append(el("div", { class: "settings" }, [
      el("h1", { text: "⚙ 設定" }),
      el("section", { class: "panel" }, [
        el("h3", { style: "margin:0 0 6px", text: "出さない問題" }),
        el("p", { class: "muted", style: "font-size:.88rem;margin:0", text: "「この問題はもう出さない」にした問題です。戻すと、また出題します。この一覧は、学習履歴の書き出しに含まれます（教材を直すときの材料になります）。" }),
        excluded.length ? el("div", { class: "ex-list" }, excluded.map((id) => el("div", { class: "ex-row" }, [
          el("span", {}, [el("small", { class: "muted", text: scopeLabel(id) + "　" }), stripTags(questionById.get(id).prompt)]),
          el("button", { class: "btn small", text: "出題に戻す", onclick: () => { setExcluded(id, false); showToast("出題に戻しました。"); render(); } }),
        ]))) : el("p", { class: "muted", style: "font-size:.88rem", text: "いまはありません。" }),
      ]),
      el("section", { class: "panel" }, [
        el("h3", { style: "margin:0 0 6px", text: "学習履歴" }),
        el("p", { class: "muted", style: "font-size:.88rem;margin:0 0 14px", text: "学習履歴（問題ごとの結果と次の出題日、出さない問題、メモ）はこのブラウザにだけ保存されます。ブラウザを変えるときやデータを消す前に、書き出して控えを取ってください。" }),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn", text: "書き出す", onclick: exportProgress }),
          el("button", { class: "btn", text: "読み込む", onclick: () => document.getElementById("import-file").click() }),
          resetButton,
        ]),
      ]),
      el("div", {}, [el("button", { class: "btn", text: "‹ ホームへ", onclick: () => showView("home") })]),
    ]));
  }
  function exportProgress() {
    const data = { ...progress, excludedQuestions: allIds.filter((id) => !isActive(id)).map((id) => ({ id, where: scopeLabel(id), prompt: stripTags(questionById.get(id).prompt) })) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const link = el("a", { href: URL.createObjectURL(blob), download: `study-kit_${content.meta.id}_${today()}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }
  document.getElementById("import-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (imported.contentId !== content.meta.id) { showToast(`別の教材の履歴です（${imported.contentId}）。読み込みませんでした。`); return; }
      if (imported.version !== PROGRESS_VERSION) { showToast("古い形式の学習履歴のため読み込めませんでした。"); return; }
      delete imported.excludedQuestions;
      progress = normalizeProgress(imported);
      saveProgress();
      run = null;
      showToast("学習履歴を読み込みました。");
      render();
    } catch (error) {
      showToast("学習履歴のファイルを読めませんでした。");
    }
  });

  // ===== 起動 =====
  document.title = content.meta.title;
  document.getElementById("brand-title").textContent = content.meta.title;
  document.getElementById("brand-series").textContent = content.meta.series || "";
  if (debugToday) document.getElementById("brand-series").textContent = `検証用の日付：${today()}`;
  render();
})();
</script>
</body>
</html>
