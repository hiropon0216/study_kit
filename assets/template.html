<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Kit</title>
<style>
/* ===== テーマ（案C アーケード：明るい地に、太い黒枠とずらした影のカード） ===== */
:root {
  color-scheme: light;
  --bg: #eef2f8;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --ink: #1d1f2e;            /* 枠線・影・文字 */
  --text: #1d1f2e;
  --muted: #5b6275;
  --faint: #8a90a0;
  --line: #d5dae6;
  --primary: #6b4ef6;        /* 主なボタン（紫） */
  --primary-dark: #4f35d6;
  --primary-soft: #ece8ff;
  --accent: #ff6a2c;         /* 進むボタン・番号（橙） */
  --accent-soft: #ffe1d3;
  --yellow: #ffd84d;         /* 今日の想起・今日出す */
  --yellow-soft: #fff4c2;
  --green: #22b35e;          /* 正解・覚えた */
  --green-soft: #d5f3df;
  --red: #ef4d4d;            /* 不正解 */
  --red-soft: #ffdede;
  --blue: #3a6fe0;           /* 次の出題日 */
  --blue-soft: #c9dcff;
  --lavender: #f0ecff;
  --code-bg: #f1f3f8;
  --pre-bg: #1e2030;
  --shadow: 4px 4px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --radius: 16px;
  --font: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", Meiryo, system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.8; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
a { color: var(--primary); }
h1, h2, h3, h4 { text-wrap: balance; }
code, pre { font-family: var(--mono); font-size: 0.9em; }
:not(pre) > code { background: var(--code-bg); border: 1px solid var(--ink); padding: 0.02em 0.45em; border-radius: 6px; }
pre { background: var(--pre-bg); color: #e8eaf3; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--ink); overflow-x: auto; line-height: 1.6; margin: 0.9em 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }

/* ===== 共通部品 ===== */
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 7px 16px; font-weight: 700; font-size: 0.9rem; line-height: 1.5; color: var(--text); box-shadow: var(--shadow-sm); transition: transform 0.06s, box-shadow 0.06s; text-decoration: none; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--primary); color: #fff; }
.btn.go { background: var(--accent); color: #fff; }
.btn.danger { color: var(--red); }
.btn:disabled { background: #e3e6ee; color: var(--faint); border-color: var(--faint); box-shadow: 3px 3px 0 var(--faint); }
.btn.block { width: 100%; padding: 10px 16px; }
.btn.small { padding: 3px 12px; font-size: 0.8rem; }
.btn kbd { font-family: var(--mono); font-size: 0.72rem; border: 1.5px solid currentColor; border-radius: 5px; padding: 0 5px; line-height: 1.4; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 1px 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--surface); white-space: nowrap; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 0 9px; border-radius: 99px; border: 1.5px solid var(--ink); background: #e3e6ee; color: var(--text); white-space: nowrap; }
.tag.ok { background: var(--green-soft); }
.tag.now { background: var(--blue-soft); }
.meter { height: 10px; border-radius: 99px; background: #e3e6ee; border: 1.5px solid var(--ink); overflow: hidden; }
.meter > span { display: block; height: 100%; background: var(--green); transition: width 0.5s ease; }
.eyebrow { display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 1px 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--surface); }
.link-btn { background: none; border: none; padding: 0; color: var(--primary); text-decoration: underline; text-underline-offset: 3px; text-align: left; font-weight: 700; }
.flash { animation: flash 1.8s ease-out; border-radius: 8px; }
@keyframes flash { 0%, 35% { background: var(--yellow-soft); } 100% { background: transparent; } }
.shake { animation: shake 0.4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
@keyframes pop { from { transform: scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
.kbd-hint { font-size: 0.75rem; color: var(--muted); }

/* ===== 上部バー ===== */
.appbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--surface); border-bottom: 2px solid var(--ink); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: none; padding: 0; text-align: left; margin-right: auto; }
.brand-icon { display: none; }
.brand-name { line-height: 1.25; min-width: 0; }
.brand-name small { display: block; font-size: 0.72rem; color: var(--muted); }
.brand-name strong { display: block; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
.search { position: relative; flex: 0 1 380px; min-width: 0; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 2px solid var(--ink); border-radius: 99px; padding: 5px 14px; }
.search-box input { background: none; border: none; outline: none; width: 100%; font-size: 0.88rem; }
.search-box input::placeholder { color: var(--faint); }
.search-results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: min(420px, 90vw); background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; max-height: 60vh; overflow-y: auto; z-index: 40; }
.search-results button { display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px; padding: 8px 10px; }
.search-results button:hover, .search-results button:focus-visible { background: var(--surface-2); }
.search-results small { display: block; color: var(--muted); font-size: 0.72rem; }
.search-results span { display: block; font-size: 0.85rem; line-height: 1.5; }
.search-results mark { background: var(--yellow); color: var(--ink); border-radius: 3px; }
.search-results .empty { padding: 8px 10px; color: var(--muted); font-size: 0.85rem; }
.appbar .spacer { display: none; }
.hdr-progress { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.hdr-progress .meter { width: 96px; }
.gear { width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--ink); background: var(--surface); box-shadow: var(--shadow-sm); display: grid; place-items: center; flex: none; font-size: 1rem; }
.gear[aria-current="page"] { background: var(--yellow); }

main { padding: 28px 20px 70px; }
.wrap { max-width: 1040px; margin: 0 auto; }

/* ===== ホーム ===== */
.home { display: grid; gap: 22px; }
.home-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 22px; }
.today-card { background: var(--yellow); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 24px 28px; }
.today-card h2 { margin: 12px 0 4px; font-size: 1.05rem; display: flex; align-items: baseline; gap: 8px; }
.today-card h2 b { font-size: 4.2rem; line-height: 1; }
.today-card p { margin: 0; font-size: 0.85rem; }
.today-card .btn { font-size: 1.05rem; padding: 12px 28px; }
.big-pct { font-size: 3rem; font-weight: 700; line-height: 1.1; margin: 10px 0 10px; }
.big-pct small { font-size: 1rem; margin-left: 4px; }
.split { display: flex; justify-content: space-between; gap: 10px; font-size: 0.8rem; font-weight: 700; margin-top: 8px; }
.resume { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 16px 22px; }
.resume .where { min-width: 0; flex: 1; }
.resume .where small { display: block; font-size: 0.78rem; color: var(--muted); }
.resume .where b { font-size: 1.2rem; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); }
.dots i.on { background: var(--green); }
.resume .info { font-size: 0.8rem; font-weight: 700; white-space: nowrap; }
.sec-title { font-size: 1.15rem; margin: 6px 0 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
.chapter-card { display: grid; gap: 12px; text-align: left; background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; transition: transform 0.06s, box-shadow 0.06s; }
.chapter-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.chapter-card.untouched { border-color: var(--muted); box-shadow: 4px 4px 0 var(--faint); }
.chapter-card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.chapter-card .no { width: 42px; height: 42px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 10px; background: var(--blue-soft); font-weight: 700; font-size: 1.15rem; }
.chapter-card.untouched .no { background: #e3e6ee; }
.chapter-card h3 { font-size: 1.05rem; margin: 0; line-height: 1.4; }
.chapter-card .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; font-weight: 700; }
.home-bottom { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.drill-card { display: grid; gap: 10px; align-content: space-between; }
.drill-card p { margin: 0; font-size: 0.9rem; }
.drill-card .btn { justify-self: start; }
.eyebrow.final { background: var(--accent-soft); }
.eyebrow.mock { background: var(--lavender); }
.eyebrow.goal { background: var(--green-soft); }
.eyebrow.today { background: var(--surface); }
.goal-list { margin: 10px 0 0; padding-left: 1.2em; font-size: 0.86rem; }

/* ===== 節のページ（見開き：左ページ＝教科書、右ページ＝問題集） ===== */
.lesson { max-width: 1440px; margin: 0 auto; }
/* 目次は左からスライドして出す（見開きに幅を使うため、常に隠しておく） */
.toc { position: fixed; z-index: 50; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); overflow-y: auto; background: var(--bg); border-right: 2px solid var(--ink); padding: 14px 16px; font-size: 0.84rem; transform: translateX(-105%); transition: transform 0.25s ease; }
.toc.open { transform: none; }
.toc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.toc .ch { font-weight: 700; font-size: 0.82rem; margin: 14px 0 6px; }
.toc-link { display: flex; gap: 8px; align-items: flex-start; width: 100%; padding: 5px 8px; border-radius: 10px; color: var(--text); background: none; border: 2px solid transparent; text-align: left; line-height: 1.5; }
.toc-link:hover { background: var(--surface); }
.toc-link.current { background: var(--surface); border-color: var(--ink); box-shadow: var(--shadow-sm); font-weight: 700; }
.toc .st { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--ink); flex: none; display: grid; place-items: center; font-size: 9px; margin-top: 2px; background: var(--surface); }
.toc .st.done { background: var(--green); color: #fff; }
.toc .st.cur { background: linear-gradient(90deg, var(--yellow) 50%, var(--surface) 50%); }
.toc .drill-link { display: inline-block; margin: 6px 0 2px 8px; font-size: 0.78rem; font-weight: 700; padding: 1px 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--accent-soft); }
.toc .drill-link.final { background: var(--lavender); }
.toc-backdrop { position: fixed; inset: 0; z-index: 45; background: rgba(29, 31, 46, 0.45); opacity: 0; pointer-events: none; transition: opacity 0.25s; }
.toc-backdrop.open { opacity: 1; pointer-events: auto; }

.lesson-bar { display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 16px; scroll-margin-top: 80px; }
.lesson-bar .ttl { margin-right: auto; min-width: 0; line-height: 1.3; }
.lesson-bar .ttl small { display: block; font-size: 0.78rem; color: var(--muted); }
.lesson-bar h1 { margin: 2px 0 0; font-size: 1.5rem; display: flex; align-items: center; gap: 10px; line-height: 1.35; }
.sec-no { display: grid; place-items: center; min-width: 46px; height: 38px; padding: 0 8px; border: 2px solid var(--ink); border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; font-size: 1rem; box-shadow: var(--shadow-sm); flex: none; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.78rem; }
.meta span { padding: 0 10px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--surface); }
.gate-pill { font-size: 0.8rem; font-weight: 700; padding: 3px 12px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--yellow-soft); }
.gate-pill.open { background: var(--green-soft); }

.page-tabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.page-tabs .lbl { font-size: 0.78rem; color: var(--muted); margin-right: 2px; }
.page-tabs button { min-width: 40px; height: 40px; padding: 0 10px; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); font-weight: 700; font-size: 0.85rem; box-shadow: var(--shadow-sm); }
.page-tabs button.ok { background: var(--green); color: #fff; }
.page-tabs button.due { background: var(--yellow); }
.page-tabs button.cur { outline: 3px solid var(--primary); outline-offset: 2px; }

.book { display: grid; grid-template-columns: minmax(0, 1.15fr) 14px minmax(0, 1fr); border: 2px solid var(--ink); border-radius: 18px; box-shadow: 6px 6px 0 var(--ink); background: var(--surface); overflow: clip; }
.page { padding: 22px 30px 30px; min-width: 0; }
.page.left { background: #fffdf7; }
.page.right .pin { position: sticky; top: 84px; }
.gutter { background: linear-gradient(90deg, #e3e6ef, #c9cede 50%, #e3e6ef); border-left: 2px solid var(--ink); border-right: 2px solid var(--ink); }
.page-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; font-size: 0.78rem; color: var(--muted); }
.page-tag { font-size: 0.75rem; font-weight: 700; padding: 1px 12px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--ink); color: #fff; }
.page.right .page-tag { background: var(--primary); border-color: var(--primary); }
.page h2 { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; margin: 0 0 12px; line-height: 1.4; }
.page h2 .no { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border: 2px solid var(--ink); border-radius: 8px; background: var(--accent); color: #fff; font-size: 0.95rem; box-shadow: var(--shadow-sm); }
.page.right .check:first-of-type { margin-top: 26px; }
.cover-list { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; font-size: 1rem; }
.example { border: 2px solid var(--ink); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 22px 20px 14px; margin: 16px 0 0; position: relative; }
.example::before { content: "例題"; position: absolute; top: -13px; left: 16px; font-size: 0.75rem; font-weight: 700; padding: 1px 12px; border-radius: 99px; background: var(--ink); color: #fff; }
.example-head b { font-size: 1rem; }
.sources { margin-top: 26px; padding-top: 14px; border-top: 2px dashed var(--line); font-size: 0.85rem; }
.sources summary { cursor: pointer; font-weight: 700; }
.sources ul { padding-left: 0; list-style: none; }
.sources li { margin: 6px 0; }
.rank { display: inline-block; min-width: 1.7em; text-align: center; font-size: 0.75em; font-weight: 700; border-radius: 4px; margin-right: 6px; background: var(--primary-soft); color: var(--primary); }
.book-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.end-next { margin-top: 24px; border-top: 2px dashed var(--line); padding-top: 16px; display: grid; justify-items: end; gap: 8px; }
.gate-text { text-align: right; font-size: 0.8rem; font-weight: 700; margin: 0; }
.gate-text b { background: var(--yellow); border: 1.5px solid var(--ink); border-radius: 6px; padding: 0 6px; }
.gate-text.open { color: var(--green); }

/* 予告問題（読む前に問いだけ見せる） */
.preview { margin-top: 14px; border: 2px dashed var(--primary); background: var(--lavender); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; justify-items: start; }
.preview p { margin: 0; font-size: 0.85rem; color: var(--primary-dark); font-weight: 700; }
/* 伏せ字（2回目に開いた項目のキーワード） */
.mask-bar { display: flex; gap: 6px 12px; flex-wrap: wrap; align-items: center; background: var(--lavender); border: 1.5px solid var(--primary); border-radius: 10px; padding: 6px 12px; font-size: 0.8rem; margin-bottom: 14px; }
.mask { display: inline; font: inherit; font-weight: 700; color: transparent; padding: 0 0.3em; margin: 0 0.1em; border: none; border-bottom: 2px solid var(--primary); border-radius: 4px; background: repeating-linear-gradient(135deg, var(--primary-soft) 0 6px, #ddd4ff 6px 12px); cursor: pointer; }
.mask:hover, .mask:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* すぐ確認・問題のまとまり（左上にタブを付けたカード） */
.check { margin: 30px 0 10px; border: 2px solid var(--ink); background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 18px 16px; position: relative; scroll-margin-top: 100px; }
.check-head { position: absolute; top: -14px; left: 14px; display: flex; gap: 8px; align-items: center; }
.check-badge { font-size: 0.75rem; font-weight: 700; padding: 1px 12px; border-radius: 99px; border: 2px solid var(--ink); background: var(--primary); color: #fff; white-space: nowrap; }
.check-head .note { display: none; }
.check.warmup { background: var(--yellow); padding: 20px 18px 18px; }
.check.warmup .check-head { position: static; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin-bottom: 4px; }
.check.warmup .check-badge { background: none; color: var(--ink); border: none; padding: 0; font-size: 0.95rem; }
.check.warmup .check-head .note { display: inline; font-size: 0.78rem; }
.check.retry { background: #fffbea; }
.check.retry .check-badge { background: var(--yellow); color: var(--ink); }
.subcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow-sm); padding: 20px 16px 14px; margin-top: 22px; position: relative; }
.subcard .type-tab { position: absolute; top: -13px; left: 12px; font-size: 0.72rem; font-weight: 700; padding: 0 10px; border-radius: 99px; border: 2px solid var(--ink); background: var(--surface); }

/* ===== 問いのカード ===== */
.qhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.qhead-l { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.78rem; color: var(--muted); }
.qs { font-size: 0.72rem; font-weight: 700; padding: 0 9px; border-radius: 99px; border: 1.5px solid var(--ink); white-space: nowrap; color: var(--ink); }
.qs.new { background: #e3e6ee; }
.qs.due { background: var(--yellow); }
.qs.wait { background: var(--blue-soft); }
.qs.closed { background: var(--green-soft); }
.qs.excluded { background: var(--surface); border-style: dashed; color: var(--muted); }
.exclude-btn { background: var(--surface); border: 1.5px solid var(--line); border-radius: 99px; padding: 0 10px; font-size: 0.72rem; color: var(--muted); }
.exclude-btn:hover { border-color: var(--red); color: var(--red); }
.q-prompt { font-weight: 700; font-size: 1.02rem; margin: 10px 0 0; }
.think { margin-top: 14px; border: 2px dashed var(--primary); background: var(--lavender); border-radius: 12px; padding: 10px 14px; }
.think-label { font-size: 0.82rem; color: var(--primary-dark); font-weight: 700; }
.think-bar { height: 10px; border-radius: 99px; background: var(--surface); border: 1.5px solid var(--ink); overflow: hidden; margin-top: 8px; }
.think-bar span { display: block; height: 100%; width: 0; background: var(--primary); }
.think-bar span.run { animation: think 3s linear forwards; }
@keyframes think { to { width: 100%; } }
.choices { display: grid; gap: 10px; margin-top: 14px; }
.choices.grid2 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-width: 0; border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; padding: 9px 14px; box-shadow: var(--shadow-sm); font-weight: 700; transition: transform 0.06s, box-shadow 0.06s; }
.choice:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.choice:disabled { cursor: default; }
.choice .k { flex: none; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 0.78rem; background: var(--surface); }
.choice .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.choice .note { flex: none; font-size: 0.75rem; font-weight: 700; }
.choice.is-ok { background: var(--green-soft); }
.choice.is-ok .k { background: var(--green); color: #fff; }
.choice.is-ng { background: var(--red-soft); }
.choice.is-ng .k { background: var(--red); color: #fff; }
.choice.dim { border-color: var(--faint); box-shadow: 3px 3px 0 var(--faint); color: var(--muted); }
.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
.ox button { height: 64px; border: 2px solid var(--ink); background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-sm); font-size: 1.6rem; }
.ox button:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.ox button.is-ok { background: var(--green-soft); }
.ox button.is-ng { background: var(--red-soft); }
.ox button.dim { border-color: var(--faint); box-shadow: 3px 3px 0 var(--faint); color: var(--faint); }
.fillrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.fillrow input { flex: 0 1 260px; min-width: 120px; background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: 9px 14px; font-size: 1.05rem; font-family: var(--mono); box-shadow: inset 2px 2px 0 rgba(29, 31, 46, 0.08); }
.fillrow input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.fillrow input.is-ok { background: var(--green-soft); }
.fillrow input.is-ng { background: var(--red-soft); }
.order-list { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
.order-item { display: flex; align-items: center; gap: 12px; padding: 7px 10px 7px 14px; border: 2px solid var(--ink); border-radius: 12px; background: var(--surface); }
.order-item .n { flex: none; font-weight: 700; }
.order-item .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.order-item .mv { display: flex; gap: 6px; }
.order-item .mv button { width: 34px; height: 34px; border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; box-shadow: 2px 2px 0 var(--ink); }
.order-item .mv button:disabled { opacity: 0.3; }
.order-list.is-ok .order-item { background: var(--green-soft); }
.order-list.is-ng .order-item { background: var(--red-soft); }
.submit-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.result { margin-top: 14px; border: 2px solid var(--ink); border-radius: 14px; padding: 14px 16px; animation: pop 0.25s ease-out; }
.result.ok { background: var(--green-soft); }
.result.ng { background: var(--red-soft); }
.result .v { font-weight: 700; font-size: 1.02rem; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.result .v code { font-size: 1rem; }
.result p { margin: 6px 0 0; font-size: 0.9rem; }
.result ul { margin: 6px 0 0; padding-left: 1.2em; font-size: 0.88rem; }
.result .sched { display: inline-block; margin-top: 10px; font-size: 0.8rem; font-weight: 700; padding: 1px 12px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--surface); }
.result .sched.retry { background: var(--yellow); }
.goto-line { margin-top: 12px; font-size: 0.85rem; font-weight: 700; }
.acts { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.q-note { margin-top: 10px; font-size: 0.86rem; color: var(--muted); }
.q-done { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 0.86rem; margin-top: 8px; }
.q-done .okmark { font-size: 0.72rem; font-weight: 700; padding: 0 9px; border-radius: 99px; border: 1.5px solid var(--ink); background: var(--green-soft); }
.q-done .practice { font-size: 0.75rem; padding: 0 10px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); color: var(--muted); }
.check.compact { padding: 14px 18px; }
.check.compact .q-prompt { font-size: 0.92rem; margin: 0; }

/* 右の列 */
.side { display: grid; gap: 22px; position: sticky; top: 84px; min-width: 0; }
.side .panel { padding: 16px 16px; }
.side h3 { margin: 0 0 10px; }
.state-dots { display: flex; gap: 8px; margin-bottom: 10px; }
.state-dots i { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font-style: normal; font-size: 0.8rem; font-weight: 700; background: var(--surface); }
.state-dots i.ok { background: var(--green); color: #fff; }
.state-dots i.due { background: var(--yellow); }
.map { display: grid; }
.map button { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left; border: none; border-bottom: 1.5px dashed var(--line); background: none; padding: 8px 2px; font-size: 0.8rem; }
.map button:last-child { border-bottom: none; }
.keypoints { margin: 0; padding-left: 1.2em; font-size: 0.85rem; }
.memo { width: 100%; min-height: 110px; resize: vertical; background: var(--surface); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 0.85rem; }

/* ===== 演習（今日の想起・章末演習・総合演習・模擬試験） ===== */
.run-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; max-width: 960px; margin: 0 auto 22px; }
.run-bar .ttl { line-height: 1.3; margin-right: auto; min-width: 0; }
.run-bar .ttl small { display: block; font-size: 0.75rem; color: var(--muted); }
.run-bar .ttl b { font-size: 1.3rem; }
.run-prog { display: flex; gap: 10px; align-items: center; }
.run-prog .pill { padding: 3px 12px; font-size: 0.82rem; }
.run { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 28px; align-items: start; max-width: 960px; margin: 0 auto; }
.run .card { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: 6px 6px 0 var(--ink); padding: 26px 26px 22px; position: relative; }
.run .card > .type-tab { position: absolute; top: -15px; left: 18px; font-size: 0.8rem; font-weight: 700; padding: 2px 14px; border-radius: 99px; border: 2px solid var(--ink); background: var(--primary); color: #fff; }
.run-foot { text-align: center; margin-top: 14px; font-size: 0.78rem; color: var(--muted); }
.grid10 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grid10 span { aspect-ratio: 1; border: 2px solid var(--ink); border-radius: 10px; background: var(--surface); position: relative; display: grid; place-items: center; font-weight: 700; }
.grid10 span small { position: absolute; top: 3px; left: 6px; font-size: 0.65rem; font-weight: 400; }
.grid10 span.ok { background: var(--green-soft); }
.grid10 span.ng { background: var(--red-soft); }
.grid10 span.again { background: var(--yellow-soft); border-style: dashed; }
.grid10 span.cur { box-shadow: 0 0 0 3px var(--primary); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.75rem; margin-top: 12px; }
.done-card { text-align: center; padding: 30px; }
.score { font-size: 2.6rem; font-weight: 700; line-height: 1.2; }
.score small { font-size: 0.9rem; color: var(--muted); font-weight: 400; margin-left: 4px; }
.miss { border: 2px solid var(--ink); border-radius: 12px; padding: 12px 16px; margin-top: 12px; text-align: left; background: var(--surface-2); }
.miss p { margin: 4px 0; font-size: 0.9rem; }

/* ===== 設定 ===== */
.settings { max-width: 720px; margin: 0 auto; display: grid; gap: 22px; }
.settings h1 { font-size: 1.5rem; margin: 0; }
.ex-list { display: grid; gap: 8px; margin-top: 10px; }
.ex-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 0.86rem; }
.ex-row span { min-width: 0; overflow-wrap: anywhere; }

/* ===== 教科書の部品（教材JSONの body で使う。references/textbook-components.md） ===== */
.lesson-body p { margin: 0.7em 0; max-width: 48em; }
.lesson-body ul, .lesson-body ol:not([class]) { padding-left: 1.4em; }
.lesson-body h3 { font-size: 1.05rem; margin: 1.4em 0 0.4em; }
.lesson-body h4 { font-size: 1rem; margin: 0 0 0.3em; }
.lesson-body table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
.lesson-body th, .lesson-body td { text-align: left; padding: 8px 12px; border-top: 1.5px solid var(--line); vertical-align: top; white-space: nowrap; }
.lesson-body th { background: var(--yellow); font-weight: 700; border-top: none; }
.lesson-body > table, .lesson-body .sk-table { display: block; overflow-x: auto; border: 2px solid var(--ink); border-radius: 12px; box-shadow: var(--shadow-sm); margin: 1.2em 0; background: var(--surface); }
/* 本文の重要語は蛍光ペンで目立たせる */
.lesson-body p strong, .lesson-body li strong, .lesson-body dd strong { background: linear-gradient(transparent 55%, var(--yellow) 55%); }

.sk-goals { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; margin: 1em 0; }
.sk-goals::before { content: "この節でわかること"; display: block; font-weight: 700; font-size: 0.8rem; }
.sk-goals ul, .sk-summary ul { margin: 4px 0 0; padding-left: 1.3em; }

.sk-premise { background: #e8f0ff; border: 2px solid var(--ink); border-radius: 12px; padding: 12px 18px; margin: 1.2em 0; }
.sk-premise::before { content: "📘 前提：" attr(data-term) " とは"; display: block; font-weight: 700; margin-bottom: 4px; }
.sk-premise p { margin: 0.35em 0; font-size: 0.92rem; }
.lesson-body .sk-premise strong { background: none; color: var(--blue); }

.sk-callout { border-radius: 12px; padding: 18px 16px 12px; margin: 1.6em 0 1.2em; position: relative; border: 2px solid var(--ink); }
.sk-callout::after { position: absolute; left: 14px; top: -12px; font-size: 0.72rem; font-weight: 700; padding: 0 10px; border-radius: 99px; border: 2px solid var(--ink); }
.sk-callout p { margin: 0.25em 0; }
.sk-callout.point { background: var(--yellow-soft); }
.sk-callout.point::after { content: "POINT"; background: var(--yellow); }
.sk-callout.warn { background: var(--red-soft); }
.sk-callout.warn::after { content: "注意"; background: var(--accent); color: #fff; }
.sk-callout.analogy { background: var(--lavender); }
.sk-callout.analogy::after { content: "たとえると"; background: var(--primary); color: #fff; }
.sk-callout.tip { background: var(--surface); }
.sk-callout.tip::after { content: "実務メモ"; background: var(--surface-2); }

.sk-terms { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 1.2em 0; }
.sk-terms > div { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; }
.sk-terms dt { display: inline-block; font-weight: 700; font-size: 0.82rem; background: var(--blue-soft); border-radius: 4px; padding: 0 6px; }
.sk-terms dd { margin: 4px 0 0; font-size: 0.85rem; }

.sk-flow { list-style: none; padding: 0; margin: 1.2em 0; display: flex; flex-wrap: wrap; gap: 14px; counter-reset: sk-step; }
.sk-flow > li { counter-increment: sk-step; flex: 1 1 120px; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 36px 10px 10px; position: relative; font-size: 0.85em; }
.sk-flow > li::before { content: counter(sk-step); position: absolute; top: 8px; left: 10px; width: 22px; height: 22px; border-radius: 50%; background: var(--yellow); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 0.75rem; }
.sk-flow > li:not(:last-child)::after { content: "›"; position: absolute; right: -11px; top: 50%; transform: translateY(-50%); font-weight: 700; z-index: 1; }

.sk-steps { list-style: none; padding: 0; margin: 1em 0; display: grid; gap: 14px; counter-reset: sk-steps; }
.sk-steps > li { counter-increment: sk-steps; position: relative; padding-left: 42px; }
.sk-steps > li::before { content: counter(sk-steps); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 8px; background: var(--yellow); border: 2px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; }
.sk-steps > li p { margin: 0 0 6px; }

.sk-nest { border: 2px solid var(--ink); border-radius: 12px; padding: 30px 12px 12px; margin: 12px 0; position: relative; background: #ffd5c6; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.sk-nest > .sk-nest { flex: 1 1 180px; margin: 0; }
.sk-nest::before { content: attr(data-label); position: absolute; top: 6px; left: 12px; font-size: 0.8rem; font-weight: 700; }
.sk-nest .sk-nest { background: #ffe9c7; }
.sk-nest .sk-nest .sk-nest { background: var(--surface); }
.sk-item { display: inline-block; background: var(--surface); border: 2px solid var(--ink); border-radius: 8px; padding: 4px 12px; font-weight: 700; font-size: 0.85em; }
.sk-caption { flex-basis: 100%; font-size: 0.8em; color: var(--muted); margin: 0; }

.sk-compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 1.2em 0; }
.sk-compare > div { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 16px; }
.sk-compare > div:nth-child(2) { background: var(--green-soft); }
.sk-compare > div:nth-child(3) { background: var(--blue-soft); }
.sk-compare h4 { font-size: 0.92rem; }
.sk-compare ul { margin: 0; padding-left: 1.2em; font-size: 0.88em; }

.sk-cells { margin: 1.2em 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 18px 16px 14px; text-align: center; }
.sk-cells > span { display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 8px; margin: 3px; border: 2px solid var(--ink); border-radius: 8px; font-family: var(--mono); font-weight: 700; background: var(--surface); vertical-align: middle; }
.sk-cells > span.on { background: var(--primary); color: #fff; }
.sk-cells > span.dim { border-style: dashed; color: var(--faint); background: var(--surface-2); }
.sk-cells[data-label]::after { content: attr(data-label); display: block; width: min(100%, 460px); margin: 8px auto 0; padding-top: 14px; font-weight: 700; font-size: 0.82rem;
  background: linear-gradient(var(--ink), var(--ink)) 0 8px / 100% 2px no-repeat, linear-gradient(var(--ink), var(--ink)) 0 0 / 2px 10px no-repeat, linear-gradient(var(--ink), var(--ink)) 100% 0 / 2px 10px no-repeat; }

.sk-figure { margin: 1.3em 0; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 16px; }
.sk-figure svg { display: block; width: 100%; height: auto; max-height: 340px; }
.sk-figure figcaption { font-size: 0.8rem; text-align: left; margin-top: 8px; }
.sk-figure .sk-fill-primary { fill: var(--primary); }
.sk-figure .sk-fill-primary-soft { fill: var(--primary-soft); }
.sk-figure .sk-fill-accent { fill: var(--green); }
.sk-figure .sk-fill-accent-soft { fill: var(--green-soft); }
.sk-figure .sk-fill-warn { fill: var(--accent); }
.sk-figure .sk-fill-warn-soft { fill: var(--accent-soft); }
.sk-figure .sk-fill-mark { fill: var(--yellow); }
.sk-figure .sk-fill-mark-soft { fill: var(--yellow-soft); }
.sk-figure .sk-fill-muted { fill: var(--surface-2); }
.sk-figure .sk-fill-surface { fill: #e3e6ee; }
.sk-figure .sk-stroke { stroke: var(--ink); }
.sk-figure .sk-stroke-primary { stroke: var(--primary); }
.sk-figure .sk-stroke-accent { stroke: var(--green); }
.sk-figure .sk-stroke-warn { stroke: var(--accent); }
.sk-figure .sk-stroke-mark { stroke: #c9a200; }
.sk-figure .sk-text { fill: var(--text); font-family: var(--font); }
.sk-figure .sk-text-muted { fill: var(--muted); font-family: var(--font); }
.sk-figure .sk-text-on { fill: #fff; font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-dark { fill: var(--ink); font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-primary { fill: var(--primary); font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-accent { fill: #178a47; font-family: var(--font); font-weight: 700; }
.sk-figure .sk-text-warn { fill: #d4511c; font-family: var(--font); font-weight: 700; }

.sk-badge { display: inline-block; font-family: var(--mono); font-size: 0.82em; font-weight: 700; padding: 0 10px; border-radius: 99px; border: 2px solid var(--ink); }
.sk-badge.ok { background: var(--green-soft); }
.sk-badge.warn { background: var(--yellow); }
.sk-badge.err { background: var(--red-soft); }
.sk-badge.info { background: var(--blue-soft); }
.sk-badge-list { display: grid; gap: 8px; margin: 1em 0; }
.sk-badge-list > div { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 12px; align-items: start; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 0.9rem; }

.sk-summary { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 10px 16px; margin: 1.4em 0 0.6em; }
.sk-summary::before { content: "⭐ まとめ"; display: block; font-weight: 700; }

/* ===== トースト・紙吹雪 ===== */
.toast { position: fixed; z-index: 70; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; max-width: calc(100vw - 32px); font-weight: 700; box-shadow: 4px 4px 0 var(--yellow); animation: pop 0.2s; }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

/* ===== 幅に合わせた並べ替え ===== */
@media (max-width: 860px) {
  .home-row, .run { grid-template-columns: minmax(0, 1fr); }
  .book { grid-template-columns: minmax(0, 1fr); }
  .gutter { height: 12px; border: none; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .page { padding: 18px 18px 24px; }
  .page.right .pin { position: static; }
  .side { position: static; }
  .search { display: none; }
  .hdr-progress .meter { display: none; }
  .brand-name strong { max-width: 50vw; }
}
@media (max-width: 480px) {
  main { padding: 18px 16px 56px; }
  .appbar { padding: 8px 16px; gap: 10px; }
  .lesson-bar h1 { font-size: 1.25rem; }
  .today-card h2 b { font-size: 3.2rem; }
  .sk-flow > li:not(:last-child)::after { display: none; }
  .sk-badge-list > div { grid-template-columns: 1fr; }
  .grid10 { grid-template-columns: repeat(5, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="appbar">
  <button class="brand" id="brand" aria-label="ホームへ">
    <span class="brand-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M6 5.5h4"/></svg></span>
    <span class="brand-name"><small id="brand-series"></small><strong id="brand-title">Study Kit</strong></span>
  </button>
  <div class="search" id="search">
    <label class="search-box"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" style="color:var(--muted)" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg><input id="search-input" type="search" placeholder="用語・問題を検索" aria-label="用語・問題を検索" autocomplete="off"></label>
    <div class="search-results" id="search-results" role="listbox" hidden></div>
  </div>
  <span class="spacer"></span>
  <span class="hdr-progress" id="hdr-progress">覚えた割合 <span class="meter"><span id="hdr-meter"></span></span><b class="num" id="hdr-pct"></b></span>
  <button class="gear" id="gear" aria-label="設定（学習履歴の書き出し・読み込み・削除）" title="設定">⚙</button>
</header>
<main id="app"></main>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script id="study-data" type="application/json">__STUDY_DATA__</script>
<script>
"use strict";
(() => {
  // ===== 定数（references/learning-engine.md） =====
  const PROGRESS_VERSION = 3;
  const RUN_SIZE = 10;          // 今日の想起・章末演習・総合演習は1回10問まで
  const THINK_MS = 3000;        // 選択肢を出す前に、問題文だけを見せる時間
  const ADVANCE_MS = 1200;      // 演習で正解したあと、次の問題へ自動で進むまでの時間
  const RETRY_GAP = 3;          // 演習で間違えた問題は、3問あとにもう一度出す
  const MAX_RETRY = 3;          // 同じ回の中でのくり返しは3回まで
  const WARMUP_SIZE = 2;        // 節を開いたときに出す、ほかの節の期日が来た問題の数
  const READ_CHARS_PER_MINUTE = 400;
  const KANA = ["ア", "イ", "ウ", "エ", "オ", "カ", "キ", "ク"];

  const app = document.getElementById("app");

  // ===== 教材データ =====
  let content;
  try {
    content = JSON.parse(document.getElementById("study-data").textContent);
  } catch (error) {
    app.innerHTML = "<p>教材データを読み込めません。scripts/build_html.py で教材JSONを埋め込んだHTMLを開いてください。</p>";
    return;
  }

  const STORAGE_KEY = "study-kit:" + content.meta.id;
  const chapters = content.chapters;
  const finalExam = content.finalExam || [];
  const sectionById = new Map();
  const chapterBySectionId = new Map();
  const questionById = new Map();   // すべての問題（すぐ確認・章末演習・総合演習）
  const checkInfo = new Map();      // すぐ確認の問題ID → { section, item }
  const drillChapter = new Map();   // 章末演習・総合演習の問題ID → 章（総合演習は null）
  const factById = new Map((content.factsheet || []).map((fact) => [fact.id, fact]));

  for (const chapter of chapters) {
    for (const section of chapter.sections) {
      sectionById.set(section.id, section);
      chapterBySectionId.set(section.id, chapter);
      let textNo = 0;
      for (const item of section.items) {
        item.kind = item.type === "example" ? "example" : "text";
        item.no = item.kind === "text" ? ++textNo : null;
        // 問題を廃止した項目は check を持たない（説明だけのページになる）
        if (!item.check) { item.check = null; continue; }
        questionById.set(item.check.id, item.check);
        checkInfo.set(item.check.id, { section, item });
      }
    }
    for (const question of chapter.exercise || []) { questionById.set(question.id, question); drillChapter.set(question.id, chapter); }
  }
  for (const question of finalExam) { questionById.set(question.id, question); drillChapter.set(question.id, null); }
  const orderedSections = chapters.flatMap((chapter) => chapter.sections);
  const allIds = [...questionById.keys()];

  const chapterNo = (chapter) => chapters.indexOf(chapter) + 1;
  function sectionCode(section) {
    const chapter = chapterBySectionId.get(section.id);
    return `${chapterNo(chapter)}-${chapter.sections.indexOf(section) + 1}`;
  }
  const chapterLabel = (chapter) => `第${chapterNo(chapter)}章 ${chapter.title}`;
  const itemLabel = (item) => (item.kind === "example" ? "例題" : `${item.no}. ${item.title}`);
  function parseRef(ref) {
    const [sectionId, itemId] = String(ref).split("#");
    const section = sectionById.get(sectionId);
    if (!section) return null;
    return { section, item: itemId ? section.items.find((item) => item.id === itemId) || null : null };
  }
  function refLabel(ref) {
    const target = parseRef(ref);
    if (!target) return "";
    const base = `${sectionCode(target.section)} ${target.section.title}`;
    return target.item ? `${base} ›「${itemLabel(target.item)}」` : base;
  }
  // 問題が教科書のどこに属するか（すぐ確認は置かれた項目、演習は refs の1件目）
  function homeOf(id) {
    const info = checkInfo.get(id);
    if (info) return { section: info.section, item: info.item };
    return parseRef((questionById.get(id).refs || [])[0]);
  }
  function scopeLabel(id) {
    if (checkInfo.has(id)) { const { section } = checkInfo.get(id); return `${sectionCode(section)} ${section.title}`; }
    const chapter = drillChapter.get(id);
    return chapter ? `第${chapterNo(chapter)}章 章末演習` : "総合演習";
  }

  // ===== 日付（端末のローカル日付。?today=YYYY-MM-DD で検証用に上書きできる） =====
  const debugToday = new URLSearchParams(location.search).get("today");
  function toDateString(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
  }
  function today() {
    if (debugToday && /^\d{4}-\d{2}-\d{2}$/.test(debugToday)) return debugToday;
    return toDateString(new Date());
  }
  function addDays(dateString, days) {
    const [y, m, d] = dateString.split("-").map(Number);
    return toDateString(new Date(y, m - 1, d + days));
  }
  function formatDate(dateString) {
    const [, m, d] = dateString.split("-").map(Number);
    if (dateString === addDays(today(), 1)) return `明日（${m}/${d}）`;
    return `${m}/${d}`;
  }

  // ===== 学習履歴 =====
  // questions[id]：status（new／learning／closed／excluded）、track（fast：2回でクローズ／standard：3回）、
  //                streak（日を変えた正解の数）、due（次に出す日）、lastCounted（最後に数えた日）、wrongDay（最後に間違えた日）、
  //                everCorrect（一度でも正解した）、attempts、lapses、lastAnswered、prevStatus（出さない前の状態）
  function createEmptyProgress() {
    return { version: PROGRESS_VERSION, contentId: content.meta.id, questions: {}, rtRatios: [], memos: {}, lastSectionId: null, stats: { answered: 0, correct: 0 } };
  }
  function normalizeProgress(saved) {
    const base = createEmptyProgress();
    if (!saved || saved.version !== PROGRESS_VERSION) return base; // 形の違う古い履歴は引き継がない
    return { ...base, ...saved, questions: saved.questions || {}, rtRatios: saved.rtRatios || [], memos: saved.memos || {}, stats: { ...base.stats, ...saved.stats } };
  }
  function loadProgress() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.contentId === content.meta.id) return normalizeProgress(saved);
    } catch (error) { /* 読めないときは空の履歴で始める */ }
    return createEmptyProgress();
  }
  let progress = loadProgress();
  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    } catch (error) {
      showToast("学習履歴を保存できませんでした。右上の ⚙ 設定から学習履歴を書き出して控えを取ってください。");
    }
  }

  // ===== 出題の判断（すべてシステムが行う） =====
  const recOf = (id) => progress.questions[id] || { status: "new", attempts: 0 };
  // 画面に出す状態：new 未出題 / due 今日出す / wait 次の出題日を待つ / closed 覚えた / excluded 出さない
  function stateOf(id) {
    const r = recOf(id);
    if (r.status === "learning") return r.due <= today() ? "due" : "wait";
    return r.status;
  }
  const isActive = (id) => recOf(id).status !== "excluded";
  const STATE_TEXT = { new: "未出題", due: "今日出す", wait: "次の出題を待つ", closed: "覚えた", excluded: "出さない" };
  function stateTag(id) {
    const s = stateOf(id);
    const text = s === "wait" ? `次は ${formatDate(recOf(id).due)}` : STATE_TEXT[s];
    return el("span", { class: `qs ${s}`, text });
  }

  // 回答時間の基準：選択肢などの文字数から見積もり、学習者のふだんの速さで補正する
  function baseMs(q) {
    if (q.type === "fill") return 3000 + Math.max(...q.answer.map((a) => a.length)) * 350;
    if (q.type === "order") return 4000 + q.options.join("").length * 60;
    if (q.type === "truefalse") return 2500 + (q.code ? 1500 : 0);
    return 2000 + q.options.join("").length * 50 + (q.code ? 1500 : 0);
  }
  function personalFactor() {
    const a = progress.rtRatios;
    if (a.length < 5) return 1;
    const sorted = [...a].sort((x, y) => x - y);
    return Math.min(1.6, Math.max(0.7, sorted[Math.floor(sorted.length / 2)]));
  }
  // good：速く正解 / hard：遅い正解、またはその日に間違えたあとの正解 / again：不正解
  function gradeOf(q, correct, rtMs, id) {
    if (!correct) return "again";
    const ratio = rtMs / baseMs(q);
    progress.rtRatios = [...progress.rtRatios, Math.round(ratio * 100) / 100].slice(-20);
    if (recOf(id).wrongDay === today()) return "hard";
    return ratio <= personalFactor() ? "good" : "hard";
  }
  // クローズまでの道筋：初回に速く正解 → 翌日もう一度正解でクローズ（2回）。それ以外は日を変えて3回正解（間隔 1日 → 3日）
  function applyResult(id, grade) {
    const r = { ...recOf(id) };
    const d = today();
    r.attempts = (r.attempts || 0) + 1;
    r.lastAnswered = d;
    progress.stats.answered += 1;
    if (grade !== "again") { progress.stats.correct += 1; r.everCorrect = true; }
    if (r.status === "excluded") { progress.questions[id] = r; saveProgress(); return r; }
    if (grade === "again") {
      if (r.status === "closed") r.reopened = d;
      r.status = "learning";
      r.track = "standard";
      r.streak = 0;
      r.due = addDays(d, 1);
      r.wrongDay = d;
      r.lapses = (r.lapses || 0) + 1;
    } else if (r.status === "new") {
      r.status = "learning";
      r.track = grade === "good" ? "fast" : "standard";
      r.streak = 1;
      r.lastCounted = d;
      r.due = addDays(d, 1);
    } else if (r.status === "learning" && r.due <= d && r.lastCounted !== d && r.wrongDay !== d) {
      // 数えるのは、期日が来た日の、その日に間違えていない正解だけ（同じ日の正解・期日前の正解は数えない）
      r.streak = (r.streak || 0) + 1;
      r.lastCounted = d;
      if (r.streak >= (r.track === "fast" ? 2 : 3)) {
        r.status = "closed";
        r.closedOn = d;
        delete r.due;
      } else {
        r.due = addDays(d, r.streak === 1 ? 1 : 3);
      }
    }
    progress.questions[id] = r;
    saveProgress();
    return r;
  }
  function setExcluded(id, on) {
    const r = { ...recOf(id) };
    if (on && r.status !== "excluded") { r.prevStatus = r.status; r.status = "excluded"; }
    if (!on && r.status === "excluded") { r.status = r.prevStatus || "new"; delete r.prevStatus; }
    progress.questions[id] = r;
    saveProgress();
  }
  const dueIds = () => allIds.filter((id) => stateOf(id) === "due");
  // 同じ節が続かないように並べ替える（混ぜて出す）
  function interleave(ids) {
    const pool = ids.slice();
    const out = [];
    while (pool.length) {
      const last = out.length ? scopeLabel(out[out.length - 1]) : null;
      const i = pool.findIndex((id) => scopeLabel(id) !== last);
      out.push(pool.splice(i === -1 ? 0 : i, 1)[0]);
    }
    return out;
  }
  function sortDue(ids) {
    return ids.slice().sort((a, b) => (recOf(a).due || "").localeCompare(recOf(b).due || "") || (recOf(b).lapses || 0) - (recOf(a).lapses || 0));
  }
  // 節の完了：その節のすぐ確認（出さない問題を除く）すべてに一度は正解した
  const sectionChecks = (section) => section.items.filter((item) => item.check).map((item) => item.check.id).filter(isActive);
  const isSectionDone = (section) => sectionChecks(section).every((id) => recOf(id).everCorrect);
  // 進捗＝覚えた（クローズした）問題 ÷ 出題する問題
  function progressPercent() {
    const active = allIds.filter(isActive);
    return active.length ? Math.floor((active.filter((id) => recOf(id).status === "closed").length / active.length) * 100) : 0;
  }
  function readingMinutes(section) {
    if (Number.isInteger(section.minutes) && section.minutes > 0) return section.minutes;
    const chars = section.items.map((item) => stripTags(item.title + item.body)).join("").length;
    return Math.max(1, Math.ceil(chars / READ_CHARS_PER_MINUTE));
  }

  // ===== 正誤判定 =====
  const normalizeFill = (text) => String(text).normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  function isAnswerCorrect(q, response) {
    if (response === null || response === undefined) return false;
    switch (q.type) {
      case "choice":
      case "predict":
      case "truefalse": return response === q.answer;
      case "fill": return q.answer.some((a) => normalizeFill(a) === normalizeFill(response));
      case "order": return response.length === q.answer.length && response.every((x, i) => x === q.answer[i]);
      default: return false;
    }
  }
  function correctAnswerText(q, view) {
    switch (q.type) {
      case "choice":
      case "predict": {
        const position = view && view.order ? view.order.indexOf(q.answer) : q.answer;
        return `${KANA[position]}．${q.options[q.answer]}`;
      }
      case "truefalse": return q.answer ? "○（正しい）" : "×（誤り）";
      case "fill": return q.answer.join(" ／ ") + (q.unit || "");
      case "order": return "\n" + q.answer.map((x, i) => `${i + 1}. ${x}`).join("\n");
      default: return "";
    }
  }

  // ===== 小さな道具 =====
  function el(tag, attributes = {}, children = []) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(attributes)) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key === "html") node.innerHTML = value; // 教材の本文・問題文・解説（スキルが生成した信頼済みHTML）だけに使う
      else if (key === "text") node.textContent = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : value);
    }
    for (const child of [].concat(children)) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }
  function stripTags(html) { const div = document.createElement("div"); div.innerHTML = html; return div.textContent || ""; }
  function shuffled(items) {
    const copy = items.slice();
    for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
    return copy;
  }
  function shuffledAvoiding(items, forbidden) {
    if (items.length < 2) return items.slice();
    let result;
    do { result = shuffled(items); } while (result.every((x, i) => x === forbidden[i]));
    return result;
  }
  function formatClock(totalSeconds) {
    const abs = Math.max(0, Math.floor(totalSeconds));
    return `${String(Math.floor(abs / 60)).padStart(2, "0")}:${String(abs % 60).padStart(2, "0")}`;
  }
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function scrollToEl(node, block = "start") { if (node) node.scrollIntoView({ behavior: prefersReducedMotion ? "auto" : "smooth", block }); }
  function flash(node) { if (!node) return; node.classList.remove("flash"); void node.offsetWidth; node.classList.add("flash"); }
  function shake(node) { if (!node) return; node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); }
  let toastTimer = null;
  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, 3500);
  }
  function bookIcon() {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("width", "16"); svg.setAttribute("height", "16"); svg.setAttribute("viewBox", "0 0 16 16");
    svg.innerHTML = '<rect x="3" y="2" width="10" height="12" rx="1.5" fill="none" stroke="#fff" stroke-width="1.6"/>';
    return svg;
  }

  // ===== 演出：紙吹雪（クラッカー） =====
  const confettiCanvas = document.getElementById("confetti");
  const confettiContext = confettiCanvas.getContext("2d");
  const CONFETTI_COLORS = ["#7b94ff", "#3cc28d", "#f2c94c", "#f0894f", "#e7eaf0", "#6aa8ff"];
  let confettiPieces = [];
  let confettiRunning = false;
  function resizeConfettiCanvas() {
    const ratio = window.devicePixelRatio || 1;
    confettiCanvas.width = innerWidth * ratio;
    confettiCanvas.height = innerHeight * ratio;
    confettiContext.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  window.addEventListener("resize", resizeConfettiCanvas);
  resizeConfettiCanvas();
  function burstConfetti(x, y, { count = 70, angle = -Math.PI / 2, spread = Math.PI / 2.2, power = 13 } = {}) {
    if (prefersReducedMotion) return;
    for (let i = 0; i < count; i++) {
      const direction = angle + (Math.random() - 0.5) * spread;
      const speed = power * (0.55 + Math.random() * 0.6);
      confettiPieces.push({ x, y, vx: Math.cos(direction) * speed, vy: Math.sin(direction) * speed, rotation: Math.random() * Math.PI, spin: (Math.random() - 0.5) * 0.4, width: 6 + Math.random() * 6, height: 4 + Math.random() * 5, color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)], life: 110 + Math.random() * 50 });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(drawConfetti); }
  }
  function drawConfetti() {
    confettiContext.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of confettiPieces) {
      p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.rotation += p.spin; p.life -= 1;
      confettiContext.save();
      confettiContext.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      confettiContext.translate(p.x, p.y);
      confettiContext.rotate(p.rotation);
      confettiContext.fillStyle = p.color;
      confettiContext.fillRect(-p.width / 2, -p.height / 2, p.width, p.height * Math.abs(Math.cos(p.rotation * 2)) + 1);
      confettiContext.restore();
    }
    confettiPieces = confettiPieces.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    if (confettiPieces.length) requestAnimationFrame(drawConfetti);
    else { confettiRunning = false; confettiContext.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function celebrateAt(node) { if (!node) return; const rect = node.getBoundingClientRect(); burstConfetti(rect.left + rect.width / 2, rect.top + 10, { count: 60 }); }
  function celebrateBig() {
    burstConfetti(0, innerHeight, { count: 110, angle: -Math.PI / 3, spread: Math.PI / 4, power: 22 });
    burstConfetti(innerWidth, innerHeight, { count: 110, angle: (-2 * Math.PI) / 3, spread: Math.PI / 4, power: 22 });
  }

  // ===== 問いのカード（すぐ確認・演習・今日の想起で共通） =====
  // 学習者の操作は「答える」と、間違えたときの「次へ」だけ。考える時間・判定・次の出題日はシステムが決める。
  // opts.record：学習履歴に記録する / opts.practice：練習（記録しない） / opts.mock：模擬試験（正誤を出さない）
  // opts.onDone(result) / opts.onNext（ある場合は次へボタン。正解なら autoAdvance で自動）/ opts.onExcludeChange(on)
  let keyTarget = null; // 数字キー・Enter を受けるカード（演習の画面だけ）
  function buildView(q, shuffle) {
    if (q.type === "choice" || q.type === "predict") {
      const indexes = q.options.map((_, i) => i);
      return { order: shuffle ? shuffled(indexes) : indexes };
    }
    if (q.type === "order") return { items: shuffle ? shuffledAvoiding(q.options, q.answer) : q.options.slice() };
    return {};
  }
  function questionCard(id, opts = {}) {
    const q = questionById.get(id);
    const view = buildView(q, opts.mock || recOf(id).attempts > 0 || opts.retry);
    const st = { phase: "idle", startedAt: 0, timer: null, advanceTimer: null };
    const root = el("div", { class: "qcard" });
    const head = el("div", { class: "qhead" });
    const body = el("div");
    const result = el("div");
    root.append(head, body, result);

    function renderHead() {
      const left = el("div", { class: "qhead-l" }, [opts.label || null, opts.mock ? null : stateTag(id)]);
      const right = opts.mock ? null : el("button", { class: "exclude-btn", type: "button", text: isActive(id) ? "この問題はもう出さない" : "出題に戻す", onclick: toggleExclude });
      head.replaceChildren(left, right || "");
    }
    function toggleExclude() {
      const on = isActive(id);
      setExcluded(id, on);
      clearTimeout(st.timer); clearTimeout(st.advanceTimer);
      renderHead();
      if (on) {
        body.replaceChildren(el("div", { class: "q-note" }, ["この問題は今後出しません。⚙ 設定の「出さない問題」からいつでも戻せます。"]));
        result.replaceChildren();
        st.phase = "excluded";
      } else {
        st.phase = "idle";
        renderBody();
        if (opts.preview) showPreview(); else start();
      }
      if (opts.onExcludeChange) opts.onExcludeChange(on);
    }

    function renderBody() {
      body.replaceChildren();
      const prompt = el("div", { class: "q-prompt" });
      prompt.innerHTML = q.prompt;
      body.append(prompt);
      if (q.type === "truefalse") body.append(el("div", { class: "muted small", style: "margin-top:2px", text: "正しければ ○、誤りなら × を押してください。" }));
      if (q.code) body.append(el("pre", {}, [el("code", { text: q.code })]));
      body.append(el("div", { class: "answer-area" }));
    }
    const area = () => body.querySelector(".answer-area");
    // 考える時間：選択肢が要る問題は、問題文だけを見せてから選択肢を出す
    const needsThink = () => !opts.mock && (q.type === "choice" || q.type === "predict" || q.type === "truefalse");
    function start() {
      if (st.phase !== "idle" || !isActive(id) && !opts.mock) return;
      if (needsThink()) {
        st.phase = "think";
        area().replaceChildren(el("div", { class: "think" }, [el("div", { class: "think-label", text: "まず答えを頭に思い浮かべてください。選択肢はこのあと出ます。" }), el("div", { class: "think-bar" }, [el("span", { class: "run" })])]));
        st.timer = setTimeout(showAnswerUi, THINK_MS);
      } else {
        showAnswerUi();
      }
    }
    // 予告問題：読む前に問いだけを見せ、読み終えたら答える（考える時間は読んでいるあいだに済んでいる）
    function showPreview() {
      st.phase = "preview";
      area().replaceChildren(el("div", { class: "preview" }, [
        el("p", { text: "読む前に、問いだけ見ておきましょう。答えは左のページにあります。答えを探しながら読んでください。" }),
        el("button", { class: "btn go", type: "button", onclick: () => showAnswerUi() }, ["読んだので答える", el("kbd", { text: "Enter" })]),
      ]));
    }
    function showAnswerUi() {
      st.phase = "answer";
      st.startedAt = performance.now();
      const a = area();
      a.replaceChildren();
      if (q.type === "choice" || q.type === "predict") {
        const short = q.type !== "predict" && q.options.length === 4 && q.options.every((o) => o.length <= 10);
        a.append(el("div", { class: `choices${short ? " grid2" : ""}` }, view.order.map((optionIndex, position) => el("button", { class: "choice", type: "button", "data-index": String(optionIndex), onclick: () => submit(optionIndex) }, [el("span", { class: "k", text: KANA[position] }), el("span", { class: "t", text: q.options[optionIndex] })]))));
      } else if (q.type === "truefalse") {
        a.append(el("div", { class: "ox" }, [[true, "○"], [false, "×"]].map(([value, mark]) => el("button", { type: "button", "data-value": String(value), "aria-label": value ? "正しい（○）" : "誤り（×）", text: mark, onclick: () => submit(value) }))));
      } else if (q.type === "fill") {
        const input = el("input", { type: "text", placeholder: "半角英数字", "aria-label": "答え", autocomplete: "off", spellcheck: "false" });
        const button = el("button", { class: "btn small", type: "button", text: "答え合わせ", onclick: () => { if (input.value.trim()) submit(input.value); } });
        input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing && input.value.trim()) submit(input.value); });
        a.append(el("div", { class: "fillrow" }, [input, q.unit ? el("span", { text: q.unit }) : null, button, el("span", { class: "kbd-hint", text: "Enter で答え合わせ" })]));
        if (opts.focus || opts.preview) input.focus({ preventScroll: true });
      } else if (q.type === "order") {
        const items = view.items;
        const list = el("ol", { class: "order-list" });
        const draw = () => list.replaceChildren(...items.map((text, i) => el("li", { class: "order-item" }, [
          el("span", { class: "n", text: String(i + 1) }), el("span", { class: "t", text }),
          el("span", { class: "mv" }, [
            el("button", { type: "button", "aria-label": "上へ", text: "↑", disabled: i === 0, onclick: () => { [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); } }),
            el("button", { type: "button", "aria-label": "下へ", text: "↓", disabled: i === items.length - 1, onclick: () => { [items[i + 1], items[i]] = [items[i], items[i + 1]]; draw(); } }),
          ]),
        ])));
        draw();
        a.append(list, el("div", { class: "submit-row" }, [el("button", { class: "btn go", type: "button", text: "答え合わせ", onclick: () => submit(items.slice()) })]));
      }
    }
    function submit(response) {
      if (st.phase !== "answer") return;
      st.phase = "done";
      const correct = isAnswerCorrect(q, response);
      const rtMs = performance.now() - st.startedAt;
      lockAnswer(response, correct);
      if (opts.mock) { if (opts.onDone) opts.onDone({ correct, response }); return; }
      let grade = correct ? "good" : "again";
      let rec = null;
      if (opts.record) { grade = gradeOf(q, correct, rtMs, id); rec = applyResult(id, grade); }
      renderHead();
      showResult(correct, grade, rec, response);
      if (opts.onDone) opts.onDone({ correct, grade, response });
    }
    function lockAnswer(response, correct) {
      const a = area();
      a.querySelectorAll("button, input").forEach((x) => { x.disabled = true; });
      if (opts.mock) return;
      a.querySelectorAll(".choice").forEach((b) => {
        const i = Number(b.dataset.index);
        if (i === response) { b.classList.add(correct ? "is-ok" : "is-ng"); b.append(el("span", { class: "note", text: correct ? "正解" : "あなたの答え" })); }
        else if (i === q.answer) { b.classList.add("is-ok"); b.append(el("span", { class: "note", text: "正解" })); }
        else b.classList.add("dim");
      });
      a.querySelectorAll(".ox button").forEach((b) => {
        const v = b.dataset.value === "true";
        if (v === response) b.classList.add(correct ? "is-ok" : "is-ng");
        else if (v === q.answer) b.classList.add("is-ok");
        else b.classList.add("dim");
      });
      const input = a.querySelector("input");
      if (input) input.classList.add(correct ? "is-ok" : "is-ng");
      const list = a.querySelector(".order-list");
      if (list) list.classList.add(correct ? "is-ok" : "is-ng");
    }
    function scheduleText(rec) {
      if (!rec) return null;
      if (rec.status === "closed") return "🎉 覚えました。この問題はもう出しません（演習で間違えたら、また出します）。";
      if (rec.status === "learning" && rec.due) return `次は ${formatDate(rec.due)} に出します。`;
      return null;
    }
    function showResult(correct, grade, rec, response) {
      const box = el("div", { class: `result ${correct ? "ok" : "ng"}` });
      const answerText = correctAnswerText(q, view);
      const answerNode = q.type === "fill" ? el("code", { text: answerText }) : el("span", { style: "white-space:pre-line", text: answerText });
      if (correct) {
        const note = opts.practice ? "練習なので、記録はしません。" : grade === "hard" ? (recOf(id).wrongDay === today() ? "間違えたあとの正解なので、日を変えてもう一度出します。" : "少し時間がかかったので、日を変えてもう一度確かめます。") : "";
        box.append(el("div", { class: "v" }, ["正解！", el("span", {}, ["答えは ", answerNode])]), note ? el("p", { class: "muted small", text: note }) : null);
      } else {
        box.append(el("div", { class: "v" }, ["ざんねん", el("span", {}, ["正解は ", answerNode])]));
      }
      box.append(el("p", { html: q.explanation }));
      // 誤った選択肢ごとの解説（optionNotes）
      const notes = q.optionNotes;
      if (!correct && notes && (q.type === "choice" || q.type === "predict")) {
        const items = view.order.map((i, position) => (notes[i] ? el("li", {}, [el("b", { text: `${KANA[position]} ${q.options[i]}：` }), notes[i]]) : null)).filter(Boolean);
        if (items.length) box.append(el("ul", {}, items));
      }
      const sched = scheduleText(rec);
      if (!correct && opts.retryNote) box.append(el("div", {}, [el("span", { class: "sched retry", text: `↻ ${opts.retryNote}` })]));
      else if (sched) box.append(el("div", {}, [el("span", { class: "sched", text: sched })]));
      result.replaceChildren(box);
      if (opts.refs) {
        for (const ref of (q.refs || []).filter((r) => parseRef(r)).slice(0, 1)) {
          const target = parseRef(ref);
          result.append(el("div", { class: "goto-line" }, ["教科書で確認する：", el("button", { class: "link-btn", type: "button", text: refLabel(ref), onclick: () => openSection(target.section.id, { itemId: target.item ? target.item.id : null }) })]));
        }
      }
      if (opts.onNext) {
        const next = el("button", { class: "btn go", type: "button", onclick: () => goNext() }, [opts.nextLabel || "次へ", el("kbd", { text: "Enter" })]);
        result.append(el("div", { class: "acts" }, [correct && opts.autoAdvance ? el("span", { class: "kbd-hint", text: "自動で次へ進みます" }) : null, next]));
        if (correct && opts.autoAdvance) st.advanceTimer = setTimeout(goNext, ADVANCE_MS);
      }
      if (correct) celebrateAt(box); else shake(root);
    }
    function goNext() {
      clearTimeout(st.advanceTimer);
      if (st.nexted) return;
      st.nexted = true;
      opts.onNext();
    }
    // 演習の画面のキー操作：数字キーで選択肢、Enter で次へ
    function key(e) {
      if (st.phase === "preview" && e.key === "Enter") { showAnswerUi(); return true; }
      if (st.phase === "answer" && /^[1-9]$/.test(e.key)) {
        const buttons = area().querySelectorAll(".choice, .ox button");
        const b = buttons[Number(e.key) - 1];
        if (b && !b.disabled) { b.click(); return true; }
      }
      if (e.key === "Enter" && (st.phase === "done" || st.phase === "excluded") && opts.onNext) { goNext(); return true; }
      return false;
    }

    renderHead();
    if (!isActive(id) && !opts.mock) {
      body.replaceChildren(el("div", { class: "q-note" }, ["この問題は出さない設定です。"]));
      st.phase = "excluded";
    } else {
      renderBody();
      if (opts.preview) showPreview();
    }
    // 画面に入ったときから考える時間を数える（予告問題は「読んだので答える」で始める）
    const api = { el: root, key, start, stop: () => { clearTimeout(st.timer); clearTimeout(st.advanceTimer); } };
    if (opts.startNow) start();
    else if (!opts.preview) waitingCards.add(api);
    return api;
  }
  // まだ始まっていない問いは、画面に入ったときに始める（スクロールのたびに位置を見る）
  const waitingCards = new Set();
  function startVisibleCards() {
    for (const card of waitingCards) {
      if (!card.el.isConnected) { waitingCards.delete(card); continue; }
      const r = card.el.getBoundingClientRect();
      const visible = Math.min(r.bottom, innerHeight) - Math.max(r.top, 0);
      if (r.height && visible >= Math.min(r.height * 0.3, innerHeight * 0.3)) { waitingCards.delete(card); card.start(); }
    }
  }
  window.addEventListener("scroll", startVisibleCards, { passive: true });
  window.addEventListener("resize", startVisibleCards);
  setInterval(() => { if (waitingCards.size) startVisibleCards(); }, 400);

  // ===== 画面の切り替え =====
  // home: ホーム / lesson: 節のページ / run: 今日の想起・演習・模擬試験 / settings: 設定
  let currentView = "home";
  let lesson = null;
  let run = null;
  let keyHandler = null;

  function render(options = {}) {
    keyHandler = null;
    keyTarget = null;
    app.replaceChildren();
    const gear = document.getElementById("gear");
    if (currentView === "settings") gear.setAttribute("aria-current", "page"); else gear.removeAttribute("aria-current");
    if (currentView === "home") renderHome();
    else if (currentView === "lesson") renderLesson();
    else if (currentView === "run") renderRun();
    else if (currentView === "settings") renderSettings();
    renderHeader();
    if (!options.keepScroll) window.scrollTo(0, 0);
    setTimeout(startVisibleCards, 0);
  }
  function showView(view) {
    if (currentView === "run" && view !== "run" && run && run.kind === "mock" && !run.finished) {
      showToast("模擬試験中です。「採点して終了」で終えてから移動してください。");
      return;
    }
    if (view !== currentView) confettiPieces = [];
    if (run && run.card) run.card.stop();
    currentView = view;
    render();
  }
  function openSection(sectionId, { itemId = null } = {}) {
    const section = sectionById.get(sectionId);
    if (!section) return;
    if (run && run.card) run.card.stop();
    if (lesson && lesson.card) lesson.card.stop();
    // 開いたときに決めること：扉に出す問題（この節とほかの節の、出題日が来た問題）と、伏せ字にする項目（もう正解した項目）
    const ownDue = sectionChecks(section).filter((id) => stateOf(id) === "due" && recOf(id).everCorrect);
    const otherDue = interleave(sortDue(dueIds().filter((id) => !ownDue.includes(id) && !(checkInfo.get(id) && checkInfo.get(id).section === section)))).slice(0, WARMUP_SIZE);
    lesson = {
      sectionId, page: 0, card: null,
      opening: { own: ownDue, other: otherDue },
      masked: new Set(section.items.filter((item) => item.check && recOf(item.check.id).everCorrect).map((item) => item.id)),
      revealed: new Set(), retries: {}, retryAt: {}, wrong: {},
    };
    // 扉がなければ1つめの項目から。項目を指定されたら、そのページを開く
    const pages = lessonPages(section);
    if (itemId) lesson.page = Math.max(0, pages.findIndex((p) => p.kind === "item" && p.item.id === itemId));
    progress.lastSectionId = sectionId;
    saveProgress();
    currentView = "lesson";
    render();
    if (itemId) requestAnimationFrame(() => flash(document.getElementById(`head-${itemId}`)));
  }
  document.getElementById("brand").addEventListener("click", () => showView("home"));
  document.getElementById("gear").addEventListener("click", () => showView("settings"));
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeSearch(); closeToc(); }
    if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) return;
    const tag = event.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || (tag === "BUTTON" && event.key === "Enter")) return;
    if (keyTarget && keyTarget.key(event)) { event.preventDefault(); return; }
    if (keyHandler) keyHandler(event);
  });

  // ===== 上部バー =====
  function renderHeader() {
    const percent = progressPercent();
    document.getElementById("hdr-progress").hidden = currentView === "home";
    document.getElementById("hdr-meter").style.width = percent + "%";
    document.getElementById("hdr-pct").textContent = percent + "%";
  }

  // ===== 検索（用語・本文・問題） =====
  const searchIndex = [];
  for (const section of orderedSections) {
    for (const item of section.items) {
      searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} ›「${itemLabel(item)}」`, text: stripTags(`${item.title}\n${item.body}`) });
      if (item.check) searchIndex.push({ section, item, label: `${sectionCode(section)} ${section.title} › すぐ確認`, text: stripTags(item.check.prompt) });
    }
    if (section.keyPoints) searchIndex.push({ section, item: null, label: `${sectionCode(section)} ${section.title} › この節の要点`, text: section.keyPoints.map(stripTags).join(" ／ ") });
  }
  for (const [id, chapter] of drillChapter) {
    const target = parseRef((questionById.get(id).refs || [])[0]);
    if (target) searchIndex.push({ section: target.section, item: target.item, label: `${chapter ? chapterLabel(chapter) + " 章末演習" : "総合演習"} の問題`, text: stripTags(questionById.get(id).prompt) });
  }
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");
  function snippet(text, query) {
    const flat = text.replace(/\s+/g, " ");
    const index = flat.toLowerCase().indexOf(query.toLowerCase());
    const start = Math.max(0, index - 24);
    const piece = flat.slice(start, index + query.length + 40);
    const at = index - start;
    return [start > 0 ? "…" : "", piece.slice(0, at), el("mark", { text: piece.slice(at, at + query.length) }), piece.slice(at + query.length), "…"];
  }
  function runSearch() {
    const query = searchInput.value.trim();
    if (!query) { closeSearch(); return; }
    const hits = searchIndex.filter((entry) => entry.text.toLowerCase().includes(query.toLowerCase())).slice(0, 8);
    searchResults.replaceChildren(...(hits.length ? hits.map((hit) => el("button", {
      role: "option",
      onclick: () => { closeSearch(); searchInput.value = ""; openSection(hit.section.id, { itemId: hit.item ? hit.item.id : null }); },
    }, [el("small", { text: hit.label }), el("span", {}, snippet(hit.text, query))])) : [el("div", { class: "empty", text: "見つかりませんでした" })]));
    searchResults.hidden = false;
  }
  function closeSearch() { searchResults.hidden = true; }
  searchInput.addEventListener("input", runSearch);
  searchInput.addEventListener("focus", () => { if (searchInput.value.trim()) runSearch(); });
  document.addEventListener("click", (event) => { if (!event.target.closest("#search")) closeSearch(); });

  // ===== ホーム =====
  function renderHome() {
    const percent = progressPercent();
    const active = allIds.filter(isActive);
    const closedN = active.filter((id) => recOf(id).status === "closed").length;
    const learningN = active.filter((id) => recOf(id).status === "learning").length;
    const due = dueIds();
    const lastSection = sectionById.get(progress.lastSectionId);
    const resumeSection = lastSection || orderedSections.find((s) => !isSectionDone(s)) || orderedSections[0];
    const resumeChapter = chapterBySectionId.get(resumeSection.id);

    // 今日の想起：期日が来た問題（システムが選ぶ）
    const nextDue = allIds.filter((id) => stateOf(id) === "wait").map((id) => recOf(id).due).sort()[0];
    const todayCard = el("section", { class: "panel today-card" }, [
      el("div", {}, [
        el("span", { class: "eyebrow today", text: "今日の想起" }),
        due.length ? el("h2", {}, ["今日の問題", el("b", { class: "num", text: String(due.length) }), "問"]) : el("h2", { text: "今日の問題はありません" }),
        el("p", { text: due.length ? "忘れかけた頃の問題を、システムが選んでいます。" : nextDue ? `次は ${formatDate(nextDue)} に出す問題があります。` : "節を読んですぐ確認を解くと、ここに出る問題が増えていきます。" }),
      ]),
      due.length ? el("button", { class: "btn primary", type: "button", text: "今日の問題を解く", onclick: () => startRun("today") }) : null,
    ]);
    const percentCard = el("section", { class: "panel" }, [
      el("span", { class: "eyebrow", text: "覚えた割合" }),
      el("div", { class: "big-pct" }, [String(percent), el("small", { text: "%" })]),
      el("div", { class: "meter" }, [el("span", { style: `width:${percent}%` })]),
      el("div", { class: "split" }, [el("span", { class: "num", text: `覚えた ${closedN} / ${active.length}` }), el("span", { class: "num", text: `学習中 ${learningN}` })]),
    ]);

    const resumeIds = sectionChecks(resumeSection);
    const resume = el("section", { class: "panel resume" }, [
      el("span", { class: "eyebrow", style: "background:var(--blue-soft)", text: lastSection ? "続きから学習" : "ここから学習" }),
      el("div", { class: "where" }, [el("small", { text: chapterLabel(resumeChapter) }), el("b", { text: `${sectionCode(resumeSection)}　${resumeSection.title}` })]),
      el("div", { class: "dots", "aria-hidden": "true" }, resumeIds.map((id) => el("i", { class: recOf(id).everCorrect ? "on" : "" }))),
      el("span", { class: "info num", text: `すぐ確認 ${resumeIds.filter((id) => recOf(id).everCorrect).length}/${resumeIds.length} ・ ${readingMinutes(resumeSection)} 分` }),
      el("button", { class: "btn go", text: lastSection ? "学習を再開" : "学習を始める", onclick: () => openSection(resumeSection.id) }),
    ]);

    const chapterCards = chapters.map((chapter) => {
      const ids = [...chapter.sections.flatMap(sectionChecks), ...(chapter.exercise || []).map((q) => q.id)].filter(isActive);
      const closed = ids.filter((id) => recOf(id).status === "closed").length;
      const touched = ids.some((id) => recOf(id).status !== "new");
      const done = chapter.sections.every(isSectionDone);
      const first = chapter.sections.find((s) => !isSectionDone(s)) || chapter.sections[0];
