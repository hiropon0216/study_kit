      return el("button", { class: `chapter-card${touched ? "" : " untouched"}`, onclick: () => openSection(first.id) }, [
        el("div", { class: "row" }, [el("span", { class: "no", text: String(chapterNo(chapter)) }), el("span", { class: `tag ${done ? "ok" : touched ? "now" : ""}`, text: done ? "読了" : touched ? "学習中" : "未着手" })]),
        el("h3", { text: chapter.title }),
        el("div", { class: "meter" }, [el("span", { style: `width:${ids.length ? Math.round((closed / ids.length) * 100) : 0}%` })]),
        el("div", { class: "foot" }, [el("span", { text: `節 ${chapter.sections.filter(isSectionDone).length} / ${chapter.sections.length}` }), el("span", { text: `覚えた ${closed} / ${ids.length} 問` })]),
      ]);
    });

    const bottom = [];
    if (finalExam.length) {
      bottom.push(el("section", { class: "panel drill-card" }, [
        el("div", {}, [el("span", { class: "eyebrow final", text: "総合演習" }), el("p", { style: "margin-top:10px", text: `全章から ${finalExam.length} 問` })]),
        el("button", { class: "btn", text: "挑戦する", onclick: () => startRun("final") }),
      ]));
    }
    if (content.meta.exam) {
      const exam = content.meta.exam;
      bottom.push(el("section", { class: "panel drill-card" }, [
        el("div", {}, [el("span", { class: "eyebrow mock", text: "模擬試験" }), el("p", { style: "margin-top:10px", text: `${exam.questionCount} 問 ・ 制限時間 ${exam.minutes} 分${exam.passingRate ? ` ・ 合格ライン ${exam.passingRate}%` : ""}` })]),
        el("button", { class: "btn", text: "受験する", onclick: () => startRun("mock") }),
      ]));
    }
    bottom.push(el("section", { class: "panel", style: "grid-column:span 1" }, [
      el("span", { class: "eyebrow goal", text: "この教材のゴール" }),
      el("ul", { class: "goal-list" }, (content.meta.goals || []).map((goal) => el("li", { text: goal }))),
    ]));

    app.append(el("div", { class: "wrap home" }, [
      el("div", { class: "home-row" }, [todayCard, percentCard]),
      resume,
      el("section", {}, [el("h2", { class: "sec-title", text: "目次" }), el("div", { class: "cards" }, chapterCards)]),
      el("div", { class: "home-bottom" }, bottom),
    ]));
  }

  // ===== 節のページ =====
  function closeToc() {
    const toc = document.querySelector(".toc");
    if (!toc || !toc.classList.contains("open")) return;
    toc.classList.remove("open");
    document.querySelector(".toc-backdrop").classList.remove("open");
  }
  function buildToc(current) {
    const children = [el("div", { class: "toc-head" }, [
      el("button", { class: "link-btn", style: "font-size:.82rem", text: "‹ ホーム", onclick: () => showView("home") }),
      el("button", { class: "btn small", "aria-label": "目次を閉じる", text: "✕", onclick: closeToc }),
    ])];
    for (const chapter of chapters) {
      children.push(el("div", { class: "ch", text: chapterLabel(chapter) }));
      for (const section of chapter.sections) {
        const isCurrent = section.id === current.id;
        const done = isSectionDone(section);
        children.push(el("button", { class: `toc-link${isCurrent ? " current" : ""}`, "aria-current": isCurrent ? "page" : null, onclick: () => openSection(section.id) }, [
          el("span", { class: `st ${done ? "done" : isCurrent ? "cur" : ""}`, text: done ? "✓" : "" }),
          `${sectionCode(section)} ${section.title}`,
        ]));
      }
      if ((chapter.exercise || []).length) children.push(el("button", { class: "drill-link", type: "button", text: `第${chapterNo(chapter)}章 章末演習へ ›`, onclick: () => startRun("chapter", chapter.id) }));
    }
    if (finalExam.length) children.push(el("div", { style: "margin-top:14px" }, [el("button", { class: "drill-link final", type: "button", text: "総合演習へ ›", onclick: () => startRun("final") })]));
    return el("nav", { class: "toc", "aria-label": "目次" }, children);
  }

  // 見開きのページ：扉（出題日が来た問題があるときだけ）→ 項目ごとのページ → まとめ
  // 左ページに教科書（項目の説明）、右ページに問題集（その項目の問題）を出す
  function lessonPages(section) {
    const pages = [];
    if (lesson.opening.own.length || lesson.opening.other.length) pages.push({ kind: "open" });
    section.items.forEach((item, index) => pages.push({ kind: "item", item, index }));
    pages.push({ kind: "end" });
    return pages;
  }
  const TYPE_NAME = { choice: "選択", predict: "結果予測", truefalse: "○×", fill: "穴埋め", order: "並べ替え" };
  const CIRCLED = "①②③④⑤⑥⑦⑧⑨⑩";
  const checkLabel = (section, index) => `${sectionCode(section)} ${CIRCLED[index] || index + 1}`;
  // 今日間違えて、まだ一度も正解していない問題
  const againToday = (id) => recOf(id).wrongDay === today() && !recOf(id).everCorrect;

  function renderLesson() {
    const section = sectionById.get(lesson.sectionId);
    const chapter = chapterBySectionId.get(section.id);
    const toc = buildToc(section);
    const backdrop = el("div", { class: "toc-backdrop", onclick: closeToc });
    const openToc = () => { toc.classList.add("open"); backdrop.classList.add("open"); };
    const bar = el("div", { class: "lesson-bar" }, [
      el("button", { class: "btn small", text: "☰ 目次", onclick: openToc }),
      el("div", { class: "ttl" }, [
        el("small", { text: chapterLabel(chapter) }),
        el("h1", {}, [el("span", { class: "sec-no", text: sectionCode(section) }), section.title]),
      ]),
      el("div", { class: "meta" }, [
        el("span", { text: `読了目安 ${readingMinutes(section)} 分` }),
        el("span", { text: `問題 ${section.items.filter((item) => item.check).length} 問` }),
      ]),
      el("span", { class: "gate-pill", id: "gate-pill" }),
    ]);
    app.append(el("div", { class: "lesson", id: "lesson" }, [
      bar,
      el("div", { class: "page-tabs", id: "page-tabs", role: "tablist", "aria-label": "ページ" }),
      el("div", { class: "book", id: "book" }),
      el("div", { class: "book-foot", id: "book-foot" }),
    ]), toc, backdrop);
    keyHandler = (event) => {
      if (event.key === "ArrowRight") turnPage(lesson.page + 1);
      else if (event.key === "ArrowLeft") turnPage(lesson.page - 1);
    };
    renderPage();
  }
  function turnPage(page) {
    const pages = lessonPages(sectionById.get(lesson.sectionId));
    if (page < 0 || page >= pages.length || page === lesson.page) return;
    lesson.page = page;
    renderPage();
    const book = document.getElementById("book");
    if (book && book.getBoundingClientRect().top < 0) scrollToEl(document.getElementById("lesson"));
  }
  function renderPage() {
    const section = sectionById.get(lesson.sectionId);
    const pages = lessonPages(section);
    const page = pages[lesson.page];
    if (lesson.card) lesson.card.stop();
    lesson.card = null;
    keyTarget = null;
    const left = el("section", { class: "page left", "aria-label": "教科書" });
    const right = el("section", { class: "page right", "aria-label": "問題集" });
    if (page.kind === "open") fillOpenPage(section, left, right);
    else if (page.kind === "item") fillItemPage(section, page, left, right);
    else fillEndPage(section, left, right);
    // 右ページ（問題集）は、左ページを読み進めても画面に残す
    right.replaceChildren(el("div", { class: "pin" }, [...right.childNodes]));
    document.getElementById("book").replaceChildren(left, el("div", { class: "gutter", "aria-hidden": "true" }), right);
    const prev = pages[lesson.page - 1];
    const next = pages[lesson.page + 1];
    document.getElementById("book-foot").replaceChildren(
      prev ? el("button", { class: "btn", text: `‹ ${pageName(prev)}`, onclick: () => turnPage(lesson.page - 1) }) : el("span"),
      el("span", { class: "kbd-hint", text: "← → でページをめくれます" }),
      next ? el("button", { class: "btn", text: `${pageName(next)} ›`, onclick: () => turnPage(lesson.page + 1) }) : el("span"),
    );
    updateLessonStatus();
    setTimeout(startVisibleCards, 0);
  }
  function pageName(page) {
    if (page.kind === "open") return "扉";
    if (page.kind === "end") return "まとめ";
    return page.item.kind === "example" ? "例題" : `項目 ${page.index + 1}`;
  }
  function pageHead(tag, note) {
    return el("div", { class: "page-head" }, [el("span", { class: "page-tag", text: tag }), el("span", { text: note })]);
  }

  // 扉：左にこの節で学ぶこと、右に出題日が来た問題（読む前に思い出す）
  function fillOpenPage(section, left, right) {
    const prereqs = (section.prerequisites || []).map((id) => sectionById.get(id)).filter(Boolean);
    const offset = lessonPages(section).findIndex((p) => p.kind === "item");
    left.append(
      pageHead("教科書", "扉"),
      el("h2", { text: "この節で学ぶこと" }),
      el("ol", { class: "cover-list" }, section.items.map((item, i) => el("li", {}, [el("button", { class: "link-btn", type: "button", text: item.kind === "example" ? `例題：${stripTags(item.title)}` : item.title, onclick: () => turnPage(offset + i) })]))),
      prereqs.length ? el("p", { class: "muted small" }, ["前提： ", ...prereqs.map((p) => el("button", { class: "link-btn", type: "button", text: `${sectionCode(p)} ${p.title}`, onclick: () => openSection(p.id) }))]) : null,
    );
    right.append(pageHead("問題集", "読む前に思い出す"));
    const groups = [["この節の復習", lesson.opening.own], ["ほかの節から", lesson.opening.other]];
    for (const [title, ids] of groups) {
      if (!ids.length) continue;
      right.append(el("div", { class: "check warmup" }, [
        el("div", { class: "check-head" }, [el("span", { class: "check-badge", text: title }), el("span", { class: "note", text: `${ids.length} 問 ・ 出題日が来た問題` })]),
        ...ids.map((id) => el("div", { class: "subcard" }, [
          el("span", { class: "type-tab", text: TYPE_NAME[questionById.get(id).type] }),
          questionCard(id, { record: true, label: el("span", { text: scopeLabel(id) }), onDone: () => updateLessonStatus() }).el,
        ])),
      ]));
    }
    right.append(el("div", { class: "acts" }, [el("button", { class: "btn go", type: "button", text: "読み始める ›", onclick: () => turnPage(offset) })]));
  }

  // 項目のページ：左に説明（2回目は伏せ字）、右にその項目の問題（予告問題）と、前のページで間違えた問題
  function fillItemPage(section, page, left, right) {
    const { item, index } = page;
    const isExample = item.kind === "example";
    const body = el("div", { class: "lesson-body", html: item.body });
    const masks = lesson.masked.has(item.id) ? maskKeywords(body, item.id) : 0;
    left.append(pageHead("教科書", `項目 ${index + 1} / ${section.items.length}`));
    if (masks) {
      left.append(el("div", { class: "mask-bar" }, [
        el("span", { text: `一度正解した項目です。キーワード ${masks} か所を伏せています。思い出してから押すと開きます。` }),
        el("button", { class: "link-btn", type: "button", text: "すべて開く", onclick: () => { left.querySelectorAll(".mask").forEach((m) => m.click()); } }),
      ]));
    }
    left.append(el("h2", { id: `head-${item.id}` }, [el("span", { class: "no", text: String(index + 1) }), isExample ? "例題" : item.title]));
    left.append(isExample ? el("div", { class: "example" }, [el("div", { class: "example-head" }, [el("b", { html: item.title })]), body]) : body);

    right.append(pageHead("問題集", item.check ? `問 ${index + 1} / ${section.items.length}` : "問題なし"));
    if (item.check) right.append(checkBox(section, item, index));
    else right.append(el("div", { class: "check compact" }, [
      el("p", { class: "q-note", style: "margin:0", text: "この項目の問題は、不要として削除しました。読み終えたら次のページへ進んでください。" }),
      el("div", { class: "acts" }, [el("button", { class: "btn go", type: "button", text: "次のページへ ›", onclick: () => turnPage(lesson.page + 1) })]),
    ]));
    const pageIndex = lesson.page;
    for (const id of Object.keys(lesson.retryAt).filter((x) => lesson.retryAt[x] === pageIndex)) right.append(retryBox(section, id));
  }
  // 2回目に開いた項目は、本文のキーワード（<strong>）を伏せ字にする。思い出してから押すと開く
  function maskKeywords(body, itemId) {
    let n = 0;
    let masked = 0;
    for (const strong of [...body.querySelectorAll("strong")]) {
      if (strong.closest("figure, svg, pre, .sk-premise")) continue;
      const text = strong.textContent.trim();
      if (!text || /[：:]$/.test(text)) continue;
      const key = `${itemId}:${n++}`;
      if (lesson.revealed.has(key)) continue;
      const mask = el("button", { class: "mask", type: "button", "aria-label": "伏せ字（押すと開きます）", text });
      mask.addEventListener("click", () => { lesson.revealed.add(key); mask.replaceWith(strong); });
      strong.replaceWith(mask);
      masked++;
    }
    return masked;
  }
  // 問題集の問題：まだ正解していない問題は、読む前に問いだけ見せる（予告問題）
  function checkBox(section, item, index) {
    const id = item.check.id;
    const label = () => el("span", { text: checkLabel(section, index) });
    const box = el("div", { class: "check", id: `chk-${id}` }, [
      el("div", { class: "check-head" }, [el("span", { class: "check-badge", text: `${item.kind === "example" ? "類題" : "問題"} ・ ${TYPE_NAME[item.check.type]}` })]),
    ]);
    const r = recOf(id);
    if (r.everCorrect || r.status === "excluded") {
      box.classList.add("compact");
      const summary = el("div", {}, [
        el("div", { class: "q-prompt", html: item.check.prompt }),
        el("div", { class: "q-done" }, [
          r.status === "excluded" ? el("span", { class: "muted", text: "出さない問題" }) : el("span", { class: "okmark", text: "✓ 正解済み" }),
          stateTag(id),
          el("button", { class: "practice", type: "button", text: r.status === "excluded" ? "問題を見る" : "練習で解く（記録しない）", onclick: () => {
            box.classList.remove("compact");
            summary.replaceWith(questionCard(id, { practice: true, label: label(), onDone: () => updateLessonStatus(), onExcludeChange: () => updateLessonStatus() }).el);
            setTimeout(startVisibleCards, 0);
          } }),
        ]),
      ]);
      box.append(summary);
      return box;
    }
    if (lesson.wrong[id]) {
      box.append(el("div", { class: "q-prompt", html: item.check.prompt }), el("p", { class: "q-note" }, [el("span", { class: "sched retry", text: "↻ 次のページで、もう一度出します" })]));
      return box;
    }
    const card = questionCard(id, {
      record: true,
      preview: true,
      label: label(),
      retryNote: "次のページで、もう一度出します",
      nextLabel: "次のページへ",
      onNext: () => turnPage(lesson.page + 1),
      onDone: (res) => {
        if (!res.correct) { lesson.wrong[id] = true; queueRetry(section, id); }
        updateLessonStatus();
        if (res.correct) celebrateSection(section);
      },
      onExcludeChange: () => updateLessonStatus(),
    });
    lesson.card = card;
    keyTarget = card;
    box.append(card.el);
    return box;
  }
  // 間違えた問題は次のページ（最後の項目ならまとめのページ）でもう一度出す。同じ回で3回まで
  function queueRetry(section, id) {
    const count = (lesson.retries[id] || 0) + 1;
    if (count > MAX_RETRY) { delete lesson.retryAt[id]; return false; }
    lesson.retries[id] = count;
    const last = lessonPages(section).length - 1;
    lesson.retryAt[id] = Math.min(lesson.page + 1, last);
    return lesson.retryAt[id] === lesson.page;
  }
  function retryBox(section, id) {
    const home = checkInfo.get(id).item;
    const index = section.items.indexOf(home);
    const box = el("div", { class: "check retry" }, [
      el("div", { class: "check-head" }, [el("span", { class: "check-badge", text: "↻ もう一度" }), el("span", { class: "note", text: `さっき間違えた「${itemLabel(home)}」の問題` })]),
    ]);
    box.append(questionCard(id, {
      record: true, retry: true,
      label: el("span", { text: checkLabel(section, index) }),
      retryNote: "このあと、もう一度出します",
      onDone: (res) => {
        if (res.correct) { delete lesson.retryAt[id]; delete lesson.wrong[id]; celebrateSection(section); }
        else if (queueRetry(section, id)) box.after(retryBox(section, id));
        updateLessonStatus();
      },
      onExcludeChange: () => updateLessonStatus(),
    }).el);
    setTimeout(startVisibleCards, 0);
    return box;
  }
  function celebrateSection(section) {
    if (!isSectionDone(section)) return;
    setTimeout(celebrateBig, 250);
    showToast("🔓 この節の問題に全問正解しました。次の節へ進めます。");
  }

  // まとめ：左に要点と出典、右に問題の状態・まだ解き直していない問題・次の節へ
  function fillEndPage(section, left, right) {
    const sources = (section.sources || []).map((id) => factById.get(id)).filter(Boolean);
    left.append(pageHead("教科書", "まとめ"), el("h2", { text: "この節の要点" }));
    if (section.keyPoints && section.keyPoints.length) left.append(el("ul", { class: "keypoints" }, section.keyPoints.map((p) => el("li", { html: p }))));
    if (sources.length) left.append(el("details", { class: "sources" }, [
      el("summary", { text: `参考出典（${sources.length}件）` }),
      el("ul", {}, sources.map((fact) => el("li", {}, [el("span", { class: "rank", text: fact.rank }), fact.claim + " ", el("a", { href: fact.url, target: "_blank", rel: "noopener", text: "出典" })]))),
    ]));
    const memo = el("textarea", { class: "memo", id: "memo", placeholder: "気づいたことを書き留めておけます（このブラウザに保存されます）", "aria-label": "メモ" });
    memo.value = progress.memos[section.id] || "";
    let memoTimer = null;
    memo.addEventListener("input", () => {
      clearTimeout(memoTimer);
      memoTimer = setTimeout(() => { if (memo.value) progress.memos[section.id] = memo.value; else delete progress.memos[section.id]; saveProgress(); }, 400);
    });
    left.append(el("h3", { style: "margin:22px 0 8px", text: "メモ" }), memo);

    right.append(pageHead("問題集", "この節の問題"), el("div", { class: "state-dots", id: "state-dots" }), el("div", { class: "map", id: "side-map" }));
    const last = lesson.page;
    for (const id of Object.keys(lesson.retryAt).filter((x) => lesson.retryAt[x] === last)) right.append(retryBox(section, id));
    right.append(el("div", { class: "end-next" }, [el("p", { class: "gate-text", id: "gate-text" }), el("button", { class: "btn", id: "next-sec" })]));
  }

  function updateLessonStatus() {
    if (currentView !== "lesson" || !lesson) return;
    const section = sectionById.get(lesson.sectionId);
    const left = sectionChecks(section).filter((id) => !recOf(id).everCorrect).length;
    const next = orderedSections[orderedSections.indexOf(section) + 1];
    const chapter = chapterBySectionId.get(section.id);
    // 章の最後の節では、次へで章末演習に進む
    const toExercise = chapter.sections[chapter.sections.length - 1] === section && (chapter.exercise || []).length > 0;
    const target = toExercise ? `第${chapterNo(chapter)}章 章末演習` : next ? `${sectionCode(next)} ${next.title}` : null;
    const gatePill = document.getElementById("gate-pill");
    gatePill.hidden = !target;
    gatePill.textContent = left ? `次へ進むまで あと ${left} 問` : "🔓 次へ進めます";
    gatePill.classList.toggle("open", left === 0);
    renderHeader();

    const pages = lessonPages(section);
    document.getElementById("page-tabs").replaceChildren(el("span", { class: "lbl", text: "ページ" }), ...pages.map((p, i) => {
      let cls = "";
      let text = pageName(p);
      if (p.kind === "item" && !p.item.check) text = String(p.index + 1);
      else if (p.kind === "item") {
        const id = p.item.check.id;
        cls = recOf(id).everCorrect ? "ok" : againToday(id) ? "due" : "";
        text = recOf(id).everCorrect ? "✓" : againToday(id) ? "↻" : String(p.index + 1);
      }
      return el("button", { type: "button", role: "tab", class: `${cls}${i === lesson.page ? " cur" : ""}`, "aria-selected": i === lesson.page ? "true" : "false", "aria-label": pageName(p), title: p.kind === "item" ? itemLabel(p.item) : pageName(p), text, onclick: () => turnPage(i) });
    }));

    const nextButton = document.getElementById("next-sec");
    if (nextButton) {
      nextButton.hidden = !target;
      nextButton.disabled = left > 0;
      nextButton.className = `btn${left ? "" : " go"}`;
      nextButton.textContent = `${left ? "🔒 " : ""}${target} ›`;
      nextButton.onclick = () => (toExercise || !next ? startRun("chapter", chapter.id) : openSection(next.id));
      const gate = document.getElementById("gate-text");
      gate.hidden = !target;
      gate.replaceChildren(...(left ? ["問題集 あと ", el("b", { text: `${left} 問` }), " で開きます"] : ["🔓 次へ進めます"]));
      gate.classList.toggle("open", left === 0);
    }
    const dots = document.getElementById("state-dots");
    if (dots) {
      const offset = pages.findIndex((p) => p.kind === "item");
      dots.replaceChildren(...section.items.map((item, i) => {
        if (!item.check) return el("i", { title: itemLabel(item), text: "−" });
        const id = item.check.id;
        const ok = recOf(id).everCorrect;
        return el("i", { class: ok ? "ok" : againToday(id) ? "due" : "", title: itemLabel(item), text: ok ? "✓" : againToday(id) ? "↻" : String(i + 1) });
      }));
      document.getElementById("side-map").replaceChildren(...section.items.map((item, i) => el("button", { type: "button", onclick: () => turnPage(offset + i) }, [
        el("span", { class: "num", text: String(i + 1) }),
        el("span", { text: item.kind === "example" ? "例題" : item.title }),
        item.check ? stateTag(item.check.id) : el("span", { class: "muted small", text: "問題なし" }),
      ])));
    }
  }

  // ===== 今日の想起・演習・模擬試験 =====
  // kind: today（期日が来た問題）/ chapter（章末演習）/ final（総合演習）/ mock（模擬試験。記録しない）
  function startRun(kind, chapterId = null) {
    const chapter = chapterId ? chapters.find((c) => c.id === chapterId) : null;
    let ids;
    let title;
    let label;
    // 演習：まだ解いていない問題 → 期日が来た問題 の順（覚えた問題・出さない問題は出さない）
    const pickDrill = (questions) => {
      const list = questions.map((q) => q.id).filter(isActive);
      return [...list.filter((id) => stateOf(id) === "new"), ...sortDue(list.filter((id) => stateOf(id) === "due"))].slice(0, RUN_SIZE);
    };
    if (kind === "today") { ids = interleave(sortDue(dueIds())).slice(0, RUN_SIZE); title = "今日の想起"; label = "もう一度確かめる日が来た問題"; }
    else if (kind === "chapter") { ids = pickDrill(chapter.exercise || []); title = "章末演習"; label = chapterLabel(chapter); }
    else if (kind === "final") { ids = pickDrill(finalExam); title = "総合演習"; label = "章をまたいだ問題"; }
    else { ids = shuffled([...drillChapter.keys()].filter(isActive)).slice(0, content.meta.exam.questionCount); title = "模擬試験"; label = `${content.meta.exam.minutes}分`; }
    if (!ids.length) { showToast(kind === "today" ? "今日解く問題はありません。" : "いま出す問題はありません。まだ覚えていない問題は、出題日が来たら「今日の想起」に出ます。"); return; }
    const backSection = currentView === "lesson" && lesson ? lesson.sectionId : null;
    run = { kind, chapterId, title, label, backSection, queue: ids.slice(), retries: {}, log: [], current: null, startedAt: Date.now(), finished: false, celebrated: false, total: ids.length };
    confettiPieces = [];
    currentView = "run";
    advanceRun(true);
  }
  function advanceRun(first = false) {
    if (run.card) run.card.stop();
    run.current = run.queue.shift() || null;
    if (!run.current) run.finished = true;
    if (first) render(); else render({ keepScroll: false });
  }
  function finishRun() { if (run.card) run.card.stop(); run.finished = true; render(); }
  function leaveRun() {
    if (run.kind === "mock" && !run.finished) { finishRun(); return; }
    const back = run.backSection;
    if (run.card) run.card.stop();
    run = null;
    if (back) openSection(back); else showView("home");
  }
  function renderRun() {
    if (!run) { currentView = "home"; renderHome(); return; }
    const answered = run.log.length;
    const bar = el("div", { class: "run-bar" }, [
      el("button", { class: "btn", text: run.kind === "mock" && !run.finished ? "‹ 採点して終了" : run.backSection ? "‹ 教科書に戻る" : "‹ ホームへ", onclick: leaveRun }),
      el("div", { class: "ttl" }, [el("small", { text: run.label }), el("b", { text: run.title })]),
      el("div", { class: "run-prog" }, [
        el("span", { class: "pill num", text: run.finished ? `${answered} 問 解答` : `${answered + 1} / ${answered + 1 + run.queue.length} 問目` }),
        el("span", { class: "pill num", id: "run-time", text: runTimeText() }),
      ]),
    ]);
    app.append(bar, el("div", { class: "run" }, [run.finished ? renderRunResult() : renderRunCard(), renderRunSide()]));
  }
  function runTimeText() {
    const elapsed = (Date.now() - run.startedAt) / 1000;
    if (run.kind === "mock") return `残り ${formatClock(content.meta.exam.minutes * 60 - elapsed)}`;
    return `経過 ${formatClock(elapsed)}`;
  }
  setInterval(() => {
    if (currentView !== "run" || !run || run.finished) return;
    const node = document.getElementById("run-time");
    if (node) node.textContent = runTimeText();
    if (run.kind === "mock" && (Date.now() - run.startedAt) / 1000 >= content.meta.exam.minutes * 60) { showToast("制限時間になりました。採点します。"); finishRun(); }
  }, 1000);
  function renderRunCard() {
    const id = run.current;
    const isMock = run.kind === "mock";
    const isRetry = (run.retries[id] || 0) > 0;
    const card = questionCard(id, {
      record: !isMock, mock: isMock, retry: isRetry, startNow: true, focus: true, refs: true, autoAdvance: true,
      label: el("span", { text: `${isRetry ? "↻ もう一度 ・ " : ""}${scopeLabel(id)}` }),
      retryNote: isMock ? null : "このあと、もう一度出します。",
      onDone: (res) => {
        run.log.push({ id, correct: res.correct, response: res.response, retry: isRetry });
        if (isMock) { advanceRun(); return; }
        // 間違えた問題は、3問あとにもう一度出す（同じ回で3回まで）
        if (!res.correct && (run.retries[id] || 0) < MAX_RETRY) {
          run.retries[id] = (run.retries[id] || 0) + 1;
          run.queue.splice(Math.min(RETRY_GAP, run.queue.length), 0, id);
        }
        renderRunSideInto();
      },
      onNext: () => advanceRun(),
      onExcludeChange: (on) => { if (on) { run.queue = run.queue.filter((x) => x !== id); renderRunSideInto(); } },
    });
    run.card = card;
    keyTarget = card;
    const q = questionById.get(id);
    const hint = isMock ? "答えると次の問題へ進みます" : q.type === "fill" ? "入力欄には自動でカーソルが入ります ・ Enter で答え合わせ・次へ" : "選択肢は数字キーでも選べます ・ Enter で次へ";
    return el("div", { style: "min-width:0" }, [
      el("section", { class: "panel card", id: "run-card" }, [el("span", { class: "type-tab", text: TYPE_NAME[q.type] }), card.el]),
      el("p", { class: "run-foot", text: hint }),
    ]);
  }
  function renderRunSide() { return el("aside", { class: "side", id: "run-side" }, runSideChildren()); }
  function renderRunSideInto() { const side = document.getElementById("run-side"); if (side) side.replaceChildren(...runSideChildren()); }
  function runSideChildren() {
    const isMock = run.kind === "mock";
    // 1マス1問：解いた問題（○ / ×）、いま解いている問題（紫の枠）、これから出す問題（もう一度は ↻）
    const hide = isMock && !run.finished;
    const cells = run.log.map((entry) => ({ cls: hide ? "" : entry.correct ? "ok" : "ng", mark: hide ? "✓" : entry.correct ? "○" : "×" }));
    const seen = new Set(run.log.map((e) => e.id));
    if (!run.finished && run.current) cells.push({ cls: "cur", mark: seen.has(run.current) ? "↻" : "" });
    if (!run.finished) for (const id of run.queue) cells.push(seen.has(id) || id === run.current ? { cls: "again", mark: "↻" } : { cls: "", mark: "" });
    return [el("section", { class: "panel" }, [
      el("h3", {}, [el("span", { class: "eyebrow", text: "この回の問題" })]),
      el("div", { class: "grid10" }, cells.map((c, i) => el("span", { class: c.cls }, [el("small", { text: String(i + 1) }), c.mark]))),
      el("p", { class: "muted", style: "font-size:.75rem;margin:12px 0 0;line-height:1.7;white-space:pre-line", text: isMock ? "答えると次の問題へ進みます。紫の枠：いま解いている問題" : "○ 正解　× 不正解　↻ もう一度\n紫の枠：いま解いている問題" }),
    ])];
  }
  function renderRunResult() {
    keyTarget = null;
    const isMock = run.kind === "mock";
    const firstTries = run.log.filter((e) => !e.retry);
    const okFirst = firstTries.filter((e) => e.correct).length;
    const ids = [...new Set(run.log.map((e) => e.id))];
    const closedNow = ids.filter((id) => recOf(id).closedOn === today()).length;
    const children = [el("div", { class: "eyebrow", text: `${run.label} ${run.title}の結果` })];
    children.push(el("div", { class: "score num", style: "margin:10px 0" }, [String(okFirst), el("small", { text: `/ ${firstTries.length} 問 正解（1回目）` })]));
    if (isMock) {
      const rate = firstTries.length ? Math.round((okFirst / firstTries.length) * 100) : 0;
      const passing = content.meta.exam.passingRate;
      children.push(el("p", { style: "font-weight:700;font-size:1.1rem", text: passing ? `正答率 ${rate}%（合格ライン ${passing}%）… ${rate >= passing ? "合格" : "不合格"}` : `正答率 ${rate}%` }));
      children.push(el("p", { class: "muted", text: "模擬試験の結果は学習履歴に記録しません。" }));
      if (passing && rate >= passing && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    } else {
      children.push(el("p", { class: "muted", text: closedNow ? `この回で ${closedNow}問を「覚えた」にしました。` : "覚えていない問題は、日を変えてもう一度出します。" }));
      if (okFirst === firstTries.length && !run.celebrated) { run.celebrated = true; requestAnimationFrame(celebrateBig); }
    }
    const buttons = [el("button", { class: "btn", text: "ホームへ", onclick: () => { run = null; showView("home"); } })];
    if (run.kind === "chapter") {
      const chapter = chapters.find((c) => c.id === run.chapterId);
      const nextChapter = chapters[chapters.indexOf(chapter) + 1];
      if (nextChapter) buttons.push(el("button", { class: "btn primary", text: `第${chapterNo(nextChapter)}章 ${nextChapter.title}へ ›`, onclick: () => { run = null; openSection(nextChapter.sections[0].id); } }));
    }
    children.push(el("div", { class: "btn-row", style: "justify-content:center;margin-top:16px" }, buttons));
    if (isMock) {
      for (const entry of run.log.filter((e) => !e.correct)) {
        const q = questionById.get(entry.id);
        children.push(el("div", { class: "miss" }, [
          el("div", { html: q.type === "truefalse" ? `「${q.prompt}」` : q.prompt }),
          el("p", {}, [el("b", { text: "正解：" }), el("span", { style: "white-space:pre-line", text: correctAnswerText(q, null) })]),
          el("p", { class: "muted", html: q.explanation }),
        ]));
      }
    }
    return el("section", { class: "panel card done-card" }, children);
  }

  // ===== 設定（学習履歴・出さない問題） =====
  function renderSettings() {
    const resetButton = el("button", { class: "btn danger", text: "学習履歴を消す" });
    resetButton.addEventListener("click", () => {
      if (resetButton.dataset.armed) { progress = createEmptyProgress(); saveProgress(); run = null; showToast("学習履歴を消しました。"); render(); }
      else { resetButton.dataset.armed = "1"; resetButton.textContent = "もう一度押すと消えます"; }
    });
    const excluded = allIds.filter((id) => !isActive(id));
    app.append(el("div", { class: "settings" }, [
      el("h1", { text: "⚙ 設定" }),
      el("section", { class: "panel" }, [
        el("h3", { style: "margin:0 0 6px", text: "出さない問題" }),
        el("p", { class: "muted", style: "font-size:.88rem;margin:0", text: "「この問題はもう出さない」にした問題です。戻すと、また出題します。教材そのものから削除するには、下の「書き出す」で学習履歴を書き出し、教材を作ったときと同じように Claude（study-kit）に渡してください。これらの問題を消した教材を作り直します。" }),
        excluded.length ? el("div", { class: "ex-list" }, excluded.map((id) => el("div", { class: "ex-row" }, [
          el("span", {}, [el("small", { class: "muted", text: scopeLabel(id) + "　" }), stripTags(questionById.get(id).prompt)]),
          el("button", { class: "btn small", text: "出題に戻す", onclick: () => { setExcluded(id, false); showToast("出題に戻しました。"); render(); } }),
        ]))) : el("p", { class: "muted", style: "font-size:.88rem", text: "いまはありません。" }),
      ]),
      el("section", { class: "panel" }, [
        el("h3", { style: "margin:0 0 6px", text: "学習履歴" }),
        el("p", { class: "muted", style: "font-size:.88rem;margin:0 0 14px", text: "学習履歴（問題ごとの結果と次の出題日、出さない問題、メモ）はこのブラウザにだけ保存されます。ブラウザを変えるときやデータを消す前に、書き出して控えを取ってください。" }),
        el("div", { class: "btn-row" }, [
          el("button", { class: "btn", text: "書き出す", onclick: exportProgress }),
          el("button", { class: "btn", text: "読み込む", onclick: () => document.getElementById("import-file").click() }),
          resetButton,
        ]),
      ]),
      el("div", {}, [el("button", { class: "btn", text: "‹ ホームへ", onclick: () => showView("home") })]),
    ]));
  }
  function exportProgress() {
    const data = { ...progress, excludedQuestions: allIds.filter((id) => !isActive(id)).map((id) => ({ id, where: scopeLabel(id), prompt: stripTags(questionById.get(id).prompt) })) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const link = el("a", { href: URL.createObjectURL(blob), download: `study-kit_${content.meta.id}_${today()}.json` });
    document.body.append(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(link.href);
  }
  document.getElementById("import-file").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    event.target.value = "";
    if (!file) return;
    try {
      const imported = JSON.parse(await file.text());
      if (imported.contentId !== content.meta.id) { showToast(`別の教材の履歴です（${imported.contentId}）。読み込みませんでした。`); return; }
      if (imported.version !== PROGRESS_VERSION) { showToast("古い形式の学習履歴のため読み込めませんでした。"); return; }
      delete imported.excludedQuestions;
      progress = normalizeProgress(imported);
      saveProgress();
      run = null;
      showToast("学習履歴を読み込みました。");
      render();
    } catch (error) {
      showToast("学習履歴のファイルを読めませんでした。");
    }
  });

  // ===== 起動 =====
  document.title = content.meta.title;
  document.getElementById("brand-title").textContent = content.meta.title;
  document.getElementById("brand-series").textContent = content.meta.series || "";
  if (debugToday) document.getElementById("brand-series").textContent = `検証用の日付：${today()}`;
  render();
})();
</script>
</body>
</html>
